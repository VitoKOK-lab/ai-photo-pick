<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>統計 Dashboard - 珠寶資料庫</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/stats.css">
</head>
<body class="stats-page">

    <div class="stats-header">
        <a href="/" class="back-btn">← 返回</a>
        <h1>互動統計</h1>
        <div class="period-tabs">
            <button class="period-btn active" data-days="7">7 天</button>
            <button class="period-btn" data-days="30">30 天</button>
            <button class="period-btn" data-days="90">90 天</button>
        </div>
    </div>

    <!-- 總覽卡片 -->
    <section class="overview-grid" id="overview-grid">
        <div class="stat-card" id="card-photos">
            <div class="stat-value">—</div>
            <div class="stat-label">照片總數</div>
        </div>
        <div class="stat-card" id="card-views">
            <div class="stat-value">—</div>
            <div class="stat-label">總瀏覽</div>
        </div>
        <div class="stat-card" id="card-favorites">
            <div class="stat-value">—</div>
            <div class="stat-label">總收藏</div>
        </div>
        <div class="stat-card" id="card-locks">
            <div class="stat-value">—</div>
            <div class="stat-label">總 Lock</div>
        </div>
        <div class="stat-card" id="card-dwell">
            <div class="stat-value">—</div>
            <div class="stat-label">平均停留（秒）</div>
        </div>
        <div class="stat-card" id="card-sessions">
            <div class="stat-value">—</div>
            <div class="stat-label">不重複 Session</div>
        </div>
    </section>

    <!-- 每日趨勢 -->
    <section class="section">
        <h2>每日趨勢</h2>
        <div class="chart-wrap">
            <canvas id="daily-chart"></canvas>
        </div>
        <div id="daily-empty" class="empty-msg" style="display:none">尚無互動資料</div>
    </section>

    <!-- 熱門照片 -->
    <section class="section">
        <h2>熱門照片</h2>
        <div class="sort-tabs">
            <button class="sort-btn active" data-sort="popular">綜合</button>
            <button class="sort-btn" data-sort="views">瀏覽</button>
            <button class="sort-btn" data-sort="favorites">收藏</button>
            <button class="sort-btn" data-sort="locks">Lock</button>
            <button class="sort-btn" data-sort="dwell">停留</button>
        </div>
        <div class="top-photos-grid" id="top-photos-grid"></div>
        <div id="top-empty" class="empty-msg" style="display:none">尚無照片資料</div>
    </section>

    <!-- 備份狀態 -->
    <section class="section">
        <h2>備份狀態</h2>
        <div class="backup-row" id="backup-info">載入中...</div>
        <div class="backup-actions">
            <button id="backup-full-btn">☁ 完整備份</button>
            <button id="backup-db-btn">💾 僅備份 DB</button>
        </div>
        <div class="backup-snapshots" id="backup-snapshots"></div>
    </section>

    <!-- 維度分布 -->
    <section class="section">
        <h2>維度分布</h2>
        <div class="dim-tabs">
            <button class="dim-btn active" data-dim="category">品類</button>
            <button class="dim-btn" data-dim="color">顏色</button>
            <button class="dim-btn" data-dim="gemstone">寶石</button>
            <button class="dim-btn" data-dim="material">材質</button>
            <button class="dim-btn" data-dim="price_band">價位</button>
        </div>
        <div class="dim-bars" id="dim-bars"></div>
        <div id="dim-empty" class="empty-msg" style="display:none">尚無資料</div>
    </section>

    <script type="module" src="/js/stats.js"></script>
</body>
</html>
