<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>報價管理 - 珠寶資料庫</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/stats.css">
    <link rel="stylesheet" href="/css/quotes.css">
</head>
<body class="stats-page">

    <div class="stats-header">
        <a href="/" class="back-btn">← 返回</a>
        <h1>報價管理</h1>
        <button class="period-btn active" id="add-btn">+ 新增</button>
    </div>

    <!-- 總覽 -->
    <section class="overview-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-value" id="s-total">—</div><div class="stat-label">報價筆數</div></div>
        <div class="stat-card"><div class="stat-value" id="s-min">—</div><div class="stat-label">最低價</div></div>
        <div class="stat-card"><div class="stat-value" id="s-max">—</div><div class="stat-label">最高價</div></div>
        <div class="stat-card"><div class="stat-value" id="s-avg">—</div><div class="stat-label">平均價</div></div>
    </section>

    <!-- 推估工具 -->
    <section class="section">
        <h2>🔍 價格推估</h2>
        <div class="estimate-form">
            <select id="est-material">
                <option value="">材質（選填）</option>
                <option>925銀</option>
                <option>18k黃金</option>
                <option>18k白金</option>
                <option>18k玫瑰金</option>
                <option>鉑金</option>
                <option>其他金屬</option>
            </select>
            <select id="est-gemstone">
                <option value="">寶石（選填）</option>
                <option>紅寶石</option><option>藍寶石</option><option>祖母綠</option>
                <option>坦桑石</option><option>海藍寶</option><option>粉碧璽</option>
                <option>綠碧璽</option><option>藍碧璽</option><option>西瓜碧璽</option>
                <option>紫水晶</option><option>黃水晶</option><option>煙水晶</option>
                <option>白水晶</option><option>托帕石</option><option>月光石</option>
                <option>歐泊</option><option>橄欖石</option><option>石榴石</option>
                <option>丹泉石</option><option>青金石</option><option>珍珠</option>
                <option>翡翠</option><option>瑪瑙</option><option>玉髓</option>
                <option>鑽石主石</option><option>其他寶石</option>
            </select>
            <button id="est-btn">推估</button>
        </div>
        <div class="estimate-result" id="est-result" style="display:none"></div>
    </section>

    <!-- 批次更新 -->
    <section class="section">
        <h2>⚡ 批次更新照片價格</h2>
        <p class="hint">對所有「尚未定價」的照片，根據 material/gemstone 自動填入推估價格區間。</p>
        <div class="batch-row">
            <label>最少樣本數 <input type="number" id="min-samples" value="3" min="1" max="20" style="width:50px"></label>
            <button id="batch-btn">執行批次推估</button>
        </div>
        <div class="batch-result" id="batch-result" style="display:none"></div>
    </section>

    <!-- 篩選 + 列表 -->
    <section class="section">
        <h2>報價列表</h2>
        <div class="filter-row">
            <select id="f-material"><option value="">所有材質</option>
                <option>925銀</option><option>18k黃金</option><option>18k白金</option>
                <option>18k玫瑰金</option><option>鉑金</option><option>其他金屬</option>
            </select>
            <select id="f-gemstone"><option value="">所有寶石</option>
                <option>紅寶石</option><option>藍寶石</option><option>祖母綠</option>
                <option>坦桑石</option><option>海藍寶</option><option>珍珠</option>
                <option>翡翠</option><option>鑽石主石</option><option>其他寶石</option>
            </select>
            <button id="filter-apply">篩選</button>
        </div>
        <table class="quotes-table" id="quotes-table">
            <thead><tr>
                <th>描述</th><th>材質</th><th>寶石</th><th>產地</th>
                <th>金額</th><th>日期</th><th></th>
            </tr></thead>
            <tbody id="quotes-tbody"></tbody>
        </table>
        <div id="quotes-empty" class="empty-msg" style="display:none">尚無報價記錄，點右上角「+ 新增」開始建立</div>
        <div class="load-more-row"><button id="load-more" style="display:none">載入更多</button></div>
    </section>

    <!-- 新增表單 Modal -->
    <div class="modal-overlay" id="modal" style="display:none">
        <div class="modal-box">
            <h3>新增報價</h3>
            <label>描述 *<input type="text" id="f-desc" placeholder="如：緬甸紅寶石戒指，2.5ct"></label>
            <label>金額（元）*<input type="number" id="f-price" placeholder="85000" min="1"></label>
            <div class="modal-row">
                <label>材質
                    <select id="f-mat">
                        <option value="">—</option>
                        <option>925銀</option><option>18k黃金</option><option>18k白金</option>
                        <option>18k玫瑰金</option><option>鉑金</option><option>其他金屬</option>
                    </select>
                </label>
                <label>寶石
                    <select id="f-gem">
                        <option value="">—</option>
                        <option>紅寶石</option><option>藍寶石</option><option>祖母綠</option>
                        <option>坦桑石</option><option>海藍寶</option><option>粉碧璽</option>
                        <option>綠碧璽</option><option>藍碧璽</option><option>西瓜碧璽</option>
                        <option>紫水晶</option><option>黃水晶</option><option>煙水晶</option>
                        <option>白水晶</option><option>托帕石</option><option>月光石</option>
                        <option>歐泊</option><option>橄欖石</option><option>石榴石</option>
                        <option>丹泉石</option><option>青金石</option><option>珍珠</option>
                        <option>翡翠</option><option>瑪瑙</option><option>玉髓</option>
                        <option>鑽石主石</option><option>其他寶石</option>
                    </select>
                </label>
            </div>
            <label>寶石產地<input type="text" id="f-origin" placeholder="如：緬甸、斯里蘭卡"></label>
            <label>報價日期<input type="date" id="f-date"></label>
            <label>備註<input type="text" id="f-notes" placeholder="選填"></label>
            <div class="modal-actions">
                <button id="modal-cancel">取消</button>
                <button id="modal-save" class="primary">儲存</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/quotes.js"></script>
</body>
</html>
