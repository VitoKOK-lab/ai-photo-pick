<div class="mockbar">設計稿 · 上傳 SHOPLINE 報表 · <a href="./index.html">回總覽</a></div>
<div class="import-card">

  <p style="font-size:13px;color:var(--ink-2);margin-top:6px;">一天兩次：從 SHOPLINE 匯出訂單報表（.xls 或 .csv），拖到下面或點選檔案。系統會自動合併同單多列、去重，只把沒見過的新單寫進看板。</p>

  <div class="import-result">

    新增 <b>18</b> 筆新單，更新 935 筆，封存 7 筆。<br>
    <span style="color:var(--ok);">✓ 欄位全部對應成功</span>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="btn btn-gold">開始匯入</button>
    <button class="btn">關閉</button>
