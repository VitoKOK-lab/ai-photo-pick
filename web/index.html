<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JewelryDB</title>
  <style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #0e0e0e;
  --s1:      #181818;   /* surface */
  --s2:      #222;
  --s3:      #2c2c2c;
  --t1:      #f0f0f0;   /* text */
  --t2:      #999;
  --t3:      #555;
  --border:  #2a2a2a;
  --gold:    #c9a96e;
  --r:       8px;
  --nav-h:   52px;
  --tab-h:   58px;
  --side-w:  224px;
}

/* ── Base ───────────────────────────────────────────────── */
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--t1);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; display: flex; flex-direction: column; }
button { font-family: inherit; }

/* ── Nav ────────────────────────────────────────────────── */
.nav {
  height: var(--nav-h);
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  flex-shrink: 0;
  gap: 12px;
}
.nav-logo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: var(--gold);
  flex: 1;
}
.nav-tabs { display: none; gap: 4px; }
.nav-tab {
  padding: 7px 16px;
  border-radius: 20px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t2);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-tab.on { background: var(--s3); color: var(--t1); }
.badge {
  background: var(--gold);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

/* ── Mobile tab bar ─────────────────────────────────────── */
.tab-bar {
  height: var(--tab-h);
  background: var(--s1);
  border-top: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t3);
  font-size: 10px;
  font-weight: 500;
  position: relative;
}
.tab-btn.on { color: var(--gold); }
.tab-btn svg {
  width: 22px; height: 22px;
  stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.tab-badge {
  position: absolute;
  top: 6px;
  right: calc(50% - 18px);
  background: var(--gold);
  color: #000;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 8px;
  min-width: 16px;
  text-align: center;
}

/* ── Content wrapper ────────────────────────────────────── */
.content {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ── Mobile filter chips ────────────────────────────────── */
.chips-bar {
  padding: 9px 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chips-bar::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 6px 12px;
  border-radius: 20px;
  background: var(--s2);
  font-size: 12px;
  color: var(--t2);
  border: 1px solid var(--border);
  cursor: pointer;
  margin-right: 6px;
  white-space: nowrap;
}
.chip.on {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
  font-weight: 600;
}
.chip-clr {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 20px;
  background: none;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--t3);
  cursor: pointer;
  white-space: nowrap;
}

/* ── Body row (sidebar + main) ──────────────────────────── */
.body-row {
  flex: 1;
  overflow: hidden;
  display: flex;
  min-height: 0;
}

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar {
  display: none;
  width: var(--side-w);
  background: var(--s1);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 8px 0 32px;
}
.sb-clear {
  margin: 6px 12px 10px;
  padding: 8px 12px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--t3);
  font-size: 12px;
  cursor: pointer;
  width: calc(100% - 24px);
  text-align: left;
}
.sb-clear:hover { background: var(--s3); color: var(--t2); }
.sb-sec { border-bottom: 1px solid var(--border); }
.sb-hd {
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
}
.sb-hd-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--t3);
}
.sb-hd.has-val .sb-hd-label { color: var(--gold); }
.sb-hd-arrow { font-size: 10px; color: var(--t3); }
.sb-opts { padding: 0 8px 8px; }
.sb-opt {
  display: block;
  width: 100%;
  padding: 8px 8px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t2);
  font-size: 13px;
  text-align: left;
  border-radius: 6px;
}
.sb-opt:hover { background: var(--s3); color: var(--t1); }
.sb-opt.on { color: var(--gold); font-weight: 600; }
.sb-opt-clr {
  display: block;
  width: 100%;
  padding: 6px 8px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t3);
  font-size: 11px;
  text-align: left;
  border-radius: 6px;
}
.sb-opt-clr:hover { color: var(--t2); }

/* ── Main area ──────────────────────────────────────────── */
.main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ── Photo grid ─────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px;
  padding: 2px;
}
.card {
  background: var(--s2);
  cursor: pointer;
  overflow: hidden;
  position: relative;
}
.card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--s3);
}
.card-fav {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  border: none;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.7);
  backdrop-filter: blur(4px);
}
.card-fav.on { color: var(--gold); }
.card-lbl {
  padding: 5px 8px 6px;
  font-size: 11px;
  color: var(--t3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sentinel { height: 1px; }
.loading-msg { text-align: center; padding: 24px; color: var(--t3); font-size: 13px; }
.empty-msg {
  text-align: center;
  padding: 64px 24px;
  color: var(--t2);
  font-size: 14px;
  line-height: 1.8;
}

/* ── Filter bottom sheet (mobile) ───────────────────────── */
.ovl {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  display: flex;
  align-items: flex-end;
}
.fsh {
  width: 100%;
  max-height: 70vh;
  background: var(--s1);
  border-radius: 16px 16px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: up .22s cubic-bezier(.32,.72,0,1);
}
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.fsh-hd {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.fsh-title { font-size: 15px; font-weight: 600; }
.fsh-x {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--s3);
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--t2);
  line-height: 28px;
  text-align: center;
}
.fsh-body { overflow-y: auto; flex: 1; }
.fsh-item {
  padding: 14px 16px;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  color: var(--t1);
}
.fsh-item:last-child { border-bottom: none; }
.fsh-item:active { background: var(--s3); }
.fsh-item.on { color: var(--gold); font-weight: 600; }
.fsh-item.clr { color: var(--t3); font-size: 13px; }

/* ── Detail overlay ─────────────────────────────────────── */
.det-ovl {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 300;
  display: flex;
  align-items: flex-end;
}
.det-panel {
  width: 100%;
  max-height: 90vh;
  background: var(--s1);
  border-radius: 16px 16px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  animation: up .25s cubic-bezier(.32,.72,0,1);
}
.det-handle {
  width: 36px; height: 4px;
  background: var(--s3);
  border-radius: 2px;
  margin: 10px auto 0;
  flex-shrink: 0;
}
.det-x {
  position: absolute;
  top: 14px; right: 14px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--t2);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  backdrop-filter: blur(4px);
}
.det-left { flex-shrink: 0; }
.det-img {
  width: 100%;
  max-height: 54vw;
  object-fit: cover;
  display: block;
  background: var(--s3);
}
.det-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.det-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.det-tags { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 4px 10px;
  background: var(--s3);
  border-radius: 20px;
  font-size: 12px;
  color: var(--t2);
}
.det-btns {
  padding: 8px 16px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.db {
  padding: 13px;
  border-radius: var(--r);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.db-fav { background: var(--s3); color: var(--t1); }
.db-fav.on { background: var(--gold); color: #000; }
.db-sim { background: var(--s2); border: 1px solid var(--border); color: var(--t1); }
.sim-sec { padding: 0 16px 28px; }
.sim-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--t3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
  padding-top: 4px;
}
.sim-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
}
.sim-grid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--s3);
  cursor: pointer;
  border-radius: 3px;
}

/* ── Favorites empty ────────────────────────────────────── */
.fav-empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--t2);
  font-size: 14px;
  line-height: 1.9;
}

/* ── RWD: tablet ≥ 768px ────────────────────────────────── */
@media (min-width: 768px) {
  .nav-tabs   { display: flex; }
  .tab-bar    { display: none; }
  .sidebar    { display: block; }
  .chips-bar  { display: none; }

  .grid { grid-template-columns: repeat(3, 1fr); }

  /* Detail: centered modal, 2-col */
  .det-ovl { align-items: center; justify-content: center; padding: 24px; }
  .det-panel {
    width: 100%;
    max-width: 860px;
    border-radius: 14px;
    flex-direction: row;
    max-height: 84vh;
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  .det-handle { display: none; }
  .det-left { width: 50%; flex-shrink: 0; }
  .det-img   { width: 100%; height: 100%; max-height: none; border-radius: 14px 0 0 14px; }
  .det-right { flex: 1; min-height: 0; }
}

/* ── RWD: desktop ≥ 1200px ──────────────────────────────── */
@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1600px) {
  :root { --side-w: 256px; }
  .grid { grid-template-columns: repeat(5, 1fr); }
}
  </style>
</head>
<body>
<div id="root"></div>
<script src="/js/vendor/react.min.js"></script>
<script src="/js/vendor/react-dom.min.js"></script>
<script src="/js/vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Config ─────────────────────────────────────────── */
const CFG = {
  category:    { label: '品項',  values: ['手鏈','墜子','耳釘','項鏈','胸針','戒指','手鐲','其他'] },
  gemstone:    { label: '寶石',  values: ['鑽石','紅寶石','藍寶石','祖母綠','坦桑石','海藍寶','碧璽','珍珠','翡翠','其他彩寶','無寶石'] },
  stone_shape: { label: '形狀',  values: ['橢圓形','圓形','水滴形','心形','方形','長方形','馬眼形','枕形','花形','不規則','無主石'] },
  stone_size:  { label: '大小',  values: ['1克拉以內','1克拉','2克拉','3克拉','5克拉','10克拉以上'] },
  style:       { label: '款式',  values: ['無鑽','簡約(5顆鑽內)','輕奢(20顆鑽內)','豪鑲滿鑲鑽'] },
  color:       { label: '顏色',  values: ['紅色','粉紅色','橙色','黃色','綠色','藍色','紫色','白色','無色透明','黑色','多色'] },
};

/* ── Fav helpers ────────────────────────────────────── */
const loadFavs = () => { try { return JSON.parse(localStorage.getItem('jdb_favs') || '[]'); } catch { return []; } };
const saveFavs = f => localStorage.setItem('jdb_favs', JSON.stringify(f));

/* ── Icons ──────────────────────────────────────────── */
function IcoGrid() {
  return (
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  );
}
function IcoHeart({ fill }) {
  return (
    <svg viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'}>
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  );
}

/* ── Mobile filter sheet ────────────────────────────── */
function FilterSheet({ field, cur, onPick, onClose }) {
  const cfg = CFG[field];
  return (
    <div className="ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="fsh">
        <div className="fsh-hd">
          <span className="fsh-title">{'選擇' + cfg.label}</span>
          <button className="fsh-x" onClick={onClose}>×</button>
        </div>
        <div className="fsh-body">
          {cur && (
            <div className="fsh-item clr" onClick={() => { onPick(null); onClose(); }}>
              清除篩選（顯示全部）
            </div>
          )}
          {cfg.values.map(v => (
            <div key={v} className={'fsh-item' + (cur === v ? ' on' : '')}
              onClick={() => { onPick(v); onClose(); }}>
              <span>{v}</span>
              {cur === v && <span>✓</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Desktop sidebar ────────────────────────────────── */
function Sidebar({ filters, onFilter, onClear }) {
  const [open, setOpen] = useState({ category: true, gemstone: true, stone_shape: false, stone_size: false, style: false, color: false });
  const hasAny = Object.keys(filters).length > 0;
  return (
    <aside className="sidebar">
      {hasAny && (
        <button className="sb-clear" onClick={onClear}>✕ 清除全部篩選</button>
      )}
      {Object.entries(CFG).map(([field, cfg]) => (
        <div key={field} className="sb-sec">
          <button className={'sb-hd' + (filters[field] ? ' has-val' : '')}
            onClick={() => setOpen(p => ({ ...p, [field]: !p[field] }))}>
            <span className="sb-hd-label">
              {cfg.label}{filters[field] ? ' · ' + filters[field] : ''}
            </span>
            <span className="sb-hd-arrow">{open[field] ? '▾' : '▸'}</span>
          </button>
          {open[field] && (
            <div className="sb-opts">
              {filters[field] && (
                <button className="sb-opt-clr" onClick={() => onFilter(field, null)}>
                  ✕ 清除
                </button>
              )}
              {cfg.values.map(v => (
                <button key={v} className={'sb-opt' + (filters[field] === v ? ' on' : '')}
                  onClick={() => onFilter(field, filters[field] === v ? null : v)}>
                  {v}
                </button>
              ))}
            </div>
          )}
        </div>
      ))}
    </aside>
  );
}

/* ── Photo detail ───────────────────────────────────── */
function PhotoDetail({ photo, onClose, isFav, toggleFav, onSelectPhoto }) {
  const [similar,     setSimilar]     = useState(null);
  const [showSimilar, setShowSimilar] = useState(false);

  useEffect(() => { setSimilar(null); setShowSimilar(false); }, [photo.id]);

  const loadSim = () => {
    setShowSimilar(true);
    if (similar !== null) return;
    fetch('/api/photos/' + photo.id + '/similar?limit=12')
      .then(r => r.json())
      .then(d => setSimilar(d.similar || []))
      .catch(() => setSimilar([]));
  };

  const fav  = isFav(photo.id);
  const tags = [photo.category, photo.gemstone, photo.stone_shape, photo.stone_size, photo.style, photo.color, photo.material]
    .filter(v => v && v !== '未定');

  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel">
        <button className="det-x" onClick={onClose}>×</button>

        {/* Image */}
        <div className="det-left">
          <div className="det-handle" />
          <img className="det-img" src={photo.full_url} alt="" loading="lazy" />
        </div>

        {/* Info */}
        <div className="det-right">
          <div className="det-scroll">
            <div className="det-tags">
              {tags.map((t, i) => <span key={i} className="tag">{t}</span>)}
              {photo.price_band && <span className="tag" style={{color:'var(--t3)'}}>{photo.price_band}</span>}
            </div>
            <div className="det-btns">
              <button className={'db db-fav' + (fav ? ' on' : '')} onClick={() => toggleFav(photo)}>
                {fav ? '♥ 已收藏' : '♡ 收藏'}
              </button>
              <button className="db db-sim" onClick={loadSim}>
                🔍 找相似
              </button>
            </div>
            {showSimilar && (
              <div className="sim-sec">
                <div className="sim-title">{'相似款 · ' + (photo.category || '')}</div>
                {similar === null
                  ? <div className="loading-msg">載入中…</div>
                  : similar.length === 0
                    ? <div style={{color:'var(--t3)',fontSize:13}}>找不到相似款</div>
                    : <div className="sim-grid">
                        {similar.map(p => (
                          <img key={p.id} src={p.thumb_url} alt="" loading="lazy"
                            onClick={() => onSelectPhoto(p)} />
                        ))}
                      </div>
                }
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Photo grid with infinite scroll ────────────────── */
function PhotoGrid({ isFav, toggleFav, extraFilters }) {
  const [photos,  setPhotos]  = useState([]);
  const [loading, setLoading] = useState(false);
  const [detail,  setDetail]  = useState(null);

  const loadingRef  = useRef(false);
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const filtersRef  = useRef({});
  const sentinelRef = useRef(null);
  const fetchRef    = useRef(null);

  const doFetch = async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random' });
      Object.entries(filtersRef.current).forEach(([k, v]) => v && qs.set(k, v));
      const res  = await fetch('/api/photos?' + qs);
      const data = await res.json();
      const list = data.photos || [];
      if (pageRef.current === 1) setPhotos(list);
      else setPhotos(prev => [...prev, ...list]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current   += 1;
    } catch {
      hasMoreRef.current = false;
    } finally {
      loadingRef.current = false;
      setLoading(false);
    }
  };
  fetchRef.current = doFetch;

  // Observer: empty deps → set up once, no loop
  useEffect(() => {
    const s = sentinelRef.current;
    if (!s) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) fetchRef.current?.(); },
      { rootMargin: '400px' }
    );
    obs.observe(s);
    return () => obs.disconnect();
  }, []);

  useEffect(() => { fetchRef.current?.(); }, []);

  // When external filters change, reset and reload
  useEffect(() => {
    filtersRef.current = extraFilters || {};
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    setPhotos([]);
    fetchRef.current?.();
  }, [JSON.stringify(extraFilters)]);

  return (
    <>
      <div className="grid-wrap">
        <div className="grid">
          {photos.map(p => (
            <div key={p.id} className="card">
              <img src={p.thumb_url} alt="" loading="lazy" onClick={() => setDetail(p)} />
              <button
                className={'card-fav' + (isFav(p.id) ? ' on' : '')}
                onClick={e => { e.stopPropagation(); toggleFav(p); }}>
                {isFav(p.id) ? '♥' : '♡'}
              </button>
              <div className="card-lbl" onClick={() => setDetail(p)}>
                {[p.category, p.gemstone].filter(v => v && v !== '未定').join(' · ')}
              </div>
            </div>
          ))}
        </div>
        {loading && <div className="loading-msg">載入中…</div>}
        {!loading && photos.length === 0 && !hasMoreRef.current && (
          <div className="empty-msg">
            沒有符合條件的照片<br/>
            <span style={{fontSize:12,color:'var(--t3)'}}>試著調整篩選條件</span>
          </div>
        )}
        <div ref={sentinelRef} className="sentinel" />
      </div>

      {detail && (
        <PhotoDetail
          photo={detail}
          onClose={() => setDetail(null)}
          isFav={isFav}
          toggleFav={toggleFav}
          onSelectPhoto={p => setDetail(p)}
        />
      )}
    </>
  );
}

/* ── Browse tab ─────────────────────────────────────── */
function BrowseTab({ isFav, toggleFav }) {
  const [filters,  setFilters]  = useState({});
  const [openChip, setOpenChip] = useState(null);

  const setF = (field, value) => {
    setFilters(prev => {
      const n = { ...prev };
      if (value) n[field] = value; else delete n[field];
      return n;
    });
  };

  const clearAll = () => setFilters({});
  const hasAny   = Object.keys(filters).length > 0;

  return (
    <>
      {/* Mobile chips */}
      <div className="chips-bar">
        {Object.entries(CFG).map(([field, cfg]) => (
          <button key={field}
            className={'chip' + (filters[field] ? ' on' : '')}
            onClick={() => setOpenChip(field)}>
            {filters[field] || cfg.label} {filters[field] ? '✕' : '▾'}
          </button>
        ))}
        {hasAny && <button className="chip-clr" onClick={clearAll}>清除</button>}
      </div>

      <div className="body-row">
        {/* Desktop sidebar */}
        <Sidebar filters={filters} onFilter={setF} onClear={clearAll} />

        {/* Grid */}
        <div className="main">
          <PhotoGrid isFav={isFav} toggleFav={toggleFav} extraFilters={filters} />
        </div>
      </div>

      {/* Mobile filter sheet */}
      {openChip && (
        <FilterSheet
          field={openChip}
          cur={filters[openChip] || null}
          onPick={v => setF(openChip, v)}
          onClose={() => setOpenChip(null)}
        />
      )}
    </>
  );
}

/* ── Favorites tab ──────────────────────────────────── */
function FavsTab({ favs, isFav, toggleFav }) {
  const [detail, setDetail] = useState(null);
  if (favs.length === 0) return (
    <div className="body-row">
      <div style={{flex:1}}>
        <div className="fav-empty">
          尚無收藏款式<br/>
          <span style={{fontSize:12,color:'var(--t3)'}}>找款頁面點 ♡ 即可收藏</span>
        </div>
      </div>
    </div>
  );
  return (
    <>
      <div className="body-row">
        <div className="main">
          <div className="grid-wrap">
            <div className="grid">
              {favs.map(p => (
                <div key={p.id} className="card">
                  <img src={p.thumb_url} alt="" loading="lazy" onClick={() => setDetail(p)} />
                  <button className="card-fav on"
                    onClick={e => { e.stopPropagation(); toggleFav(p); }}>
                    ♥
                  </button>
                  <div className="card-lbl" onClick={() => setDetail(p)}>
                    {[p.category, p.gemstone].filter(v => v && v !== '未定').join(' · ')}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      {detail && (
        <PhotoDetail
          photo={detail}
          onClose={() => setDetail(null)}
          isFav={isFav}
          toggleFav={toggleFav}
          onSelectPhoto={p => setDetail(p)}
        />
      )}
    </>
  );
}

/* ── App ────────────────────────────────────────────── */
function App() {
  const [tab,  setTab]  = useState('browse');
  const [favs, setFavs] = useState(loadFavs);

  const toggleFav = photo => setFavs(prev => {
    const next = prev.find(p => p.id === photo.id)
      ? prev.filter(p => p.id !== photo.id)
      : [...prev, photo];
    saveFavs(next);
    return next;
  });

  const isFav = id => favs.some(p => p.id === id);

  return (
    <React.Fragment>
      {/* Nav */}
      <header className="nav">
        <span className="nav-logo">JEWELRY DB</span>
        <div className="nav-tabs">
          <button className={'nav-tab' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>
            找款
          </button>
          <button className={'nav-tab' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
            收藏 {favs.length > 0 && <span className="badge">{favs.length}</span>}
          </button>
        </div>
      </header>

      {/* Screen */}
      <div className="content">
        {tab === 'browse'    && <BrowseTab isFav={isFav} toggleFav={toggleFav} />}
        {tab === 'favorites' && <FavsTab   favs={favs} isFav={isFav} toggleFav={toggleFav} />}
      </div>

      {/* Mobile tab bar */}
      <nav className="tab-bar">
        <button className={'tab-btn' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>
          <IcoGrid /><span>找款</span>
        </button>
        <button className={'tab-btn' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
          <IcoHeart fill={tab === 'favorites'} />
          <span>收藏</span>
          {favs.length > 0 && <span className="tab-badge">{favs.length}</span>}
        </button>
      </nav>
    </React.Fragment>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
