/* ── 員工：客人連結管理 ──────────────────────────────── */
function GuestLinksPanel() {
  const [links,    setLinks]    = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [creating, setCreating] = useState(false);
  const [name,     setName]     = useState('');
  const staffName = getJwtUser()?.name || getJwtUser()?.username || '';
  const [msg,      setMsg]      = useState('');
  const [newLink,  setNewLink]  = useState(null);
  const [viewLink, setViewLink] = useState(null);

  const baseUrl = window.location.origin;

  function flash(t) { setMsg(t); setTimeout(()=>setMsg(''), 3000); }

  async function load() {
    setLoading(true);
    try { const r = await fetch('/api/guest-links'); setLinks(await r.json()); }
    finally { setLoading(false); }
  }
  useEffect(() => { load(); }, []);

  async function create() {
    if (!name.trim()) { flash('請輸入客人名字'); return; }
    setCreating(true);
    const r = await fetch('/api/guest-links', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ customer_name: name.trim(), staff_name: staffName.trim() }),
    });
    setCreating(false);
    if (r.ok) {
      const d = await r.json();
      setNewLink({ url: `${baseUrl}/?g=${d.token}`, ...d });
      setName('');
      load();
    } else {
      try { const e = await r.json(); flash('建立失敗：' + (e.detail || r.status)); }
      catch { flash('建立失敗（' + r.status + '）'); }
    }
  }

  async function deactivate(token) {
    await fetch(`/api/guest-links/${token}`, { method:'DELETE' });
    flash('已停用'); load();
  }

  async function copyLink(url) {
    try { await navigator.clipboard.writeText(url); flash('連結已複製！'); }
    catch { flash(url); }
  }

  const iS = { padding:'8px 12px', border:'2px solid #c8b89a', borderRadius:8, fontSize:14,
               background:'#fdf8ef', color:'var(--text)', fontWeight:600, width:'100%', boxSizing:'border-box' };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'14px 16px 80px',paddingTop:'calc(var(--nav-h) + 14px)'}}>
      <div style={{fontSize:16,fontWeight:800,marginBottom:14}}>建立客人連結</div>
      {msg && <div style={{fontSize:13,color:'var(--gold)',fontWeight:600,marginBottom:10}}>{msg}</div>}

      {/* 建立表單 */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'14px',marginBottom:20}}>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>客人名字 *</div>
          <input style={iS} placeholder="例：Amy、小美" value={name}
            onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&create()} />
        </div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>
          服務員工：<strong style={{color:'var(--text)'}}>{staffName || '（未知）'}</strong>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:10}}>
          ⏱ 連結有效 4 小時，客人可在時限內瀏覽所有去背照片並收藏
        </div>
        <button onClick={create} disabled={creating}
          style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,
            padding:'10px 24px',fontSize:14,fontWeight:700,cursor:'pointer',width:'100%'}}>
          {creating ? '建立中…' : '🔗 建立連結'}
        </button>
      </div>

      {/* 剛建立的連結 */}
      {newLink && (
        <div style={{background:'#e8f5e9',border:'2px solid #4caf77',borderRadius:12,padding:'14px',marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,color:'#2e7d32',marginBottom:6}}>
            ✅ 連結已建立 — {newLink.customer_name}
          </div>
          <div style={{fontSize:11,color:'#555',marginBottom:10,wordBreak:'break-all',fontFamily:'monospace',background:'rgba(0,0,0,.05)',borderRadius:6,padding:'6px 8px'}}>
            {newLink.url}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>copyLink(newLink.url)}
              style={{flex:1,background:'#4caf77',color:'#fff',border:'none',borderRadius:8,padding:'9px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
              📋 複製連結
            </button>
          </div>
          <div style={{fontSize:11,color:'#888',marginTop:8,textAlign:'center'}}>
            有效至 {newLink.expires_at?.slice(0,16).replace('T',' ')} UTC
          </div>
        </div>
      )}

      {/* 歷史連結 */}
      <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>連結紀錄</div>
      {viewLink && <GuestFavViewModal link={viewLink} onClose={() => setViewLink(null)} />}

      {loading ? <div style={{color:'var(--text3)',fontSize:13}}>載入中…</div> : (
        links.length === 0 ? <div style={{color:'var(--text3)',fontSize:13}}>尚無連結</div> :
        links.map(l => {
          const url = `${baseUrl}/?g=${l.token}`;
          return (
            <div key={l.id} style={{background:'var(--surface)',border:'1px solid var(--border)',
              borderRadius:10,padding:'10px 14px',marginBottom:8,
              opacity: l.active ? 1 : 0.5}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:14}}>{l.customer_name}</span>
                <span style={{fontSize:11,padding:'2px 8px',borderRadius:6,fontWeight:700,
                  background: l.active?'#e8f5e9':'#f5f5f5',
                  color: l.active?'#2e7d32':'#888'}}>
                  {l.active ? '有效' : l.expired ? '已過期' : '已停用'}
                </span>
              </div>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>
                {l.created_by && `員工：${l.created_by} · `}建立：{l.created_at?.slice(0,16).replace('T',' ')}
              </div>
              {l.active && (
                <div style={{display:'flex',gap:6}}>
                  <button onClick={()=>copyLink(url)}
                    style={{flex:1,padding:'6px',fontSize:12,fontWeight:600,border:'1px solid var(--border)',borderRadius:6,background:'var(--s2)',cursor:'pointer'}}>
                    📋 複製
                  </button>
                  {l.fav_count > 0 && (
                    <button onClick={() => setViewLink(l)}
                      style={{flex:1,padding:'6px',fontSize:12,fontWeight:700,border:'none',borderRadius:6,background:'#ffebee',color:'#c62828',cursor:'pointer'}}>
                      ❤️ {l.fav_count} 查看收藏
                    </button>
                  )}
                  <button onClick={()=>deactivate(l.token)}
                    style={{padding:'6px 10px',fontSize:12,fontWeight:600,border:'none',borderRadius:6,background:'#ffebee',color:'#c62828',cursor:'pointer'}}>
                    停用
                  </button>
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

/* ──────────────────────────────────────────────────────── */
function App() {
  const [splash,         setSplash]         = useState(true);
  const [tab,            setTab]            = useState('browse');
  const [favs,           setFavs]           = useState(loadFavs);
  const [showDarkBg,     setShowDarkBg]     = useState(false);
  const [role,           setRole]           = useState(() => localStorage.getItem('userRole') || 'guest');
  const [metalsLastUpd,  setMetalsLastUpd]  = useState(null);
  const [idleWarning,    setIdleWarning]    = useState(false);

  const isAdmin = role === 'admin';
  const isStaff = role === 'admin' || role === 'editor';

  // 15 分鐘無操作自動登出
  useEffect(() => {
    if (role === 'guest') return;
    const IDLE_MS = 15 * 60 * 1000;
    const WARN_MS = 13 * 60 * 1000;
    let idleTimer, warnTimer;
    function reset() {
      clearTimeout(idleTimer); clearTimeout(warnTimer);
      setIdleWarning(false);
      warnTimer = setTimeout(() => setIdleWarning(true), WARN_MS);
      idleTimer = setTimeout(() => { clearJwtAuth(); localStorage.removeItem('userRole'); setRole('guest'); }, IDLE_MS);
    }
    const evts = ['mousemove','mousedown','keydown','touchstart','scroll','click'];
    evts.forEach(e => window.addEventListener(e, reset, true));
    reset();
    return () => { clearTimeout(idleTimer); clearTimeout(warnTimer); evts.forEach(e => window.removeEventListener(e, reset, true)); };
  }, [role]);

  // Fetch metals_last_updated for banner
  useEffect(() => {
    if (!isStaff) return;
    fetch('/api/pricing/all')
      .then(r => r.json())
      .then(d => { if (d.metals_last_updated) setMetalsLastUpd(d.metals_last_updated); })
      .catch(() => {});
  }, [isStaff]);

  // JWT init — restore session from localStorage on page load
  useEffect(() => {
    const token = getJwtToken();
    const user  = getJwtUser();
    if (token && user) {
      // verify token is still valid
      fetch('/api/auth/me')
        .then(r => r.json())
        .then(data => {
          if (!data.authenticated) { clearJwtAuth(); setRole('guest'); }
          else setRole(data.user?.role || user.role);
        })
        .catch(() => {});
    }
    // Handle 401 from anywhere in the app
    const onExpire = () => { clearJwtAuth(); setRole('guest'); };
    window.addEventListener('authExpired', onExpire);
    return () => window.removeEventListener('authExpired', onExpire);
  }, []);

  function handleLogout() {
    localStorage.removeItem('userRole');
    clearJwtAuth();
    setRole('guest');
  }

  const toggleFav = photo => setFavs(prev => {
    const isCurrent = prev.some(p => p.id === photo.id);
    logEvent(photo.id, isCurrent ? 'unfavorite' : 'favorite');
    const next = isCurrent ? prev.filter(p => p.id !== photo.id) : [...prev, photo];
    saveFavs(next);
    return next;
  });
  const clearFavs = () => { setFavs([]); saveFavs([]); };
  const isFav = id => favs.some(p => p.id === id);

  const favCount  = favs.length;
  const roleLabel = '管理員';
  const logoutLabel = '登出';

  if (role === 'guest') {
    return <LoginPage onAuth={setRole} />;
  }

  return (
    <React.Fragment>
      {splash && <Splash onDone={() => setSplash(false)} />}
      {isStaff && (
        <PricingBanner
          metalsLastUpdated={metalsLastUpd}
          onGotoSettings={isAdmin ? () => setTab('settings') : null}
        />
      )}


      <header className="nav">
        <span className="nav-logo" style={{cursor:'pointer'}} onClick={() => setSplash(true)}>Tahir Zainab Selection</span>
        <div className="nav-tabs">
          <button className={'nav-tab' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>找款</button>
          <button className={'nav-tab' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
            收藏 {favCount > 0 && <span className="badge">{favCount}</span>}
          </button>
          {isStaff && (
            <button className={'nav-tab' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
              估價紀錄<QuotePendingBadge />
            </button>
          )}
          {isStaff && (
            <button className={'nav-tab' + (tab === 'guest' ? ' on' : '')} onClick={() => setTab('guest')}>
              客人收藏夾
            </button>
          )}
          {isAdmin && (
            <button className={'nav-tab' + (tab === 'settings' ? ' on' : '')} onClick={() => setTab('settings')}>
              設定
            </button>
          )}
        </div>
        <div className="nav-right">
          <span className="nav-role">{roleLabel}</span>
          <button className="nav-logout" onClick={handleLogout}>{logoutLabel}</button>
        </div>
      </header>
      {showDarkBg && (
        <DarkBgModal
          onClose={() => setShowDarkBg(false)}
          onDeleted={() => { setShowDarkBg(false); window.location.reload(); }}
        />
      )}
      <div className="content">
        {tab === 'browse'    && <BrowseTab isFav={isFav} toggleFav={toggleFav} role={role} />}
        {tab === 'favorites' && <FavsTab favs={favs} isFav={isFav} toggleFav={toggleFav} clearFavs={clearFavs} role={role} />}
        {tab === 'quote'     && isStaff  && <QuoteHistoryPage role={role} />}
        {tab === 'guest'     && isStaff  && <GuestLinksPanel />}
        {tab === 'settings'  && isAdmin  && <PricingSettingsTab />}
      </div>
      <nav className="tab-bar">
        <button className={'tab-btn' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>找款</button>
        <button className={'tab-btn' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
          收藏{favCount > 0 && <span className="tab-badge">{favCount}</span>}
        </button>
        {isStaff && (
          <button className={'tab-btn' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
            估價<QuotePendingBadge />
          </button>
        )}
        {isStaff && (
          <button className={'tab-btn' + (tab === 'guest' ? ' on' : '')} onClick={() => setTab('guest')}>
            收藏夾
          </button>
        )}
        {isAdmin && (
          <button className={'tab-btn' + (tab === 'settings' ? ' on' : '')} onClick={() => setTab('settings')}>
            設定
          </button>
        )}
      </nav>
      {idleWarning && (
        <div style={{position:'fixed',bottom:80,left:'50%',transform:'translateX(-50%)',
          background:'#323232',color:'#fff',borderRadius:12,padding:'12px 20px',
          zIndex:9999,display:'flex',alignItems:'center',gap:14,boxShadow:'0 4px 20px rgba(0,0,0,.4)',
          fontSize:13,fontWeight:500,whiteSpace:'nowrap'}}>
          ⏰ 2 分鐘後自動登出
          <button onClick={() => setIdleWarning(false)}
            style={{background:'var(--gold)',color:'#fff',border:'none',borderRadius:8,
              padding:'5px 14px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            繼續使用
          </button>
        </div>
      )}
    </React.Fragment>
  );
}

function Root() {
  const guestToken = React.useMemo(() => new URLSearchParams(window.location.search).get('g'), []);
  if (guestToken) return React.createElement(GuestApp, { token: guestToken });
  return React.createElement(App);
}
ReactDOM.render(React.createElement(Root), document.getElementById('root'));
</script>
</body>
