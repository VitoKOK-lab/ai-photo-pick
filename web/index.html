            <div style={{fontSize:8,color:'#b8935a',letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>AI 估價區間</div>
            <div style={{fontSize:16,fontWeight:800,color:'#1a1a1a',lineHeight:1.2,marginBottom:2}}>{fmtNT(manualPrice)}</div>
            <div style={{fontSize:12,color:'#888',marginBottom:8}}>–&nbsp;{fmtNT(estimatedMax)}</div>
            <div style={{fontSize:9,color:'#d32f2f',fontWeight:700,background:'#fff5f5',borderRadius:5,padding:'4px 6px',textAlign:'center',lineHeight:1.5}}>
              AI預估<br/>以最終報價為主
            </div>
          </div>
        </div>

        <div style={{paddingBottom:6,borderBottom:'1px solid #f0f0f0',marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:700,color:'#1a1a1a',lineHeight:1.5,marginBottom:1}}>{description||'—'}</div>
          <div style={{fontSize:9,color:'#bbb'}}>{today}{customer&&' · '+customer}{sourceChannel&&' ('+sourceChannel+')'}</div>
        </div>

        {/* Details table */}
        <div style={{margin:'10px 0',borderTop:'1px solid #f0f0f0',paddingTop:8}}>
          <R label="品項" value={cat} />
          <R label="寶石" value={stoneName} />
          {stoneMode==='invest' && carat>0 && <R label="克拉" value={carat+'ct'} />}
          {stoneMode==='invest' && <R label="產地" value={origin} />}
          {stoneMode==='invest' && <R label="優化處理" value={treatment} />}
          {stoneMode==='invest' && <R label="顏色等級" value={colorQ} />}
          <R label="材質" value={materialType} />
          <R label="用料重量" value={weightKey} />
          <R label="做工複雜度" value={craft||style} />
          <R label="配石" value={sidestone!=='無配石'?sidestone:null} />
          <R label="鍍金" value={plating&&plating!=='無'?plating:null} />
          <R label="尺寸" value={itemSize} />
          {inquiryDate && <R label="詢價日期" value={inquiryDate} />}
          {budget > 0 && <R label="客戶預算" value={fmtNT(budget)} />}
        </div>

        {/* Legal disclaimer */}
        <div style={{fontSize:9,color:'#bbb',lineHeight:1.8,marginTop:10,paddingTop:8,borderTop:'1px solid #f0f0f0'}}>
          本公司為彩色裸礦石供應商，珠寶訂製為滿足客戶提供樣式、需求之金工服務，最終樣式以溝通內容詳載於訂單付款頁面為主，付款後視同確認無誤。
        </div>
      </div>
    </div>
  );
}

/* ── Photo-triggered estimator ──────────────────────── */
function PhotoQuoteFlow({ photo, onBack, onClose }) {
  const pricing = usePricing();
  // Map photo gemstone name → stoneKey
  const GEM_MAP = {};
  Object.entries(STONES_INVEST).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'invest'}; });
  Object.entries(pricing.STONES_COMMERCIAL).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'commercial'}; });
  const initGem = GEM_MAP[photo.gemstone] || null;

  const [budget,      setBudget]      = useState('');
  const [cat,         setCat]         = useState(photo.category        || CATS[0] || '戒指');
  const [style,       setStyle]       = useState(photo.style           || '');
  const [chain,       setChain]       = useState(photo.setting_amount  || '正常');
  const [craft,       setCraft]       = useState(photo.craft_complexity|| '普通');
  const [metalColor,  setMetalColor]  = useState(photo.metal_color     || '');
  const [materialType,setMaterialType]= useState(photo.metal_color==='銀'?'925銀':'18K金');
  const [stoneKey,    setStoneKey]    = useState(initGem?.key  || '');
  const [stoneMode,   setStoneMode]   = useState(initGem?.mode || 'invest');
  const [carat,       setCarat]       = useState('1');
  const [origin,      setOrigin]      = useState('');
  const [treatment,   setTreatment]   = useState('');
  const [colorQ,      setColorQ]      = useState('');
  const [sidestone,   setSidestone]   = useState('無配石');
  const [manualQuote, setManualQuote] = useState('');
  const [customer,       setCustomer]       = useState('');
  const [inquiryDate,    setInquiryDate]    = useState(`${new Date().getMonth()+1}/${new Date().getDate()}`);
  const [sourceChannel,  setSourceChannel]  = useState('');
  const [itemSize,       setItemSize]       = useState('');
  const [plating,        setPlating]        = useState('');
  const [stoneOrderNo,   setStoneOrderNo]   = useState('');
  const [qNotes,         setQNotes]         = useState('');
  const [colorPref,      setColorPref]      = useState('');
  const [saving,         setSaving]         = useState(false);
  const [savedId,        setSavedId]        = useState(null);
  const [finalInput,     setFinalInput]     = useState('');
  const [confirming,     setConfirming]     = useState(false);
  const [confirmed,      setConfirmed]      = useState(false);
  const [showCard,       setShowCard]       = useState(false);

  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColorQ(Object.keys(s.colors)[0]);
    }
    setManualQuote('');
  }, [stoneKey, stoneMode]);

  useEffect(() => {
    const opts = SIZE_OPTS[cat];
    setItemSize(opts ? opts[0] : '');
  }, [cat]);

  // Compute price
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0;
  const currentStone = stoneMode === 'invest' ? STONES_INVEST[stoneKey] : null;
  const currentStoneC = stoneMode === 'commercial' ? pricing.STONES_COMMERCIAL[stoneKey] : null;
  const stoneName = currentStone?.name || currentStoneC?.name || '';

  if (currentStone && ct > 0) {
    const band = getBand(ct);
    const k = (currentStone.origins[origin]||1) * (currentStone.treatments[treatment]||1) * (currentStone.colors[colorQ]||1);
    stoneMin = currentStone.floor[band] * k * 0.8 * ct;
    stoneMax = currentStone.ceil[band]  * k * 0.8 * ct;
  } else if (currentStoneC && ct > 0) {
    stoneMin = currentStoneC.range[0] * ct;
    stoneMax = currentStoneC.range[1] * ct;
  }

  const STYLE_TO_LABOR = {'無鑽':'極簡','簡約(5顆鑽內)':'簡單','輕奢(20顆鑽內)':'中等','奢華滿鑲鑽':'複雜','簡約':'簡單','輕奢':'中等','奢華':'複雜'};
  const CHAIN_TO_WEIGHT = {'少':'輕 (1.5–3g)','正常':'中 (3–5g)','多':'偏重 (5–8g)'};
  const laborKey   = STYLE_TO_LABOR[style] || craft || '中等';
  const laborRange = pricing.LABOR[cat]?.[laborKey] || [0,0];
  const weightKey  = CHAIN_TO_WEIGHT[chain] || '中 (3–5g)';
  const weightRange = (pricing.WEIGHTS[weightKey] || WEIGHTS[weightKey]) || [3,5];
  const metalPg    = pricing.METAL_PER_G[materialType] || METAL_PER_G[materialType] || 3800;
  const sideRange  = pricing.SIDESTONES[sidestone] || [0,0];
  const metalCostMin = metalPg * weightRange[0];
  const metalCostMax = metalPg * weightRange[1];
  const plateRange  = pricing.PLATING[plating] || [0,0];
  const mountMin   = laborRange[0] + metalCostMin + sideRange[0] + plateRange[0];
  const mountMax   = laborRange[1] + metalCostMax + sideRange[1] + plateRange[1];
  const totalMin   = stoneMin + mountMin;
  const totalMax   = stoneMax + mountMax;
  const hasPrice     = totalMin > 0 || totalMax > 0;
  const manualNum    = parseInt(String(manualQuote).replace(/[^0-9]/g,'')) || 0;
  const displayPrice = manualNum || Math.round((totalMin + totalMax) / 2);
  const budgetNum    = parseInt(String(budget).replace(/[^0-9]/g,'')) || 0;

  // Original values from CLIP
  const orig = {
    category:        photo.category         || '',
    style:           photo.style            || '',
    setting_amount:  photo.setting_amount   || '',
    craft_complexity:photo.craft_complexity || '',
    metal_color:     photo.metal_color      || '',
    gemstone:        photo.gemstone         || '',
  };
  const isChanged = (key, val) => orig[key] && orig[key] !== '未定' && orig[key] !== val;

  async function doSave() {
    setSaving(true);
    try {
      const adj = {category:cat, style, setting_amount:chain, craft_complexity:craft, metal_color:metalColor, material:materialType, gemstone:stoneName, stoneKey, stoneMode, carat:ct, origin, treatment, colorQ, sidestone, size:itemSize, plating, stone_order_no:stoneOrderNo, notes:qNotes, inquiry_time:inquiryDate, source_channel:sourceChannel};
      const notesText = [
        inquiryDate && `詢價時間：${inquiryDate}${sourceChannel?' ('+sourceChannel+')':''}`,
        manualNum > 0 && `初步報價：NT$${manualNum.toLocaleString('zh-TW')}`,
        itemSize && `尺寸：${itemSize}`,
        plating && plating !== '無' && `鍍金：${plating}`,
        stoneOrderNo && `裸石單號：${stoneOrderNo}`,
        qNotes && `備註：${qNotes}`,
      ].filter(Boolean).join('\n');
      const payload = {
        description:    `${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`,
        final_price:    manualNum,
        material:       materialType,
        gemstone:       stoneName || null,
        photo_id:       photo.id || null,
        customer_name:  customer || null,
        original_data:  JSON.stringify(orig),
        adjusted_data:  JSON.stringify(adj),
        estimated_min:  totalMin > 0 ? Math.round(totalMin) : null,
        estimated_max:  totalMax > 0 ? Math.round(totalMax) : null,
        budget:         budgetNum > 0 ? budgetNum : null,
        stone_order_no: stoneOrderNo || null,
        inquiry_time:   inquiryDate || null,
        source_channel: sourceChannel || null,
        notes:          notesText || null,
      };
      const res = await fetch('/api/quotes', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      if (res.ok) { const d = await res.json(); setSavedId(d.id); }
      else {
        const rawText = await res.text().catch(() => '');
        console.error('儲存失敗', res.status, rawText, payload);
        let detail = rawText;
        try { const j = JSON.parse(rawText); detail = JSON.stringify(j.detail || j, null, 2); } catch {}
        alert('儲存失敗 ' + res.status + '\n' + detail);
      }
    } catch(e) { alert('網路錯誤：' + e.message); }
    setSaving(false);
  }

  async function doConfirmPrice() {
    const price = parseInt(String(finalInput).replace(/[^0-9]/g,''));
    if (!price || !savedId) return;
    setConfirming(true);
    try {
      await fetch(`/api/quotes/${savedId}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: price }),
      });
      setConfirmed(true);
      setTimeout(onBack, 1600);
    } catch { alert('回填失敗'); }
    setConfirming(false);
  }

  if (savedId !== null) return (
    <div className="det-ovl">
      {showCard && hasPrice && (
        <QuoteCard
          photo={photo}
          description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
          estimatedMax={Math.round(totalMax)}
          manualPrice={manualNum}
          customer={customer}
          itemSize={itemSize}
          plating={plating}
          cat={cat}
          stoneName={stoneName}
          carat={ct}
          origin={origin}
          treatment={treatment}
          colorQ={colorQ}
          stoneMode={stoneMode}
          materialType={materialType}
          weightKey={weightKey}
          craft={craft}
          style={style}
          sidestone={sidestone}
          sourceChannel={sourceChannel}
          inquiryDate={inquiryDate}
          budget={budgetNum}
          onClose={() => setShowCard(false)}
        />
      )}
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <span className="det-hd-title">報價已儲存</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onBack}>×</button>
        </div>
        <div className="det-scroll" style={{padding:'24px 20px'}}>
          {/* Estimate summary + share */}
          <div style={{background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'18px 20px',marginBottom:20,textAlign:'center'}}>
            <div style={{fontSize:11,color:'var(--text3)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>預估報價</div>
            {hasPrice ? (
              <>
                <div style={{fontSize:32,fontWeight:700,color:'var(--text)',marginBottom:4}}>{fmtNT(manualNum || Math.round(totalMin))}</div>
                <div style={{fontSize:13,color:'var(--text2)'}}>{fmtNT(totalMin)} – {fmtNT(totalMax)}</div>
              </>
            ) : (
              <div style={{fontSize:14,color:'var(--text3)'}}>未計算報價</div>
            )}
            {customer && <div style={{fontSize:12,color:'var(--text2)',marginTop:8}}>客戶：{customer}</div>}
            {hasPrice && (
              <button onClick={() => setShowCard(true)}
                style={{marginTop:14,background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 18px',fontSize:13,fontWeight:600,color:'var(--text)',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
                📤 預覽報價單（截圖傳客人）
              </button>
            )}
          </div>

          {!confirmed ? (
            <div style={{background:'#fffbf0',borderRadius:12,border:'1px solid rgba(184,147,90,.35)',padding:'16px 18px'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--gold)',marginBottom:4}}>成交後回填實際成交價</div>
              <div style={{fontSize:12,color:'var(--text2)',marginBottom:14,lineHeight:1.6}}>
                實際成交價會記入歷史資料庫，讓系統自動學習並校正未來的報價區間。
              </div>
              <div style={{position:'relative',marginBottom:12}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:14,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
                <input type="text" inputMode="numeric" placeholder="0" autoFocus
                  value={finalInput}
                  onChange={e=>setFinalInput(e.target.value.replace(/[^0-9]/g,''))}
                  style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'11px 12px 11px 44px',fontSize:18,fontWeight:700,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit'}}
                  onFocus={e=>e.target.style.borderColor='var(--gold)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}
                  onKeyDown={e=>e.key==='Enter' && doConfirmPrice()}
                />
              </div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={doConfirmPrice} disabled={!finalInput || confirming}
                  style={{flex:1,background:(!finalInput||confirming)?'var(--s3)':'var(--gold)',color:(!finalInput||confirming)?'var(--text3)':'#fff',border:'none',borderRadius:8,padding:'11px',fontSize:14,fontWeight:700,cursor:(!finalInput||confirming)?'default':'pointer'}}>
                  {confirming ? '確認中…' : '✓ 確認成交'}
                </button>
                <button onClick={onBack}
                  style={{flex:1,background:'var(--surface)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:8,padding:'11px',fontSize:14,cursor:'pointer'}}>
                  事後再填
                </button>
              </div>
            </div>
          ) : (
            <div style={{textAlign:'center',padding:'32px 0'}}>
              <div style={{fontSize:48}}>✓</div>
              <div style={{fontSize:18,fontWeight:700,marginTop:12}}>成交價已記錄</div>
              <div style={{fontSize:13,color:'var(--text2)',marginTop:4}}>返回中…</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  // Chip component (inline helper)
  const Chip = ({val, cur, setCur, origVal}) => {
    const on = cur === val;
    const isOrig = origVal && origVal !== '未定' && origVal === val;
    return (
      <button key={val} onClick={() => setCur(val)} style={{
        padding:'7px 11px', borderRadius:8, margin:'3px 3px 3px 0',
        border: on ? '1.5px solid var(--gold)' : '1px solid var(--border)',
        background: on ? 'rgba(184,147,90,.14)' : isOrig ? 'rgba(184,147,90,.06)' : 'var(--surface)',
        color: on ? 'var(--gold)' : 'var(--text)',
        fontSize:12, fontWeight: on ? 700 : 400, cursor:'pointer',
        position:'relative', flexShrink:0,
      }}>
        {val}
        {isOrig && !on && <span style={{position:'absolute',top:-6,right:-4,background:'var(--gold)',color:'#fff',fontSize:8,fontWeight:700,padding:'1px 4px',borderRadius:4,lineHeight:1.3}}>原</span>}
      </button>
    );
  };

  const SLabel = ({label, origVal, adjVal}) => (
    <div style={{fontSize:11,fontWeight:700,letterSpacing:0.5,color:'var(--text3)',margin:'12px 0 4px'}}>
      {label}
      {origVal && origVal !== '未定' && origVal !== adjVal && (
        <span style={{fontSize:10,fontWeight:400,color:'rgba(184,147,90,.8)',marginLeft:8}}>原: {origVal}</span>
      )}
    </div>
  );

  const anyChanged = ['category','style','setting_amount','craft_complexity'].some(k =>
    isChanged(k, {category:cat,style,setting_amount:chain,craft_complexity:craft}[k])
  ) || (orig.gemstone && orig.gemstone !== '未定' && stoneName && stoneName !== orig.gemstone);

  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={onBack}>←</button>
          <span className="det-hd-title">簡易估價</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>
        </div>

        <div className="det-scroll" style={{padding:'12px 16px',paddingBottom:160}}>

          {/* ── 詢單資訊 ─────────────────────────────── */}
          <div style={{background:'var(--surface)',borderRadius:12,border:'1px solid var(--border)',padding:'14px 16px',marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',color:'var(--text3)',marginBottom:10}}>詢單資訊</div>
            {/* Row: date + source */}
            <div style={{display:'flex',gap:8,marginBottom:10}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>詢價時間</div>
                <input type="text" placeholder={`${new Date().getMonth()+1}/${new Date().getDate()}`} value={inquiryDate}
                  onChange={e=>setInquiryDate(e.target.value)}
                  style={{width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 10px',fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)'}}
                  onFocus={e=>e.target.style.borderColor='var(--gold)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}
                />
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>帳號來源</div>
                <select value={sourceChannel} onChange={e=>setSourceChannel(e.target.value)}
                  style={{width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 10px',fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)',cursor:'pointer',appearance:'none',WebkitAppearance:'none'}}
                  onFocus={e=>e.target.style.borderColor='var(--gold)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}
                >
                  <option value="">— 選擇 —</option>
                  {['FB','IG','LINE','WhatsApp','現場','官網','其他'].map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            {/* Customer name */}
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>客人名字</div>
            <input type="text" placeholder="林小姐" value={customer}
              onChange={e=>setCustomer(e.target.value)}
              style={{width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 10px',fontSize:14,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)'}}
              onFocus={e=>e.target.style.borderColor='var(--gold)'}
              onBlur={e=>e.target.style.borderColor='var(--border)'}
            />
          </div>

          {/* Reference photo */}
          <div style={{display:'flex',gap:12,alignItems:'center',background:'var(--surface)',borderRadius:12,padding:'12px',border:'1px solid var(--border)',marginBottom:14}}>
            <img src={photo.thumb_url} alt="" style={{width:64,height:64,objectFit:'cover',borderRadius:8,flexShrink:0}} />
            <div>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>參考款</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                {[photo.category, photo.gemstone, photo.style, photo.stone_size].filter(v=>v&&v!=='未定').map((t,i)=>(
                  <span key={i} style={{background:'var(--s3)',borderRadius:5,padding:'2px 7px',fontSize:11}}>{t}</span>
                ))}
              </div>
            </div>
          </div>

          {/* Budget + color preference */}
          <div style={{background:'var(--surface)',borderRadius:12,border:'1px solid var(--border)',padding:'14px 16px',marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',color:'var(--text3)',marginBottom:8}}>客戶預算</div>
            <div style={{position:'relative',marginBottom:12}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:15,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
              <input type="text" inputMode="numeric" placeholder="0"
                value={budget}
                onChange={e => setBudget(e.target.value.replace(/[^0-9]/g,''))}
                style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'11px 12px 11px 44px',fontSize:20,fontWeight:700,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit'}}
                onFocus={e=>e.target.style.borderColor='var(--gold)'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
            </div>
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,fontWeight:600}}>顏色偏好（選擇後寶石區會亮起建議）</div>

/* ── Quote / Estimator tab ──────────────────────────── */
function QuoteTab() {
  const pricing = usePricing();
  /* ── State ── */
  const [stoneKey,    setStoneKey]    = useState('');       // invest key or '' or COMMERCIAL_*
  const [stoneMode,   setStoneMode]   = useState('invest'); // 'invest' | 'commercial'
  const [carat,       setCarat]       = useState('1');
  const [origin,      setOrigin]      = useState('');
  const [treatment,   setTreatment]   = useState('');
  const [color,       setColor]       = useState('');
  const [hasMounting, setHasMounting] = useState(true);
  const [item,        setItem]        = useState('戒指');
  const [metal,       setMetal]       = useState('18K金');
  const [weight,      setWeight]      = useState('中 (3–5g)');
  const [complexity,  setComplexity]  = useState('中等');
  const [sidestone,   setSidestone]   = useState('無配石');
  const [size,        setSize]        = useState('');
  const [cert,        setCert]        = useState('無');
  const [customer,    setCustomer]    = useState('');
  const [sliderPct,   setSliderPct]   = useState(0.5);
  const [copied,      setCopied]      = useState(false);

  /* ── Pending quotes ── */
  const [pending,          setPending]          = useState([]);
  const [pendingFill,      setPendingFill]      = useState({});
  const [pendingBusy,      setPendingBusy]      = useState(null);
  const [overdueAlert,     setOverdueAlert]     = useState(false);

  useEffect(() => {
    fetch('/api/quotes/pending')
      .then(r => r.json())
      .then(data => {
        setPending(data);
        if (data.some(q => q.hours_elapsed >= 24)) setOverdueAlert(true);
      })
      .catch(() => {});
  }, []);

  async function confirmPending(id) {
    const price = parseInt((pendingFill[id]||'').replace(/[^0-9]/g,''));
    if (!price) return;
    setPendingBusy(id);
    try {
      await fetch(`/api/quotes/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: price }),
      });
      setPending(prev => prev.filter(q => q.id !== id));
    } catch { alert('回填失敗'); }
    setPendingBusy(null);
  }

  /* ── Reset invest-detail fields when stone changes ── */
  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColor(Object.keys(s.colors)[0]);
    }
    setSliderPct(0.5);
  }, [stoneKey, stoneMode]);

  /* Reset size when item changes */
  useEffect(() => {
    if (SIZE_OPTS[item]) setSize(SIZE_OPTS[item][0]);
  }, [item]);

  /* ── Computation ── */
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0, stoneTarget = 0;
  let stoneLabel = '';

  if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey] && ct > 0) {
    const s = STONES_INVEST[stoneKey];
    stoneLabel = s.name;
    const band = getBand(ct);
    const k = (s.origins[origin] || 1) * (s.treatments[treatment] || 1) * (s.colors[color] || 1);
    const fpc = s.floor[band] * k;
    const cpc = s.ceil[band] * k;
    const ref = Math.sqrt(fpc * cpc);
    stoneMin    = fpc * 0.8 * ct;
    stoneMax    = cpc * 0.8 * ct;
    stoneTarget = ref * 0.8 * ct;
  } else if (stoneMode === 'commercial' && stoneKey && pricing.STONES_COMMERCIAL[stoneKey] && ct > 0) {
    const s = pricing.STONES_COMMERCIAL[stoneKey];
    stoneLabel = s.name;
    stoneMin    = s.range[0] * ct;
    stoneMax    = s.range[1] * ct;
    stoneTarget = (stoneMin + stoneMax) / 2;
  }

  let mountMin = 0, mountMax = 0;
  if (hasMounting) {
    const laborRange  = (pricing.LABOR[item] && pricing.LABOR[item][complexity]) ? pricing.LABOR[item][complexity] : [0,0];
    const weightRange = pricing.WEIGHTS[weight] || WEIGHTS[weight] || [0,0];
    const metalPg     = pricing.METAL_PER_G[metal] || METAL_PER_G[metal] || 0;
    const sideRange   = pricing.SIDESTONES[sidestone] || [0,0];
    mountMin = laborRange[0] + metalPg * weightRange[0] + sideRange[0];
    mountMax = laborRange[1] + metalPg * weightRange[1] + sideRange[1];
  }

  const certFee = CERTS[cert] || 0;
  const totalMin    = stoneMin    + mountMin + certFee;
  const totalMax    = stoneMax    + mountMax + certFee;
  const totalTarget = stoneTarget + (mountMin + mountMax) / 2 + certFee;

/* ── Login PIN modal ───────────────────────────────── */
function PinModal({ onClose, onAuth, onAgentLogin }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState(false);
  function submit() {
    if (pin === ADMIN_PIN)      { localStorage.setItem('userRole','admin'); onAuth('admin'); onClose(); }
    else if (pin === STAFF_PIN) { localStorage.setItem('userRole','staff'); onAuth('staff'); onClose(); }
    else { setErr(true); setPin(''); }
  }
  return (
    <div className="pin-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="pin-box">
        <div className="pin-title">登入</div>
        <input className="pin-input" type="password" inputMode="numeric" maxLength={6}
          placeholder="••••" value={pin} autoFocus
          onChange={e => { setPin(e.target.value); setErr(false); }}
          onKeyDown={e => e.key === 'Enter' && submit()} />
        <div className="pin-err">{err ? '密碼錯誤' : ''}</div>
        <button className="pin-btn" onClick={submit}>確認</button>
        <button className="pin-cancel" onClick={onClose}>取消</button>
        {onAgentLogin && (
          <div style={{textAlign:'center',marginTop:10}}>
            <button className="agent-login-toggle" onClick={onAgentLogin}>代理商登入</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Login modal (JWT, inactive when USE_JWT_AUTH=false) */
function LoginModal({ onClose, onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  async function submit() {
    if (!username || !password) return;
    setLoading(true); setErr('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      if (!res.ok) { setErr('帳號或密碼錯誤'); setLoading(false); return; }
      const data = await res.json();
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('jwt_user', JSON.stringify(data.user));
      onAuth(data.user.role, data.user);
      onClose();
    } catch { setErr('連線失敗'); }

  return (

}

/* ── Agent login modal ─────────────────────────────── */
function AgentLoginModal({ onClose, onAuth }) {
  const [mode, setMode] = useState('phone'); // 'phone' | 'name'
  const [name,  setName]  = useState('');
  const [phone, setPhone] = useState('');
  const [pin,   setPin]   = useState('');
  const [err,   setErr]   = useState('');
  const [busy,  setBusy]  = useState(false);

  async function submit() {
    if (!pin) { setErr('請輸入 PIN'); return; }
    if (mode === 'phone' && !phone) { setErr('請輸入電話'); return; }
    if (mode === 'name'  && !name)  { setErr('請輸入姓名'); return; }
    setBusy(true); setErr('');
    try {
      const res = await fetch('/api/agents/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: name.trim(), phone: phone.trim(), pin: pin.trim() }),

      const agent = await res.json();
      localStorage.setItem('agentUser', JSON.stringify({...agent, pin: pin.trim()}));
      onAuth(agent);
      onClose();
    } catch { setErr('連線失敗'); }
    setBusy(false);

  return (
    <div className="pin-ovl" onClick={e => e.target === e.currentTarget && onClose()}>

/* ── SwipeMode ─────────────────────────────────────────── */
function SwipeMode({ agentUser, filters, onClose, onFavAdded }) {
  const [queue,    setQueue]    = useState([]);
  const [idx,      setIdx]      = useState(0);
  const [loading,  setLoading]  = useState(true);
  const [done,     setDone]     = useState(false);

  // Drag state
  const [dragX,    setDragX]    = useState(0);
  const [dragging, setDragging] = useState(false);
  const dragStartX = useRef(0);
  const flyRef     = useRef(null); // 'left' | 'right'
  const cardRef    = useRef(null);

  // Swipe count for display
  const [swiped, setSwiped] = useState(0);

  const loadBatch = async () => {
    try {
      const qs = new URLSearchParams({ pin: agentUser.pin, limit: 20, ...filters });
      const res = await fetch(`/api/agents/${agentUser.id}/recommendations?${qs}`);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  };

  useEffect(() => {
    setLoading(true);
    loadBatch().then(batch => {
      setQueue(batch);
      setLoading(false);
      if (!batch.length) setDone(true);
    });
  }, []);

  // Prefetch next batch when near end
  useEffect(() => {
    if (!done && queue.length - idx < 5 && !loading) {
      setLoading(true);
      loadBatch().then(batch => {
        if (!batch.length) { setDone(true); }
        else { setQueue(prev => [...prev, ...batch]); }
        setLoading(false);
      });
    }
  }, [idx, queue.length]);

  const postSwipe = (photo_id, action) => {
    fetch(`/api/agents/${agentUser.id}/swipe`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ photo_id, action, pin: agentUser.pin }),
    }).catch(() => {});
  };

  const doSwipe = (action) => {
    const photo = queue[idx];
    if (!photo) return;
    postSwipe(photo.id, action);
    setSwiped(n => n + 1);

    // animate
    if (cardRef.current) {
      cardRef.current.classList.add(action === 'like' ? 'fly-right' : 'fly-left');
    }
    setTimeout(() => {
      setDragX(0);
      setIdx(i => {
        const next = i + 1;
        if (next >= queue.length && done) setDone(true);
        return next;
      });
      if (cardRef.current) {
        cardRef.current.classList.remove('fly-right', 'fly-left');
      }
    }, 280);
  };

  const doFavorite = () => {
    const photo = queue[idx];
    if (!photo) return;
    fetch(`/api/agents/${agentUser.id}/favorites/${photo.id}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pin: agentUser.pin }),
    }).catch(() => {});
    if (onFavAdded) onFavAdded(photo);
    doSwipe('like');
  };

  // Touch / mouse drag
  const onStart = (x) => { dragStartX.current = x; setDragging(true); };
  const onMove  = (x) => { if (!dragging) return; setDragX(x - dragStartX.current); };
  const onEnd   = (x) => {
    setDragging(false);
    const diff = x - dragStartX.current;
    if (Math.abs(diff) > 80) doSwipe(diff > 0 ? 'like' : 'unlike');
    else setDragX(0);
  };

  const photo = queue[idx];
  const nextPhoto = queue[idx + 1];

  const rotation = dragX * 0.06;
  const cardStyle = {
    transform: `translateX(${dragX}px) rotate(${rotation}deg)`,
    transition: dragging ? 'none' : 'transform .25s ease',
  };

  const showLike  = dragX >  50;
  const showSkip  = dragX < -50;

  if (loading && !queue.length) return (
    <div className="swipe-overlay">
      <div className="swipe-topbar">
        <button className="swipe-back-btn" onClick={onClose}>← 返回</button>
      </div>
      <div className="swipe-empty"><div style={{color:'#888',marginTop:60}}>載入中…</div></div>
    </div>
  );

  if ((!photo && done) || (!photo && !loading)) return (
    <div className="swipe-overlay">
      <div className="swipe-topbar">
        <button className="swipe-back-btn" onClick={onClose}>← 返回</button>
      </div>
      <div className="swipe-empty">
        <h3>已看完所有款式 ✓</h3>
        <div>已滑過 {swiped} 張</div>
        <div style={{marginTop:8,fontSize:13,color:'#666'}}>換個條件繼續探索，或查看收藏</div>
        <button onClick={onClose} style={{marginTop:20,background:'var(--gold)',color:'#fff',border:'none',borderRadius:10,padding:'10px 24px',fontSize:14,cursor:'pointer'}}>查看收藏</button>
      </div>
    </div>
  );

  return (
    <div className="swipe-overlay"
      onMouseMove={e => onMove(e.clientX)}
      onMouseUp={e => { onEnd(e.clientX); }}
      onMouseLeave={() => { if (dragging) { setDragging(false); setDragX(0); } }}
    >
      <div className="swipe-topbar">
        <button className="swipe-back-btn" onClick={onClose}>← 返回</button>
        <span className="swipe-counter">已滑 {swiped} 張</span>
      </div>

      <div className="swipe-arena">
        {/* Background next card */}
        {nextPhoto && (
          <div className="swipe-card-wrap back-card">
            <img src={`/static/full/${nextPhoto.filename}`} alt="" draggable={false} />
          </div>
        )}

        {/* Front card */}
        {photo && (
          <div
            ref={cardRef}
            className="swipe-card-wrap front-card"
            style={cardStyle}
            onTouchStart={e => onStart(e.touches[0].clientX)}
            onTouchMove={e  => onMove(e.touches[0].clientX)}
            onTouchEnd={e   => onEnd(e.changedTouches[0].clientX)}
            onMouseDown={e  => { e.preventDefault(); onStart(e.clientX); }}
          >
            <img src={`/static/full/${photo.filename}`} alt="" draggable={false} />
            <div className="swipe-card-info">
              <div className="swipe-card-tags">
                {[photo.category, photo.gemstone, photo.stone_shape, photo.style, photo.color].filter(Boolean).map((t,i) => (
                  <span key={i} className="swipe-card-tag">{t}</span>
                ))}
              </div>
            </div>

            {/* Direction hints */}
            <div className={`swipe-hint like ${showLike ? 'show' : ''}`}>❤ 喜歡</div>
            <div className={`swipe-hint skip ${showSkip ? 'show' : ''}`}>✕ 跳過</div>
          </div>
        )}
      </div>

      <div className="swipe-btns">
        <button className="swipe-btn swipe-btn-skip" onClick={() => doSwipe('unlike')} title="跳過（不再出現）">✕</button>
        <button className="swipe-btn swipe-btn-fav"  onClick={doFavorite} title="收藏">★</button>
        <button className="swipe-btn swipe-btn-like" onClick={() => doSwipe('like')} title="喜歡">❤</button>
      </div>
    </div>
  );
}

/* ── Upload button ─────────────────────────────────── */
function UploadBtn({ onUploaded }) {
  const inputRef  = useRef(null);
  const [busy,    setBusy]    = useState(false);
  const [toast,   setToast]   = useState(null);

  async function handleFiles(e) {
    const files = [...e.target.files];
    if (!files.length) return;
    setBusy(true); setToast(null);
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const ok   = data.uploaded?.length || 0;
      const fail = data.errors?.length   || 0;
      const dups = data.errors?.filter(e => e.error === '重複照片').length || 0;
      let msg = ok > 0 ? `✓ 已新增 ${ok} 張` : '';
      if (dups)  msg += (msg ? '\n' : '') + `⚠ ${dups} 張重複`;
      if (fail - dups > 0) msg += (msg ? '\n' : '') + `✗ ${fail - dups} 張失敗`;
      setToast(msg || '無新照片');
      if (ok > 0 && onUploaded) onUploaded(data.uploaded);
    } catch {
      setToast('✗ 上傳失敗，請重試');
    } finally {
      setBusy(false);
      e.target.value = '';
      setTimeout(() => setToast(null), 4000);
    }
  }

  return (
    <>
      <input ref={inputRef} type="file" accept="image/*,.heic,.heif" multiple style={{display:'none'}} onChange={handleFiles} />
      <button className="upload-fab" onClick={() => inputRef.current.click()} disabled={busy} title="上傳照片">
        {busy ? '…' : '+'}
      </button>
      {toast && <div className="upload-toast">{toast}</div>}
    </>
  );
}

/* ── Dark-bg cleaner modal ─────────────────────────── */
function DarkBgModal({ onClose, onDeleted }) {
  const [phase, setPhase] = useState('idle'); // idle | scanning | confirm | deleting | done
  const [photos, setPhotos] = useState([]);
  const [excluded, setExcluded] = useState(new Set()); // IDs to keep (untick)
  const [count, setCount] = useState(0);

  const scan = () => {
    setPhase('scanning');
    fetch('/api/photos/dark-bg')
      .then(r => r.json())
      .then(d => { setPhotos(d.photos); setPhase('confirm'); })
      .catch(() => { alert('掃描失敗'); setPhase('idle'); });
  };

  const toggle = id => setExcluded(prev => {
    const s = new Set(prev);
    s.has(id) ? s.delete(id) : s.add(id);
    return s;
  });

  const doDelete = async () => {
    const ids = photos.filter(p => !excluded.has(p.id)).map(p => p.id);
    if (!ids.length) { onClose(); return; }
    setPhase('deleting');
    const res = await fetch('/api/photos/bulk', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const d = await res.json();
    setCount(d.deleted.length);
    setPhase('done');
    onDeleted && onDeleted(d.deleted);
  };

  const toDelete = photos.filter(p => !excluded.has(p.id));

  return (
    <div className="darkbg-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="darkbg-panel">
        <div className="darkbg-hd">
          <button className="det-back" onClick={onClose}>×</button>
          <span style={{flex:1,fontSize:15,fontWeight:600}}>清除黑底照片</span>
        </div>

        {phase === 'idle' && (
          <div style={{padding:'40px 24px',textAlign:'center',color:'var(--text2)',fontSize:14,lineHeight:1.9}}>
            偵測縮圖四個角落亮度<br/>自動找出黑色背景的照片<br/>
            <button className="db db-save" style={{marginTop:20,padding:'10px 32px'}} onClick={scan}>開始掃描</button>
          </div>
        )}

        {phase === 'scanning' && (
          <div className="loading-msg" style={{padding:60}}>掃描中，請稍候…</div>
        )}

        {phase === 'confirm' && (
          <>
            <div style={{padding:'8px 16px',fontSize:12,color:'var(--text2)',flexShrink:0}}>
              找到 <b>{photos.length}</b> 張黑底圖・點擊可取消勾選保留・將刪除 <b>{toDelete.length}</b> 張
            </div>
            {photos.length === 0
              ? <div className="empty-msg">沒有找到黑底照片</div>
              : <div className="darkbg-grid">
                  {photos.map(p => (
                    <div key={p.id} className={'darkbg-card' + (excluded.has(p.id) ? ' exclude' : '')}
                      onClick={() => toggle(p.id)}>
                      <img src={p.thumb_url} alt="" loading="lazy" />
                    </div>
                  ))}
                </div>
            }
            <div className="darkbg-footer">
              <button className="db" style={{flex:1,border:'1px solid var(--border)',background:'none'}} onClick={onClose}>取消</button>
              <button className="db db-save" style={{flex:2}} onClick={doDelete} disabled={toDelete.length===0}>
                永久刪除 {toDelete.length} 張
              </button>
            </div>
          </>
        )}

        {phase === 'deleting' && <div className="loading-msg" style={{padding:60}}>刪除中…</div>}

        {phase === 'done' && (
          <div style={{padding:'40px 24px',textAlign:'center',fontSize:14,color:'var(--text2)',lineHeight:2}}>
            ✅ 已刪除 {count} 張黑底照片<br/>
            <button className="db db-save" style={{marginTop:16,padding:'10px 32px'}} onClick={onClose}>完成</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── PricingBanner ──────────────────────────────────── */
function PricingBanner({ metalsLastUpdated, onGotoSettings }) {
  const DISMISS_KEY = 'pricingBannerDismissed';
  const DISMISS_TTL = 7 * 24 * 3600 * 1000; // 7 days in ms

  const [visible, setVisible] = React.useState(() => {
    try {
      const raw = localStorage.getItem(DISMISS_KEY);
      if (!raw) return true;
      const { ts } = JSON.parse(raw);
      return Date.now() - ts > DISMISS_TTL;
    } catch { return true; }
  });

  if (!visible || !metalsLastUpdated) return null;

  // Calculate days since last update
  const lastMs = new Date(metalsLastUpdated).getTime();
  const daysSince = Math.floor((Date.now() - lastMs) / (24 * 3600 * 1000));
  if (daysSince <= 7) return null;

  function dismiss() {
    localStorage.setItem(DISMISS_KEY, JSON.stringify({ ts: Date.now() }));
    setVisible(false);
  }

  return (
    <div className="pricing-banner">
      <span className="banner-msg">⚠️ 金銀行情已 {daysSince} 天未更新</span>
      {onGotoSettings && (
        <button className="banner-goto" onClick={onGotoSettings}>前往更新</button>
      )}
      <button className="banner-dismiss" onClick={dismiss} title="關閉">✕</button>
    </div>
  );
}

/* ── StagingSection ─────────────────────────────────── */
function StagingSection() {
  const [files,   setFiles]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [status,  setStatus]  = useState(null);
  const [polling, setPolling] = useState(false);

  function load() {
    setLoading(true);
    fetch('/api/staging').then(r => r.json()).then(d => {
      setFiles(d.files || []);
      setLoading(false);
    }).catch(() => setLoading(false));
  }

  useEffect(() => { load(); }, []);

  // poll ingest status while running
  useEffect(() => {
    if (!polling) return;
    const id = setInterval(() => {
      fetch('/api/staging/ingest-status').then(r => r.json()).then(s => {
        setStatus(s);
        if (!s.running) {
          setPolling(false);
          load();
        }
      });
    }, 1500);
    return () => clearInterval(id);
  }, [polling]);

  function del(rel) {
    fetch(`/api/staging/${encodeURIComponent(rel)}`, { method: 'DELETE' })
      .then(() => setFiles(f => f.filter(x => x.rel !== rel)));
  }

  function startIngest() {
    fetch('/api/staging/ingest', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        setStatus(d.status || {});
        setPolling(true);
      });
  }

  const running = status?.running;
  const done    = status?.done;

  return (
    <div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:8}}>
        將照片放入 <code>data/01_unsorted/</code>，預看後按「確認匯入」。
      </div>
      {loading
        ? <div className="staging-empty">載入中…</div>
        : files.length === 0
          ? <div className="staging-empty">目前沒有待匯入照片</div>
          : (
            <div className="staging-grid">
              {files.map(f => (
                <div key={f.rel} className="staging-card">
                  <img src={`/api/staging/thumb/${encodeURIComponent(f.rel)}`} loading="lazy" />
                  <button className="staging-card-del" onClick={() => del(f.rel)} title="刪除">✕</button>
                </div>
              ))}
            </div>
          )
      }
      <div className="staging-actions">
        <button
          className="staging-ingest-btn"
          disabled={files.length === 0 || running}
          onClick={startIngest}
        >
          {running ? `匯入中… ${status?.step || ''}` : `確認匯入 ${files.length} 張`}
        </button>
        <button className="staging-ingest-btn" style={{flex:'none',background:'#888'}} onClick={load}>重新整理</button>
      </div>
      {status && (
        <div className="staging-status">
          {done ? '✅ 匯入完成' : running ? `⏳ ${status.step}` : status.step || ''}
        </div>
      )}
    </div>
  );
}

/* ── PricingSettingsTab ─────────────────────────────── */
function PricingSettingsTab() {
  const SECTIONS = ['金銀', '金工', '彩寶', '投資寶石', '代理商'];
  const LABOR_CATS = ['戒指', '墜子', '耳釘', '手鍊', '項鍊', '胸針', '手鐲'];
  const LABOR_CAT_KEYS = { '戒指':'戒指', '墜子':'吊墜', '耳釘':'耳釘', '手鍊':'手鍊', '項鍊':'項鍊', '胸針':'胸針', '手鐲':'手鐲' };
  const COMPLEXITIES = ['極簡', '簡單', '中等', '複雜', '精工'];
  const METAL_NAMES = ['925銀', '9K金', '14K金', '18K金', 'Pt950'];
  const INVEST_STONES = ['RUBY', 'SAPPHIRE', 'EMERALD', 'DIAMOND', 'ALEXANDRITE', 'TANZANITE'];
  const BANDS = ['B1', 'B2', 'B3', 'B4', 'B5'];

  const [sec, setSec] = React.useState('金銀');
  const [laborCat, setLaborCat] = React.useState('戒指');
  const [laborSubTab, setLaborSubTab] = React.useState('品項費');
  const [investStone, setInvestStone] = React.useState('RUBY');
  const [pricing, setPricing] = React.useState(null);
  const [saving, setSaving] = React.useState({});
  const [saved, setSaved] = React.useState({});

  const [metalVals, setMetalVals] = React.useState({});
  const [laborVals, setLaborVals] = React.useState({});
  const [commVals, setCommVals] = React.useState({});
  const [sidestoneVals, setSidestoneVals] = React.useState({});
  const [platingVals, setPlatingVals] = React.useState({});
  const [investBandVals, setInvestBandVals] = React.useState({});
  const [investMultVals, setInvestMultVals] = React.useState({});

  useEffect(() => {
    fetch('/api/pricing/all')
      .then(r => r.json())
      .then(d => {
        setPricing(d);
        const mv = {};
        (d.metals ? Object.entries(d.metals) : []).forEach(([mat, val]) => { mv[mat] = String(val); });
        setMetalVals(mv);

        const lv = {};
        (d.labor ? Object.entries(d.labor) : []).forEach(([cat, comps]) => {
          Object.entries(comps).forEach(([comp, range]) => { lv[cat + '/' + comp] = { min: String(range[0]), max: String(range[1]) }; });
        });
        setLaborVals(lv);

        const cv = {};
        (d.stones_commercial ? Object.entries(d.stones_commercial) : []).forEach(([key, info]) => { cv[key] = { min: String(info.range[0]), max: String(info.range[1]) }; });
        setCommVals(cv);

        const sv = {};
        (d.sidestones ? Object.entries(d.sidestones) : []).forEach(([label, range]) => { sv[label] = { min: String(range[0]), max: String(range[1]) }; });
        setSidestoneVals(sv);

        const pv = {};
        (d.plating ? Object.entries(d.plating) : []).forEach(([label, range]) => { pv[label] = { min: String(range[0]), max: String(range[1]) }; });
        setPlatingVals(pv);

        const ibv = {};
        (d.stones_invest ? Object.entries(d.stones_invest) : []).forEach(([skey, info]) => {
          ['B1','B2','B3','B4','B5'].forEach(band => {
            if (info.floor[band] != null) ibv[skey + '/' + band] = { floor: String(info.floor[band]), ceil: String(info.ceil[band]) };
          });
        });
        setInvestBandVals(ibv);

        const imv = {};
        (d.stones_invest ? Object.entries(d.stones_invest) : []).forEach(([skey, info]) => {
          Object.entries(info.origins    || {}).forEach(([o, m]) => { imv[skey + '/origins/'    + o] = String(m); });
          Object.entries(info.treatments || {}).forEach(([t, m]) => { imv[skey + '/treatments/' + t] = String(m); });
          Object.entries(info.colors     || {}).forEach(([c, m]) => { imv[skey + '/colors/'     + c] = String(m); });
        });
        setInvestMultVals(imv);
      })
      .catch(() => {});
  }, []);

  function markSaved(key) {
    setSaved(s => ({ ...s, [key]: true }));
    setTimeout(() => setSaved(s => { const n = { ...s }; delete n[key]; return n; }), 2000);
  }

  async function saveMetal(mat) {
    const key = 'metal/' + mat;
    setSaving(s => ({ ...s, [key]: true }));
    try {
      const res = await fetch('/api/pricing/metals/' + encodeURIComponent(mat), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ price_per_g: parseInt(metalVals[mat]) || 0 }),
      });
      if (res.ok) {
        markSaved(key);
        setPricing(p => ({ ...p, metals: { ...p.metals, [mat]: parseInt(metalVals[mat]) || 0 } }));
      }
    } catch {}
    setSaving(s => { const n = { ...s }; delete n[key]; return n; });
  }

  async function saveLabor(catDisplay, comp) {
    const catKey = LABOR_CAT_KEYS[catDisplay] || catDisplay;
    const lkey = catKey + '/' + comp;
    const key = 'labor/' + lkey;
    setSaving(s => ({ ...s, [key]: true }));
    try {
      const res = await fetch(
        '/api/pricing/labor/' + encodeURIComponent(catKey) + '/' + encodeURIComponent(comp),
        {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            price_min: parseInt(laborVals[lkey]?.min) || 0,
            price_max: parseInt(laborVals[lkey]?.max) || 0,
          }),
        }
      );
      if (res.ok) markSaved(key);
    } catch {}

/* ── AgentFavsTab ──────────────────────────────────────── */
function AgentFavsTab({ agentUser, onSelectPhoto }) {
  const [favs,   setFavs]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [detail,  setDetail]  = useState(null);

  useEffect(() => {
    fetch(`/api/agents/${agentUser.id}/favorites?pin=${encodeURIComponent(agentUser.pin)}`)
      .then(r => r.json()).then(d => { setFavs(Array.isArray(d) ? d : []); setLoading(false); })
      .catch(() => setLoading(false));
  }, [agentUser.id]);

  const removeFav = async (photo_id) => {
    await fetch(`/api/agents/${agentUser.id}/favorites/${photo_id}?pin=${encodeURIComponent(agentUser.pin)}`, { method: 'DELETE' });
    setFavs(prev => prev.filter(p => p.id !== photo_id));
  };

  if (loading) return <div style={{padding:32,textAlign:'center',color:'var(--text2)'}}>載入中…</div>;
  if (!favs.length) return (
    <div style={{padding:40,textAlign:'center',color:'var(--text2)'}}>
      <div style={{fontSize:32,marginBottom:8}}>★</div>
      <div>還沒有收藏</div>
      <div style={{fontSize:13,marginTop:4}}>在探索模式中點 ★ 收藏喜歡的款式</div>
    </div>
  );

  return (
    <div style={{padding:'12px 8px'}}>
      <div style={{padding:'0 8px 8px',fontSize:13,color:'var(--text2)'}}>收藏 {favs.length} 款</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:4}}>
        {favs.map(p => (
          <div key={p.id} style={{position:'relative',cursor:'pointer'}} onClick={() => setDetail(p)}>
            <img src={`/static/thumb/${p.filename}`} alt="" style={{width:'100%',aspectRatio:'1/1',objectFit:'cover',borderRadius:8,display:'block'}} />
            <button onClick={e => { e.stopPropagation(); removeFav(p.id); }}
              style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,.5)',border:'none',borderRadius:50,width:22,height:22,color:'#fff',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
              ✕
            </button>
          </div>
        ))}
      </div>
      {detail && (
        <PhotoDetail
          photo={detail} onClose={() => setDetail(null)}
          isFav={() => true}
          toggleFav={() => { removeFav(detail.id); setDetail(null); }}
          onSelectPhoto={() => {}} onDeleted={() => {}} onUpdated={() => {}}
          role="agent"
        />
      )}
    </div>
  );
}

/* ── App ────────────────────────────────────────────── */
function App() {
  const [splash,         setSplash]         = useState(true);
  const [tab,            setTab]            = useState('browse');
  const [favs,           setFavs]           = useState(loadFavs);
  const [showDarkBg,     setShowDarkBg]     = useState(false);
  const [role,           setRole]           = useState(() => {
    const stored = localStorage.getItem('userRole') || 'guest';
    // If agentUser exists in localStorage, role is agent
    const agent = (() => { try { return JSON.parse(localStorage.getItem('agentUser') || 'null'); } catch { return null; } })();
    return agent ? 'agent' : stored;
  });
  const [showPin,        setShowPin]        = useState(false);
  const [showAgentLogin, setShowAgentLogin] = useState(false);
  const [metalsLastUpd,  setMetalsLastUpd]  = useState(null);
  const [agentUser,      setAgentUser]      = useState(() => {
    try { return JSON.parse(localStorage.getItem('agentUser') || 'null'); } catch { return null; }
  });
  const [swipeMode,      setSwipeMode]      = useState(false);
  const [swipeFilters,   setSwipeFilters]   = useState({});

  const isAdmin = role === 'admin';
  const isStaff = role === 'staff' || role === 'admin';
  const isAgent = role === 'agent';

  // Fetch metals_last_updated for banner
  useEffect(() => {
    if (!isStaff) return;
    fetch('/api/pricing/all')
      .then(r => r.json())
      .then(d => { if (d.metals_last_updated) setMetalsLastUpd(d.metals_last_updated); })
      .catch(() => {});
  }, [isStaff]);

  // JWT init (only when USE_JWT_AUTH = true)
  useEffect(() => {
    if (!USE_JWT_AUTH) return;
    const user = getJwtUser();
    const token = getJwtToken();
    if (user && token) {
      setRole(user.role);
      fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(r => r.json())
        .then(data => { if (!data.authenticated) { clearJwtAuth(); setRole('guest'); } })
        .catch(() => {});
    }
  }, []);

  function handleLogout() {
    if (isAgent) {
      localStorage.removeItem('agentUser');
      setAgentUser(null);
    } else {
      localStorage.removeItem('userRole');
      if (USE_JWT_AUTH) clearJwtAuth();
    }
    setRole('guest');
  }

  const toggleFav = photo => setFavs(prev => {
    const isCurrent = prev.some(p => p.id === photo.id);
    logEvent(photo.id, isCurrent ? 'unfavorite' : 'favorite');
    const next = isCurrent ? prev.filter(p => p.id !== photo.id) : [...prev, photo];
    saveFavs(next);
    return next;
  });
  const clearFavs = () => { setFavs([]); saveFavs([]); };
  const isFav = id => favs.some(p => p.id === id);

  const favCount  = isAgent ? null : favs.length;
  const roleLabel = isAdmin ? '管理員' : isStaff ? '員工' : isAgent ? (agentUser?.name || '代理商') : '';
  const logoutLabel = isAgent ? `登出（${agentUser?.name || ''}）` : '登出';

  // Show login page when not authenticated
  if (role === 'guest' && !isAgent) {
    return (
      <React.Fragment>
        <LoginPage onAuth={setRole} onAgentLogin={() => setShowAgentLogin(true)} />
        {showAgentLogin && (
          <AgentLoginModal
            onClose={() => setShowAgentLogin(false)}
            onAuth={agent => { setAgentUser(agent); setRole('agent'); }}
          />
        )}
      </React.Fragment>
    );
  }

  return (
    <React.Fragment>
      {splash && <Splash onDone={() => setSplash(false)} />}
      {isStaff && (
        <PricingBanner
          metalsLastUpdated={metalsLastUpd}
          onGotoSettings={isAdmin ? () => setTab('settings') : null}
        />
      )}

      {/* SwipeMode full-screen overlay */}
      {swipeMode && isAgent && agentUser && (
        <SwipeMode
          agentUser={agentUser}
          filters={swipeFilters}
          onClose={() => setSwipeMode(false)}
          onFavAdded={() => {}}
        />
      )}

      <header className="nav">
        <span className="nav-logo" style={{cursor:'pointer'}} onClick={() => setSplash(true)}>Tahir Zainab Selection</span>
        <div className="nav-tabs">
          <button className={'nav-tab' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>找款</button>
          <button className={'nav-tab' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
            收藏 {favCount > 0 && <span className="badge">{favCount}</span>}
          </button>
          {isStaff && (
            <button className={'nav-tab' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
              估價紀錄<QuotePendingBadge />
            </button>
          )}
          {isAdmin && (
            <button className={'nav-tab' + (tab === 'settings' ? ' on' : '')} onClick={() => setTab('settings')}>
              設定
            </button>
          )}
        </div>
        <div className="nav-right">
          <span className="nav-role">{roleLabel}</span>
          <button className="nav-logout" onClick={handleLogout}>{logoutLabel}</button>
        </div>
      </header>
      {showDarkBg && (
        <DarkBgModal
          onClose={() => setShowDarkBg(false)}
          onDeleted={() => { setShowDarkBg(false); window.location.reload(); }}
        />
      )}
      {showAgentLogin && (
        <AgentLoginModal
          onClose={() => setShowAgentLogin(false)}
          onAuth={agent => { setAgentUser(agent); setRole('agent'); }}
        />
      )}
      <div className="content">
        {tab === 'browse'    && !isAgent && <BrowseTab isFav={isFav} toggleFav={toggleFav} role={role} />}
        {tab === 'browse'    && isAgent  && (
          <BrowseTab
            isFav={isFav} toggleFav={toggleFav} role={role}
            onStartSwipe={(filters) => { setSwipeFilters(filters); setSwipeMode(true); }}
          />
        )}
        {tab === 'favorites' && !isAgent && <FavsTab favs={favs} isFav={isFav} toggleFav={toggleFav} clearFavs={clearFavs} role={role} />}
        {tab === 'favorites' && isAgent  && agentUser && <AgentFavsTab agentUser={agentUser} />}
        {tab === 'quote'     && isStaff  && <QuoteHistoryPage role={role} />}
        {tab === 'settings'  && isAdmin  && (
          <iframe src={`/estimator.html?v=20260620#settings`} style={{width:'100%',height:'100%',border:'none',display:'block'}} />
        )}
      </div>
      <nav className="tab-bar">
        <button className={'tab-btn' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>找款</button>
        <button className={'tab-btn' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
          收藏{favCount > 0 && <span className="tab-badge">{favCount}</span>}
        </button>
        {isStaff && (
          <button className={'tab-btn' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
            估價<QuotePendingBadge />
          </button>
        )}
      </nav>
    </React.Fragment>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
