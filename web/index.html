<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tahir Zainab Jewelry Selection</title>
  <style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #f4f4f4;
  --surface: #ffffff;
  --s2:      #f9f9f9;
  --s3:      #efefef;
  --text:    #1a1a1a;
  --text2:   #777;
  --text3:   #bbb;
  --border:  #e8e8e8;
  --accent:  #1a1a1a;
  --gold:    #b8935a;
  --r:       10px;
  --nav-h:   52px;
  --tab-h:   58px;
  --side-w:  220px;
  --shadow:  0 1px 4px rgba(0,0,0,.08);
  --shadow2: 0 4px 16px rgba(0,0,0,.12);
}

/* ── Base ───────────────────────────────────────────────── */
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }

/* ── Nav ────────────────────────────────────────────────── */
.nav {
  height: var(--nav-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  box-shadow: var(--shadow);
}
.nav-logo { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--gold); flex: 1; }
.nav-tabs { display: none; gap: 4px; }
.nav-tab {
  padding: 7px 18px;
  border-radius: 20px;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-tab.on { background: var(--s3); color: var(--text); font-weight: 600; }
.badge { background: var(--gold); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

/* ── Tab bar (mobile) ───────────────────────────────────── */
.tab-bar { height: var(--tab-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: var(--text3); font-size: 10px; font-weight: 500; position: relative; }
.tab-btn.on { color: var(--accent); }
.tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab-badge { position: absolute; top: 6px; right: calc(50% - 18px); background: var(--gold); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; }

/* ── Content ────────────────────────────────────────────── */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

/* ── Category tabs ───────────────────────────────────────── */
.cat-tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:10px 10px 6px; gap:6px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.cat-tabs::-webkit-scrollbar { display:none; }
.cat-tab { display:flex; flex-direction:column; align-items:center; gap:4px; border:none; background:none; padding:4px 6px; border-radius:10px; cursor:pointer; min-width:56px; flex-shrink:0; touch-action:manipulation; transition:background .2s; }
.cat-tab.on { background:var(--s3); }
.cat-tab-img { width:52px; height:52px; border-radius:8px; object-fit:cover; border:2px solid transparent; transition:border-color .2s, transform .15s; }
.cat-tab:active .cat-tab-img { transform:scale(.93); }
.cat-tab.on .cat-tab-img { border-color:var(--accent); }
.cat-tab-all { width:52px; height:52px; border-radius:8px; background:var(--s3); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--text2); border:2px solid transparent; }
.cat-tab.on .cat-tab-all { border-color:var(--accent); }
.cat-tab span { font-size:11px; color:var(--text2); white-space:nowrap; }
.cat-tab.on span { color:var(--text); font-weight:600; }

/* ── Chips ───────────────────────────────────────────────── */
.chips-bar { padding: 8px 14px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chips-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 20px; background: var(--s3); font-size: 12px; color: var(--text2); border: 1px solid var(--border); margin-right: 6px; white-space: nowrap; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.chip-clr { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 20px; background: none; border: 1px solid var(--border); font-size: 12px; color: var(--text3); white-space: nowrap; }

/* ── Body row ───────────────────────────────────────────── */
.body-row { flex: 1; overflow: hidden; display: flex; min-height: 0; }

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar { display: none; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 12px 0 32px; }
.sb-clear { margin: 6px 14px 12px; padding: 8px 12px; background: none; border: 1px solid var(--border); border-radius: var(--r); color: var(--text3); font-size: 12px; width: calc(100% - 28px); text-align: left; }
.sb-clear:hover { background: var(--s3); color: var(--text2); }
.sb-sec { border-bottom: 1px solid var(--border); }
.sb-hd { width: 100%; padding: 11px 16px; background: none; border: none; display: flex; align-items: center; justify-content: space-between; text-align: left; }
.sb-hd-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
.sb-hd.has-val .sb-hd-label { color: var(--accent); }
.sb-hd-arrow { font-size: 10px; color: var(--text3); }
.sb-opts { padding: 0 10px 10px; }
.sb-opt { display: block; width: 100%; padding: 8px 8px; background: none; border: none; color: var(--text2); font-size: 13px; text-align: left; border-radius: 6px; }
.sb-opt:hover { background: var(--s3); color: var(--text); }
.sb-opt.on { color: var(--accent); font-weight: 600; }
.sb-opt-clr { display: block; width: 100%; padding: 5px 8px; background: none; border: none; color: var(--text3); font-size: 11px; text-align: left; }

/* ── Main + grid ────────────────────────────────────────── */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 2px; }
.card { background: var(--surface); cursor: pointer; overflow: hidden; position: relative; border-radius: 0; animation: fadeUp .3s ease both; transition: transform .15s ease, box-shadow .15s ease; }
.card:active { transform: scale(.97); }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fff; transition: opacity .2s; }
.card-fav { position: absolute; top: 7px; right: 7px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); border: none; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--text3); box-shadow: var(--shadow); transition: transform .2s, color .2s; }
.card-fav:active { transform: scale(1.3); }
.card-fav.on { color: var(--gold); }
.card-lbl { padding: 6px 9px 8px; font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sentinel { height: 1px; }
.loading-msg { text-align: center; padding: 28px; color: var(--text3); font-size: 13px; }
.empty-msg { text-align: center; padding: 64px 24px; color: var(--text2); font-size: 14px; line-height: 1.9; }

/* ── Filter dropdown ────────────────────────────────────── */
.dd-panel { position: fixed; min-width: 160px; max-width: min(92vw, 260px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow2); z-index: 9999; overflow-y: auto; max-height: min(60vh, 380px); animation: ddIn .15s ease; }
@keyframes ddIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.dd-item { padding: 11px 15px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border); gap: 10px; transition: background .12s; }
.dd-item:last-child { border-bottom: none; }
.dd-item:active, .dd-item:hover { background: var(--s3); }
.dd-item.on { color: var(--accent); font-weight: 600; }
.dd-clr { color: var(--text3); font-size: 12px; }
.dd-cnt { font-size: 12px; color: var(--text3); font-weight: 400; flex-shrink: 0; }

/* ── Detail overlay ─────────────────────────────────────── */
.det-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; display: flex; align-items: flex-end; }
.det-panel { width: 100%; max-height: 90vh; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative; animation: up .25s cubic-bezier(.32,.72,0,1); box-shadow: var(--shadow2); }
.det-handle { width: 36px; height: 4px; background: var(--s3); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
.det-x { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--s3); border: none; font-size: 18px; color: var(--text2); display: flex; align-items: center; justify-content: center; z-index: 1; }
.det-hd-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.det-back { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text); }
.det-hd-title { font-size: 15px; font-weight: 600; flex: 1; }
.det-left { flex-shrink: 0; }
.det-img { width: 100%; max-height: 56vw; object-fit: cover; display: block; background: var(--s3); }
.det-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.det-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.det-tags { padding: 14px 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 11px; background: var(--s3); border-radius: 20px; font-size: 12px; color: var(--text2); }
.det-btns { padding: 10px 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.db { padding: 13px; border-radius: var(--r); border: none; font-size: 13px; font-weight: 600; touch-action: manipulation; position: relative; z-index: 2; }
.db-fav { background: var(--s3); color: var(--text); }
.db-fav.on { background: #fff0e0; color: var(--gold); border: 1.5px solid var(--gold); }
.db-sim { background: var(--accent); color: #fff; }

/* ── Edit panel ─────────────────────────────────────────── */
.db-edit { background: var(--s3); color: var(--text2); }
.edit-panel { padding: 14px 16px 20px; }
.edit-row { margin-bottom: 12px; }
.edit-label { font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--text3); margin-bottom: 6px; }
.edit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.edit-chip { padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; color: var(--text2); cursor: pointer; }
.edit-chip.on { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.edit-actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
.db-save { background: var(--accent); color: #fff; }
.db-del { background: none; border: 1px solid #e8c4c4; color: #c0392b; font-size: 11px; font-weight: 400; padding: 0; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* similar view */
.sim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
.sim-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--s3); cursor: pointer; }

/* ── Fav empty ──────────────────────────────────────────── */
.fav-empty { text-align: center; padding: 80px 24px; color: var(--text2); font-size: 14px; line-height: 1.9; }

/* ── Fav bar ────────────────────────────────────────────── */
.fav-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.fav-bar-info { font-size: 12px; color: var(--text3); }
.fav-clr-btn { font-size: 11px; color: #c0392b; background: none; border: 1px solid #f5c6c6; border-radius: 20px; padding: 4px 12px; }

/* ── Desktop ≥ 768px ────────────────────────────────────── */
@media (min-width: 768px) {
  .nav-tabs  { display: flex; }
  .tab-bar   { display: none; }
  .sidebar   { display: none; }
  .chips-bar { display: flex; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }

  .det-ovl { align-items: center; justify-content: center; padding: 32px; }
  .det-panel { width: 100%; max-width: 840px; border-radius: 16px; flex-direction: row; max-height: 82vh; animation: pop .2s ease; box-shadow: var(--shadow2); }
  @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  .det-handle { display: none; }
  .det-left { width: 50%; flex-shrink: 0; }
  .det-img { width: 100%; height: 100%; max-height: none; border-radius: 16px 0 0 16px; }
  .det-right { flex: 1; min-height: 0; }
}
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1600px) { :root { --side-w: 248px; } .grid { grid-template-columns: repeat(5, 1fr); } }
/* card label narrower to maximise photo area */
.card-lbl { padding: 4px 7px 6px; font-size: 11px; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="/js/vendor/react.min.js"></script>
<script src="/js/vendor/react-dom.min.js"></script>
<script src="/js/vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Config ─────────────────────────────────────────── */
const CATS = ['戒指','手鏈','墜子','項鍊','耳釘','胸針','其他'];
const CFG = {
  style:       { label: '鑽石數量', values: ['無鑽','簡約','輕奢','奢華'] },
  color:       { label: '寶石色', values: ['紅','粉','黃','綠','藍','紫','白','彩'] },
  metal_color: { label: '金工色', values: ['金','銀'] },
};

/* ── Fav storage ────────────────────────────────────── */
const loadFavs = () => { try { return JSON.parse(localStorage.getItem('jdb_favs') || '[]'); } catch { return []; } };
const saveFavs = f => localStorage.setItem('jdb_favs', JSON.stringify(f));

/* ── Icons ──────────────────────────────────────────── */
function IcoGrid() {
  return <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
}
function IcoHeart({ fill }) {
  return <svg viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
}

/* ── Category tabs ──────────────────────────────────── */
function CategoryTabs({ active, onSelect }) {
  const [reps, setReps] = useState({});

  useEffect(() => {
    Promise.all(
      CATS.map(cat =>
        fetch(`/api/photos?category=${encodeURIComponent(cat)}&sort=popular&page=1`)
          .then(r => r.json())
          .then(d => d.photos?.[0] ? [cat, d.photos[0].thumb_url] : null)
          .catch(() => null)
      )
    ).then(results => {
      const map = {};
      results.filter(Boolean).forEach(([cat, url]) => { map[cat] = url; });
      setReps(map);
    });
  }, []);

  return (
    <div className="cat-tabs">
      <button className={'cat-tab' + (!active ? ' on' : '')} onClick={() => onSelect(null)}>
        <div className="cat-tab-all">▦</div>
        <span>全部</span>
      </button>
      {CATS.map(cat => (
        <button key={cat} className={'cat-tab' + (active === cat ? ' on' : '')}
          onClick={() => onSelect(cat)}>
          {reps[cat]
            ? <img className="cat-tab-img" src={reps[cat]} alt="" loading="lazy" />
            : <div className="cat-tab-all" style={{fontSize:13}}>{cat}</div>
          }
          <span>{cat}</span>
        </button>
      ))}
    </div>
  );
}

/* ── Filter dropdown ────────────────────────────────── */
function FilterDropdown({ field, cur, counts, onPick }) {
  const cfg = CFG[field];
  const [open, setOpen] = React.useState(false);
  const [panelStyle, setPanelStyle] = React.useState({});
  const btnRef = React.useRef(null);
  const panelRef = React.useRef(null);

  const toggle = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - 168);
      setPanelStyle({ top: r.bottom + 4, left: Math.max(4, left) });
    }
    setOpen(p => !p);
  };

  React.useEffect(() => {
    if (!open) return;
    const h = e => {
      if (btnRef.current?.contains(e.target)) return;
      if (panelRef.current?.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener('mousedown', h);
    document.addEventListener('touchstart', h);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('touchstart', h); };
  }, [open]);

  const panel = open && ReactDOM.createPortal(
    <div ref={panelRef} className="dd-panel" style={panelStyle}>
      {cur && <div className="dd-item dd-clr" onClick={() => { onPick(null); setOpen(false); }}>清除（全部）</div>}
      {cfg.values.map(v => (
        <div key={v} className={'dd-item' + (cur === v ? ' on' : '')}
          onClick={() => { onPick(v === cur ? null : v); setOpen(false); }}>
          <span>{v}{cur === v ? ' ✓' : ''}</span>
          {counts?.[v] != null && <span className="dd-cnt">{counts[v]}</span>}
        </div>
      ))}
    </div>,
    document.body
  );

  return (
    <div style={{position:'relative', display:'inline-block', flexShrink:0}}>
      <button ref={btnRef} className={'chip' + (cur ? ' on' : '')} onClick={toggle}>
        {cur || cfg.label} {cur ? '✕' : '▾'}
      </button>
      {panel}
    </div>
  );
}

/* ── Sidebar ────────────────────────────────────────── */
function Sidebar({ filters, onFilter, onClear, counts }) {
  const [open, setOpen] = useState({ category: true, style: true, color: false, metal_color: false });
  return (
    <aside className="sidebar">
      {Object.keys(filters).length > 0 && (
        <button className="sb-clear" onClick={onClear}>✕ 清除全部篩選</button>
      )}
      {Object.entries(CFG).map(([field, cfg]) => (
        <div key={field} className="sb-sec">
          <button className={'sb-hd' + (filters[field] ? ' has-val' : '')}
            onClick={() => setOpen(p => ({ ...p, [field]: !p[field] }))}>
            <span className="sb-hd-label">{cfg.label}{filters[field] ? ' · ' + filters[field] : ''}</span>
            <span className="sb-hd-arrow">{open[field] ? '▾' : '▸'}</span>
          </button>
          {open[field] && (
            <div className="sb-opts">
              {filters[field] && <button className="sb-opt-clr" onClick={() => onFilter(field, null)}>✕ 清除</button>}
              {cfg.values.map(v => {
                const cnt = counts?.[field]?.[v];
                return (
                  <button key={v} className={'sb-opt' + (filters[field] === v ? ' on' : '')}
                    onClick={() => onFilter(field, filters[field] === v ? null : v)}>
                    <span>{v}</span>
                    {cnt != null && <span style={{marginLeft:6,fontSize:11,color:'var(--text3)',fontWeight:400}}>{cnt}</span>}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      ))}
    </aside>
  );
}

/* ── Photo detail ───────────────────────────────────── */
function PhotoDetail({ photo, onClose, isFav, toggleFav, onSelectPhoto, onDeleted, onUpdated }) {
  const [view,    setView]    = useState('detail'); // 'detail' | 'similar' | 'edit'
  const [similar, setSimilar] = useState(null);
  const [simErr,  setSimErr]  = useState(false);
  const [editCat,   setEditCat]   = useState(photo.category        || '');
  const [editSty,   setEditSty]   = useState(photo.style           || '');
  const [editChain, setEditChain] = useState(photo.setting_amount  || '');
  const [editCraft, setEditCraft] = useState(photo.craft_complexity|| '');
  const [editMetal, setEditMetal] = useState(photo.metal_color     || '');
  const [saving,    setSaving]    = useState(false);

  useEffect(() => {
    setView('detail'); setSimilar(null); setSimErr(false);
    setEditCat(photo.category || ''); setEditSty(photo.style || '');
    setEditChain(photo.setting_amount || ''); setEditCraft(photo.craft_complexity || '');
    setEditMetal(photo.metal_color || '');
  }, [photo.id]);

  const doSave = async () => {
    setSaving(true);
    try {
      const res = await fetch('/api/photos/' + photo.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: editCat, style: editSty, setting_amount: editChain, craft_complexity: editCraft, metal_color: editMetal }),
      });
      const updated = await res.json();
      onUpdated && onUpdated(updated);
      setView('detail');
    } catch { alert('儲存失敗'); }
    setSaving(false);
  };

  const doDelete = async () => {
    if (!confirm('確定永久刪除這張照片？（檔案會一併刪除，無法復原）')) return;
    await fetch('/api/photos/' + photo.id, { method: 'DELETE' });
    onDeleted && onDeleted(photo.id);
    onClose();
  };

  const openSimilar = () => {
    setView('similar');
    if (similar !== null) return;
    setSimErr(false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    fetch('/api/photos/' + photo.id + '/similar?limit=12', { signal: ctrl.signal })
      .then(r => r.json())
      .then(d => { clearTimeout(timer); setSimilar(d.similar || []); })
      .catch(() => { clearTimeout(timer); setSimilar([]); setSimErr(true); });
  };

  const fav  = isFav(photo.id);
  const STYLE_VALS = new Set(['無鑽','簡約(5顆鑽內)','輕奢(20顆鑽內)','奢華滿鑲鑽']);
  const tags = [photo.category, photo.style,
    STYLE_VALS.has(photo.gemstone) ? null : photo.gemstone,
    photo.stone_shape, photo.stone_size, photo.color, photo.metal_color,
    photo.setting_amount, photo.craft_complexity]
    .filter(v => v && v !== '未定');

  /* Edit view */
  if (view === 'edit') return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setView('detail')}>←</button>
          <span className="det-hd-title">修改分類</span>
          <button className="db db-del" onClick={doDelete} title="刪除照片">🗑</button>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>
        </div>
        <div className="det-scroll">
          <img src={photo.full_url} alt="" style={{width:'100%',maxHeight:220,objectFit:'contain',background:'#f9f9f9'}} />
          <div className="edit-panel">
            <div className="edit-row">
              <div className="edit-label">品項</div>
              <div className="edit-chips">
                {CFG.category.values.map(v => (
                  <button key={v} className={'edit-chip' + (editCat === v ? ' on' : '')} onClick={() => setEditCat(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">鑽石數量</div>
              <div className="edit-chips">
                {CFG.style.values.map(v => (
                  <button key={v} className={'edit-chip' + (editSty === v ? ' on' : '')} onClick={() => setEditSty(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">用料多寡</div>
              <div className="edit-chips">
                {['少','正常','多'].map(v => (
                  <button key={v} className={'edit-chip' + (editChain === v ? ' on' : '')} onClick={() => setEditChain(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">做工複雜</div>
              <div className="edit-chips">
                {['極簡','普通','複雜','極複雜'].map(v => (
                  <button key={v} className={'edit-chip' + (editCraft === v ? ' on' : '')} onClick={() => setEditCraft(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">金工顏色</div>
              <div className="edit-chips">
                {['金','銀'].map(v => (
                  <button key={v} className={'edit-chip' + (editMetal === v ? ' on' : '')} onClick={() => setEditMetal(v)}>{v}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
        <div style={{padding:'10px 16px 20px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <button className="db db-save" style={{width:'100%'}} onClick={doSave} disabled={saving}>
            {saving ? '儲存中…' : '✓ 儲存'}
          </button>
        </div>
      </div>
    </div>
  );

  /* Similar view */
  if (view === 'similar') return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setView('detail')}>←</button>
          <span className="det-hd-title">{'相似款 · ' + (photo.category || '')}</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>
        </div>
        <div className="det-scroll">
          {similar === null
            ? <div className="loading-msg">載入中…</div>
            : simErr
              ? <div className="empty-msg">載入失敗，請稍後再試<br/><button style={{marginTop:12,padding:'8px 20px',borderRadius:8,border:'1px solid var(--border)',background:'var(--s3)',fontSize:13,cursor:'pointer'}} onClick={() => { setSimilar(null); setSimErr(false); openSimilar(); }}>重試</button></div>
              : similar.length === 0
                ? <div className="empty-msg">找不到相似款</div>
                : <div className="sim-grid">
                    {similar.map(p => (
                      <img key={p.id} src={p.thumb_url} alt="" loading="lazy"
                        onClick={() => { onSelectPhoto(p); setView('detail'); }} />
                    ))}
                </div>
          }
        </div>
      </div>
    </div>
  );

  /* Detail view */
  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel">
        <button className="det-x" onClick={onClose}>×</button>
        <div className="det-left">
          <div className="det-handle" />
          <img className="det-img" src={photo.full_url} alt="" loading="lazy" />
        </div>
        <div className="det-right">
          <div className="det-scroll">
            <div className="det-tags">
              {tags.map((t, i) => <span key={i} className="tag">{t}</span>)}
              {photo.price_band && <span className="tag" style={{color:'var(--text3)'}}>{photo.price_band}</span>}
            </div>
            <div className="det-btns">
              <button className={'db db-fav' + (fav ? ' on' : '')} onClick={() => toggleFav(photo)}>
                {fav ? '♥ 已收藏' : '♡ 收藏'}
              </button>
              <button className="db db-sim" onClick={openSimilar}>
                找相似 →
              </button>
            </div>
            <div style={{padding:'0 16px 16px'}}>
              <button className="db db-edit" style={{width:'100%'}} onClick={() => setView('edit')}>
                ✏️ 修改分類 / 刪除
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Photo grid ─────────────────────────────────────── */
function PhotoGrid({ isFav, toggleFav, filters }) {
  const [photos,  setPhotos]  = useState([]);
  const [loading, setLoading] = useState(false);
  const [detail,  setDetail]  = useState(null);

  const loadingRef  = useRef(false);
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const filtersRef  = useRef({});
  const seedRef     = useRef(Math.random());
  const sentinelRef = useRef(null);
  const fetchRef    = useRef(null);

  const doFetch = async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random', _r: seedRef.current });
      Object.entries(filtersRef.current).forEach(([k, v]) => v && qs.set(k, v));
      const res  = await fetch('/api/photos?' + qs);
      const data = await res.json();
      const list = data.photos || [];
      if (pageRef.current === 1) setPhotos(list);
      else setPhotos(prev => [...prev, ...list]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current += 1;
    } catch { hasMoreRef.current = false; }
    finally { loadingRef.current = false; setLoading(false); }
  };
  fetchRef.current = doFetch;

  useEffect(() => {
    const s = sentinelRef.current;
    if (!s) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) fetchRef.current?.(); },
      { rootMargin: '400px' }
    );
    obs.observe(s);
    return () => obs.disconnect();
  }, []);

  useEffect(() => { fetchRef.current?.(); }, []);

  useEffect(() => {
    filtersRef.current = filters || {};
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    seedRef.current    = Math.random();
    setPhotos([]);
    fetchRef.current?.();
  }, [JSON.stringify(filters)]);

  return (
    <>
      <div className="grid-wrap">
        <div className="grid">
          {photos.map(p => (
            <div key={p.id} className="card">
              <img src={p.thumb_url} alt="" loading="lazy" onClick={() => setDetail(p)} />
              <button className={'card-fav' + (isFav(p.id) ? ' on' : '')}
                onClick={e => { e.stopPropagation(); toggleFav(p); }}>
                {isFav(p.id) ? '♥' : '♡'}
              </button>
              <div className="card-lbl" onClick={() => setDetail(p)}>
                {[p.category, p.style].filter(v => v && v !== '未定').join(' · ')}
              </div>
            </div>
          ))}
        </div>
        {loading && <div className="loading-msg">載入中…</div>}
        {!loading && photos.length === 0 && !hasMoreRef.current && (
          <div className="empty-msg">沒有符合條件的照片<br/><span style={{fontSize:12,color:'var(--text3)'}}>試著調整篩選條件</span></div>
        )}
        <div ref={sentinelRef} className="sentinel" />
      </div>

      {detail && (
        <PhotoDetail
          photo={detail}
          onClose={() => setDetail(null)}
          isFav={isFav}
          toggleFav={toggleFav}
          onSelectPhoto={p => setDetail(p)}
          onDeleted={id => { setPhotos(prev => prev.filter(p => p.id !== id)); setDetail(null); }}
          onUpdated={updated => { setPhotos(prev => prev.map(p => p.id === updated.id ? {...p, ...updated} : p)); setDetail(updated); }}
        />
      )}
    </>
  );
}

/* ── Browse tab ─────────────────────────────────────── */
function BrowseTab({ isFav, toggleFav }) {
  const [catFilter, setCatFilter] = useState(null);
  const [filters, setFilters] = useState({});
  const [counts,  setCounts]  = useState({});

  const allFilters = catFilter ? { ...filters, category: catFilter } : filters;

  useEffect(() => {
    const qs = new URLSearchParams();
    if (catFilter) qs.set('category', catFilter);
    Object.entries(filters).forEach(([k, v]) => v && qs.set(k, v));
    fetch('/api/photos/filter-counts?' + qs)
      .then(r => r.json())
      .then(d => setCounts(d))
      .catch(() => {});
  }, [catFilter, JSON.stringify(filters)]);

  const setF = (field, value) => setFilters(prev => {
    const n = { ...prev };
    if (value) n[field] = value; else delete n[field];
    return n;
  });

  return (
    <>
      <CategoryTabs active={catFilter} onSelect={setCatFilter} />
      <div className="chips-bar">
        {Object.entries(CFG).map(([field]) => (
          <FilterDropdown key={field} field={field} cur={filters[field] || null}
            counts={counts[field] || {}} onPick={v => setF(field, v)} />
        ))}
        {Object.keys(filters).length > 0 && <button className="chip-clr" onClick={() => setFilters({})}>清除</button>}
      </div>
      <div className="body-row">
        <div className="main">
          <PhotoGrid isFav={isFav} toggleFav={toggleFav} filters={allFilters} />
        </div>
      </div>
    </>
  );
}

/* ── Favorites tab ──────────────────────────────────── */
function FavsTab({ favs, isFav, toggleFav, clearFavs }) {
  const [detail, setDetail] = useState(null);

  if (favs.length === 0) return (
    <div className="body-row"><div style={{flex:1}}>
      <div className="fav-empty">尚無收藏款式<br/><span style={{fontSize:12,color:'var(--text3)'}}>找款頁面點 ♡ 即可收藏</span></div>
    </div></div>
  );

  return (
    <>
      <div className="fav-bar">
        <span className="fav-bar-info">收藏 {favs.length} 張</span>
        <button className="fav-clr-btn" onClick={clearFavs}>清空收藏</button>
      </div>
      <div className="body-row">
        <div className="main">
          <div className="grid-wrap">
            <div className="grid">
              {favs.map(p => (
                <div key={p.id} className="card" onClick={() => setDetail(p)}>
                  <img src={p.thumb_url} alt="" loading="lazy" />
                  <button className="card-fav on" onClick={e => { e.stopPropagation(); toggleFav(p); }}>♥</button>
                  <div className="card-lbl">{[p.category, p.style].filter(v => v && v !== '未定').join(' · ')}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      {detail && (
        <PhotoDetail photo={detail} onClose={() => setDetail(null)}
          isFav={isFav} toggleFav={toggleFav} onSelectPhoto={p => setDetail(p)} />
      )}
    </>
  );
}

/* ── App ────────────────────────────────────────────── */
function App() {
  const [tab,  setTab]  = useState('browse');
  const [favs, setFavs] = useState(loadFavs);

  const toggleFav = photo => setFavs(prev => {
    const next = prev.find(p => p.id === photo.id) ? prev.filter(p => p.id !== photo.id) : [...prev, photo];
    saveFavs(next);
    return next;
  });
  const clearFavs = () => { setFavs([]); saveFavs([]); };
  const isFav = id => favs.some(p => p.id === id);

  return (
    <React.Fragment>
      <header className="nav">
        <span className="nav-logo">TAHIR ZAINAB Jewelry Selection</span>
        <div className="nav-tabs">
          <button className={'nav-tab' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>找款</button>
          <button className={'nav-tab' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
            收藏 {favs.length > 0 && <span className="badge">{favs.length}</span>}
          </button>
        </div>
      </header>
      <div className="content">
        {tab === 'browse'    && <BrowseTab    isFav={isFav} toggleFav={toggleFav} />}
        {tab === 'favorites' && <FavsTab favs={favs} isFav={isFav} toggleFav={toggleFav} clearFavs={clearFavs} />}
      </div>
      <nav className="tab-bar">
        <button className={'tab-btn' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>
          <IcoGrid /><span>找款</span>
        </button>
        <button className={'tab-btn' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
          <IcoHeart fill={tab === 'favorites'} /><span>收藏</span>
          {favs.length > 0 && <span className="tab-badge">{favs.length}</span>}
        </button>
      </nav>
    </React.Fragment>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
