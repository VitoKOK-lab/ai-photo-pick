/* ── 金工試算：拉桿組合各項費用，貼合客人預算 ───────── */
function CostCalcPanel({ onClose }) {
  const pricing = usePricing();

  const metals    = Object.keys(pricing.METAL_PER_G);
  const LC        = pricing.LABOR_CONFIG || {};
  const dailyRate = Number(LC.daily_rate) || 3500;
  const CRAFTS    = ['極簡','簡單','中等','複雜','精工'];
  const SIDE_TYPES = ['無配石', ...Object.keys(pricing.SIDESTONES_V2 || {})];
  const QTY_BANDS  = ['1–5顆','6–15顆','16–30顆','31–50顆','50顆以上'];
  const PLATINGS   = Object.keys(pricing.PLATING || {});

  const [budget,    setBudget]    = useState('');
  const [metal,     setMetal]     = useState(metals.includes('18K金') ? '18K金' : (metals[0] || '18K金'));
  const [grams,     setGrams]     = useState(3);
  const [craftIdx,  setCraftIdx]  = useState(2);
  const [sideType,  setSideType]  = useState('無配石');
  const [sideIdx,   setSideIdx]   = useState(1);
  const [plating,   setPlating]   = useState(PLATINGS[0] || '無');
  const [stoneCost, setStoneCost] = useState(0);

  /* 各項費用 */
  const metalPg    = pricing.METAL_PER_G[metal] || 0;
  const metalCost  = Math.round(metalPg * grams);
  const craft      = CRAFTS[craftIdx];
  const laborCost  = Math.round(dailyRate * (Number(LC[craft]) || 0));
  const sideRange  = sideType !== '無配石'
    ? ((pricing.SIDESTONES_V2 || {})[sideType] || {})[QTY_BANDS[sideIdx]] || [0,0]
    : [0,0];
  const sideCost   = Math.round((sideRange[0] + sideRange[1]) / 2);
  const plateRange = (pricing.PLATING || {})[plating] || [0,0];
  const plateCost  = Math.round((plateRange[0] + plateRange[1]) / 2);
  const total      = metalCost + laborCost + sideCost + plateCost + stoneCost;

  const budgetNum  = parseInt(String(budget).replace(/[^0-9]/g,'')) || 0;
  const diff       = budgetNum ? budgetNum - total : null;

  /* 樣式 */
  const secSt   = { background:'var(--surface)', borderRadius:12, border:'1px solid var(--border)', padding:'12px 16px 14px', marginBottom:10 };
  const rowHd   = (label, amount) => (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
      <span style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:'var(--text3)'}}>{label}</span>
      <span style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>{fmtNT(amount)}</span>
    </div>
  );
  const sliderSt = { width:'100%', accentColor:'var(--gold)', cursor:'pointer', height:4, margin:'6px 0 2px' };
  const chipSt   = on => ({ padding:'5px 12px', borderRadius:16, border:'1.5px solid', fontSize:12, cursor:'pointer',
    borderColor: on ? 'var(--gold)' : 'var(--border)', background: on ? '#fff8ee' : 'var(--surface)',
    color: on ? 'var(--gold)' : 'var(--text2)', fontWeight: on ? 700 : 400, whiteSpace:'nowrap' });

  return (
    <div style={{position:'fixed',inset:0,zIndex:900,background:'var(--bg)',display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',
        background:'var(--surface)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>金工試算</div>
        <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,color:'var(--text3)',cursor:'pointer',lineHeight:1,padding:'0 4px'}}>×</button>
      </div>

      {/* Scroll body */}
      <div style={{flex:1,minHeight:0,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'12px 14px 16px'}}>

        {/* 客人預算 */}
        <div style={secSt}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:1.5,color:'var(--text3)',marginBottom:8}}>客人預算（選填）</div>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
            <input type="text" inputMode="numeric" placeholder="輸入預算，即時顯示差額" value={budget}
              onChange={e => setBudget(e.target.value.replace(/[^0-9]/g,''))}
              style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 12px 10px 44px',fontSize:14,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)'}} />
          </div>
        </div>

        {/* 金料 */}
        <div style={secSt}>
          {rowHd('金料 ・ ' + grams.toFixed(1) + ' g × ' + metalPg.toLocaleString('zh-TW') + '/g', metalCost)}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
            {metals.map(m => <button key={m} style={chipSt(metal===m)} onClick={()=>setMetal(m)}>{m}</button>)}
          </div>
          <input type="range" min="0.5" max="50" step="0.5" value={grams}
            onChange={e => setGrams(parseFloat(e.target.value))} style={sliderSt} />
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)'}}>
            <span>0.5g</span><span>50g</span>
          </div>
        </div>

        {/* 工錢 */}
        <div style={secSt}>
          {rowHd('工錢 ・ ' + craft + '（約 ' + (Number(LC[craft])||0) + ' 天工）', laborCost)}
          <input type="range" min="0" max={CRAFTS.length-1} step="1" value={craftIdx}
            onChange={e => setCraftIdx(parseInt(e.target.value))} style={sliderSt} />
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)'}}>
            {CRAFTS.map(c => <span key={c} style={{color: c===craft ? 'var(--gold)' : 'var(--text3)', fontWeight: c===craft?700:400}}>{c}</span>)}
          </div>
        </div>

        {/* 配石 */}
        <div style={secSt}>
          {rowHd('配石' + (sideType!=='無配石' ? ' ・ ' + sideType + ' ' + QTY_BANDS[sideIdx] : ''), sideCost)}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
            {SIDE_TYPES.map(t => <button key={t} style={chipSt(sideType===t)} onClick={()=>setSideType(t)}>{t}</button>)}
          </div>
          {sideType !== '無配石' && (
            <>
              <input type="range" min="0" max={QTY_BANDS.length-1} step="1" value={sideIdx}
                onChange={e => setSideIdx(parseInt(e.target.value))} style={sliderSt} />
              <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)'}}>
                {QTY_BANDS.map(b => <span key={b} style={{color: b===QTY_BANDS[sideIdx] ? 'var(--gold)' : 'var(--text3)', fontWeight: b===QTY_BANDS[sideIdx]?700:400}}>{b}</span>)}
              </div>
            </>
          )}
        </div>

        {/* 電鍍 */}
        <div style={secSt}>
          {rowHd('電鍍', plateCost)}
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {PLATINGS.map(pl => <button key={pl} style={chipSt(plating===pl)} onClick={()=>setPlating(pl)}>{pl}</button>)}
          </div>
        </div>

        {/* 主石（選填） */}
        <div style={secSt}>
          {rowHd('主石費用（選填，另計可留 0）', stoneCost)}
          <input type="range" min="0" max="500000" step="2500" value={stoneCost}
            onChange={e => setStoneCost(parseInt(e.target.value))} style={sliderSt} />
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)'}}>
            <span>0</span><span>50萬</span>
          </div>
        </div>
      </div>

      {/* 總計 footer */}
      <div style={{flexShrink:0,background:'var(--accent)',padding:'12px 16px 14px',boxShadow:'0 -4px 20px rgba(0,0,0,.18)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:22,fontWeight:700,color:'#fff',letterSpacing:.5}}>{fmtNT(total)}</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,.55)',marginTop:2}}>
              金料 {fmtNT(metalCost)} ・ 工錢 {fmtNT(laborCost)}
              {sideCost > 0 ? ' ・ 配石 ' + fmtNT(sideCost) : ''}
              {plateCost > 0 ? ' ・ 電鍍 ' + fmtNT(plateCost) : ''}
              {stoneCost > 0 ? ' ・ 主石 ' + fmtNT(stoneCost) : ''}
            </div>
          </div>
          {diff !== null && (
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:11,color:'rgba(255,255,255,.55)'}}>{diff >= 0 ? '預算內剩餘' : '超出預算'}</div>
              <div style={{fontSize:17,fontWeight:700,color: diff >= 0 ? '#7ddc9a' : '#ff8a80'}}>
                {fmtNT(Math.abs(diff))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══ 顧問選款模式：介紹 → 選款 → 快速估價 一條龍 ══════════
   給店員拿著平板/手機/電腦向客人介紹用。
   大圖大按鈕、無後台雜訊；手機可切換滑卡手勢，共用同一份選款清單。 */
const CONSULT_COLORS = [
  ['紅','#e05050'],['粉','#f2a0b8'],['黃','#e8c84a'],['綠','#5cb85c'],
  ['藍','#5090e0'],['紫','#9b59b6'],['白','#e8e4de'],['彩','linear-gradient(135deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f)'],
];
const CONSULT_BANDS = [['入門','1萬內'],['中階','1–3萬'],['高階','3–6萬'],['奢華','6–15萬'],['頂級','15萬+']];

function ConsultMode({ onClose, role }) {
  const [stage,    setStage]    = useState('start');   // start | pick | summary
  const [name,     setName]     = useState('');
  const [filters,  setFilters]  = useState({});        // category / color / price_band
  const [photos,   setPhotos]   = useState([]);
  const [loading,  setLoading]  = useState(false);
  const [picks,    setPicks]    = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const [quoting,  setQuoting]  = useState(null);
  const [quotedIds,setQuotedIds]= useState(new Set());
  const [swipe,    setSwipe]    = useState(false);
  const [shareUrl, setShareUrl] = useState(null);
  const [sharing,  setSharing]  = useState(false);
  const sessionIdRef = useRef(null);

  /* 自動存檔：選款有變動就 debounce 寫入 consult_sessions */
  useEffect(() => {
    if (stage === 'start' || picks.length === 0) return;
    const t = setTimeout(async () => {
      const payload = { customer_name: name || null, picks: picks.map(p => p.id), quoted: [...quotedIds] };
      try {
        if (!sessionIdRef.current) {
          const r = await fetch('/api/consult-sessions', { method:'POST',
            headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
          const d = await r.json();
          sessionIdRef.current = d.id;
        } else {
          await fetch('/api/consult-sessions/' + sessionIdRef.current, { method:'PATCH',
            headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        }
      } catch {}
    }, 800);
    return () => clearTimeout(t);
  }, [stage, name, JSON.stringify(picks.map(p=>p.id)), quotedIds.size]);

  /* 產生臨時連結：建立 guest link 並把選款預填成客人的收藏 */
  const shareToGuest = async () => {
    if (sharing || !picks.length) return;
    setSharing(true);
    try {
      const r = await fetch('/api/guest-links', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ customer_name: name || '訪客' }) });
      if (!r.ok) throw new Error('建立失敗');
      const d = await r.json();
      await Promise.all(picks.map(pk =>
        fetch(`/api/guest-links/favorite/${d.token}/${pk.id}`, { method:'POST' }).catch(()=>{})));
      const url = window.location.origin + '/?g=' + d.token;
      setShareUrl(url);
      try { await navigator.clipboard.writeText(url); } catch {}
    } catch (e) { alert('產生連結失敗：' + e.message); }
    setSharing(false);
  };

  const pageRef    = useRef(1);
  const hasMoreRef = useRef(true);
  const loadingRef = useRef(false);
  const seedRef    = useRef(Math.random());
  const sentinelRef= useRef(null);
  const scrollRef  = useRef(null);

  const pickHas    = id => picks.some(p => p.id === id);
  const togglePick = photo => setPicks(prev =>
    prev.some(p => p.id === photo.id) ? prev.filter(p => p.id !== photo.id) : [...prev, photo]);

  const loadMore = async (reset = false) => {
    if (loadingRef.current) return;
    if (!reset && !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    if (reset) { pageRef.current = 1; hasMoreRef.current = true; seedRef.current = Math.random(); }
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random', _r: seedRef.current, photo_type: '去背' });
      Object.entries(filters).forEach(([k, v]) => v && qs.set(k, v));
      const r = await fetch('/api/photos?' + qs);
      const d = await r.json();
      setPhotos(prev => reset ? (d.photos || []) : [...prev, ...(d.photos || [])]);
      hasMoreRef.current = !!d.has_more;
      pageRef.current += 1;
    } catch {}
    loadingRef.current = false;
    setLoading(false);
  };

  useEffect(() => {
    if (stage !== 'pick') return;
    setPhotos([]);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    loadMore(true);
  }, [stage, JSON.stringify(filters)]);

  useEffect(() => {
    if (stage !== 'pick') return;
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) loadMore(); }, { rootMargin: '600px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, [stage]);

  const setF = (field, value) => setFilters(prev => {
    const n = { ...prev };
    if (n[field] === value || !value) delete n[field]; else n[field] = value;
    return n;
  });

  /* 大顆觸控 chip */
  const bigChip = (on, extra = {}) => ({
    padding:'9px 16px', borderRadius:20, border:'1.5px solid', fontSize:14, cursor:'pointer',
    borderColor: on ? 'var(--gold)' : 'var(--border)', background: on ? '#fff8ee' : 'var(--surface)',
    color: on ? 'var(--gold)' : 'var(--text2)', fontWeight: on ? 700 : 500,
    whiteSpace:'nowrap', flexShrink:0, transition:'all .15s', ...extra,
  });
  const chipRow = { display:'flex', gap:8, overflowX:'auto', padding:'6px 16px',
    scrollbarWidth:'none', WebkitOverflowScrolling:'touch' };

  /* ── 估價中：直接進正常估價精靈 ── */
  if (quoting) return (
    <PhotoQuoteFlow photo={quoting} initialCustomer={name}
      onBack={() => setQuoting(null)}
      onClose={() => { setQuotedIds(prev => new Set(prev).add(quoting.id)); setQuoting(null); }} />
  );

  return (
    <div style={{position:'fixed',inset:0,zIndex:850,background:'var(--bg)',display:'flex',flexDirection:'column'}}>

      {/* ══ 開始畫面 ══ */}
      {stage === 'start' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,
          background:'radial-gradient(ellipse at 50% 20%, #fffdf8 0%, #f1ebe0 100%)'}}>
          <button onClick={onClose} style={{position:'absolute',top:16,right:18,background:'none',border:'none',fontSize:24,color:'var(--text3)',cursor:'pointer',lineHeight:1}}>×</button>
          <div style={{fontSize:11,letterSpacing:6,color:'#a07f4d',fontWeight:600,marginBottom:14}}>PRIVATE SELECTION</div>
          <div style={{fontSize:26,fontWeight:300,color:'var(--text)',letterSpacing:2,marginBottom:6,textAlign:'center'}}>顧問選款</div>
          <div style={{fontSize:13,color:'var(--text3)',marginBottom:36,textAlign:'center',lineHeight:1.7}}>
            陪同客人瀏覽、收藏喜歡的款式<br/>選完直接逐件估價
          </div>
          <input type="text" placeholder="客人稱呼（選填）" value={name}
            onChange={e => setName(e.target.value)}
            style={{width:'100%',maxWidth:320,border:'1.5px solid var(--border)',borderRadius:12,
              padding:'13px 16px',fontSize:15,textAlign:'center',outline:'none',background:'var(--surface)',
              color:'var(--text)',marginBottom:16,fontFamily:'inherit'}} />
          <button onClick={() => setStage('pick')}
            style={{width:'100%',maxWidth:320,padding:'14px',borderRadius:12,border:'none',
              background:'linear-gradient(135deg,#c9a86c,#8a6a3a)',color:'#fff',fontSize:16,fontWeight:700,
              letterSpacing:2,cursor:'pointer',boxShadow:'0 6px 20px rgba(184,147,90,.35)'}}>
            開始選款
          </button>
        </div>
      )}

      {/* ══ 選款畫面 ══ */}
      {stage === 'pick' && (
        <>
          {/* Header */}
          <div style={{display:'flex',alignItems:'center',padding:'10px 16px',background:'var(--surface)',
            borderBottom:'1px solid var(--border)',flexShrink:0,gap:10}}>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:13,fontWeight:600,color:'var(--text3)',cursor:'pointer',padding:0,whiteSpace:'nowrap'}}>結束</button>
            <div style={{flex:1,textAlign:'center',fontSize:14,fontWeight:700,color:'#8a6a3a',letterSpacing:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              {name ? name + ' 的選款' : '顧問選款'}
            </div>
            {window.innerWidth < 768 && (
              <button onClick={() => setSwipe(true)}
                style={{background:'none',border:'1px solid var(--gold)',borderRadius:8,padding:'4px 10px',
                  fontSize:12,fontWeight:600,color:'var(--gold)',cursor:'pointer',whiteSpace:'nowrap'}}>✦ 滑卡</button>
            )}
          </div>

          {/* 大顆篩選：品項 / 色系 / 價位 */}
          <div style={{background:'var(--surface)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
            <div style={chipRow}>
              {CATS.map(c => <button key={c} style={bigChip(filters.category === c)} onClick={() => setF('category', c)}>{c}</button>)}
            </div>
            <div style={{...chipRow,paddingTop:0}}>
              {CONSULT_COLORS.map(([label, hex]) => (
                <button key={label} onClick={() => setF('color', label)}
                  style={{...bigChip(filters.color === label),display:'flex',alignItems:'center',gap:6,padding:'7px 13px'}}>
                  <span style={{width:14,height:14,borderRadius:'50%',background:hex,border:'1px solid rgba(0,0,0,.12)',display:'inline-block'}} />
                  {label}
                </button>
              ))}
            </div>
            <div style={{...chipRow,paddingTop:0,paddingBottom:10}}>
              {CONSULT_BANDS.map(([band, hint]) => (
                <button key={band} style={bigChip(filters.price_band === band)} onClick={() => setF('price_band', band)}>
                  {hint}
                </button>
              ))}
            </div>
          </div>

          {/* 大圖網格 */}
          <div ref={scrollRef} style={{flex:1,minHeight:0,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:8}}>
            <div style={{display:'grid',gap:8,
              gridTemplateColumns:`repeat(${window.innerWidth >= 1200 ? 4 : window.innerWidth >= 768 ? 3 : 2}, 1fr)`}}>
              {photos.map(p => {
                const on = pickHas(p.id);
                return (
                  <div key={p.id} style={{position:'relative',borderRadius:14,overflow:'hidden',background:'var(--surface)',
                    border: on ? '2px solid var(--gold)' : '2px solid transparent',boxShadow:'0 2px 10px rgba(0,0,0,.06)'}}>
                    <img src={p.thumb_url + '?size=640'} alt="" loading="lazy" onClick={() => { setLightbox(p); logEvent(p.id, 'view'); }}
                      style={{width:'100%',aspectRatio:'1/1',objectFit:'cover',display:'block',cursor:'pointer',background:'#faf8f4'}} />
                    <button onClick={() => togglePick(p)}
                      style={{position:'absolute',top:8,right:8,width:40,height:40,borderRadius:'50%',border:'none',
                        background: on ? 'linear-gradient(145deg,#e26a8f,#c94069)' : 'rgba(255,255,255,.92)',
                        color: on ? '#fff' : 'rgba(0,0,0,.35)',fontSize:18,cursor:'pointer',lineHeight:1,
                        boxShadow:'0 2px 8px rgba(0,0,0,.15)',transition:'all .15s'}}>
                      {on ? '♥' : '♡'}
                    </button>
                  </div>
                );
              })}
            </div>
            <div ref={sentinelRef} style={{height:1}} />
            {loading && <div style={{textAlign:'center',padding:18,fontSize:13,color:'var(--text3)'}}>載入中…</div>}
            {!loading && photos.length === 0 && (
              <div style={{textAlign:'center',padding:'60px 20px',fontSize:14,color:'var(--text3)'}}>沒有符合條件的款式<br/><span style={{fontSize:12}}>點已選的篩選可取消</span></div>
            )}
          </div>

          {/* 底部：已選 → 完成 */}
          <div style={{flexShrink:0,padding:'10px 16px 14px',background:'var(--surface)',borderTop:'1px solid var(--border)',
            display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1,display:'flex',alignItems:'center',gap:6,overflow:'hidden'}}>
              {picks.slice(-5).map(p => (
                <img key={p.id} src={p.thumb_url} alt="" style={{width:36,height:36,borderRadius:8,objectFit:'cover',border:'1.5px solid var(--gold)',flexShrink:0}} />
              ))}
              <span style={{fontSize:13,color:picks.length?'var(--gold)':'var(--text3)',fontWeight:600,whiteSpace:'nowrap'}}>
                {picks.length ? `已選 ${picks.length} 件` : '點 ♡ 收藏喜歡的款式'}
              </span>
            </div>
            <button disabled={!picks.length} onClick={() => setStage('summary')}
              style={{padding:'11px 22px',borderRadius:10,border:'none',fontSize:14,fontWeight:700,letterSpacing:1,
                cursor:picks.length?'pointer':'default',whiteSpace:'nowrap',
                background:picks.length?'linear-gradient(135deg,#c9a86c,#8a6a3a)':'var(--s3)',
                color:picks.length?'#fff':'var(--text3)',
                boxShadow:picks.length?'0 4px 14px rgba(184,147,90,.3)':'none'}}>
              完成選款 ›
            </button>
          </div>
        </>
      )}

      {/* ══ 總結畫面：逐件估價 ══ */}
      {stage === 'summary' && (
        <>
          <div style={{display:'flex',alignItems:'center',padding:'10px 16px',background:'var(--surface)',
            borderBottom:'1px solid var(--border)',flexShrink:0,gap:10}}>
            <button onClick={() => setStage('pick')} style={{background:'none',border:'none',fontSize:13,fontWeight:600,color:'var(--text3)',cursor:'pointer',padding:0}}>‹ 繼續選款</button>
            <div style={{flex:1,textAlign:'center',fontSize:14,fontWeight:700,color:'#8a6a3a',letterSpacing:2}}>
              {(name ? name + '・' : '') + '已選 ' + picks.length + ' 件'}
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:13,fontWeight:600,color:'var(--text3)',cursor:'pointer',padding:0}}>結束</button>
          </div>
          {/* 傳給客人：臨時連結 */}
          <div style={{padding:'10px 14px 0',flexShrink:0}}>
            {shareUrl ? (
              <div style={{display:'flex',gap:8,alignItems:'center',background:'#f0f9f1',border:'1px solid #bfe3c5',borderRadius:10,padding:'9px 12px'}}>
                <span style={{fontSize:12,color:'#2e7d32',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>✓ 已複製連結　{shareUrl}</span>
                <button onClick={() => { try { navigator.clipboard.writeText(shareUrl); } catch {} }}
                  style={{background:'#2e7d32',color:'#fff',border:'none',borderRadius:7,padding:'6px 12px',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>複製</button>
              </div>
            ) : (
              <button onClick={shareToGuest} disabled={sharing || !picks.length}
                style={{width:'100%',padding:'10px',borderRadius:10,border:'1.5px dashed var(--gold)',
                  background:'#fffdf8',color:'var(--gold)',fontSize:13,fontWeight:700,cursor:'pointer',
                  opacity: sharing ? 0.6 : 1}}>
                {sharing ? '產生中…' : '🔗 傳給客人（臨時連結，內含這次選款）'}
              </button>
            )}
          </div>
          <div style={{flex:1,minHeight:0,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'12px 14px'}}>
            {picks.map(p => (
              <div key={p.id} style={{display:'flex',gap:12,alignItems:'center',background:'var(--surface)',
                borderRadius:14,border:'1px solid var(--border)',padding:10,marginBottom:10}}>
                <img src={p.thumb_url} alt="" onClick={() => setLightbox(p)}
                  style={{width:76,height:76,borderRadius:10,objectFit:'cover',cursor:'pointer',flexShrink:0,background:'#faf8f4'}} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:'var(--text)',marginBottom:2}}>
                    {[p.category, p.gemstone].filter(v=>v&&v!=='未定').join('・') || '未分類'}
                  </div>
                  <div style={{fontSize:11,color:'var(--text3)'}}>
                    {[p.stone_size, p.style, p.price_band].filter(v=>v&&v!=='未定').join('・')}
                  </div>
                </div>
                <button onClick={() => togglePick(p)} style={{background:'none',border:'none',fontSize:16,color:'var(--text3)',cursor:'pointer',padding:'4px 6px'}}>✕</button>
                <button onClick={() => setQuoting(p)}
                  style={{padding:'10px 16px',borderRadius:10,border:'none',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',
                    background: quotedIds.has(p.id) ? '#e8f5e9' : 'linear-gradient(135deg,#c9a86c,#8a6a3a)',
                    color: quotedIds.has(p.id) ? '#2e7d32' : '#fff'}}>
                  {quotedIds.has(p.id) ? '✓ 已估價' : '💎 估價'}
                </button>
              </div>
            ))}
            {picks.length === 0 && <div style={{textAlign:'center',padding:'60px 0',fontSize:14,color:'var(--text3)'}}>尚未選任何款式</div>}
          </div>
        </>
      )}

      {/* ══ 大圖 lightbox ══ */}
      {lightbox && (
        <div onClick={() => setLightbox(null)} style={{position:'fixed',inset:0,zIndex:880,background:'rgba(15,10,5,.92)',
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:18}}>
          <img src={lightbox.thumb_url ? lightbox.thumb_url + '?size=1200' : lightbox.full_url} alt="" onClick={e => e.stopPropagation()}
            style={{maxWidth:'100%',maxHeight:'70vh',objectFit:'contain',borderRadius:14,background:'#fff'}} />
          <div style={{marginTop:14,fontSize:15,color:'#f0e6d2',letterSpacing:1,textAlign:'center'}}>
            {[lightbox.category, lightbox.gemstone, lightbox.stone_size].filter(v=>v&&v!=='未定').join('・')}
          </div>
          <button onClick={e => { e.stopPropagation(); togglePick(lightbox); }}
            style={{marginTop:16,padding:'12px 34px',borderRadius:24,border:'none',fontSize:15,fontWeight:700,cursor:'pointer',
              background: pickHas(lightbox.id) ? 'linear-gradient(145deg,#e26a8f,#c94069)' : 'rgba(255,255,255,.95)',
              color: pickHas(lightbox.id) ? '#fff' : '#333'}}>
            {pickHas(lightbox.id) ? '♥ 已收藏' : '♡ 收藏這款'}
          </button>
        </div>
      )}

      {/* ══ 手機滑卡模式：共用同一份選款清單 ══ */}
      {swipe && (
        <SwipeMode initFilters={{ ...filters, photo_type:'去背' }} onClose={() => setSwipe(false)}
          isFav={pickHas} toggleFav={togglePick} role={role} />
      )}
    </div>
  );
}

/* ── Browse tab ─────────────────────────────────────── */
function BrowseTab({ isFav, toggleFav, role, onStartSwipe }) {
  const [photoMode, setPhotoMode] = useState('去背'); // '去背' | '情境'
  const [catFilter, setCatFilter]  = useState(null);
  const [filters,   setFilters]    = useState({});
  const [counts,    setCounts]     = useState({});
  const [consult,     setConsult]     = useState(false);
  const [costCalc,    setCostCalc]    = useState(false);
  const [batchMode,  setBatchMode]  = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [batchPicker, setBatchPicker] = useState(false);
  const [batchSaving, setBatchSaving] = useState(false);
  const isStaff = role === 'admin' || role === 'editor';

  const toggleSelect = id => setSelectedIds(prev => {
    const s = new Set(prev);
    s.has(id) ? s.delete(id) : s.add(id);
    return s;
  });

  const exitBatch = () => { setBatchMode(false); setSelectedIds(new Set()); setBatchPicker(false); };

  const batchUpdate = async (field, value) => {
    if (!selectedIds.size) return;
    setBatchSaving(true);
    await fetch('/api/photos/batch/update', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [...selectedIds], updates: { [field]: value } }),
    });
    setBatchSaving(false);
    setBatchPicker(false);
    exitBatch();
    // 重新觸發篩選器讓照片格刷新
    setFilters(f => ({ ...f }));
  };

  const allFilters = {
    ...(catFilter ? { category: catFilter } : {}),
    ...filters,
    photo_type: photoMode,
  };

  useEffect(() => {
    let stale = false;
    const timer = setTimeout(() => {
      const qs = new URLSearchParams();
      if (catFilter) qs.set('category', catFilter);
      qs.set('photo_type', photoMode);
      Object.entries(filters).forEach(([k, v]) => v && qs.set(k, v));
      fetch('/api/photos/filter-counts?' + qs)
        .then(r => r.json())
        .then(d => { if (!stale) setCounts(d); })
        .catch(() => {});
    }, 150);
    return () => { stale = true; clearTimeout(timer); };
  }, [catFilter, photoMode, JSON.stringify(filters)]);

  const setF = (field, value) => setFilters(prev => {
    const n = { ...prev };
    if (value) n[field] = value; else delete n[field];
    return n;
  });

  return (
    <>
      <div className="browse-hdr">
        <CategoryTabs active={catFilter} onSelect={v => { if (!batchMode) setCatFilter(v); }} />
        {/* 單列：左邊可橫滑（切換+篩選+次要動作），右邊固定 like or not */}
        <div style={{display:'flex',alignItems:'stretch',background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
          <div className="chips-bar" style={{flex:1,minWidth:0,gap:6,padding:'6px 10px',border:'none'}}>
            <div style={{display:'flex',gap:0,background:'var(--s3)',borderRadius:8,padding:2,flexShrink:0}}>
              {['去背','情境'].map(mode => (
                <button key={mode} onClick={() => setPhotoMode(mode)} style={{
                  padding:'4px 12px', border:'none', borderRadius:6, fontSize:12, fontWeight:600,
                  cursor:'pointer', transition:'all .18s',
                  background: photoMode===mode ? 'var(--surface)' : 'transparent',
                  color: photoMode===mode ? 'var(--text)' : 'var(--text3)',
                  boxShadow: photoMode===mode ? '0 1px 3px rgba(0,0,0,.1)' : 'none',
                }}>{mode}</button>
              ))}
            </div>
            {Object.entries(CFG).map(([field]) => (
              <FilterDropdown key={field} field={field} cur={filters[field] || null}
                counts={counts[field] || {}} onPick={v => setF(field, v)} />
            ))}
            {(catFilter || Object.keys(filters).length > 0) && (
              <button className="chip-clr" onClick={() => { setFilters({}); setCatFilter(null); }}>清除</button>
            )}
            <div style={{flex:1,minWidth:8}} />
            {isStaff && (
              batchMode
                ? <button onClick={exitBatch} style={{padding:'5px 12px',border:'1px solid var(--border)',borderRadius:8,fontSize:12,background:'var(--surface)',cursor:'pointer',color:'var(--text2)',flexShrink:0}}>取消</button>
                : <>
                    <button onClick={() => setBatchMode(true)} style={{padding:'5px 12px',border:'1px solid var(--border)',borderRadius:8,fontSize:12,background:'var(--surface)',cursor:'pointer',color:'var(--text2)',whiteSpace:'nowrap',flexShrink:0}}>批量編輯</button>
                    <button onClick={() => setCostCalc(true)} style={{padding:'5px 12px',border:'1px solid var(--border)',borderRadius:8,fontSize:12,background:'var(--surface)',cursor:'pointer',color:'var(--text2)',whiteSpace:'nowrap',flexShrink:0}}>金工試算</button>
                  </>
            )}
          </div>
          {isStaff && !batchMode && (
            <div style={{flexShrink:0,display:'flex',alignItems:'center',padding:'6px 10px 6px 6px',
              boxShadow:'-10px 0 10px -8px rgba(0,0,0,.12)',position:'relative',zIndex:1}}>
              <button className="swipe-launch-btn" onClick={() => setConsult(true)} style={{padding:'5px 12px',border:'1px solid var(--gold)',borderRadius:8,fontSize:12,background:'var(--surface)',cursor:'pointer',color:'var(--gold)',fontWeight:600,display:'flex',alignItems:'center',gap:4,whiteSpace:'nowrap'}}>
                <span style={{fontSize:12}}>✦</span> 客人選款
              </button>
            </div>
          )}
        </div>
      </div>
      <div className="body-row">
        <div className="main">
          <PhotoGrid isFav={isFav} toggleFav={toggleFav} filters={allFilters} role={role}
            batchMode={batchMode} selectedIds={selectedIds} onToggleSelect={toggleSelect} />
        </div>
      </div>

      {/* 批量操作浮動列 */}
      {batchMode && (
        <div style={{position:'fixed',bottom:0,left:0,right:0,zIndex:500,
          background:'var(--surface)',borderTop:'1px solid var(--border)',
          padding:'12px 16px 24px',display:'flex',alignItems:'center',gap:10,boxShadow:'0 -2px 12px rgba(0,0,0,.08)'}}>
          <span style={{fontSize:14,color:'var(--text2)',flex:1}}>
            {selectedIds.size > 0 ? `已選 ${selectedIds.size} 張` : '點選照片以選取'}
          </span>
          {selectedIds.size > 0 && (
            <>
              <button onClick={() => setBatchPicker(true)} style={{
                padding:'9px 20px',borderRadius:8,border:'none',
                background:'var(--accent)',color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer'}}>
                修改品項
              </button>
              <button onClick={() => setSelectedIds(new Set())} style={{
                padding:'9px 14px',borderRadius:8,border:'1px solid var(--border)',
                background:'var(--surface)',fontSize:13,cursor:'pointer',color:'var(--text2)'}}>
                清除選取
              </button>
            </>
          )}
        </div>
      )}

      {/* 品項選擇 bottom sheet */}
      {batchPicker && (
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(0,0,0,.4)'}}
          onClick={() => setBatchPicker(false)}>
          <div style={{position:'absolute',bottom:0,left:0,right:0,
            background:'var(--surface)',borderRadius:'16px 16px 0 0',padding:'20px 16px 40px'}}
            onClick={e => e.stopPropagation()}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:16,color:'var(--text)'}}>
              將 {selectedIds.size} 張照片的品項改為：
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
              {CATS.map(cat => (
                <button key={cat} disabled={batchSaving} onClick={() => batchUpdate('category', cat)} style={{
                  padding:'12px 8px',borderRadius:10,border:'1px solid var(--border)',
                  background:'var(--bg)',fontSize:14,cursor:'pointer',
                  opacity: batchSaving ? 0.5 : 1,
                }}>
                  {cat}
                </button>
              ))}
            </div>
            {batchSaving && <div style={{textAlign:'center',marginTop:16,color:'var(--text2)',fontSize:13}}>儲存中…</div>}
          </div>
        </div>
      )}

      {/* 金工試算 */}
      {costCalc && <CostCalcPanel onClose={() => setCostCalc(false)} />}

      {/* 顧問選款模式（大圖選款＋滑卡＋逐件估價） */}
      {consult && <ConsultMode onClose={() => setConsult(false)} role={role} />}
    </>
  );
}

/* ── Favorites tab ──────────────────────────────────── */
function FavsTab({ favs, isFav, toggleFav, clearFavs, role }) {
  const [detail, setDetail] = useState(null);
  const [pendingDel, setPendingDel] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);

    <div className="body-row" style={{paddingTop:'var(--nav-h)'}}><div style={{flex:1}}>

    </div></div>

  return (
    <>
      <div className="fav-bar" style={{marginTop:'var(--nav-h)'}}>

        <button className="fav-clr-btn" onClick={() => setConfirmClear(true)}>清空收藏</button>

      {confirmClear && (

        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:'var(--surface)',borderRadius:16,padding:'28px 28px 22px',
            boxShadow:'0 16px 48px rgba(0,0,0,.2)',maxWidth:300,width:'90%',textAlign:'center',
          }}>
            <div style={{fontSize:15,fontWeight:600,marginBottom:8}}>清空收藏？</div>
            <div style={{fontSize:13,color:'var(--text2)',marginBottom:22}}>
              將移除全部 {favs.length} 張收藏，無法復原。
            </div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={() => setConfirmClear(false)}
                style={{flex:1,padding:'10px',borderRadius:10,border:'1px solid var(--border)',
                  background:'none',fontSize:14,cursor:'pointer',color:'var(--text2)'}}>
                取消
              </button>
              <button onClick={() => { clearFavs(); setConfirmClear(false); }}
                style={{flex:1,padding:'10px',borderRadius:10,border:'none',
                  background:'#c0392b',color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer'}}>
                確認清空
              </button>
            </div>
          </div>
        </div>
      )}
      <div className="body-row">
        <div className="main">
          <div className="grid-wrap" style={{paddingTop:'var(--nav-h)'}}>
            <div className="grid">
              {favs.map(p => (
                <div key={p.id} className="card" onClick={() => setDetail(p)}>
                  <img src={p.thumb_url} alt="" loading="lazy" />
                  <button className="card-fav on" onClick={e => { e.stopPropagation(); toggleFav(p); }}>♥</button>
                  <div className="card-lbl">{[p.category, p.style].filter(v => v && v !== '未定').join(' · ')}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      {detail && (
        <PhotoDetail photo={detail} onClose={() => setDetail(null)}
          isFav={isFav} toggleFav={toggleFav} onSelectPhoto={p => setDetail(p)}
          role={role}
          onDeleted={id => {
            const isAdmin = role === 'admin';
            toggleFav(favs.find(p => p.id === id) || {id});
            setDetail(null);
            if (!isAdmin) {
              const photo = favs.find(p => p.id === id);
              const timer = setTimeout(() => {
                fetch('/api/photos/' + id, { method: 'DELETE' });
                setPendingDel(null);
              }, 5000);
              setPendingDel({ id, photo, timer });
            } else {
              fetch('/api/photos/' + id, { method: 'DELETE' });
            }
          }}
          onUpdated={updated => { setDetail(updated); }} />
      )}
      {pendingDel && (
        <div className="undo-toast">
          <span>已移除照片</span>
          <button className="undo-btn" onClick={() => {
            clearTimeout(pendingDel.timer);
            if (pendingDel.photo) toggleFav(pendingDel.photo);
            setPendingDel(null);
          }}>復原</button>
        </div>
      )}
    </>
  );
}

/* ── Pricing DB hook – fetches from /api/pricing/all, falls back to hardcoded ── */
const _pricingState = { data: null, promise: null };
function _fetchPricing(setP) {
  _pricingState.data = null; _pricingState.promise = null;
  _pricingState.promise = fetch('/api/pricing/all')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d) return;
      const data = {
        METAL_PER_G:       d.metals       || {},
        LABOR:             d.labor        || {},
        LABOR_CONFIG:      d.labor_config || {daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8},
        WEIGHTS:           d.weights      || {},
        SIDESTONES:        d.sidestones   || {},
        SIDESTONES_V2:     d.sidestones_v2 || {},
        PLATING:           d.plating      || {},
        STONES_COMMERCIAL: Object.fromEntries(
          Object.entries(d.stones_commercial || {}).map(([k, v]) => [k, { name: v.name, range: v.range || [v.price_min||0, v.price_max||0] }])
        ),
        /* 投資級寶石：DB 有完整資料（含產地/處理/色級乘數）才採用，否則 fallback 寫死表 */
        STONES_INVEST: (() => {
          const inv = d.stones_invest || {};
          const ok = Object.keys(inv).length > 0 &&
            Object.values(inv).every(s => s.floor && s.ceil && Object.keys(s.origins||{}).length && Object.keys(s.colors||{}).length);
          return ok ? inv : null;
        })(),
      };
      _pricingState.data = data;
      if (setP) setP(data);
    })
    .catch(() => {});
  return _pricingState.promise;
}
function usePricing() {
  const [p, setP] = React.useState(_pricingState.data);
  React.useEffect(() => {
    if (_pricingState.data) { setP(_pricingState.data); return; }
    if (!_pricingState.promise) { _fetchPricing(setP); }
    else { _pricingState.promise.then(() => { if (_pricingState.data) setP(_pricingState.data); }); }
  }, []);
  React.useEffect(() => {
    const handler = () => _fetchPricing(setP);
    window.addEventListener('pricingUpdated', handler);
    return () => window.removeEventListener('pricingUpdated', handler);
  }, []);
  return {
    METAL_PER_G:       p?.METAL_PER_G       || METAL_PER_G,
    LABOR:             p?.LABOR             || LABOR,
    LABOR_CONFIG:      p?.LABOR_CONFIG      || {daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8},
    WEIGHTS:           p?.WEIGHTS           || WEIGHTS,
    SIDESTONES:        p?.SIDESTONES        || SIDESTONES,
    SIDESTONES_V2:     p?.SIDESTONES_V2     || {},
    STONES_COMMERCIAL: p?.STONES_COMMERCIAL || STONES_COMMERCIAL,
    STONES_INVEST:     p?.STONES_INVEST     || STONES_INVEST,
    PLATING:           p?.PLATING           || {'無':[0,0],'金色':[500,1500],'玫瑰金':[500,1500],'黑金':[800,2000]},
  };
}

        <button onClick={onClose} style={{position:'absolute',top:8,right:10,background:'none',border:'none',fontSize:20,color:'#bbb',cursor:'pointer',lineHeight:1}}>×</button>

        <div style={{textAlign:'center',marginBottom:4}}>
          <div style={{fontSize:9,letterSpacing:4,fontWeight:200,color:'#b8935a',textTransform:'uppercase',marginBottom:2}}>Tahir Zainab Selection</div>
          <div style={{fontSize:11,color:'#999',letterSpacing:1}}>{isEstimate ? '報價單（AI預估）' : '報價單'}</div>
        </div>

        {customer && <div style={{textAlign:'center',fontSize:16,fontWeight:800,color:'#1a1a1a',marginBottom:2}}>{customer}</div>}
        {staffName && <div style={{textAlign:'center',fontSize:11,color:'#b8935a',fontWeight:600,marginBottom:6}}>服務專員：{staffName}</div>}

        {orderType !== '全訂制' && (stoneOrderNo || commissionNote) && (
          <div style={{background:'#fffaf0',border:'1px solid #e8c97a',borderRadius:9,padding:'8px 12px',marginBottom:8}}>
            {orderType==='半訂制' && stoneOrderNo && (
              <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:commissionNote?4:0}}>
                <span style={{fontSize:10,fontWeight:700,color:'#b8935a',flexShrink:0}}>裸石單號</span>
                <span style={{fontSize:12,fontWeight:800,color:'#1a1a1a'}}>{stoneOrderNo}</span>
              </div>
            )}
            {commissionNote && (
              <div>
                <div style={{fontSize:10,fontWeight:700,color:'#b8935a',marginBottom:2}}>委託石頭</div>
                <div style={{fontSize:12,color:'#333',lineHeight:1.6}}>{commissionNote}</div>
              </div>
            )}
          </div>
        )}

        <div style={{display:'flex',gap:10,borderTop:'1px solid #f0f0f0',padding:'10px 0 8px',alignItems:'stretch'}}>
          {photo?.thumb_url && (
            <div style={{flex:'0 0 50%',height:130,background:'#f8f8f8',borderRadius:10,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ImgZoom src={photo.thumb_url} fullSrc={photo.full_url || photo.thumb_url} alt="" style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',display:'block'}} />
            </div>
          )}
          <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',paddingLeft:2}}>
            {isEstimate ? (
              <>
                <div style={{fontSize:8,color:'#b8935a',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>預估區間</div>
                <div style={{fontSize:16,fontWeight:800,color:'#1a1a1a',lineHeight:1.2}}>{fmtNT(totalMin)}</div>
                <div style={{fontSize:13,color:'#888',marginBottom:8}}>–&nbsp;{fmtNT(totalMax)}</div>
                <div style={{fontSize:9,color:'#d32f2f',fontWeight:700,background:'#fff5f5',borderRadius:5,padding:'4px 6px',textAlign:'center',lineHeight:1.5}}>預估參考<br/>以最終報價為主</div>
              </>
            ) : (
              <>
                <div style={{fontSize:8,color:'#b8935a',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>最終報價</div>
                <div style={{fontSize:22,fontWeight:800,color:'#1a1a1a',lineHeight:1.2,marginBottom:6}}>{fmtNT(manualPrice)}</div>
              </>
            )}
          </div>
        </div>

        <div style={{paddingBottom:6,borderBottom:'1px solid #f0f0f0',marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:700,color:'#1a1a1a',lineHeight:1.5,marginBottom:1}}>{description||'—'}</div>
          <div style={{fontSize:9,color:'#bbb'}}>{today}{sourceChannel&&' · '+sourceChannel}</div>
        </div>

        <div style={{margin:'8px 0'}}>
          <R label="品項" value={cat} />
          <R label="主石" value={stoneName?`${stoneName}${carat>0?' '+carat+'ct':''}`:null} />
          {stoneMode==='invest' && <R label="產地" value={origin} />}
          {stoneMode==='invest' && <R label="優化處理" value={treatment} />}
          {stoneMode==='invest' && <R label="顏色等級" value={colorQ} />}
          <R label="材質" value={materialType} />
          <R label="用料重量" value={weightKey} />
          <R label="做工複雜度" value={craft||style} />
          <R label="配石" value={sidestone&&sidestone!=='無配石'?sidestone:null} />
          <R label="尺寸" value={itemSize} />
          {budget>0 && <R label="客戶預算" value={fmtNT(budget)} />}
        </div>

        <div style={{fontSize:8,color:'#bbb',lineHeight:1.8,marginTop:8,paddingTop:8,borderTop:'1px solid #f0f0f0'}}>
          本公司為彩色裸礦石供應商，珠寶訂製為滿足客戶提供樣式、需求之金工服務，最終樣式以溝通內容詳載於訂單付款頁面為主，付款後視同確認無誤。<br/>
          ※ 圖片為參考圖，並非為本公司商品。
        </div>
        <div style={{textAlign:'center',fontSize:8,color:'#ddd',marginTop:6,letterSpacing:3}}>TAHIR ZAINAB SELECTION</div>
      </div>
    </div>
  );
}

/* ── Photo-triggered estimator (4-step wizard) ──────── */

/* 點擊放大圖 lightbox */
function ImgZoom({ src, fullSrc, style, className, ...props }) {
  const [open, setOpen] = React.useState(false);
  return (
    <>
      <img src={src} style={{...style, cursor:'zoom-in'}} className={className}
        onClick={e => { e.stopPropagation(); setOpen(true); }} {...props} />
      {open && ReactDOM.createPortal(
        <div onClick={() => setOpen(false)}
          style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:99999,
            display:'flex',alignItems:'center',justifyContent:'center'}}>
          <img src={fullSrc || src} alt=""
            style={{maxWidth:'95vw',maxHeight:'92vh',objectFit:'contain',borderRadius:8,
              boxShadow:'0 8px 48px rgba(0,0,0,.6)'}} />
          <button onClick={() => setOpen(false)}
            style={{position:'fixed',top:16,right:20,background:'none',border:'none',
              color:'#fff',fontSize:32,lineHeight:1,cursor:'pointer',padding:4}}>×</button>
        </div>,
        document.body
      )}
    </>
  );
}

function PhotoQuoteFlow({ photo, onBack, onClose, initialCustomer }) {
  const pricing = usePricing();
  const STONES_INVEST = pricing.STONES_INVEST;  // 遮蔽全域寫死表，與設定頁同步
  const GEM_MAP = {};
  Object.entries(STONES_INVEST).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'invest'}; });
  Object.entries(pricing.STONES_COMMERCIAL).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'commercial'}; });
  const initGem = GEM_MAP[photo.gemstone] || null;

  const [uploadedUrl,      setUploadedUrl]      = useState(null);
  const [uploadingPhoto,   setUploadingPhoto]   = useState(false);
  // dispPhoto merges server photo with any client-uploaded image
  const dispPhoto = React.useMemo(() => ({
    ...photo,
    thumb_url: photo.thumb_url || uploadedUrl || null,
    full_url:  photo.full_url  || uploadedUrl || null,
  }), [photo, uploadedUrl]);

  async function handlePhotoUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';
    // 先用 data URL 顯示預覽
    const reader = new FileReader();
    reader.onload = ev => setUploadedUrl(ev.target.result);
    reader.readAsDataURL(file);
    // 同時上傳到 server
    setUploadingPhoto(true);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/api/quotes/upload-ref-photo', { method: 'POST', body: fd });
      if (r.ok) {
        const d = await r.json();
        setUploadedUrl(d.url); // 換成 server URL（永久保存）
      }
    } catch {}
    setUploadingPhoto(false);
  }

  const [step,         setStep]         = useState(1);
  const [budget,       setBudget]       = useState('');
  const [cat,          setCat]          = useState(photo.category        || CATS[0] || '戒指');
  const [style,        setStyle]        = useState(photo.style           || '');
  const [chain,        setChain]        = useState(photo.setting_amount  || '正常');
  const [craft,        setCraft]        = useState(photo.craft_complexity || '中等');
  const [metalColor,   setMetalColor]   = useState(photo.metal_color     || '');
  const [materialType, setMaterialType] = useState(photo.metal_color==='銀'?'925銀':'18K金');
  const [stoneKey,     setStoneKey]     = useState(initGem?.key  || '');
  const [stoneMode,    setStoneMode]    = useState('commercial');
  const [carat,        setCarat]        = useState('1');
  const [origin,       setOrigin]       = useState('');
  const [treatment,    setTreatment]    = useState('');
  const [colorQ,       setColorQ]       = useState('');
  const [sideType,     setSideType]     = useState('無配石');
  const [sideBand,     setSideBand]     = useState('1–5顆');
  const [manualQuote,  setManualQuote]  = useState('');
  const [customer,     setCustomer]     = useState(initialCustomer || '');
  const [inquiryDate,  setInquiryDate]  = useState(`${new Date().getMonth()+1}/${new Date().getDate()}`);
  const [sourceChannel,setSourceChannel]= useState('');
  const [itemSize,     setItemSize]     = useState('');
  const [plating,      setPlating]      = useState('');
  const [stoneOrderNo, setStoneOrderNo] = useState('');
  const [qNotes,       setQNotes]       = useState('');
  const [colorPref,    setColorPref]    = useState('');
  const [saving,            setSaving]            = useState(false);
  const [savedId,           setSavedId]           = useState(null);
  const [finalInput,        setFinalInput]        = useState('');
  const [confirming,        setConfirming]        = useState(false);
  const [confirmed,         setConfirmed]         = useState(false);
  const [showCard,          setShowCard]          = useState(false);
  const [showEstimateCard,  setShowEstimateCard]  = useState(false);
  const [orderType,         setOrderType]         = useState('全訂制');
  const [commissionNote,    setCommissionNote]    = useState('');
  const [showIntro,         setShowIntro]         = useState(true);
  const staffName = getJwtUser()?.name || '';

  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColorQ(Object.keys(s.colors)[0]);
    }
    setManualQuote('');
  }, [stoneKey, stoneMode]);

  useEffect(() => {
    const opts = SIZE_OPTS[cat];
    const def = opts ? opts[0] : '';
    setItemSize(def);
    if (cat === '項鍊' && NECKLACE_LENGTH_TO_CHAIN[def]) setChain(NECKLACE_LENGTH_TO_CHAIN[def]);
    else if (cat === '手鏈' && BRACELET_LENGTH_TO_CHAIN[def]) setChain(BRACELET_LENGTH_TO_CHAIN[def]);
  }, [cat]);

  // Price calculation
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0;
  const currentStone  = stoneMode === 'invest'     ? STONES_INVEST[stoneKey]             : null;
  const currentStoneC = stoneMode === 'commercial' ? pricing.STONES_COMMERCIAL[stoneKey] : null;
  const stoneName = currentStone?.name || currentStoneC?.name || '';

  if (currentStone && ct > 0) {
    const band = getBand(ct);
    const k = (currentStone.origins[origin]||1) * (currentStone.treatments[treatment]||1) * (currentStone.colors[colorQ]||1);
    stoneMin = currentStone.floor[band] * k * 0.8 * ct;
    stoneMax = currentStone.ceil[band]  * k * 0.8 * ct;
  } else if (currentStoneC && ct > 0) {
    stoneMin = currentStoneC.range[0] * ct;
    stoneMax = currentStoneC.range[1] * ct;
  }

  const CHAIN_TO_WEIGHT = {'少':'輕 (1.5–3g)','正常':'中 (3–5g)','多':'偏重 (5–8g)'};
  const laborKey    = craft || '中等';
  const LC          = pricing.LABOR_CONFIG || {};
  const dailyRate   = Number(LC.daily_rate) || 2000;
  const craftDays   = Number(LC[laborKey]) || 0;
  const laborExact  = Math.round(dailyRate * craftDays);
  const laborRange  = craftDays > 0 ? [Math.round(laborExact * 0.9), Math.round(laborExact * 1.1)] : [0, 0];
  const weightKey   = CHAIN_TO_WEIGHT[chain] || '中 (3–5g)';
  const weightRange = (pricing.WEIGHTS[weightKey] || WEIGHTS[weightKey]) || [3,5];
  const metalPg     = pricing.METAL_PER_G[materialType] || METAL_PER_G[materialType] || 3800;
  const sidestone    = sideType === '無配石' ? '無配石' : `${sideType} ${sideBand}`;
  const sideRange    = sideType !== '無配石' && pricing.SIDESTONES_V2[sideType]
    ? (pricing.SIDESTONES_V2[sideType][sideBand] || [0,0])
    : [0,0];
  const metalCostMin = metalPg * weightRange[0];
  const metalCostMax = metalPg * weightRange[1];
  const plateRange  = pricing.PLATING[plating] || [0,0];
  const mountMin    = laborRange[0] + metalCostMin + sideRange[0] + plateRange[0];
  const mountMax    = laborRange[1] + metalCostMax + sideRange[1] + plateRange[1];
  const totalMin    = stoneMin + mountMin;
  const totalMax    = stoneMax + mountMax;
  const hasPrice    = totalMin > 0 || totalMax > 0;
  const manualNum   = parseInt(String(manualQuote).replace(/[^0-9]/g,'')) || 0;
  const budgetNum   = parseInt(String(budget).replace(/[^0-9]/g,'')) || 0;

  const orig = {
    category: photo.category || '', style: photo.style || '',
    setting_amount: photo.setting_amount || '', craft_complexity: photo.craft_complexity || '',
    metal_color: photo.metal_color || '', gemstone: photo.gemstone || '',
  };

  async function doSave() {
    setSaving(true);
    try {
      const adj = {category:cat, style, setting_amount:chain, craft_complexity:craft, metal_color:metalColor, material:materialType, gemstone:stoneName, stoneKey, stoneMode, carat:ct, origin, treatment, colorQ, sidestone, size:itemSize, plating, stone_order_no:stoneOrderNo, commission_note:commissionNote, order_type:orderType, staff_name:staffName, notes:qNotes, inquiry_time:inquiryDate, source_channel:sourceChannel};
      const notesText = [
        inquiryDate && `詢價時間：${inquiryDate}${sourceChannel?' ('+sourceChannel+')':''}`,
        manualNum > 0 && `預估報價：NT$${manualNum.toLocaleString('zh-TW')}`,
        itemSize && `尺寸：${itemSize}`,
        plating && plating !== '無' && `鍍金：${plating}`,
        stoneOrderNo && `裸石單號：${stoneOrderNo}`,
        commissionNote && `委託石頭：${commissionNote}`,
        qNotes && `備註：${qNotes}`,
      ].filter(Boolean).join('\n');
      const payload = {
        description:    `${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`,
        final_price:    null,
        material:       materialType,
        gemstone:       stoneName || null,
        photo_id:       photo.id || null,
        customer_name:  customer || null,
        original_data:  JSON.stringify(orig),
        adjusted_data:  JSON.stringify(adj),
        estimated_min:  manualNum > 0 ? Math.min(manualNum, Math.round(totalMax)) : (totalMin > 0 ? Math.round(totalMin) : null),
        estimated_max:  manualNum > 0 ? Math.max(manualNum, Math.round(totalMax)) : (totalMax > 0 ? Math.round(totalMax) : null),
        budget:         budgetNum > 0 ? budgetNum : null,
        stone_order_no: stoneOrderNo || null,
        inquiry_time:   inquiryDate || null,
        source_channel: sourceChannel || null,
        staff_name:     staffName || null,
        notes:          notesText || null,
        ref_photo_url:  uploadedUrl && !uploadedUrl.startsWith('data:') ? uploadedUrl : null,
      };
      const res = await fetch('/api/quotes', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      if (res.ok) { const d = await res.json(); setSavedId(d.id); }
      else {
        const rawText = await res.text().catch(()=>'');
        let detail = rawText;
        try { const j = JSON.parse(rawText); detail = JSON.stringify(j.detail||j,null,2); } catch {}
        alert('儲存失敗 ' + res.status + '\n' + detail);
      }
    } catch(e) { alert('網路錯誤：' + e.message); }
    setSaving(false);
  }

  async function doConfirmPrice() {
    const price = parseInt(String(finalInput).replace(/[^0-9]/g,''));
    if (!price || !savedId) return;
    setConfirming(true);
    try {
      await fetch(`/api/quotes/${savedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({final_price:price}) });
      setConfirmed(true);
      setTimeout(onBack, 1600);
    } catch { alert('回填失敗'); }
    setConfirming(false);
  }

  const Chip = ({val, cur, setCur}) => {
    const on = cur === val;
    return (
      <button onClick={() => setCur(val)} style={{
        padding:'8px 14px', borderRadius:8, margin:'4px 4px 4px 0',
        border: on ? '1.5px solid var(--gold)' : '1px solid var(--border)',
        background: on ? 'rgba(184,147,90,.14)' : 'var(--surface)',
        color: on ? 'var(--gold)' : 'var(--text)',
        fontSize:13, fontWeight: on ? 700 : 400, cursor:'pointer', flexShrink:0,
      }}>{val}</button>
    );
  };

  // ── Saved view ──────────────────────────────────────
  if (savedId !== null) return (
    <div className="det-ovl">
      {showEstimateCard && hasPrice && (
        <QuoteCard mode="estimate" photo={dispPhoto} description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
          totalMin={manualNum>0?Math.min(manualNum,Math.round(totalMax)):Math.round(totalMin)}
          totalMax={manualNum>0?Math.max(manualNum,Math.round(totalMax)):Math.round(totalMax)} customer={customer} staffName={staffName} stoneOrderNo={stoneOrderNo}
          commissionNote={commissionNote} orderType={orderType}
          itemSize={itemSize} cat={cat} stoneName={stoneName}
          carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}
          materialType={materialType} weightKey={weightKey} craft={craft} style={style}
          sidestone={sidestone} sourceChannel={sourceChannel} inquiryDate={inquiryDate}
          budget={budgetNum} onClose={() => setShowEstimateCard(false)} />
      )}
      {showCard && parseInt(finalInput) > 0 && (
        <QuoteCard mode="final" photo={dispPhoto} description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
          manualPrice={parseInt(String(finalInput).replace(/[^0-9]/g,''))||0} totalMin={Math.round(totalMin)} totalMax={Math.round(totalMax)} customer={customer} staffName={staffName} stoneOrderNo={stoneOrderNo}
          commissionNote={commissionNote} orderType={orderType}
          itemSize={itemSize} cat={cat} stoneName={stoneName}
          carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}
          materialType={materialType} weightKey={weightKey} craft={craft} style={style}
          sidestone={sidestone} sourceChannel={sourceChannel} inquiryDate={inquiryDate}
          budget={budgetNum} onClose={() => setShowCard(false)} />
      )}
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setSavedId(null)}>←</button>
          <span className="det-hd-title">報價已儲存</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onBack}>×</button>
        </div>
        <div className="det-scroll" style={{padding:'14px'}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            {/* 左：預估報價 */}
            <div style={{flex:1,background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'14px',textAlign:'center'}}>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:1.2,textTransform:'uppercase',marginBottom:6}}>預估報價</div>
              {hasPrice ? (
                <>
                  <div style={{fontSize:20,fontWeight:700,color:'var(--text)',marginBottom:2}}>{fmtNT(manualNum || Math.round(totalMin))}</div>
                  <div style={{fontSize:10,color:'var(--text2)'}}>{fmtNT(totalMin)} – {fmtNT(totalMax)}</div>
                </>
              ) : <div style={{fontSize:12,color:'var(--text3)'}}>未計算</div>}
              {customer && <div style={{fontSize:10,color:'var(--text2)',marginTop:4}}>客戶：{customer}</div>}
              {hasPrice && (
                <>
                  <div style={{fontSize:10,color:'var(--text3)',marginTop:8,marginBottom:6,lineHeight:1.5}}>先把資訊跟參考照片傳給估價專員</div>
                  <button onClick={() => setShowEstimateCard(true)}
                    style={{width:'100%',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:11,fontWeight:600,color:'var(--text)',cursor:'pointer'}}>
                    📊 預覽截圖
                  </button>
                </>
              )}
            </div>
            {/* 右：最終報價 */}
            <div style={{flex:1,background:'#fffbf0',borderRadius:14,border:'1px solid rgba(184,147,90,.35)',padding:'14px'}}>
              <div style={{fontSize:10,letterSpacing:1.2,textTransform:'uppercase',color:'var(--gold)',fontWeight:700,marginBottom:6}}>最終報價</div>
              {!confirmed ? (
                <>
                  <div style={{fontSize:10,color:'var(--text2)',marginBottom:8,lineHeight:1.5}}>輸入給客人的最終報價</div>
                  <div style={{position:'relative',marginBottom:6}}>
                    <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
                    <input type="text" inputMode="numeric" placeholder="0" autoFocus
                      value={finalInput} onChange={e=>setFinalInput(e.target.value.replace(/[^0-9]/g,''))}
                      style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'8px 6px 8px 30px',fontSize:15,fontWeight:700,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit'}}
                      onFocus={e=>e.target.style.borderColor='var(--gold)'}
                      onBlur={e=>e.target.style.borderColor='var(--border)'}
                      onKeyDown={e=>e.key==='Enter'&&doConfirmPrice()} />
                  </div>
                  {parseInt(finalInput) > 0 && (
                    <button onClick={() => setShowCard(true)}
                      style={{width:'100%',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:11,fontWeight:600,color:'var(--text)',cursor:'pointer',marginBottom:6}}>
                      📋 預覽截圖
                    </button>
                  )}
                  <button onClick={doConfirmPrice} disabled={!finalInput||confirming}
                    style={{width:'100%',background:(!finalInput||confirming)?'var(--s3)':'var(--accent)',color:(!finalInput||confirming)?'var(--text3)':'#fff',border:'none',borderRadius:8,padding:'9px',fontSize:12,fontWeight:700,cursor:(!finalInput||confirming)?'default':'pointer',marginBottom:4}}>
                    {confirming ? '確認中…' : '✓ 確認成交'}
                  </button>
                  <button onClick={onBack} style={{width:'100%',background:'var(--surface)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px',fontSize:11,cursor:'pointer'}}>事後再填</button>
                </>

  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>

        {showEstimateCard && hasPrice && (

            carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}

              if (step === 6) return renderStep5();

              if (step === 2) return renderCommissionStoneStep();
              if (step === 3) return renderCommissionOrderNoStep();

        {step < STEPS.length ? (
          <div style={{padding:'12px 16px 20px',borderTop:'1px solid var(--border)',background:'var(--surface)'}}>
            <button onClick={() => setStep(s=>s+1)}

          <div style={{position:'absolute',bottom:0,left:0,right:0,background:'var(--accent)',padding:'12px 16px 20px',boxShadow:'0 -4px 20px rgba(0,0,0,.2)'}}>

            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:6}}>

                <span style={{padding:'0 4px 0 10px',color:'rgba(255,255,255,.6)',fontSize:13,fontWeight:600,flexShrink:0,lineHeight:1}}>NT$</span>
                <input type="text" inputMode="numeric" placeholder="輸入預估金額" value={manualQuote}
                  onChange={e=>setManualQuote(e.target.value.replace(/[^0-9]/g,''))}

              <button onClick={doSave} disabled={saving||manualNum===0}

            {budgetNum>0&&manualNum>0 && (
              <div style={{fontSize:11,marginTop:2,color:manualNum<=budgetNum*1.05?'#4caf77':'#ff8a80'}}>
                {manualNum<=budgetNum*1.05?'✓ 預算範圍內':`超出預算 ${fmtNT(manualNum-budgetNum)}`}

/* ── Quote / Estimator tab ──────────────────────────── */
function QuoteTab({ onBack, onHistory } = {}) {
  const pricing = usePricing();
  const STONES_INVEST = pricing.STONES_INVEST;  // 遮蔽全域寫死表，與設定頁同步
  /* ── State ── */
  const [stoneKey,    setStoneKey]    = useState('');       // invest key or '' or COMMERCIAL_*
  const [stoneMode,   setStoneMode]   = useState('invest'); // 'invest' | 'commercial'
  const [carat,       setCarat]       = useState('1');
  const [origin,      setOrigin]      = useState('');
  const [treatment,   setTreatment]   = useState('');
  const [color,       setColor]       = useState('');
  const [hasMounting, setHasMounting] = useState(true);
  const [item,        setItem]        = useState('戒指');
  const [metal,       setMetal]       = useState('18K金');
  const [weight,      setWeight]      = useState('中 (3–5g)');
  const [complexity,  setComplexity]  = useState('中等');
  const [sidestone,   setSidestone]   = useState('無配石');
  const [size,        setSize]        = useState('');
  const [cert,        setCert]        = useState('無');
  const [customer,    setCustomer]    = useState('');
  const [sliderPct,   setSliderPct]   = useState(0.5);
  const [copied,      setCopied]      = useState(false);

  /* ── Pending quotes ── */
  const [pending,          setPending]          = useState([]);
  const [pendingFill,      setPendingFill]      = useState({});
  const [pendingBusy,      setPendingBusy]      = useState(null);
  const [overdueAlert,     setOverdueAlert]     = useState(false);

  useEffect(() => {
    fetch('/api/quotes/pending')
      .then(r => r.json())
      .then(data => {
        setPending(data);
        if (data.some(q => q.hours_elapsed >= 24)) setOverdueAlert(true);
      })
      .catch(() => {});
  }, []);

  async function confirmPending(id) {
    const price = parseInt((pendingFill[id]||'').replace(/[^0-9]/g,''));
    if (!price) return;
    setPendingBusy(id);
    try {
      await fetch(`/api/quotes/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: price }),
      });
      setPending(prev => prev.filter(q => q.id !== id));
    } catch { alert('回填失敗'); }
    setPendingBusy(null);
  }

  /* ── Reset invest-detail fields when stone changes ── */
  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColor(Object.keys(s.colors)[0]);
    }
    setSliderPct(0.5);
  }, [stoneKey, stoneMode]);

  /* Reset size when item changes */
  useEffect(() => {
    if (SIZE_OPTS[item]) setSize(SIZE_OPTS[item][0]);
  }, [item]);

  /* ── Computation ── */
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0, stoneTarget = 0;
  let stoneLabel = '';

  if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey] && ct > 0) {
    const s = STONES_INVEST[stoneKey];
    stoneLabel = s.name;
    const band = getBand(ct);
    const k = (s.origins[origin] || 1) * (s.treatments[treatment] || 1) * (s.colors[color] || 1);
    const fpc = s.floor[band] * k;
    const cpc = s.ceil[band] * k;
    const ref = Math.sqrt(fpc * cpc);
    stoneMin    = fpc * 0.8 * ct;
    stoneMax    = cpc * 0.8 * ct;
    stoneTarget = ref * 0.8 * ct;
  } else if (stoneMode === 'commercial' && stoneKey && pricing.STONES_COMMERCIAL[stoneKey] && ct > 0) {
    const s = pricing.STONES_COMMERCIAL[stoneKey];
    stoneLabel = s.name;
    stoneMin    = s.range[0] * ct;
    stoneMax    = s.range[1] * ct;
    stoneTarget = (stoneMin + stoneMax) / 2;
  }

  let mountMin = 0, mountMax = 0;
  if (hasMounting) {
    const LC2 = pricing.LABOR_CONFIG || {};
    const laborExact2 = Math.round((Number(LC2.daily_rate)||2000) * (Number(LC2[complexity])||0));
    const laborRange  = LC2[complexity] ? [Math.round(laborExact2*0.9), Math.round(laborExact2*1.1)] : [0,0];
    const weightRange = pricing.WEIGHTS[weight] || WEIGHTS[weight] || [0,0];
    const metalPg     = pricing.METAL_PER_G[metal] || METAL_PER_G[metal] || 0;
    const sideRange   = (() => {
      if (sidestone === '無配石') return [0,0];
      const spaceIdx = sidestone.indexOf(' ');
      if (spaceIdx < 0) return [0,0];
      const tp = sidestone.slice(0, spaceIdx);
      const bd = sidestone.slice(spaceIdx + 1);
      return (pricing.SIDESTONES_V2[tp] || {})[bd] || [0,0];
    })();
    mountMin = laborRange[0] + metalPg * weightRange[0] + sideRange[0];
    mountMax = laborRange[1] + metalPg * weightRange[1] + sideRange[1];
  }

  const certFee = CERTS[cert] || 0;
  const totalMin    = stoneMin    + mountMin + certFee;
  const totalMax    = stoneMax    + mountMax + certFee;
  const totalTarget = stoneTarget + (mountMin + mountMax) / 2 + certFee;
  const finalPrice  = totalMin + (totalMax - totalMin) * sliderPct;

  const hasPrice = totalMin > 0 || totalMax > 0;

  /* ── Copy ── */
  function handleCopy() {
    if (!hasPrice) return;
    const lines = [];
    if (customer) lines.push('客戶：' + customer);
    if (stoneLabel) lines.push('寶石：' + stoneLabel + (ct ? '  ' + ct + ' ct' : ''));
    if (hasMounting) lines.push('鑲嵌：' + item + ' / ' + metal + ' / ' + complexity);
    if (cert !== '無') lines.push('證書：' + cert);
    lines.push('報價：' + fmtNT(finalPrice));
    lines.push('範圍：' + fmtNT(totalMin) + ' – ' + fmtNT(totalMax));
    const txt = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    } else {
      const el = document.createElement('textarea');
      el.value = txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }
  }

  /* ── Style helpers ── */
  const sectionStyle = {
    background: 'var(--surface)',
    borderRadius: '12px',
    border: '1px solid var(--border)',
    marginBottom: '10px',
    overflow: 'hidden',
  };
  const sectionHeaderStyle = {
    fontSize: '10px',
    fontWeight: 700,
    letterSpacing: '1.5px',
    textTransform: 'uppercase',
    color: 'var(--text3)',
    padding: '12px 16px 6px',
  };
  const rowStyle = { padding: '6px 16px 10px' };
  const labelStyle = { fontSize: '11px', color: 'var(--text3)', fontWeight: 600, marginBottom: '5px' };
  const inputStyle = {
    width: '100%', border: '1.5px solid var(--border)', borderRadius: '8px',
    padding: '10px 12px', fontSize: '14px', color: 'var(--text)',
    background: 'var(--surface)', outline: 'none', appearance: 'none',
    WebkitAppearance: 'none', fontFamily: 'inherit',
  };
  const divStyle = { borderTop: '1px solid var(--border)', margin: '2px 16px' };
  const toggleRowStyle = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    padding: '12px 16px',
  };

  /* ── Invest stone select options ── */
  const investKeys = Object.keys(STONES_INVEST);
  const commercialKeys = Object.keys(pricing.STONES_COMMERCIAL);

  const currentInvestStone = stoneMode === 'invest' && stoneKey ? STONES_INVEST[stoneKey] : null;

  return (
    React.createElement('div', {
      style: {
        flex: 1, minHeight: 0,
        paddingTop: 'var(--nav-h)',
        background: '#F4F4F4',
        display: 'flex', flexDirection: 'column',
      }
    },

      /* ── Sub-header ── */
      React.createElement('div', {
        style: { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 16px', background:'var(--surface)', borderBottom:'1px solid var(--border)', flexShrink:0 }
      },
        React.createElement('div', { style:{fontSize:15,fontWeight:700,color:'var(--text)',letterSpacing:'0.5px'} }, '互動估價'),
        React.createElement('div', { style:{display:'flex',gap:8} },
          onBack && React.createElement('button', {
            onClick: onBack,
            style:{background:'none',border:'none',color:'var(--text2)',fontSize:13,fontWeight:600,cursor:'pointer',padding:'6px 10px'}
          }, '‹ 返回'),

/* ── LoginPage (full-screen) ── */
function LoginPage({ onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err,      setErr]      = useState('');
  const [shake,    setShake]    = useState(false);
  const [loading,  setLoading]  = useState(false);
  const [userList, setUserList] = useState([]);
  const pwRef = useRef(null);

  useEffect(() => {
    fetch('/api/auth/user-list').then(r => r.json()).then(setUserList).catch(() => {});
  }, []);

  function triggerError(msg) {
    setErr(msg || '帳號或密碼錯誤'); setPassword('');
    setShake(true);
    setTimeout(() => setShake(false), 500);
  }

  function storeAndAuth(data) {
    // PIN login: {token, role}  |  Account login: {token, user:{id,name,username,role}}
    const role = data.role || data.user?.role;
    const u    = data.user  || {};
    localStorage.setItem('jwt_token', data.token);
    localStorage.setItem('jwt_user', JSON.stringify({ role, name: u.name || '', username: u.username || '' }));
    localStorage.setItem('userRole', role);
    onAuth(role);
  }

  async function submit() {
    if (!username.trim() || !password.trim()) { setErr('請選擇帳號並輸入密碼'); return; }
    setLoading(true); setErr('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) { storeAndAuth(await res.json()); }
      else { triggerError('帳號或密碼錯誤'); }
    } catch { triggerError('網路錯誤，請重試'); }
    finally { setLoading(false); }
  }

  const inputSt = {
    width:'100%', padding:'11px 14px', border:'1.5px solid var(--border)', borderRadius:'var(--r)',
    fontSize:15, outline:'none', boxSizing:'border-box', fontFamily:'inherit',
    background:'var(--surface)', color:'var(--text)',
  };

  return (
    <div className="login-page">
      <div className="login-brand">Tahir Zainab Selection</div>
      <div className="login-card">
        <div className={'login-card-inner' + (shake ? ' shake' : '')}>
          <div className="login-label">登入</div>
          <select style={{...inputSt, cursor:'pointer'}} value={username} autoFocus
            onChange={e => { setUsername(e.target.value); setErr(''); pwRef.current?.focus(); }}>
            <option value="">— 請選擇帳號 —</option>
            {userList.map(u => <option key={u.username} value={u.username}>{u.name}</option>)}
          </select>
          <input ref={pwRef} type="password" style={inputSt} placeholder="密碼"
            value={password}
            onChange={e => { setPassword(e.target.value); setErr(''); }}
            onKeyDown={e => e.key === 'Enter' && submit()} />
          <div className="login-err">{err}</div>
          <button className="login-btn" onClick={submit} disabled={loading}>
            {loading ? '驗證中…' : '確認'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Login modal (JWT, inactive when USE_JWT_AUTH=false) */
function LoginModal({ onClose, onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  async function submit() {
    if (!username || !password) return;
    setLoading(true); setErr('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      if (!res.ok) { setErr('帳號或密碼錯誤'); setLoading(false); return; }
      const data = await res.json();
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('jwt_user', JSON.stringify(data.user));
      onAuth(data.user.role, data.user);
      onClose();
    } catch { setErr('連線失敗'); }
    setLoading(false);
  }

  return (
    <div className="pin-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="pin-box">
        <div className="pin-title">登入</div>
        <input className="pin-input" type="text" placeholder="帳號" value={username}
          onChange={e => { setUsername(e.target.value); setErr(''); }}
          style={{marginBottom:8}} />
        <input className="pin-input" type="password" placeholder="密碼" value={password}
          onChange={e => { setPassword(e.target.value); setErr(''); }}
          onKeyDown={e => e.key === 'Enter' && submit()} />
        <div className="pin-err">{err}</div>
        <button className="pin-btn" onClick={submit} disabled={loading}>
          {loading ? '登入中…' : '登入'}
        </button>
        <button className="pin-cancel" onClick={onClose}>取消</button>
      </div>
    </div>
  );
}

      <div style={{padding:'8px 16px',borderTop:'1px solid var(--border)'}}>
