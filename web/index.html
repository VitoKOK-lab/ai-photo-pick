<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Tahir Zainab Selection</title>
  <style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #f4f4f4;
  --surface: #ffffff;
  --s2:      #f9f9f9;
  --s3:      #efefef;
  --text:    #1a1a1a;
  --text2:   #777;
  --text3:   #bbb;
  --border:  #e8e8e8;
  --accent:  #1a1a1a;
  --gold:    #b8935a;
  --r:       10px;
  --nav-h:   52px;
  --tab-h:   58px;
  --side-w:  220px;
  --shadow:  0 1px 4px rgba(0,0,0,.08);
  --shadow2: 0 4px 16px rgba(0,0,0,.12);
}

/* ── Base ───────────────────────────────────────────────── */
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }

/* ── Nav ────────────────────────────────────────────────── */
.nav {
  height: var(--nav-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  box-shadow: var(--shadow);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  transition: transform .4s cubic-bezier(.4,0,.2,1);
}
.browse-hdr { position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 150; background: var(--surface); transition: transform .4s cubic-bezier(.4,0,.2,1); }
.nav-logo { font-size: 13px; font-weight: 200; letter-spacing: 5px; color: var(--gold); flex: 1; text-transform: uppercase; }
.nav-tabs { display: none; gap: 0; }
.nav-tab {
  position: relative;
  padding: 0 20px;
  height: 100%;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  white-space: nowrap;
}
.nav-tab:first-child { border-left: 1px solid var(--border); }
.nav-tab.on { color: var(--accent); font-weight: 700; }
.badge { background: var(--gold); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

/* ── Tab bar (mobile) ───────────────────────────────────── */
.tab-bar { background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
.tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; background: none; border: none; border-right: 1px solid var(--border); color: var(--text2); font-size: 13px; font-weight: 500; padding: 14px 4px; cursor: pointer; position: relative; }
.tab-btn:last-child { border-right: none; }
.tab-btn.on { color: var(--accent); font-weight: 700; }
.tab-badge { background: var(--gold); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; line-height: 1.4; }

/* ── Content ────────────────────────────────────────────── */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

/* ── Category tabs ───────────────────────────────────────── */
.cat-tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:6px 10px 4px; gap:4px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.cat-tabs::-webkit-scrollbar { display:none; }
.cat-tab { display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; padding:3px 5px; border-radius:10px; cursor:pointer; min-width:48px; flex-shrink:0; touch-action:manipulation; transition:background .2s; }
.cat-tab.on { background:none; }
.cat-tab-img { width:52px; height:52px; border-radius:8px; object-fit:cover; border:none; transition:transform .15s; }
.cat-tab:active .cat-tab-img { transform:scale(.93); }
.cat-tab-thumb { position:relative; width:52px; height:52px; flex-shrink:0; }
.cat-tab-thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; display:block; }
.cat-tab-thumb::after { content:''; position:absolute; inset:0; border-radius:8px; background:rgba(184,147,90,0); transition:background .2s; pointer-events:none; }
.cat-tab.on .cat-tab-thumb::after { background:rgba(184,147,90,.38); }
.cat-tab-all { width:52px; height:52px; border-radius:8px; background:var(--s3); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text2); border:none; }
.cat-tab span { font-size:10px; color:var(--text2); white-space:nowrap; }
.cat-tab.on span { color:var(--gold); font-weight:600; }

/* ── Chips ───────────────────────────────────────────────── */
.chips-bar { display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chips-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: none; border: none; border-right: 1px solid var(--border); font-size: 13px; color: var(--text2); white-space: nowrap; transition: color .15s; flex-shrink: 0; }
.chip.on { color: var(--accent); font-weight: 600; }
.chip-clr { display: inline-flex; align-items: center; padding: 6px 12px; background: none; border: none; font-size: 13px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }

/* ── Body row ───────────────────────────────────────────── */
.body-row { flex: 1; overflow: hidden; display: flex; min-height: 0; }

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar { display: none; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 12px 0 32px; }
.sb-clear { margin: 6px 14px 12px; padding: 8px 12px; background: none; border: 1px solid var(--border); border-radius: var(--r); color: var(--text3); font-size: 12px; width: calc(100% - 28px); text-align: left; }
.sb-clear:hover { background: var(--s3); color: var(--text2); }
.sb-sec { border-bottom: 1px solid var(--border); }
.sb-hd { width: 100%; padding: 11px 16px; background: none; border: none; display: flex; align-items: center; justify-content: space-between; text-align: left; }
.sb-hd-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
.sb-hd.has-val .sb-hd-label { color: var(--accent); }
.sb-hd-arrow { font-size: 10px; color: var(--text3); }
.sb-opts { padding: 0 10px 10px; }
.sb-opt { display: block; width: 100%; padding: 8px 8px; background: none; border: none; color: var(--text2); font-size: 13px; text-align: left; border-radius: 6px; }
.sb-opt:hover { background: var(--s3); color: var(--text); }
.sb-opt.on { color: var(--accent); font-weight: 600; }
.sb-opt-clr { display: block; width: 100%; padding: 5px 8px; background: none; border: none; color: var(--text3); font-size: 11px; text-align: left; }

/* ── Main + grid ────────────────────────────────────────── */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 2px; }
.card { background: var(--surface); cursor: pointer; overflow: hidden; position: relative; border-radius: 0; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; transition: transform .15s ease; }
.card:active { transform: scale(.97); }
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fff; transition: opacity .2s; }
.card-fav { position: absolute; top: 7px; right: 7px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); border: none; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--text3); box-shadow: var(--shadow); transition: transform .2s, color .2s; }
.card-fav:active { transform: scale(1.3); }
.card-fav.on { color: var(--gold); }
.card-selected { outline: 3px solid var(--gold); outline-offset: -2px; }
.card-check { position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: var(--shadow); border: 2px solid rgba(255,255,255,.8); }
.card-lbl { padding: 6px 9px 8px; font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sentinel { height: 1px; }

/* ── Grid banner (full-width editorial) ─────────────── */
.grid-banner { grid-column: 1 / -1; position: relative; cursor: pointer; overflow: hidden; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; }
.grid-banner img { width: 100%; aspect-ratio: 16/7; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.25,.46,.45,.94); }
.grid-banner:active img { transform: scale(1.04); }
.grid-banner-lbl { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 16px; background: linear-gradient(transparent, rgba(0,0,0,.42)); color: #fff; font-size: 13px; letter-spacing: 3px; font-weight: 300; text-transform: uppercase; }
.loading-msg { text-align: center; padding: 28px; color: var(--text3); font-size: 13px; }
/* ── Section divider between 去背 / 情境 ─────────────── */
.grid-section-div { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 18px 14px 10px; }
.grid-section-div-line { flex: 1; height: 1px; background: var(--border); }
.grid-section-div-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--text3); white-space: nowrap; }
.empty-msg { text-align: center; padding: 64px 24px; color: var(--text2); font-size: 14px; line-height: 1.9; }

/* ── Filter dropdown ────────────────────────────────────── */
.dd-panel { position: fixed; min-width: 160px; max-width: min(92vw, 260px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow2); z-index: 9999; overflow-y: auto; max-height: min(60vh, 380px); animation: ddIn .15s ease; }
@keyframes ddIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.dd-item { padding: 11px 15px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border); gap: 10px; transition: background .12s; }
.dd-item:last-child { border-bottom: none; }
.dd-item:active, .dd-item:hover { background: var(--s3); }
.dd-item.on { color: var(--accent); font-weight: 600; }
.dd-item.dd-zero { color: var(--text3); cursor: default; pointer-events: none; }
.dd-clr { color: var(--text3); font-size: 12px; }
.dd-cnt { font-size: 12px; color: var(--text3); font-weight: 400; flex-shrink: 0; }

/* ── Detail overlay ─────────────────────────────────────── */
.det-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; display: flex; align-items: flex-end; }
.det-panel { width: 100%; max-height: 80vh; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative; animation: up .25s cubic-bezier(.32,.72,0,1); box-shadow: var(--shadow2); }
.det-handle { width: 36px; height: 4px; background: var(--s3); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
.det-x { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--s3); border: none; font-size: 18px; color: var(--text2); display: flex; align-items: center; justify-content: center; z-index: 1; }
.det-hd-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.det-back { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text); }
.det-hd-title { font-size: 15px; font-weight: 600; flex: 1; }
.det-left { flex-shrink: 0; }
.det-img { width: 100%; aspect-ratio: 1; max-height: none; object-fit: cover; display: block; background: var(--s3); }
.det-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.det-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.det-tags { padding: 12px 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 11px; background: var(--s3); border-radius: 20px; font-size: 12px; color: var(--text2); }
/* Action bar */
.det-actions { display: flex; align-items: center; padding: 10px 16px 18px; border-top: 1px solid var(--border); gap: 8px; flex-shrink: 0; background: var(--surface); }
.det-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 10px; min-width: 48px; transition: background .15s; touch-action: manipulation; }
.det-icon-btn:active { background: var(--s3); }
.det-icon-btn span:first-child { font-size: 20px; line-height: 1; }
.det-icon-btn span:last-child { font-size: 10px; color: var(--text3); font-weight: 500; white-space: nowrap; }
.det-icon-btn.fav-on span:last-child { color: var(--gold); }
.det-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
.det-cta { background: var(--gold); color: #fff; border: none; border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.det-edit-btn { background: var(--s3); color: var(--text2); border: none; border-radius: 10px; padding: 11px 14px; font-size: 16px; cursor: pointer; touch-action: manipulation; }
.db { padding: 13px; border-radius: var(--r); border: none; font-size: 13px; font-weight: 600; touch-action: manipulation; position: relative; z-index: 2; }
.db-fav { background: var(--s3); color: var(--text); }
.db-fav.on { background: #fff0e0; color: var(--gold); border: 1.5px solid var(--gold); }
.db-sim { background: var(--accent); color: #fff; }

/* ── Edit panel ─────────────────────────────────────────── */
.db-edit { background: var(--s3); color: var(--text2); }
.edit-panel { padding: 14px 16px 20px; }
.edit-row { margin-bottom: 12px; }
.edit-label { font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--text3); margin-bottom: 6px; }
.edit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.edit-chip { padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; color: var(--text2); cursor: pointer; }
.edit-chip.on { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.edit-actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
.db-save { background: var(--accent); color: #fff; }
.db-del { background: none; border: 1px solid #e8c4c4; color: #c0392b; font-size: 11px; font-weight: 400; padding: 0; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* similar view */
.sim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; padding: 3px; }
.sim-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--s3); cursor: pointer; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; }

/* ── Dark-bg cleaner ────────────────────────────────────── */
.darkbg-btn { font-size: 11px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text2); cursor: pointer; white-space: nowrap; }
.darkbg-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 400; display: flex; align-items: flex-end; }
.darkbg-panel { width: 100%; max-height: 85vh; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .25s cubic-bezier(.32,.72,0,1); }
.darkbg-hd { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.darkbg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; overflow-y: auto; flex: 1; }
.darkbg-card { position: relative; cursor: pointer; }
.darkbg-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.darkbg-card.exclude::after { content: '✓'; position: absolute; inset: 0; background: rgba(0,200,100,.35); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
.darkbg-footer { padding: 12px 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }

/* ── Login page ─────────────────────────────────────────── */
.login-page { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-brand { font-size: 13px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; font-weight: 200; text-align: center; margin-bottom: 36px; }
.login-card { background: var(--surface); border-radius: var(--r); padding: 24px 20px 20px; width: 100%; max-width: 280px; box-shadow: var(--shadow2); display: flex; flex-direction: column; gap: 14px; }
.login-label { font-size: 13px; color: var(--text2); text-align: center; }
.login-pin-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; box-sizing: border-box; }
.login-pin-input:focus { border-color: var(--gold); }
.login-pin-input.shake { animation: pin-shake .4s ease; }
@keyframes pin-shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)} }
.login-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.login-err { font-size: 12px; color: #e74c3c; text-align: center; min-height: 16px; }
.login-agent-link { display: block; text-align: center; font-size: 12px; color: var(--text3); cursor: pointer; }
.login-agent-link:hover { color: var(--text2); }

/* ── Nav right-side logout ──────────────────────────────── */
.nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-role { font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 0.5px; }
.nav-logout { padding: 6px 14px; border: none; border-radius: var(--r); background: var(--s3); font-size: 13px; color: var(--text2); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.nav-logout:hover { background: var(--border); color: var(--text); }

/* ── Admin PIN modal (kept for agent login) ─────────────── */
.pin-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; display: flex; align-items: center; justify-content: center; }
.pin-box { background: var(--surface); border-radius: 16px; padding: 24px 20px; width: 280px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
.pin-title { font-size: 15px; font-weight: 600; text-align: center; color: var(--text); }
.pin-input { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; width: 100%; box-sizing: border-box; }
.pin-input:focus { border-color: var(--gold); }
.pin-err { font-size: 12px; color: #e74c3c; text-align: center; min-height: 16px; }
.pin-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.pin-cancel { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--text2); cursor: pointer; }
.undo-toast { position: fixed; bottom: calc(var(--tab-h) + 16px); left: 50%; transform: translateX(-50%); z-index: 400; background: #1a1a1a; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.3); animation: fadeUp .3s ease both; }
.undo-btn { background: var(--gold); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

/* ── Upload FAB ─────────────────────────────────────────── */
.upload-fab { position: fixed; bottom: calc(var(--tab-h) + 16px); right: 16px; z-index: 300; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 28px; font-weight: 300; line-height: 1; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.24); display: flex; align-items: center; justify-content: center; transition: transform .15s, box-shadow .15s; }
.upload-fab:active { transform: scale(.92); }
.upload-fab:disabled { opacity: .6; cursor: default; }
.upload-toast { position: fixed; bottom: calc(var(--tab-h) + 78px); right: 14px; z-index: 301; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; animation: fadeUp .3s ease both; pointer-events: none; white-space: pre-line; max-width: 220px; }
.upload-prog { position: fixed; bottom: calc(var(--tab-h) + 78px); right: 14px; z-index: 301; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; animation: fadeUp .3s ease both; pointer-events: none; }

/* ── Staging panel ───────────────────────────────────────── */
.staging-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 0; }
.staging-card { position: relative; border-radius: 10px; overflow: hidden; background: #f0f0f0; aspect-ratio: 1; }
.staging-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.staging-card-del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.staging-empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 14px; }
.staging-actions { display: flex; gap: 10px; padding: 12px 0 4px; }
.staging-ingest-btn { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.staging-ingest-btn:disabled { opacity: .5; cursor: default; }
.staging-status { margin-top: 10px; padding: 10px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
.staging-badge { background: #e05; color: #fff; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 5px; margin-left: 4px; vertical-align: top; }

/* ── Splash ──────────────────────────────────────────────── */
.splash { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: splashOut .7s ease 3.2s forwards; pointer-events: none; overflow: hidden; }
@keyframes splashOut { to { opacity: 0; } }
.spark { position: absolute; color: #B8935A; opacity: 0; font-size: var(--sz,12px); animation: sparkPop var(--dur,.85s) ease-out var(--d,0s) forwards; text-shadow: 0 0 10px rgba(184,147,90,.9), 0 0 20px rgba(255,220,120,.5); }
@keyframes sparkPop { 0% { opacity:0; transform:scale(0) translateY(0); } 30% { opacity:1; transform:scale(1.4) translateY(-5px); } 100% { opacity:0; transform:scale(.5) translateY(-26px); } }
.splash-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: splashIn 1.7s cubic-bezier(.22,.68,0,1.2) 1.3s both; }
.splash-name { font-size: clamp(22px, 6vw, 36px); font-weight: 200; letter-spacing: 8px; color: #1a1a1a; text-transform: uppercase; }
.splash-sel { font-size: clamp(11px, 3vw, 15px); letter-spacing: 6px; color: var(--gold); font-weight: 400; text-transform: uppercase; }
.splash-line { width: 40px; height: 1px; background: var(--gold); }
@keyframes splashIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

/* ── Fav empty ──────────────────────────────────────────── */
.fav-empty { text-align: center; padding: 80px 24px; color: var(--text2); font-size: 14px; line-height: 1.9; }

/* ── Fav bar ────────────────────────────────────────────── */
.fav-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.fav-bar-info { font-size: 12px; color: var(--text3); }
.fav-clr-btn { font-size: 11px; color: #c0392b; background: none; border: 1px solid #f5c6c6; border-radius: 20px; padding: 4px 12px; }

/* ── Desktop ≥ 768px ────────────────────────────────────── */
@media (min-width: 768px) {
  .nav-tabs  { display: flex; }
  .tab-bar   { display: none; }
  .sidebar   { display: none; }
  .chips-bar { display: flex; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }

  .sim-grid { grid-template-columns: repeat(3, 1fr); }
  .det-ovl { align-items: center; justify-content: center; padding: 32px; }
  .det-panel { width: 100%; max-width: 840px; border-radius: 16px; flex-direction: row; max-height: 82vh; animation: pop .2s ease; box-shadow: var(--shadow2); }
  @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
  .det-handle { display: none; }
  .det-left { width: 50%; flex-shrink: 0; }

}
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1600px) { :root { --side-w: 248px; } .grid { grid-template-columns: repeat(5, 1fr); } }

/* ── Pricing Settings Tab ─────────────────────────────── */

/* ── Agent login & management ───────────────────────────── */
.agent-login-tab { margin-top: 12px; }

.heart-beat { animation: heartBeat 0.7s ease forwards; color: #e53935 !important; }
@keyframes streakIn {

.streak-badge {

  animation: streakIn 0.38s cubic-bezier(.34,1.3,.64,1) forwards;

  color:#fff; font-size:12px; font-weight:700; letter-spacing:2px;
  padding:5px 16px; border-radius:20px; white-space:nowrap;
  box-shadow: 0 4px 16px rgba(220,50,50,0.45);
}
@keyframes scorePopKf {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.55); }

<body>
<div id="root"></div>
<script src="/js/vendor/react.min.js"></script>
<script src="/js/vendor/react-dom.min.js"></script>
<script src="/js/vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Config ─────────────────────────────────────────── */
const BANNERS = ['/banners/ｂ1.png','/banners/ｂ2.png','/banners/ｂ3.png','/banners/ｂ4.png','/banners/ｂ5.png','/banners/ｂ6.png','/banners/ｂ7.png','/banners/ｂ8.png','/banners/ｂ9.png','/banners/ｂ10.png'].sort(() => Math.random() - 0.5);

/* ── JWT auth utilities ─────────────────────────────── */
function getJwtToken() { return localStorage.getItem('jwt_token'); }
function getJwtUser()  { try { return JSON.parse(localStorage.getItem('jwt_user') || 'null'); } catch { return null; } }
function clearJwtAuth() { localStorage.removeItem('jwt_token'); localStorage.removeItem('jwt_user'); }
function authHeaders() { const t = getJwtToken(); return t ? { 'Authorization': `Bearer ${t}` } : {}; }

/* Intercept all fetch() calls — automatically attach Bearer token for /api/ routes,
   and fire 'authExpired' event on 401 so App can show the login screen again. */
(function() {
  const _origFetch = window.fetch.bind(window);
  window.fetch = function(url, opts = {}) {
    const token = getJwtToken();
    if (token && typeof url === 'string' && url.startsWith('/api/')) {
      opts = { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) } };
    }
    return _origFetch(url, opts).then(resp => {
      if (resp.status === 401 && typeof url === 'string' && url.startsWith('/api/') && !url.includes('/api/auth/')) {
        clearJwtAuth();
        window.dispatchEvent(new CustomEvent('authExpired'));
      }
      return resp;
    });
  };
})();

async function apiFetch(url, options = {}) { return fetch(url, options); }
const SESSION_ID = (sessionStorage.getItem('sid') || (() => { const s = Math.random().toString(36).slice(2); sessionStorage.setItem('sid', s); return s; })());
async function logEvent(photo_id, event_type, extra = {}) {
  try {
    await fetch('/api/events', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ photo_id, event_type, session_id: SESSION_ID, ...extra }) });
  } catch {}
}
const CATS = ['戒指','墜子','耳釘','手鏈','項鍊','胸針','其他'];
const CFG = {
  gemstone:    { label: '寶石', values: ['鑽石','紅寶石','藍寶石','祖母綠','坦桑石','海藍寶','碧璽','紫水晶','黃水晶','月光石','歐泊','橄欖石','石榴石','珍珠','翡翠','托帕石','尖晶石','其他彩寶','無寶石'] },
  color:       { label: '色系', values: ['紅','粉','黃','綠','藍','紫','白','彩'] },
  metal_color: { label: '金工', values: ['金','銀'] },
  price_band:  { label: '價位', values: ['入門','中階','高階','奢華','頂級'] },
  style:       { label: '鑽飾', values: ['無鑽','簡約','輕奢','奢華'] },
  stone_shape: { label: '形狀', values: ['橢圓形','圓形','水滴形','心形','方形','長方形','馬眼形','枕形','梨形','三角形','花形','不規則','無主石'] },
};

/* ── Fav storage ────────────────────────────────────── */
const loadFavs = () => { try { return JSON.parse(localStorage.getItem('jdb_favs') || '[]'); } catch { return []; } };
const saveFavs = f => localStorage.setItem('jdb_favs', JSON.stringify(f));

/* ── Icons ──────────────────────────────────────────── */
function IcoGrid() {
  return <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
}
function IcoHeart({ fill }) {
  return <svg viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
}

const CAT_IMGS = {
  '戒指': '/banners/戒指.png', '手鏈': '/banners/手鏈.png',
  '項鍊': '/banners/項鍊.png', '耳釘': '/banners/耳釘.png', '胸針': '/banners/胸針.png', '其他': '/banners/其他.png',
};

/* ── Category tabs ──────────────────────────────────── */
function CategoryTabs({ active, onSelect }) {
  return (
    <div className="cat-tabs">
      {CATS.map(cat => (
        <button key={cat} className={'cat-tab' + (active === cat ? ' on' : '')}
          onClick={() => onSelect(cat)}>
          <div className="cat-tab-thumb">
            {CAT_IMGS[cat]
              ? <img src={CAT_IMGS[cat]} alt="" loading="lazy" />
              : <div className="cat-tab-all" style={{fontSize:13,width:'100%',height:'100%',borderRadius:8}}>{cat}</div>
            }
          </div>
          <span>{cat}</span>
        </button>
      ))}
    </div>
  );
}

/* ── Filter dropdown ────────────────────────────────── */
function FilterDropdown({ field, cur, counts, onPick }) {
  const cfg = CFG[field];
  const [open, setOpen] = React.useState(false);
  const [panelStyle, setPanelStyle] = React.useState({});
  const btnRef = React.useRef(null);
  const panelRef = React.useRef(null);

  const toggle = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - 168);
      setPanelStyle({ top: r.bottom + 4, left: Math.max(4, left) });
    }
    setOpen(p => !p);
  };

  React.useEffect(() => {
    if (!open) return;
    const h = e => {
      if (btnRef.current?.contains(e.target)) return;
      if (panelRef.current?.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener('mousedown', h);
    document.addEventListener('touchstart', h);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('touchstart', h); };
  }, [open]);

  const panel = open && ReactDOM.createPortal(
    <div ref={panelRef} className="dd-panel" style={panelStyle}>
      {cur && <div className="dd-item dd-clr" onClick={() => { onPick(null); setOpen(false); }}>清除（全部）</div>}
      {cfg.values.map(v => {
        const cnt = counts?.[v] ?? null;
        const zero = cnt !== null && cnt === 0;
        return (
          <div key={v} className={'dd-item' + (cur === v ? ' on' : '') + (zero ? ' dd-zero' : '')}
            onClick={() => { if (!zero) { onPick(v === cur ? null : v); setOpen(false); } }}>
            <span>{v}{cur === v ? ' ✓' : ''}</span>
            {cnt != null && <span className="dd-cnt">{cnt}</span>}
          </div>
        );
      })}
    </div>,

  return (

/* ── Similar infinite grid ──────────────────────────── */
function SimilarInfiniteGrid({ items, onSelectPhoto, setView }) {
  const [displayed, setDisplayed] = React.useState(() => items.map((p, i) => ({...p, _key: i})));
  const [counter, setCounter]     = React.useState(items.length);
  const sentinelRef = React.useRef(null);

  React.useEffect(() => {
    const sentinel = sentinelRef.current;
    if (!sentinel || items.length === 0) return;
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        const shuffled = [...items].sort(() => Math.random() - 0.5);
        setDisplayed(prev => {
          const base = prev.length;
          return [...prev, ...shuffled.map((p, i) => ({...p, _key: base + i + Math.random()}))];
        });
      }
    }, { threshold: 0.1 });
    observer.observe(sentinel);
    return () => observer.disconnect();
  }, [items]);

  return (
    <div className="sim-grid">
      {displayed.map((p, i) => (
        <img key={p._key} src={p.thumb_url} alt="" loading="lazy"
          style={{animationDelay:`${(i % 9) * 0.19}s`}}
          onClick={() => { onSelectPhoto(p); setView('detail'); }} />
      ))}
      <div ref={sentinelRef} style={{gridColumn:'1/-1', height:60}} />
    </div>
  );
}

/* ── Zoom image (button +/−) ────────────────────────── */
function PinchImage({ src, className }) {
  const containerRef = useRef(null);
  const imgRef       = useRef(null);
  const [scale, setScale] = useState(1);
  const scaleRef = useRef(1);
  const offset   = useRef({ tx:0, ty:0 });
  const drag     = useRef({ on:false, x0:0, y0:0, tx0:0, ty0:0 });

  function applyTransform(s, animate) {
    const img = imgRef.current; if (!img) return;
    const o = offset.current;
    img.style.transition = animate ? 'transform .2s ease' : 'none';
    img.style.transform  = `scale(${s}) translate(${o.tx}px,${o.ty}px)`;
  }

  function zoom(delta) {
    const s = Math.min(4, Math.max(1, scaleRef.current + delta));
    if (s <= 1) offset.current = { tx:0, ty:0 };
    scaleRef.current = s;
    setScale(s);
    applyTransform(s, true);
  }

  useEffect(() => {
    const el = containerRef.current; if (!el) return;
    function client(e) { return e.touches ? { x:e.touches[0].clientX, y:e.touches[0].clientY } : { x:e.clientX, y:e.clientY }; }
    function startDrag(e) {
      if (scaleRef.current <= 1) return;
      if (e.touches && e.touches.length !== 1) return;
      const c = client(e);
      drag.current = { on:true, x0:c.x, y0:c.y, tx0:offset.current.tx, ty0:offset.current.ty };
    }
    function moveDrag(e) {
      if (!drag.current.on) return;
      if (e.touches && e.touches.length !== 1) return;
      e.preventDefault();
      const c = client(e); const s = scaleRef.current;
      offset.current.tx = drag.current.tx0 + (c.x - drag.current.x0) / s;
      offset.current.ty = drag.current.ty0 + (c.y - drag.current.y0) / s;
      applyTransform(s, false);
    }
    function endDrag() { drag.current.on = false; }

    el.addEventListener('touchstart', startDrag, { passive: true });
    el.addEventListener('touchmove',  moveDrag,  { passive: false });
    el.addEventListener('touchend',   endDrag,   { passive: true });
    el.addEventListener('mousedown',  startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup',   endDrag);
    return () => {
      el.removeEventListener('touchstart', startDrag);
      el.removeEventListener('touchmove',  moveDrag);
      el.removeEventListener('touchend',   endDrag);
      el.removeEventListener('mousedown',  startDrag);
      window.removeEventListener('mousemove', moveDrag);
      window.removeEventListener('mouseup',   endDrag);
    };
  }, [src]);

  const btnStyle = (disabled) => ({
    width:32, height:32, borderRadius:8, border:'none',
    background:'rgba(0,0,0,.5)', color:'#fff', fontSize:20, lineHeight:1,
    cursor: disabled ? 'default' : 'pointer', display:'flex', alignItems:'center',
    justifyContent:'center', opacity: disabled ? 0.35 : 1, flexShrink:0,
  });

  return (
    <div ref={containerRef} className={className}
      style={{overflow:'hidden', position:'relative', touchAction: scale > 1 ? 'none' : 'auto'}}>
      <img ref={imgRef} src={src} alt="" loading="lazy"
        style={{width:'100%',height:'100%',objectFit:'cover',display:'block',
                transformOrigin:'center',userSelect:'none',WebkitUserSelect:'none',
                cursor: scale > 1 ? 'grab' : 'default'}}
        draggable={false} />
      <div style={{position:'absolute',bottom:8,right:8,display:'flex',gap:4,zIndex:5}}>
        <button style={btnStyle(scale<=1)} onClick={() => zoom(-0.5)} disabled={scale<=1}>－</button>
        <button style={btnStyle(scale>=4)} onClick={() => zoom( 0.5)} disabled={scale>=4}>＋</button>
      </div>
    </div>
  );
}

  const [view,    setView]    = useState('detail'); // 'detail' | 'similar' | 'edit'

/* ── Photo grid ─────────────────────────────────────── */
function PhotoGrid({ isFav, toggleFav, filters, role, batchMode, selectedIds, onToggleSelect }) {
  const [photos,     setPhotos]     = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [detail,     setDetail]     = useState(null);
  const [pendingDel, setPendingDel] = useState(null); // {id, photo, timer}
  const isAdmin = role === 'admin';
  const isStaff = role === 'admin' || role === 'editor';

  const loadingRef  = useRef(false);
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const filtersRef  = useRef({});
  const seedRef     = useRef(Math.random());
  const sentinelRef = useRef(null);
  const fetchRef    = useRef(null);
  const gridWrapRef = useRef(null);

  const doFetch = async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random', _r: seedRef.current });
      Object.entries(filtersRef.current).forEach(([k, v]) => v && qs.set(k, v));
      const res  = await fetch('/api/photos?' + qs);
      const data = await res.json();
      const list = data.photos || [];
      if (pageRef.current === 1) setPhotos(list);
      else setPhotos(prev => [...prev, ...list]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current += 1;
    } catch { hasMoreRef.current = false; }
    finally { loadingRef.current = false; setLoading(false); }
  };
  fetchRef.current = doFetch;

  useEffect(() => {
    const s = sentinelRef.current;
    if (!s) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) fetchRef.current?.(); },
      { rootMargin: '400px' }
    );
    obs.observe(s);
    return () => obs.disconnect();
  }, []);

  useEffect(() => { fetchRef.current?.(); }, []);

  useEffect(() => {
    const el = gridWrapRef.current;
    if (!el) return;
    const nav = document.querySelector('.nav');
    const browseHdr = document.querySelector('.browse-hdr');
    const navH = nav ? nav.offsetHeight : 52;
    const hdrH = browseHdr ? browseHdr.offsetHeight : 0;
    const total = navH + hdrH;
    el.style.paddingTop = total + 'px';
    let lastY = 0;
    const show = () => { if (nav) nav.style.transform=''; if (browseHdr) browseHdr.style.transform=''; };
    const hide = () => { if (nav) nav.style.transform=`translateY(-${total}px)`; if (browseHdr) browseHdr.style.transform=`translateY(-${total}px)`; };
    const onScroll = () => {
      const y = el.scrollTop;
      if (y < total) show();
      else if (y > lastY) hide();
      else show();
      lastY = y;
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => { el.removeEventListener('scroll', onScroll); show(); };
  }, []);

  useEffect(() => {
    filtersRef.current = filters || {};
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    seedRef.current    = Math.random();
    setPhotos([]);
    if (gridWrapRef.current) gridWrapRef.current.scrollTop = 0;
    fetchRef.current?.();
  }, [JSON.stringify(filters)]);

  return (
    <>
      <div className="grid-wrap" ref={gridWrapRef}>
        <div className="grid">
          {photos.reduce((acc, p, i) => {
            if (i > 0 && i % 36 === 0) {
              const bIdx = Math.floor(i / 36) - 1;
              acc.push(
                <div key={`banner-${i}`} className="grid-banner">
                  <img src={BANNERS[bIdx % BANNERS.length]} alt="" loading="lazy" />
                  <div className="grid-banner-lbl">Tahir Zainab Selection</div>
                </div>
              );
            }
            const isSel = batchMode && selectedIds?.has(p.id);
            acc.push(
              <div key={p.id} className={'card' + (isSel ? ' card-selected' : '')}
                style={{animationDelay:`${(i % 9) * 0.19}s`}}
                onClick={() => batchMode ? onToggleSelect(p.id) : setDetail(p)}>
                <img src={p.thumb_url} alt="" loading="lazy" />
                {batchMode
                  ? <div className="card-check">{isSel ? '✓' : ''}</div>
                  : <button className={'card-fav' + (isFav(p.id) ? ' on' : '')}
                      onClick={e => { e.stopPropagation(); toggleFav(p); }}>
                      {isFav(p.id) ? '♥' : '♡'}
                    </button>
                }
                <div className="card-lbl">
                  {[p.category, p.style].filter(v => v && v !== '未定').join(' · ')}
                </div>
              </div>
            );
            return acc;
          }, [])}
        </div>
        {loading && <div className="loading-msg">載入中…</div>}
        {!loading && photos.length === 0 && !hasMoreRef.current && (
          <div className="empty-msg">沒有符合條件的照片<br/><span style={{fontSize:12,color:'var(--text3)'}}>試著調整篩選條件</span></div>
        )}
        <div ref={sentinelRef} className="sentinel" />
      </div>

      {detail && (
        <PhotoDetail
          photo={detail}
          onClose={() => setDetail(null)}
          isFav={isFav}
          toggleFav={toggleFav}
          onSelectPhoto={p => setDetail(p)}
          role={role}
          onDeleted={id => {
            if (isAdmin) {
              // Admin: immediate delete
              setPhotos(prev => prev.filter(p => p.id !== id));
              setDetail(null);
            } else {
              // Staff: delayed delete with undo
              const photo = photos.find(p => p.id === id);
              setPhotos(prev => prev.filter(p => p.id !== id));
              setDetail(null);
              const timer = setTimeout(() => {
                fetch('/api/photos/' + id, { method: 'DELETE' });
                setPendingDel(null);
              }, 5000);
              setPendingDel({ id, photo, timer });
            }
          }}
          onUpdated={updated => { setPhotos(prev => prev.map(p => p.id === updated.id ? {...p, ...updated} : p)); setDetail(updated); }}
        />
      )}
      {pendingDel && (
        <div className="undo-toast">
          <span>已移除照片</span>
          <button className="undo-btn" onClick={() => {
            clearTimeout(pendingDel.timer);
            setPhotos(prev => [pendingDel.photo, ...prev]);
            setPendingDel(null);
          }}>復原</button>
        </div>
      )}
    </>
  );
}

/* ── SwipeMode ───────────────────────────────────────── */
function SwipeMode({ initFilters, onClose, isFav, toggleFav, role }) {
  const [photos,      setPhotos]      = useState([]);
  const [idx,         setIdx]         = useState(0);
  const [loading,     setLoading]     = useState(true);
  const [done,        setDone]        = useState(false);
  const [showTutorial,setShowTutorial]= useState(() => !localStorage.getItem('swipeTutSeen'));
  const [favCount,    setFavCount]    = useState(0);
  const [streak,      setStreak]      = useState(0);
  const [histLen,     setHistLen]     = useState(0);   // 可復原步數

  const histRef     = useRef([]);   // [{i, faved}]
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const loadingRef  = useRef(false);
  const cardRef     = useRef(null);
  const lblRef      = useRef(null);
  const heartRef    = useRef(null);
  const heartNumRef = useRef(null);
  const lastDirRef  = useRef(null);
  const dragRef     = useRef({ active:false, x0:0, y0:0, dx:0, dy:0 });

  /* tutorial refs */
  const tutCardRef  = useRef(null);
  const tutLblRef   = useRef(null);
  const tutHeartRef = useRef(null);

  const loadMore = React.useCallback(async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    const qs = new URLSearchParams({ page: pageRef.current, sort: 'random' });
    Object.entries(initFilters || {}).forEach(([k,v]) => v && qs.set(k, v));
    try {
      const r = await fetch('/api/photos?' + qs);
      const data = await r.json();
      setPhotos(prev => [...prev, ...(data.photos || [])]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current++;
    } catch {}
    loadingRef.current = false;
    setLoading(false);
  }, []);

  useEffect(() => { loadMore(); }, []);

  /* ── tutorial: cinematic human-throw demo ── */
  useEffect(() => {
    if (!showTutorial) return;
    const card  = tutCardRef.current;
    const lbl   = tutLblRef.current;
    const heart = tutHeartRef.current;
    if (!card) return;

    const SHADOW_BASE = '0 14px 40px rgba(80,60,30,.22)';
    const setLbl = (text, color, rot = '0deg') => {
      if (!lbl) return;
      lbl.textContent = text; lbl.style.color = color; lbl.style.borderColor = color;
      lbl.style.transform = `translateX(-50%) translateY(-50%) rotate(${rot})`;
      lbl.style.opacity = '1';
    };
    const clearLbl = () => { if (lbl) lbl.style.opacity = '0'; };
    const spring   = () => {
      card.style.transition = 'transform .5s cubic-bezier(.34,1.3,.64,1), box-shadow .3s';
      card.style.transform  = ''; card.style.boxShadow = SHADOW_BASE;
    };

    const timers = [
      /* LEFT */
      setTimeout(() => { card.style.transition='transform .22s ease-out'; card.style.transform='translateX(-20px) rotate(-2.5deg)'; }, 450),
      setTimeout(() => {
        card.style.transition = 'transform .54s cubic-bezier(.1,.3,.55,1), box-shadow .18s';
        card.style.transform  = 'translateX(-92px) rotate(-20deg)';
        card.style.boxShadow  = `0 0 28px rgba(130,140,155,.55), ${SHADOW_BASE}`;
        setLbl('略過', '#8a93a0', '-12deg');
      }, 680),
      setTimeout(() => { clearLbl(); spring(); }, 1530),

      /* RIGHT */
      setTimeout(() => { card.style.transition='transform .22s ease-out'; card.style.transform='translateX(20px) rotate(2.5deg)'; }, 2200),
      setTimeout(() => {
        card.style.transition = 'transform .54s cubic-bezier(.1,.3,.55,1), box-shadow .18s';
        card.style.transform  = 'translateX(92px) rotate(20deg)';
        card.style.boxShadow  = `0 0 34px rgba(201,168,108,.7), ${SHADOW_BASE}`;
        setLbl('✦ 更多同款', '#b8935a', '12deg');
      }, 2430),
      setTimeout(() => { clearLbl(); spring(); }, 3290),

      /* DOWN – lift → throw demo → stop at 65px (pause), heart glows → spring back */
      setTimeout(() => {
        card.style.transition = 'transform .11s ease-out';
        card.style.transform  = 'translateY(-10px) scale(1.03) rotate(-3deg)';
        card.style.boxShadow  = `0 0 28px rgba(224,80,112,.5), ${SHADOW_BASE}`;
        setLbl('♥ 收藏', '#e05070', '0deg');
      }, 3900),
      setTimeout(() => {
        card.style.transition = 'transform .45s cubic-bezier(.4,0,.6,.9), box-shadow .2s';
        card.style.transform  = 'translateY(65px) rotate(8deg)';
      }, 4015),
      setTimeout(() => {
        if (heart) { heart.classList.remove('heart-beat'); void heart.offsetWidth; heart.classList.add('heart-beat'); }
      }, 4530),
      setTimeout(() => { clearLbl(); spring(); }, 5060),
      setTimeout(() => { localStorage.setItem('swipeTutSeen', '1'); setShowTutorial(false); }, 5800),
    ];
    return () => timers.forEach(clearTimeout);
  }, [showTutorial]);

  useEffect(() => {
    if (idx >= photos.length - 3 && hasMoreRef.current) loadMore();
    if (idx >= photos.length && !hasMoreRef.current && photos.length > 0) setDone(true);
  }, [idx, photos.length]);

  const current = photos[idx];

  const getDir = (dx, dy, thr = 50) => {
    if (dy > thr && Math.abs(dy) > Math.abs(dx) * 1.2) return 'down';
    if (dx > thr) return 'right';
    if (dx < -thr) return 'left';
    return null;
  };

  /* DOM particle burst – no React state, zero re-renders */
  const spawnEl = (text, css, life = 1100) => {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = css;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), life);
  };
  const spawnRing = (x, y, color) => {
    spawnEl('', `position:fixed;left:${x}px;top:${y}px;width:90px;height:90px;border-radius:50%;`
      + `border:2.5px solid ${color};pointer-events:none;z-index:919;`
      + `animation:ringPulse .55s ease-out forwards;`, 650);
  };
  const burstParticles = (dir) => {
    const card = cardRef.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    if (dir === 'right') {
      /* 金色星火：偏右上炸開、發光旋轉 */
      spawnRing(cx, cy, 'rgba(201,168,108,.75)');
      for (let i = 0; i < 16; i++) {
        const ang  = -100 + Math.random() * 160;
        const dist = 70 + Math.random() * 140;
        const tx   = Math.cos(ang * Math.PI/180) * dist + 45;
        const ty   = Math.sin(ang * Math.PI/180) * dist - 25;
        const ch   = i % 3 === 0 ? '✦' : (i % 3 === 1 ? '✧' : '·');
        const size = ch === '·' ? 8 : 12 + Math.random() * 12;
        spawnEl(ch, `position:fixed;left:${cx}px;top:${cy}px;color:#c9a86c;`
          + `font-size:${size}px;font-weight:900;pointer-events:none;z-index:920;margin:-8px 0 0 -4px;`
          + `text-shadow:0 0 8px rgba(201,168,108,.95), 0 0 20px rgba(255,215,140,.65);`
          + `--tx:${tx}px;--ty:${ty}px;animation:sparkFly .82s cubic-bezier(.2,.4,.4,1) ${i*13}ms forwards;`);
      }
    } else if (dir === 'left') {
      /* 冷灰塵埃：往左下墜落消散（與 like 相反：冷色、下沉、無光） */
      for (let i = 0; i < 12; i++) {
        const tx = -(20 + Math.random() * 130);
        const ty = 50 + Math.random() * 130;
        const size = 5 + Math.random() * 6;
        spawnEl('·', `position:fixed;left:${cx}px;top:${cy}px;color:#9aa2ad;`
          + `font-size:${size}px;font-weight:900;pointer-events:none;z-index:920;margin:-8px 0 0 -4px;`
          + `--tx:${tx}px;--ty:${ty}px;animation:dustFall .68s cubic-bezier(.45,.05,.9,.6) ${i*18}ms forwards;`, 850);
      }
    } else if (dir === 'down') {
      /* 愛心煙火：從收藏鈕炸出 + 震波環 */
      const h = heartRef.current;
      const hr = h ? h.getBoundingClientRect() : null;
      const hx = hr ? hr.left + hr.width / 2 : cx;
      const hy = hr ? hr.top + hr.height / 2 : cy;
      setTimeout(() => {
        spawnRing(hx, hy, 'rgba(224,80,112,.75)');
        for (let i = 0; i < 12; i++) {
          const ang  = 180 + Math.random() * 180;   // 往上半圓
          const dist = 50 + Math.random() * 100;
          const tx   = Math.cos(ang * Math.PI/180) * dist;
          const ty   = Math.sin(ang * Math.PI/180) * dist - 20;
          const ch   = i % 2 === 0 ? '♥' : '·';
          spawnEl(ch, `position:fixed;left:${hx}px;top:${hy}px;color:#e05070;`
            + `font-size:${ch==='·'?7:11+Math.random()*9}px;font-weight:900;pointer-events:none;z-index:920;margin:-8px 0 0 -4px;`
            + `text-shadow:0 0 8px rgba(224,80,112,.8);`
            + `--tx:${tx}px;--ty:${ty}px;animation:sparkFly .75s cubic-bezier(.2,.4,.4,1) ${i*15}ms forwards;`);
        }
      }, 360);   // 等卡片落進收藏鈕
    }
  };

  /* single centered label + box-shadow glow */
  const GLOW_BASE = '0 18px 44px rgba(80,60,30,.18), 0 4px 12px rgba(80,60,30,.10)';
  const showLabel = dir => {
    const lbl  = lblRef.current;
    const card = cardRef.current;
    if (card) {
      if (!dir) { card.style.boxShadow = GLOW_BASE; }
      else {
        const g = { left:'rgba(130,140,155,.55)', right:'rgba(201,168,108,.75)', down:'rgba(224,80,112,.55)' };
        card.style.boxShadow = `0 0 34px ${g[dir]}, ${GLOW_BASE}`;
      }
    }
    if (!lbl) return;
    if (!dir) { lbl.style.opacity = '0'; return; }
    const C = { left:['略過','#8a93a0','-13deg'], right:['✦ 更多同款','#b8935a','13deg'], down:['♥ 收藏','#e05070','0deg'] }[dir];
    lbl.textContent = C[0]; lbl.style.color = C[1]; lbl.style.borderColor = C[1];
    lbl.style.transform = `translateX(-50%) translateY(-50%) rotate(${C[2]})`;
    lbl.style.opacity = '1';
  };

  /* two-phase physics throw */
  const advance = dir => {
    const card = cardRef.current;
    showLabel(null);
    if (!card) { setIdx(i => i+1); return; }

    if (dir === 'down') {
      /* Calculate drop target: card center → heart box center */
      const cardRect  = card.getBoundingClientRect();
      const heartEl   = heartRef.current;
      const heartRect = heartEl ? heartEl.getBoundingClientRect() : null;
      const cardCx = cardRect.left + cardRect.width  / 2;
      const cardCy = cardRect.top  + cardRect.height / 2;
      const tx = heartRect ? (heartRect.left + heartRect.width  / 2) - cardCx : 0;
      const ty = heartRect ? (heartRect.top  + heartRect.height / 2) - cardCy : window.innerHeight * 0.45;

      /* Single fluid motion: 後仰縮小 + 直落收藏鈕（像掉進投幣口） */
      card.style.transition = 'transform .48s cubic-bezier(.5,0,.8,.6), opacity .38s ease-in .1s';
      card.style.transform  = `perspective(900px) translate(${tx}px,${ty}px) scale(0.06) rotateX(42deg)`;
      card.style.opacity    = '0';

      /* Heart glows when card arrives */
      setTimeout(() => {
        const h = heartRef.current;
        if (h) { h.classList.remove('heart-beat'); void h.offsetWidth; h.classList.add('heart-beat'); }
        setFavCount(n => n + 1);
        setTimeout(() => {
          const num = heartNumRef.current;
          if (num) { num.classList.remove('score-pop'); void num.offsetWidth; num.classList.add('score-pop'); }
        }, 50);
      }, 380);
      setTimeout(() => { card.style.cssText = ''; setIdx(i => i+1); }, 540);
    } else {
      /* like：亮金翻飛出去｜略過：褪色灰暗、下墜翻出（相反特效） */
      const isR  = dir === 'right';
      card.style.transition = 'transform .42s cubic-bezier(.15,.3,.65,1), filter .3s ease';
      card.style.transform  = isR
        ? `perspective(900px) translate(118vw,-30px) rotate(26deg) rotateY(38deg)`
        : `perspective(900px) translate(-118vw,60px) rotate(-30deg) rotateY(-38deg)`;
      card.style.filter = isR ? 'brightness(1.1) saturate(1.2)' : 'grayscale(.95) brightness(.88)';
      setTimeout(() => { card.style.cssText = ''; setIdx(i => i+1); }, 420);
    }
    burstParticles(dir);
    /* streak tracking */
    if (dir === 'down') {
      setStreak(s => lastDirRef.current === 'down' ? s + 1 : 1);
    } else {
      setStreak(0);
    }
    lastDirRef.current = dir;
  };

  /* ── 三個動作：手勢與底部按鈕共用 ── */
  const pushHist = (faved) => { histRef.current.push({ i: idx, faved: !!faved }); setHistLen(histRef.current.length); };

  const doSkip = () => {
    if (!current) return;
    pushHist(false);
    advance('left');
  };
  const doFav = () => {
    if (!current) return;
    pushHist(true);
    toggleFav(current);
    advance('down');
  };
  const doLike = () => {
    if (!current) return;
    pushHist(false);
    advance('right');
    fetch(`/api/photos/${current.id}/similar?limit=6`).then(r=>r.json()).then(similars => {
      if (Array.isArray(similars) && similars.length > 0) {
        setPhotos(prev => {
          const ci = idx + 1;
          return [...prev.slice(0,ci), ...similars.filter(s=>s.id!==current.id), ...prev.slice(ci)];
        });
      }
    }).catch(()=>{});
  };
  const undo = () => {
    const last = histRef.current.pop();
    if (!last) return;
    setHistLen(histRef.current.length);
    const photo = photos[last.i];
    if (last.faved && photo) {
      toggleFav(photo);            // 取消剛剛的收藏
      setFavCount(n => Math.max(0, n - 1));
    }
    setStreak(0);
    lastDirRef.current = null;
    setDone(false);
    setIdx(last.i);
  };

  const dismissTutorial = () => { localStorage.setItem('swipeTutSeen', '1'); setShowTutorial(false); };

  const onTouchStart = e => {
    const t = e.touches[0];
    dragRef.current = { active:true, x0:t.clientX, y0:t.clientY, dx:0, dy:0 };
    if (cardRef.current) cardRef.current.style.transition = 'none';
  };
  const onTouchMove = e => {
    if (!dragRef.current.active) return;
    const t = e.touches[0];
    const dx = t.clientX - dragRef.current.x0;
    const dy = t.clientY - dragRef.current.y0;
    dragRef.current.dx = dx; dragRef.current.dy = dy;
    if (cardRef.current) {
      /* amplify downward pull so it feels like throwing, not pressing */
      const visualDy = dy > 0 ? dy * 1.5 : dy;
      const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
      /* 3D 傾斜：左右拖有 Y 軸翻轉、下拉有 X 軸後仰 */
      cardRef.current.style.transform =
        `perspective(900px) translate(${dx}px,${visualDy}px) rotate(${dx*0.055}deg)`
        + ` rotateY(${clamp(dx*0.07, 16)}deg) rotateX(${clamp(-dy*0.05, 14)}deg)`;
    }
    showLabel(getDir(dx, dy, 40));
  };
  const onTouchEnd = () => {
    if (!dragRef.current.active) return;
    dragRef.current.active = false;
    showLabel(null);
    const { dx, dy } = dragRef.current;
    const dir = getDir(dx, dy, 80);
    if (dir === 'down') {
      doFav();
    } else if (dir === 'right') {
      doLike();
    } else if (dir === 'left') {
      doSkip();
    } else {
      if (cardRef.current) {
        cardRef.current.style.transition = 'transform .38s cubic-bezier(.34,1.3,.64,1), box-shadow .25s';
        cardRef.current.style.transform  = '';
        cardRef.current.style.boxShadow  = GLOW_BASE;
        setTimeout(() => { if (cardRef.current) cardRef.current.style.transition=''; }, 400);
      }
    }
  };

  /* ── RENDER ── */
  const BG = 'radial-gradient(ellipse at 50% 12%, #fffdf8 0%, #f1ebe0 100%)';

  return (
    <div style={{position:'fixed',inset:0,zIndex:800,background:BG,display:'flex',flexDirection:'column',touchAction:'none'}}>

      {/* ── Header ── */}
      <div style={{display:'flex',alignItems:'center',padding:'11px 16px',
        background:'rgba(255,255,255,.82)',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',
        borderBottom:'1px solid rgba(184,147,90,.22)',flexShrink:0}}>
        <button onClick={onClose} style={{border:'none',background:'none',fontSize:12,fontWeight:600,cursor:'pointer',
          padding:'4px 10px 4px 0',color:'#a07f4d',whiteSpace:'nowrap',letterSpacing:.5}}>
          ← 一般模式
        </button>
        <span style={{flex:1,textAlign:'center',fontWeight:700,fontSize:14,color:'#8a6a3a',letterSpacing:3}}>
          {current?.category || '探索'}
        </span>
        {/* Favorites counter */}
        <div style={{display:'flex',alignItems:'center',gap:5,minWidth:52,justifyContent:'flex-end'}}>
          <span ref={heartNumRef} style={{fontSize:15,fontWeight:700,color:favCount>0?'#a07f4d':'rgba(0,0,0,.15)',minWidth:16,textAlign:'right'}}>
            {favCount > 0 ? favCount : ''}
          </span>
          <span style={{fontSize:16,color:favCount>0?'#e05070':'rgba(0,0,0,.15)',transition:'color .4s'}}>♥</span>
        </div>
        <button onClick={() => setShowTutorial(true)} style={{background:'none',cursor:'pointer',
          marginLeft:10,width:22,height:22,borderRadius:'50%',border:'1px solid rgba(184,147,90,.45)',
          color:'#a07f4d',fontSize:12,lineHeight:1,padding:0,flexShrink:0}}>?</button>
      </div>

      {/* ── 進度條 ── */}
      <div style={{height:2,background:'rgba(0,0,0,.06)',flexShrink:0}}>
        <div style={{height:'100%',transition:'width .35s ease',
          width: photos.length ? Math.min(100, (idx / photos.length) * 100) + '%' : '0%',
          background:'linear-gradient(90deg, rgba(138,106,58,.8), #c9a86c)'}} />
      </div>

      {/* ── Card area ── */}
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
        position:'relative',overflow:'visible',padding:'14px 16px 0'}}>

        {/* streak badge */}
        {streak >= 2 && (
          <div className="streak-badge">{streak} 連藏 🔥</div>
        )}

        {loading && !current && (
          <div style={{color:'#a07f4d',fontSize:14,letterSpacing:2}}>載入中…</div>
        )}
        {done && (
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:44,marginBottom:12,color:'#c9a86c',filter:'drop-shadow(0 0 12px rgba(184,147,90,.5))'}}>✦</div>
            <div style={{fontSize:15,color:'#8a6a3a',letterSpacing:2}}>探索完畢</div>
            <div style={{fontSize:13,color:'rgba(0,0,0,.4)',marginTop:6}}>共收藏 {favCount} 件</div>
            <button onClick={onClose} style={{marginTop:22,padding:'10px 30px',borderRadius:20,
              border:'1px solid rgba(184,147,90,.5)',background:'rgba(184,147,90,.08)',
              color:'#8a6a3a',fontSize:14,cursor:'pointer',letterSpacing:1}}>
              返回
            </button>
          </div>
        )}
        {current && !done && (
          <div style={{position:'relative',width:'100%',maxWidth:420}}>
            {/* 牌堆：三張卡同一個 keyed 列表 → 換卡時 React 重用節點，
                後面那張平滑升到最前，圖片不重載、不閃爍 */}
            {[2,1,0].map(off => {
              const p = photos[idx + off];
              if (!p) return null;
              const isTop = off === 0;
              return (
                <div key={p.id}
                  ref={isTop ? cardRef : null}
                  onTouchStart={isTop ? onTouchStart : undefined}
                  onTouchMove={isTop ? onTouchMove : undefined}
                  onTouchEnd={isTop ? onTouchEnd : undefined}
                  style={{
                    position: isTop ? 'relative' : 'absolute',
                    ...(isTop ? {} : { inset: 0 }),
                    width:'100%', zIndex: 3 - off,
                    transform: isTop ? '' : `translateY(${off*13}px) scale(${1 - off*0.05})`,
                    transition:'transform .32s cubic-bezier(.34,1.2,.64,1), box-shadow .32s',
                    background:'#fff', borderRadius:32, overflow:'hidden',
                    border:'1px solid rgba(184,147,90,.28)',
                    boxShadow: isTop
                      ? '0 18px 44px rgba(80,60,30,.18), 0 4px 12px rgba(80,60,30,.10)'
                      : '0 8px 22px rgba(80,60,30,.12)',
                    pointerEvents: isTop ? 'auto' : 'none',
                    userSelect:'none', touchAction:'none',
                  }}>
                  {/* 三張都載 full 圖：升到最前時 src 不變 → 零閃爍 */}
                  <img src={p.thumb_url ? p.thumb_url + '?size=1200' : p.full_url} alt="" draggable={false}
                    style={{width:'100%',aspectRatio:'1/1',objectFit:'contain',background:'#faf8f4',display:'block',pointerEvents:'none'}} />
                  {isTop && <div ref={lblRef} className="swipe-lbl" />}
                  {/* Info strip */}
                  <div style={{padding:'10px 16px 14px',background:'#fff',borderTop:'1px solid rgba(184,147,90,.14)'}}>
                    <div style={{fontSize:13,fontWeight:500,color:'#3a3530',marginBottom:3}}>
                      {p.category || '—'}
                    </div>
                    <div style={{fontSize:11,color:'#b0a898',fontWeight:300,letterSpacing:.5}}>
