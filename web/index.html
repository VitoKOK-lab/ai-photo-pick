/* ── Upload button ─────────────────────────────────── */
function UploadBtn({ onUploaded }) {
  const inputRef  = useRef(null);
  const [busy,    setBusy]    = useState(false);
  const [toast,   setToast]   = useState(null);

  async function handleFiles(e) {
    const files = [...e.target.files];
    if (!files.length) return;
    setBusy(true); setToast(null);
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const ok   = data.uploaded?.length || 0;
      const fail = data.errors?.length   || 0;
      const dups = data.errors?.filter(e => e.error === '重複照片').length || 0;
      let msg = ok > 0 ? `✓ 已新增 ${ok} 張` : '';
      if (dups)  msg += (msg ? '\n' : '') + `⚠ ${dups} 張重複`;
      if (fail - dups > 0) msg += (msg ? '\n' : '') + `✗ ${fail - dups} 張失敗`;
      setToast(msg || '無新照片');
      if (ok > 0 && onUploaded) onUploaded(data.uploaded);
    } catch {
      setToast('✗ 上傳失敗，請重試');
    } finally {
      setBusy(false);
      e.target.value = '';
      setTimeout(() => setToast(null), 4000);
    }
  }

  return (
    <>
      <input ref={inputRef} type="file" accept="image/*,.heic,.heif" multiple style={{display:'none'}} onChange={handleFiles} />
      <button className="upload-fab" onClick={() => inputRef.current.click()} disabled={busy} title="上傳照片">
        {busy ? '…' : '+'}
      </button>
      {toast && <div className="upload-toast">{toast}</div>}
    </>
  );
}

/* ── Dark-bg cleaner modal ─────────────────────────── */
function DarkBgModal({ onClose, onDeleted }) {
  const [phase, setPhase] = useState('idle'); // idle | scanning | confirm | deleting | done
  const [photos, setPhotos] = useState([]);
  const [excluded, setExcluded] = useState(new Set()); // IDs to keep (untick)
  const [count, setCount] = useState(0);

  const scan = () => {
    setPhase('scanning');
    fetch('/api/photos/dark-bg')
      .then(r => r.json())
      .then(d => { setPhotos(d.photos); setPhase('confirm'); })
      .catch(() => { alert('掃描失敗'); setPhase('idle'); });
  };

  const toggle = id => setExcluded(prev => {
    const s = new Set(prev);
    s.has(id) ? s.delete(id) : s.add(id);
    return s;
  });

  const doDelete = async () => {
    const ids = photos.filter(p => !excluded.has(p.id)).map(p => p.id);
    if (!ids.length) { onClose(); return; }
    setPhase('deleting');
    const res = await fetch('/api/photos/bulk', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const d = await res.json();
    setCount(d.deleted.length);
    setPhase('done');
    onDeleted && onDeleted(d.deleted);
  };

  const toDelete = photos.filter(p => !excluded.has(p.id));

  return (
    <div className="darkbg-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="darkbg-panel">
        <div className="darkbg-hd">
          <button className="det-back" onClick={onClose}>×</button>
          <span style={{flex:1,fontSize:15,fontWeight:600}}>清除黑底照片</span>
        </div>

        {phase === 'idle' && (
          <div style={{padding:'40px 24px',textAlign:'center',color:'var(--text2)',fontSize:14,lineHeight:1.9}}>
            偵測縮圖四個角落亮度<br/>自動找出黑色背景的照片<br/>
            <button className="db db-save" style={{marginTop:20,padding:'10px 32px'}} onClick={scan}>開始掃描</button>
          </div>
        )}

        {phase === 'scanning' && (
          <div className="loading-msg" style={{padding:60}}>掃描中，請稍候…</div>
        )}

        {phase === 'confirm' && (
          <>
            <div style={{padding:'8px 16px',fontSize:12,color:'var(--text2)',flexShrink:0}}>
              找到 <b>{photos.length}</b> 張黑底圖・點擊可取消勾選保留・將刪除 <b>{toDelete.length}</b> 張
            </div>
            {photos.length === 0
              ? <div className="empty-msg">沒有找到黑底照片</div>
              : <div className="darkbg-grid">
                  {photos.map(p => (
                    <div key={p.id} className={'darkbg-card' + (excluded.has(p.id) ? ' exclude' : '')}
                      onClick={() => toggle(p.id)}>
                      <img src={p.thumb_url} alt="" loading="lazy" />
                    </div>
                  ))}
                </div>
            }
            <div className="darkbg-footer">
              <button className="db" style={{flex:1,border:'1px solid var(--border)',background:'none'}} onClick={onClose}>取消</button>
              <button className="db db-save" style={{flex:2}} onClick={doDelete} disabled={toDelete.length===0}>
                永久刪除 {toDelete.length} 張
              </button>
            </div>
          </>
        )}

        {phase === 'deleting' && <div className="loading-msg" style={{padding:60}}>刪除中…</div>}

        {phase === 'done' && (
          <div style={{padding:'40px 24px',textAlign:'center',fontSize:14,color:'var(--text2)',lineHeight:2}}>
            ✅ 已刪除 {count} 張黑底照片<br/>
            <button className="db db-save" style={{marginTop:16,padding:'10px 32px'}} onClick={onClose}>完成</button>
          </div>
        )}
      </div>
    </div>
  );
}

function UploadPanel() {
  const [dragging,     setDragging]     = useState(false);
  const [uploading,    setUploading]    = useState(false);
  const [results,      setResults]      = useState([]);  // classified items in staging
  const [errors,       setErrors]       = useState([]);
  const [folderName,   setFolderName]   = useState('');
  const [isCustom,     setIsCustom]     = useState(false);
  const [importing,    setImporting]    = useState(new Set());
  const [msg,          setMsg]          = useState('');
  const fileRef = useRef(null);

  const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };

  const doUpload = async (fileList) => {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    if (!files.length) return;
    setUploading(true);
    setErrors([]);
    flash(`上傳 ${files.length} 張中，Gemini 分析中…`);

    const form = new FormData();
    files.forEach(f => form.append('files', f));
    if (isCustom && folderName.trim()) form.append('folder_name', folderName.trim());

    try {
      const res = await fetch('/api/upload', { method:'POST', headers: authHeaders(), body: form });
      const data = await res.json();
      setResults(prev => [...data.uploaded, ...prev]);
      setErrors(data.errors || []);
      const needsReview = data.needs_review_count || 0;
      flash(`✓ 上傳 ${data.count} 張${needsReview ? `，其中 ${needsReview} 張標紅需確認` : '，全部高信心'}`);
    } catch(e) {
      flash('上傳失敗：' + e.message);
    }
    setUploading(false);
  };

  const handleDrop = (e) => {
    e.preventDefault(); setDragging(false);
    doUpload(e.dataTransfer.files);
  };

  const updateField = (itemId, field, value) => {
    fetch(`/api/staging/queue/${itemId}`, {
      method:'PATCH', headers:{...authHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({[field]: value}),
    }).catch(()=>{});
    setResults(prev => prev.map(it => {
      if (it.id !== itemId) return it;
      const newFields = { ...it.fields, [field]: { ...it.fields[field], label: value, confidence: 1.0, color: 'green' } };
      const anyRed = Object.values(newFields).some(v => v.color === 'red');
      return { ...it, fields: newFields, needs_review: anyRed };
    }));
  };

  const importOne = async (itemId) => {
    setImporting(prev => new Set([...prev, itemId]));
    try {
      await fetch(`/api/staging/queue/${itemId}/import`, { method:'POST', headers: authHeaders() });
      setResults(prev => prev.filter(it => it.id !== itemId));
      flash('✓ 匯入成功');
    } catch(e) { flash('匯入失敗：' + e.message); }
    setImporting(prev => { const s = new Set(prev); s.delete(itemId); return s; });
  };

  const importAll = async () => {
    const ids = results.map(r => r.id);
    setUploading(true); flash(`匯入 ${ids.length} 張中…`);
    try {
      const res = await fetch('/api/staging/queue/import-all', { method:'POST', headers: authHeaders() });
      const data = await res.json();
      setResults([]);
      flash(`✓ 匯入完成 ${data.ok} 張`);
    } catch(e) { flash('匯入失敗：' + e.message); }
    setUploading(false);
  };

  const discardOne = async (itemId) => {
    await fetch(`/api/staging/queue/${itemId}`, { method:'DELETE', headers: authHeaders() });
    setResults(prev => prev.filter(it => it.id !== itemId));
  };

  const needsReviewCount = results.filter(r => r.needs_review).length;
  const allGreen = results.length > 0 && needsReviewCount === 0;

  return (
    <div style={{flex:1, overflowY:'auto', padding:'16px 14px 40px'}}>
      <DataQualityCard />
      {/* Drop zone */}
      <div
        onDragOver={e=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={handleDrop}
        onClick={()=>fileRef.current?.click()}
        style={{border:`2px dashed ${dragging ? 'var(--gold)' : 'var(--border)'}`,
          borderRadius:12, padding:'32px 20px', textAlign:'center', cursor:'pointer',
          background: dragging ? 'rgba(184,147,90,.06)' : 'transparent',
          transition:'all .2s', marginBottom:12}}>
        <input ref={fileRef} type="file" multiple accept="image/*,.heic,.heif"
          style={{display:'none'}} onChange={e=>doUpload(e.target.files)} />
        <div style={{fontSize:28, marginBottom:6}}>📷</div>
        <div style={{fontSize:14, fontWeight:700, color:'var(--text)'}}>
          {uploading ? 'Gemini 分析中…' : '拖曳照片到這裡'}
        </div>
        <div style={{fontSize:12, color:'var(--text3)', marginTop:4, marginBottom:12}}>
          支援 JPG / PNG / WEBP / HEIC，可一次多選
        </div>
        {!uploading && (
          <button onClick={e=>{e.stopPropagation();fileRef.current?.click();}}
            style={{padding:'8px 24px',borderRadius:8,border:'none',fontWeight:700,fontSize:13,
              cursor:'pointer',background:'var(--gold)',color:'#fff'}}>
            選取照片
          </button>
        )}
      </div>

      {/* Custom order option */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,padding:'8px 12px',
        border:'1px solid var(--border)',borderRadius:8,background:'var(--surface)'}}>
        <input type="checkbox" id="isCustom" checked={isCustom} onChange={e=>setIsCustom(e.target.checked)}
          style={{width:15,height:15,cursor:'pointer'}} />
        <label htmlFor="isCustom" style={{fontSize:13,cursor:'pointer',fontWeight:600}}>客製訂單（多角度同一件）</label>
        {isCustom && (
          <input value={folderName} onChange={e=>setFolderName(e.target.value)}
            placeholder="資料夾名稱，如：王小明藍寶石戒指"
            style={{flex:1,padding:'4px 10px',border:'1px solid var(--gold)',borderRadius:6,
              fontSize:12,background:'var(--surface)',color:'var(--text)'}} />
        )}
      </div>

      {/* Status msg */}
      {msg && <div style={{padding:'8px 14px',marginBottom:10,borderRadius:8,
        background:'rgba(184,147,90,.12)',border:'1px solid rgba(184,147,90,.3)',
        fontSize:13,color:'var(--gold)',fontWeight:600}}>{msg}</div>}

      {/* Errors */}
      {errors.length > 0 && (
        <div style={{padding:'8px 14px',marginBottom:10,borderRadius:8,
          background:'rgba(220,38,38,.06)',border:'1px solid rgba(220,38,38,.3)',fontSize:12,color:'#c0392b'}}>
          {errors.map((e,i) => <div key={i}>✕ {e.filename}: {e.error}</div>)}
        </div>
      )}

      {/* Results toolbar */}
      {results.length > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>
            待確認 {results.length} 張
            {needsReviewCount > 0 && <span style={{color:'#dc2626',marginLeft:6}}>⚠ {needsReviewCount} 張標紅</span>}
          </span>
          <button onClick={async () => {
            await Promise.all(results.map(r => fetch(`/api/staging/queue/${r.id}`, {method:'DELETE', headers:authHeaders()}).catch(()=>{})));
            setResults([]);
            flash('已清空');
          }} style={{padding:'6px 14px',borderRadius:8,border:'1px solid #f5c6c6',
            background:'none',color:'#c0392b',fontSize:13,cursor:'pointer', marginLeft:'auto'}}>
            清空
          </button>
          <button onClick={importAll} disabled={uploading}
            style={{padding:'6px 18px',borderRadius:8,border:'none',fontWeight:700,fontSize:13,cursor:'pointer',
              background: allGreen ? 'var(--gold)' : '#f59e0b', color:'#fff'}}>
            {allGreen ? `✓ 全部匯入 (${results.length})` : `仍要全部匯入 (${results.length})`}
          </button>
        </div>
      )}

      {/* Result cards */}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {results.map(item => (
          <UploadResultCard key={item.id} item={item}
            onUpdate={updateField}
            onImport={importOne}
            onDiscard={discardOne}
            importing={importing.has(item.id)} />
        ))}
      </div>
    </div>
  );
}

function FolderGroupCard({ folderName, items, selected, onToggleGroup, patch, importOne, discard, importing }) {
  const [idx, setIdx] = useState(0);
  const allSel = items.length > 0 && items.every(it => selected.has(it.id));

  // When a tag changes in this group → patch ALL items in the folder
  const patchAll = (field, value) => items.forEach(it => patch(it.id, field, value));

  const selAll = (field) => (
    <select value={items[0][field] || ''} onChange={e => patchAll(field, e.target.value)}
      style={{fontSize:11,padding:'2px 4px',border:'1px solid var(--border)',borderRadius:6,
        background:'var(--surface)',color:'var(--text)',width:'100%'}}>
      <option value="">—</option>
      {(STAGING_OPTS[field]||[]).map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );

  const safeIdx = Math.min(idx, items.length - 1);

  return (
    <div style={{marginBottom:14,border:'1px solid rgba(184,147,90,.4)',borderRadius:10,overflow:'hidden'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 14px',
        background:'rgba(184,147,90,.12)',borderBottom:'1px solid rgba(184,147,90,.2)'}}>
        <input type="checkbox" checked={allSel} onChange={()=>onToggleGroup(items.map(it=>it.id))}
          style={{width:15,height:15,cursor:'pointer'}} />
        <span style={{fontWeight:700,fontSize:13}}>{folderName}</span>
        <span style={{fontSize:11,color:'var(--text3)'}}>{items.length} 張</span>
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--gold)',fontWeight:700}}>客製訂單</span>
      </div>
      {/* Body */}
      <div style={{display:'flex',gap:14,padding:12,flexWrap:'wrap'}}>
        {/* Carousel */}
        <div style={{flexShrink:0}}>
          <div style={{position:'relative',width:120,height:120,borderRadius:8,overflow:'hidden',background:'var(--s3)'}}>
            <img src={`/api/staging/queue/thumb/${items[safeIdx].id}`}
              style={{width:120,height:120,objectFit:'cover',display:'block'}} />
            {items.length > 1 && <>
              <button onClick={()=>setIdx(i=>Math.max(0,i-1))} disabled={safeIdx===0}
                style={{position:'absolute',left:2,top:'50%',transform:'translateY(-50%)',
                  border:'none',borderRadius:4,padding:'2px 7px',cursor:'pointer',
                  background:'rgba(0,0,0,.55)',color:'#fff',fontSize:16,lineHeight:1}}>‹</button>
              <button onClick={()=>setIdx(i=>Math.min(items.length-1,i+1))} disabled={safeIdx===items.length-1}
                style={{position:'absolute',right:2,top:'50%',transform:'translateY(-50%)',
                  border:'none',borderRadius:4,padding:'2px 7px',cursor:'pointer',
                  background:'rgba(0,0,0,.55)',color:'#fff',fontSize:16,lineHeight:1}}>›</button>
              <div style={{position:'absolute',bottom:4,left:'50%',transform:'translateX(-50%)',
                background:'rgba(0,0,0,.55)',color:'#fff',fontSize:10,padding:'1px 7px',borderRadius:10}}>
                {safeIdx+1}/{items.length}
              </div>
            </>}
          </div>
          {/* Thumbnail strip */}
          <div style={{display:'flex',gap:4,marginTop:6,maxWidth:200,overflowX:'auto'}}>
            {items.map((it,i)=>(
              <img key={it.id} src={`/api/staging/queue/thumb/${it.id}`}
                onClick={()=>setIdx(i)}
                style={{width:34,height:34,objectFit:'cover',borderRadius:4,cursor:'pointer',flexShrink:0,
                  border: i===safeIdx ? '2px solid var(--gold)' : '2px solid transparent'}} />
            ))}
          </div>
        </div>
        {/* Tags grid — applies to ALL items in group */}
        <div style={{flex:1,display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'6px 10px',alignContent:'start',minWidth:280}}>
          {STAGING_FIELDS.map(f=>(
            <div key={f}>
              <div style={{fontSize:10,color:'var(--text3)',marginBottom:2}}>{FIELD_LABELS[f]}</div>
              {selAll(f)}
            </div>
          ))}
        </div>
        {/* Actions */}
        <div style={{display:'flex',flexDirection:'column',gap:6,justifyContent:'flex-start',flexShrink:0}}>
          <button onClick={()=>items.forEach(it=>importOne(it.id))}
            style={{padding:'7px 14px',borderRadius:7,border:'none',
              background:'var(--gold)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
            匯入全組
          </button>
          <button onClick={()=>{ if(confirm(`刪除「${folderName}」全組 ${items.length} 張？`)) items.forEach(it=>discard(it.id,true)); }}
            style={{padding:'7px 14px',borderRadius:7,border:'1px solid #f5c6c6',
              background:'none',color:'#c0392b',fontSize:12,cursor:'pointer',whiteSpace:'nowrap'}}>
            刪除全組
          </button>
        </div>
      </div>
    </div>
  );
}

function StagingQueuePanel() {
  const [items,      setItems]      = useState([]);
  const [scanning,   setScanning]   = useState(false);
  const [scanMsg,    setScanMsg]    = useState('');
  const [importing,  setImporting]  = useState(new Set());
  const [selected,   setSelected]   = useState(new Set());
  const [batchField, setBatchField] = useState('');
  const [batchValue, setBatchValue] = useState('');

  const load = () =>
    fetch('/api/staging/queue', {headers: authHeaders()}).then(r=>r.json()).then(d=>{setItems(d); setSelected(new Set());}).catch(()=>{});

  useEffect(() => { load(); }, []);

  const scan = () => {
    setScanning(true); setScanMsg('掃描中…');
    fetch('/api/staging/queue/scan', {method:'POST', headers: authHeaders()})
      .then(r=>r.json())
      .then(d => {
        setScanMsg(d.message || '');
        const poll = () => {
          fetch('/api/staging/queue/scan-status', {headers: authHeaders()}).then(r=>r.json()).then(s => {
            setScanMsg(`${s.step} (${s.done}/${s.total})`);
            if (s.running) setTimeout(poll, 1200);
            else { setScanning(false); load(); }
          }).catch(()=>setScanning(false));
        };
        if (d.total > 0) setTimeout(poll, 800);
        else setScanning(false);
      }).catch(()=>setScanning(false));
  };

  const patch = (id, field, value) => {
    fetch(`/api/staging/queue/${id}`, {
      method:'PATCH', headers:{...authHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({[field]: value}),
    }).catch(()=>{});
    setItems(prev => prev.map(it => it.id === id ? {...it, [field]: value} : it));
  };

  const applyBatch = () => {
    if (!batchField || !selected.size) return;
    const val = batchValue || null;
    selected.forEach(id => patch(id, batchField, val));
    setScanMsg(`已套用到 ${selected.size} 張`);
    setTimeout(()=>setScanMsg(''), 3000);
  };

  const importOne = (id) => {
    setImporting(prev => new Set([...prev, id]));
    fetch(`/api/staging/queue/${id}/import`, {method:'POST', headers: authHeaders()})
      .then(r=>r.json())
      .then(() => { load(); setImporting(prev => { const s=new Set(prev); s.delete(id); return s; }); })
      .catch(()=>setImporting(prev => { const s=new Set(prev); s.delete(id); return s; }));
  };

  const importAll = () => {
    setScanning(true); setScanMsg('匯入中…');
    fetch('/api/staging/queue/import-all', {method:'POST', headers: authHeaders()})
      .then(r=>r.json())
      .then(d => { setScanMsg(`匯入完成 ${d.ok} 張`); setScanning(false); load(); })
      .catch(()=>setScanning(false));
  };

  const discard = (id) => {
    fetch(`/api/staging/queue/${id}`, {method:'DELETE', headers: authHeaders()})
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; })
      .then(()=>{ setItems(prev => prev.filter(it => it.id !== id)); })
      .catch(e => setScanMsg('刪除失敗：' + e.message));
  };

  const toggleSelect = (id) => setSelected(prev => {
    const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s;
  });

  const toggleGroup = (ids) => {
    const allIn = ids.every(id => selected.has(id));
    setSelected(prev => {
      const s = new Set(prev);
      ids.forEach(id => allIn ? s.delete(id) : s.add(id));
      return s;
    });
  };

  const allSelected = items.length > 0 && items.every(it => selected.has(it.id));
  const toggleAll = () => setSelected(allSelected ? new Set() : new Set(items.map(it=>it.id)));

  const sel = (id, field, val) => (
    <select value={val || ''} onChange={e=>patch(id, field, e.target.value)}
      style={{fontSize:11,padding:'2px 4px',border:'1px solid var(--border)',borderRadius:6,
        background:'var(--surface)',color:'var(--text)',maxWidth:90}}>
      <option value="">—</option>
      {(STAGING_OPTS[field]||[]).map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );

  // Split items into folder groups and individual files
  const folderMap = {};
  const singles = [];
  items.forEach(it => {
    if (it.folder_name) {
      if (!folderMap[it.folder_name]) folderMap[it.folder_name] = [];
      folderMap[it.folder_name].push(it);
    } else {
      singles.push(it);
    }
  });
  const folders = Object.entries(folderMap).sort(([a],[b]) => a.localeCompare(b));

  return (
    <div style={{flex:1,overflowY:'auto',padding:'16px 14px 32px'}}>
      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}>
        <div style={{fontSize:12,color:'var(--text3)',flex:1}}>
          照片放入 <code style={{background:'var(--s3)',padding:'1px 6px',borderRadius:4}}>data/00_staging/</code>，子資料夾視為客製訂單
        </div>
        {items.length > 0 && (
          <button onClick={importAll} disabled={scanning}
            style={{padding:'7px 18px',borderRadius:8,border:'none',
              background:'var(--gold)',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            全部匯入 ({items.length})
          </button>
        )}
        <button onClick={scan} disabled={scanning}
          style={{padding:'7px 18px',borderRadius:8,border:'1px solid var(--border)',
            background:'var(--surface)',fontSize:13,cursor:scanning?'default':'pointer',
            color: scanning ? 'var(--text3)' : 'var(--text)'}}>
          {scanning ? '⏳ ' + scanMsg : '🔍 掃描新照片'}
        </button>
      </div>

      {/* Batch action bar */}
      {selected.size > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',marginBottom:8,
          background:'rgba(184,147,90,.12)',border:'1px solid rgba(184,147,90,.3)',
          borderRadius:8,flexWrap:'wrap'}}>
          <span style={{fontSize:12,fontWeight:700,color:'var(--gold)',whiteSpace:'nowrap'}}>已選 {selected.size} 張</span>
          <select value={batchField} onChange={e=>{setBatchField(e.target.value);setBatchValue('');}}
            style={{fontSize:12,padding:'4px 8px',border:'1px solid var(--border)',borderRadius:6,
              background:'var(--surface)',color:'var(--text)'}}>
            <option value="">選欄位…</option>
            {STAGING_FIELDS.map(f=><option key={f} value={f}>{FIELD_LABELS[f]}</option>)}
          </select>
          {batchField && (
            <select value={batchValue} onChange={e=>setBatchValue(e.target.value)}
              style={{fontSize:12,padding:'4px 8px',border:'1px solid var(--border)',borderRadius:6,
                background:'var(--surface)',color:'var(--text)'}}>
              <option value="">— 清空 —</option>
              {(STAGING_OPTS[batchField]||[]).map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          )}
          <button onClick={applyBatch} disabled={!batchField}
            style={{padding:'4px 14px',borderRadius:6,border:'none',
              background: batchField ? 'var(--gold)' : 'var(--border)',
              color:'#fff',fontSize:12,fontWeight:700,cursor: batchField ? 'pointer':'default'}}>
            套用到選取
          </button>
          <button onClick={async () => {
            const ids = [...selected];
            await Promise.all(ids.map(id => fetch(`/api/staging/queue/${id}`, {method:'DELETE', headers:authHeaders()}).catch(()=>{})));
            setItems(prev => prev.filter(it => !selected.has(it.id)));
            setSelected(new Set());
            setScanMsg(`已刪除 ${ids.length} 張`);
            setTimeout(()=>setScanMsg(''), 3000);
          }} style={{padding:'4px 14px',borderRadius:6,border:'1px solid #f5c6c6',
            background:'none',color:'#c0392b',fontSize:12,cursor:'pointer',fontWeight:700}}>
            刪除選取
          </button>
          <button onClick={()=>setSelected(new Set())}
            style={{padding:'4px 10px',borderRadius:6,border:'1px solid var(--border)',
              background:'none',color:'var(--text2)',fontSize:12,cursor:'pointer'}}>
            取消選取
          </button>
          {scanMsg && <span style={{fontSize:11,color:'var(--gold)'}}>{scanMsg}</span>}
        </div>
      )}

      {items.length === 0 && !scanning && (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text3)',fontSize:14,lineHeight:2}}>
          佇列是空的<br/>
          <span style={{fontSize:12}}>把照片丟進 data/00_staging/ 再按掃描<br/>子資料夾 = 客製訂單（整組一起匯入）</span>
        </div>
      )}

      {/* Custom order folder groups */}
      {folders.length > 0 && (
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:'var(--text3)',fontWeight:700,marginBottom:8,letterSpacing:.5}}>客製訂單</div>
          {folders.map(([folderName, groupItems]) => (
            <FolderGroupCard key={folderName}
              folderName={folderName}
              items={groupItems}
              selected={selected}
              onToggleGroup={toggleGroup}
              patch={patch}
              importOne={importOne}
              discard={discard}
              importing={importing}
            />
          ))}
        </div>
      )}

      {/* Individual files table */}
      {singles.length > 0 && (
        <>
          {folders.length > 0 && <div style={{fontSize:11,color:'var(--text3)',fontWeight:700,marginBottom:8,letterSpacing:.5}}>一般商品</div>}
          <div style={{overflowX:'auto'}}>
            <table style={{borderCollapse:'collapse',fontSize:12,minWidth:900,width:'100%'}}>
              <thead>
                <tr style={{background:'var(--s3)'}}>
                  <th style={{padding:'8px 6px',textAlign:'center'}}>
                    <input type="checkbox" checked={singles.every(it=>selected.has(it.id))}
                      onChange={()=>{ const allIn=singles.every(it=>selected.has(it.id));
                        setSelected(prev=>{ const s=new Set(prev); singles.forEach(it=>allIn?s.delete(it.id):s.add(it.id)); return s; }); }}
                      style={{width:15,height:15,cursor:'pointer'}} />
                  </th>
                  <th style={{padding:'8px 6px',textAlign:'left',fontWeight:700}}>縮圖</th>
                  <th style={{padding:'8px 6px',textAlign:'left',fontWeight:700}}>檔名</th>
                  {STAGING_FIELDS.map(f => (
                    <th key={f} style={{padding:'8px 4px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',fontSize:11}}>
                      {FIELD_LABELS[f]}
                    </th>
                  ))}
                  <th style={{padding:'8px 6px',textAlign:'center',fontWeight:700}}>操作</th>
                </tr>
              </thead>
              <tbody>
                {singles.map(it => (
                  <tr key={it.id} onClick={()=>toggleSelect(it.id)}
                    style={{borderTop:'1px solid var(--border)',cursor:'pointer',
                      background: selected.has(it.id) ? 'rgba(184,147,90,.08)' : 'transparent'}}>
                    <td style={{padding:'6px',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                      <input type="checkbox" checked={selected.has(it.id)} onChange={()=>toggleSelect(it.id)}
                        style={{width:15,height:15,cursor:'pointer'}} />
                    </td>
                    <td style={{padding:'6px'}} onClick={e=>e.stopPropagation()}>
                      <img src={`/api/staging/queue/thumb/${it.id}`}
                        style={{width:56,height:56,objectFit:'cover',borderRadius:6,background:'var(--s3)',display:'block'}} />
                    </td>
                    <td style={{padding:'6px 8px',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:11,color:'var(--text2)'}}>
                      {it.original_filename}
                    </td>
                    {STAGING_FIELDS.map(f => (
                      <td key={f} style={{padding:'4px 2px',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                        {sel(it.id, f, it[f])}
                      </td>
                    ))}
                    <td style={{padding:'4px 8px',textAlign:'center',whiteSpace:'nowrap'}} onClick={e=>e.stopPropagation()}>
                      <button onClick={()=>importOne(it.id)} disabled={importing.has(it.id)||!it.filename}
                        style={{padding:'4px 10px',borderRadius:6,border:'none',
                          background: it.filename ? 'var(--gold)' : 'var(--border)',
                          color:'#fff',fontSize:11,fontWeight:700,cursor:'pointer',marginRight:4}}>
                        {importing.has(it.id) ? '…' : '匯入'}
                      </button>
                      <button onClick={()=>discard(it.id)}
                        style={{padding:'4px 8px',borderRadius:6,border:'1px solid #f5c6c6',
                          background:'none',color:'#c0392b',fontSize:11,cursor:'pointer'}}>
                        ✕
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ── Pricing Settings Tab ────────────────────────────── */
function PricingSettingsTab({ initialTab = 'upload' }) {
  const [settingsTab, setSettingsTab] = useState(initialTab);

  const tabBtnSt = (active) => ({
    flex: 1, padding: '9px 4px', fontSize: 13, fontWeight: active ? 700 : 500,
    border: 'none', borderBottom: active ? '3px solid var(--gold)' : '3px solid transparent',
    background: 'var(--surface)', color: active ? 'var(--gold)' : 'var(--text2)',
    cursor: 'pointer', transition: 'all .15s',
  });

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0, paddingTop:'var(--nav-h)' }}>
      {/* 分頁選擇列 */}
      <div style={{ display:'flex', borderBottom:'1px solid var(--border)', background:'var(--surface)', flexShrink:0 }}>
        <button style={tabBtnSt(settingsTab==='upload')}    onClick={()=>setSettingsTab('upload')}>上傳</button>
        <button style={tabBtnSt(settingsTab==='pricing')}   onClick={()=>setSettingsTab('pricing')}>估價參數</button>
        <button style={tabBtnSt(settingsTab==='staff')}     onClick={()=>setSettingsTab('staff')}>員工</button>
        <button style={tabBtnSt(settingsTab==='links')}     onClick={()=>setSettingsTab('links')}>臨時網址</button>
        <button style={tabBtnSt(settingsTab==='customers')} onClick={()=>setSettingsTab('customers')}>客人分析</button>
        <button style={tabBtnSt(settingsTab==='staging')}   onClick={()=>setSettingsTab('staging')}>舊佇列</button>
      </div>

      {settingsTab === 'upload'    && <div style={{flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column'}}><UploadPanel /></div>}
      <div style={{flex:1, minHeight:0, overflow:'hidden', display: settingsTab === 'pricing' ? 'flex' : 'none', flexDirection:'column'}}>
        <PricingParamsPanel />
      </div>
      {settingsTab === 'staff'     && <div style={{flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column'}}><StaffMgmtPanel /></div>}
      {settingsTab === 'links'     && <div style={{flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column'}}><GuestLinksPanel /></div>}
      {settingsTab === 'customers' && <div style={{flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column'}}><CustomerAnalyticsPanel /></div>}
      {settingsTab === 'staging'   && <div style={{flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column'}}><StagingQueuePanel /></div>}
    </div>
  );
}

/* ── 估價參數面板（原 PricingSettingsTab 內容） ──────── */
function PricingParamsPanel() {
  const [metals,         setMetals]         = useState({});
  const [labor,          setLabor]          = useState({});
  const [laborConfig,    setLaborConfig]    = useState({daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8});
  const [sidestones,     setSidestones]     = useState({});
  const [sidestonesV2,   setSidestonesV2]   = useState({});
  const [weights,        setWeights]        = useState({});
  const [invest,         setInvest]         = useState({});
  const [commercialCarat,setCommercialCarat]= useState({});
  const [newInvestName,  setNewInvestName]  = useState('');
  const [newCommName,    setNewCommName]    = useState('');
  const [showWtEdit,     setShowWtEdit]     = useState(false);
  const [loaded,         setLoaded]         = useState(false);
  const [saving,         setSaving]         = useState(false);
  const [saved,          setSaved]          = useState(false);

  useEffect(() => {
    fetch('/api/pricing/all').then(r => r.json()).then(d => {
      setMetals(d.metals ? { ...d.metals } : {});
      setLabor(d.labor ? JSON.parse(JSON.stringify(d.labor)) : {});
      if (d.labor_config) setLaborConfig({ ...d.labor_config });
      setSidestones(d.sidestones ? { ...d.sidestones } : {});
      if (d.sidestones_v2) setSidestonesV2(JSON.parse(JSON.stringify(d.sidestones_v2)));
      setWeights(d.weights ? { ...d.weights } : {});
      if (d.stones_invest) {
        const inv = {};
        Object.entries(d.stones_invest).forEach(([k, v]) => {
          inv[k] = { name: v.name, floor: { ...v.floor }, ceil: { ...v.ceil } };
        });
        setInvest(inv);
      }
      if (d.commercial_carat) {
        setCommercialCarat(JSON.parse(JSON.stringify(d.commercial_carat)));
      }
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const saveAll = async () => {
    setSaving(true);
    const reqs = [];
    for (const [mat, price] of Object.entries(metals)) {
      reqs.push(fetch('/api/pricing/metals/' + encodeURIComponent(mat), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ price_per_g: Math.round(Number(price)) }),
      }));
    }
    for (const [skey, s] of Object.entries(invest)) {
      for (const band of ['B1','B2','B3','B4','B5']) {
        if ((s.floor||{})[band] !== undefined) {
          reqs.push(fetch('/api/pricing/stones-invest/' + encodeURIComponent(skey) + '/' + band, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price_floor: Math.round(Number(s.floor[band])), price_ceil: Math.round(Number(s.ceil[band])) }),
          }));
        }
      }
    }
    for (const [skey, s] of Object.entries(commercialCarat)) {
      for (const ct of ['1ct','2ct','3ct','4ct','5ct']) {
        if (s[ct]) {
          reqs.push(fetch('/api/pricing/stones-commercial-carat/' + encodeURIComponent(skey) + '/' + ct, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price_min: Math.round(Number(s[ct][0])), price_max: Math.round(Number(s[ct][1])) }),
          }));
        }
      }
    }
    for (const [key, val] of Object.entries(laborConfig)) {
      reqs.push(fetch('/api/pricing/labor-config/' + encodeURIComponent(key), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: Number(val) }),
      }));
    }
    for (const [stype, bands] of Object.entries(sidestonesV2)) {
      for (const [band, vals] of Object.entries(bands)) {
        if (!Array.isArray(vals)) continue;
        reqs.push(fetch('/api/pricing/sidestones-v2/' + encodeURIComponent(stype) + '/' + encodeURIComponent(band), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ price_min: Math.round(Number(vals[0])), price_max: Math.round(Number(vals[1])) }),
        }));
      }
    }
    for (const [label, vals] of Object.entries(weights)) {
      if (!Array.isArray(vals)) continue;
      reqs.push(fetch('/api/pricing/weights/' + encodeURIComponent(label), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weight_min: Number(vals[0]), weight_max: Number(vals[1]) }),
      }));
    }
    await Promise.all(reqs).catch(() => {});
    window.dispatchEvent(new Event('pricingUpdated'));
    setSaving(false); setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  if (!loaded) return <div style={{padding:32,textAlign:'center',color:'var(--text2)',fontSize:14}}>載入中…</div>;

  const COMPLEXITY_ORDER = ['極簡', '簡單', '中等', '複雜', '精工'];
  const laborCats = Object.keys(labor);
  const laborComps = COMPLEXITY_ORDER.filter(c => laborCats.some(cat => (labor[cat] || {})[c] !== undefined));
  const CT_LABELS = ['1ct','2ct','3ct','4ct','5ct'];
  const BANDS = ['B1','B2','B3','B4','B5'];
  const BAND_LBL = {B1:'B1 (~1ct)',B2:'B2 (~2ct)',B3:'B3 (~3ct)',B4:'B4 (~4ct)',B5:'B5 (~5ct)'};
  const investKeys = Object.keys(invest);
  const commCaratKeys = Object.keys(commercialCarat);

  const iS = { padding:'7px 10px', border:'2px solid #c8b89a', borderRadius:8, fontSize:15, background:'#fdf8ef', color:'var(--text)', fontWeight:600, boxSizing:'border-box', textAlign:'right', width:'100%' };
  const hdSt = { fontSize:16, fontWeight:800, color:'var(--text)', padding:'16px 0 10px', borderBottom:'2px solid var(--border)', marginBottom:14 };
  const thSt = { padding:'6px 8px', textAlign:'right', fontWeight:700, fontSize:13, color:'var(--text2)' };
  const matrixCell = (minVal, maxVal, onMin, onMax) => (
    <td style={{padding:'3px 4px',textAlign:'center'}}>
      <div style={{display:'flex',gap:2,alignItems:'center',justifyContent:'center'}}>
        <input type="number" style={{...iS,width:62,fontSize:13,padding:'5px 4px'}} value={minVal||''} onChange={onMin} />
        <span style={{color:'var(--text3)',fontSize:12}}>/</span>
        <input type="number" style={{...iS,width:62,fontSize:13,padding:'5px 4px'}} value={maxVal||''} onChange={onMax} />
      </div>
    </td>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', background:'var(--surface)', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
        <span style={{ fontSize:13, color: saved ? 'var(--gold)' : 'var(--text2)', flex:1, fontWeight: saved ? 600 : 400 }}>
          {saved ? '✓ 已儲存' : saving ? '儲存中…' : '修改後點「儲存」生效'}
        </span>
        <button onClick={saveAll} disabled={saving} style={{ background:'var(--accent)', color:'#fff', border:'none', borderRadius:8, padding:'7px 20px', fontSize:13, fontWeight:700, cursor:'pointer', opacity:saving ? 0.6 : 1 }}>儲存</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'4px 20px 40px' }}>

        {/* 貴金屬行情：金屬 × 重量 自動計算矩陣 */}
        {(() => {
          return (
            <div style={{...hdSt}}>
              貴金屬行情
              <span style={{fontWeight:400,fontSize:12,color:'var(--text3)',marginLeft:8}}>輸入NT$/克，其餘自動帶入</span>
            </div>
          );
        })()}
        {(() => {
          const metalKeys = Object.keys(metals);
          const weightEntries = Object.entries(weights);
          return (
            <div style={{overflowX:'auto',marginBottom:8}}>
              <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
                <thead>
                  <tr>
                    <th style={{...thSt,textAlign:'left',minWidth:88,position:'sticky',left:0,background:'var(--surface)',fontSize:11}}>用料級別</th>
                    {metalKeys.map(mat => (
                      <th key={mat} style={{...thSt,textAlign:'center',minWidth:96,paddingBottom:4}}>
                        <div style={{fontWeight:600,marginBottom:4}}>{mat}</div>
                        <input type="number" style={{...iS,width:86,fontSize:14,textAlign:'center',padding:'5px 6px'}}
                          value={metals[mat]||''} placeholder="NT$/克"
                          onChange={e => setMetals(prev => ({...prev,[mat]:e.target.value}))} />
                        <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>NT$/克</div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {weightEntries.map(([label, vals]) => {
                    const [wMin, wMax] = Array.isArray(vals) ? [Number(vals[0]),Number(vals[1])] : [0,0];
                    return (
                      <tr key={label} style={{borderTop:'1px solid var(--border)'}}>
                        <td style={{padding:'7px 8px',position:'sticky',left:0,background:'var(--bg)',whiteSpace:'nowrap'}}>
                          <div style={{fontSize:11,fontWeight:600,color:'var(--text)'}}>{label.replace(/ \(.*\)/,'')}</div>
                          <div style={{fontSize:10,color:'var(--text3)'}}>{wMin}–{wMax} g</div>
                        </td>
                        {metalKeys.map(mat => {
                          const pg = Number(metals[mat])||0;
                          if (!pg) return <td key={mat} style={{padding:'7px 8px',textAlign:'center',color:'var(--text3)',fontSize:11}}>—</td>;
                          const price = Math.round(pg * wMax).toLocaleString();
                          return (
                            <td key={mat} style={{padding:'7px 8px',textAlign:'center',fontSize:12,color:'var(--text)',fontWeight:600,fontVariantNumeric:'tabular-nums'}}>
                              {price}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })()}
        <div style={{marginBottom:24}}>
          <button onClick={() => setShowWtEdit(v => !v)}
            style={{fontSize:11,color:'var(--text3)',background:'none',border:'none',cursor:'pointer',padding:'4px 0',textDecoration:'underline'}}>
            {showWtEdit ? '▲ 收起' : '▼ 調整克數範圍'}
          </button>
          {showWtEdit && (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginTop:8}}>
              <thead><tr>
                <th style={{...thSt,textAlign:'left'}}>級別</th>
                <th style={thSt}>最輕 (g)</th>
                <th style={thSt}>最重 (g)</th>
              </tr></thead>
              <tbody>
                {Object.entries(weights).map(([label, vals]) => (
                  <tr key={label} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'6px 8px',color:'var(--text)',fontSize:11}}>{label}</td>
                    <td style={{padding:'4px 6px',width:90}}>
                      <input type="number" step="0.1" style={iS} value={Array.isArray(vals)?vals[0]||'':''} onChange={e => setWeights(prev=>({...prev,[label]:[e.target.value,(prev[label]||[0,0])[1]]}))} />
                    </td>
                    <td style={{padding:'4px 6px',width:90}}>
                      <input type="number" step="0.1" style={iS} value={Array.isArray(vals)?vals[1]||'':''} onChange={e => setWeights(prev=>({...prev,[label]:[(prev[label]||[0,0])[0],e.target.value]}))} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>

        {/* 投資型寶石：矩陣 stones × B1-B5 */}
        <>
          <div style={hdSt}>投資型寶石單價 <span style={{fontWeight:400,fontSize:12,color:'var(--text3)'}}>每顆總價 NT$（下限／上限）</span></div>
          {investKeys.length > 0 && (
            <div style={{overflowX:'auto',marginBottom:12}}>
              <table style={{borderCollapse:'collapse',fontSize:12}}>
                <thead><tr>
                  <th style={{...thSt,textAlign:'left',minWidth:60,position:'sticky',left:0,background:'var(--surface)'}}>寶石</th>
                  {BANDS.map(b => (
                    <th key={b} style={{...thSt,textAlign:'center',minWidth:120,paddingBottom:2}}>{BAND_LBL[b]}<br/><span style={{fontWeight:400,fontSize:10,color:'var(--text3)'}}>下／上</span></th>
                  ))}
                </tr></thead>
                <tbody>
                  {investKeys.map(skey => (
                    <tr key={skey} style={{borderTop:'1px solid var(--border)'}}>
                      <td style={{padding:'6px 8px',fontWeight:600,color:'var(--text)',fontSize:12,whiteSpace:'nowrap',position:'sticky',left:0,background:'var(--surface)'}}>{invest[skey].name}</td>
                      {BANDS.map(band => matrixCell(
                        (invest[skey].floor||{})[band],
                        (invest[skey].ceil||{})[band],
                        e => setInvest(prev => ({...prev,[skey]:{...prev[skey],floor:{...prev[skey].floor,[band]:e.target.value}}})),
                        e => setInvest(prev => ({...prev,[skey]:{...prev[skey],ceil:{...prev[skey].ceil,[band]:e.target.value}}}))
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:28}}>
            <input placeholder="新增寶石名稱…" value={newInvestName} onChange={e=>setNewInvestName(e.target.value)}
              style={{...iS,flex:1,maxWidth:200,fontWeight:400,textAlign:'left'}} />
            <button onClick={() => {
              const n = newInvestName.trim(); if (!n) return;
              const k = 'CUSTOM_' + Date.now();
              setInvest(prev => ({...prev,[k]:{name:n,floor:{},ceil:{}}}));
              setNewInvestName('');
            }} style={{padding:'7px 18px',borderRadius:8,border:'1px solid var(--gold)',
              background:'none',color:'var(--gold)',fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
              + 新增
            </button>
          </div>
        </>

        {/* 輕奢級寶石：矩陣 stones × 1-5ct */}
        <>
          <div style={hdSt}>輕奢級寶石單價 <span style={{fontWeight:400,fontSize:12,color:'var(--text3)'}}>NT$/克拉，依大小分級（下／上）</span></div>
          {commCaratKeys.length > 0 && (
            <div style={{overflowX:'auto',marginBottom:12}}>
              <table style={{borderCollapse:'collapse',fontSize:12}}>
                <thead><tr>
                  <th style={{...thSt,textAlign:'left',minWidth:64,position:'sticky',left:0,background:'var(--surface)'}}>寶石</th>
                  {CT_LABELS.map(ct => (
                    <th key={ct} style={{...thSt,textAlign:'center',minWidth:116,paddingBottom:2}}>{ct}<br/><span style={{fontWeight:400,fontSize:10,color:'var(--text3)'}}>下／上</span></th>
                  ))}
                </tr></thead>
                <tbody>
                  {commCaratKeys.map(skey => (
                    <tr key={skey} style={{borderTop:'1px solid var(--border)'}}>
                      <td style={{padding:'6px 8px',fontWeight:600,color:'var(--text)',fontSize:12,whiteSpace:'nowrap',position:'sticky',left:0,background:'var(--surface)'}}>{commercialCarat[skey]?.name}</td>
                      {CT_LABELS.map(ct => {
                        const vals = (commercialCarat[skey]||{})[ct] || [0,0];
                        return matrixCell(
                          vals[0], vals[1],
                          e => setCommercialCarat(prev => ({...prev,[skey]:{...prev[skey],[ct]:[e.target.value,(prev[skey]?.[ct]||[0,0])[1]]}})),
                          e => setCommercialCarat(prev => ({...prev,[skey]:{...prev[skey],[ct]:[(prev[skey]?.[ct]||[0,0])[0],e.target.value]}}))
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:28}}>
            <input placeholder="新增寶石名稱…" value={newCommName} onChange={e=>setNewCommName(e.target.value)}
              style={{...iS,flex:1,maxWidth:200,fontWeight:400,textAlign:'left'}} />
            <button onClick={() => {
              const n = newCommName.trim(); if (!n) return;
              const k = 'CUSTOM_' + Date.now();
              setCommercialCarat(prev => ({...prev,[k]:{name:n}}));
              setNewCommName('');
            }} style={{padding:'7px 18px',borderRadius:8,border:'1px solid var(--gold)',
              background:'none',color:'var(--gold)',fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
              + 新增
            </button>
          </div>
        </>

        {/* 師傅工錢：日薪 × 天數 */}
        <div style={hdSt}>師傅工錢 <span style={{fontWeight:400,fontSize:12,color:'var(--text3)'}}>深圳珠寶廠行情 · 日薪 × 天數</span></div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,background:'var(--s3)',borderRadius:10,padding:'12px 14px'}}>
          <div style={{fontSize:12,color:'var(--text3)',flexShrink:0}}>日薪（NT$/天）</div>
          <input type="number" style={{...iS,width:100,fontWeight:700}}
            value={laborConfig.daily_rate||''}
            onChange={e=>setLaborConfig(prev=>({...prev,daily_rate:e.target.value}))} />
          <div style={{fontSize:11,color:'var(--text3)'}}>× 天數 = 工費</div>
        </div>
        <div style={{overflowX:'auto',marginBottom:28}}>
          <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
            <thead><tr>
              <th style={{...thSt,textAlign:'left',minWidth:60}}>複雜度</th>
              <th style={{...thSt,textAlign:'center',minWidth:80}}>天數</th>
              <th style={{...thSt,textAlign:'center',minWidth:130}}>工費預估</th>
            </tr></thead>
            <tbody>
              {['極簡','簡單','中等','複雜','精工'].map(comp => {
                const days = Number(laborConfig[comp] || 0);
                const dr   = Number(laborConfig.daily_rate || 2000);
                const cost = Math.round(dr * days);
                const lo   = Math.round(cost * 0.9);
                const hi   = Math.round(cost * 1.1);
                return (
                  <tr key={comp} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'8px 8px',fontWeight:600,color:'var(--text)',fontSize:12}}>{comp}</td>
                    <td style={{padding:'6px 8px',width:90}}>
                      <input type="number" step="0.5" style={iS}
                        value={laborConfig[comp]||''}
                        onChange={e=>setLaborConfig(prev=>({...prev,[comp]:e.target.value}))} />
                    </td>
                    <td style={{padding:'6px 8px',textAlign:'center',fontSize:11,color:'var(--text2)'}}>
                      {cost>0 ? `${lo.toLocaleString()}–${hi.toLocaleString()}` : '—'}
                    </td>
                  </tr>
                );
              })}

/* ── 封鎖 IP 管理 ────────────────────────────────────── */
function BlockedIPsSection() {
  const [ips, setIps] = useState([]);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');
  function flash(t) { setMsg(t); setTimeout(()=>setMsg(''),2500); }

  async function load() {
    setLoading(true);
    try { setIps(await fetch('/api/auth/blocked-ips').then(r=>r.json())); }
    finally { setLoading(false); }
  }
  useEffect(()=>{ load(); }, []);

  async function unblock(ip) {
    await fetch(`/api/auth/blocked-ips/${encodeURIComponent(ip)}`, { method:'DELETE' });
    flash(`已解鎖 ${ip}`); load();
  }

  return (
    <div>
      <div style={{fontSize:16,fontWeight:800,marginBottom:6}}>封鎖 IP 列表</div>

       ips.length === 0 ? <div style={{color:'var(--text3)',fontSize:13}}>目前無封鎖 IP</div> :
       ips.map(r => (
        <div key={r.ip} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',
          background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,marginBottom:8}}>

            <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>

/* ── UserMgmtSection ────────────────────────────────── */
function UserMgmtSection() {
  const ROLE_LABEL = { admin:'管理員', editor:'員工', viewer:'唯讀' };
  const ROLE_COLOR = { admin:'#b8935a', editor:'#4caf77', viewer:'#8a8a8a' };

  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [editPw,  setEditPw]  = useState(null);
  const [newPw,   setNewPw]   = useState('');
  const [form,    setForm]    = useState({ name:'', username:'', password:'', role:'editor' });
  const [saving,  setSaving]  = useState(false);
  const [msg,     setMsg]     = useState('');

  const iS = { padding:'10px 12px', border:'2px solid #c8b89a', borderRadius:8, fontSize:15,
               background:'#fdf8ef', color:'var(--text)', fontWeight:600, width:'100%', boxSizing:'border-box' };
  const btnSm = (bg, color) => ({
    padding:'5px 12px', fontSize:12, fontWeight:600, border:'none', borderRadius:6,
    background: bg, color: color, cursor:'pointer',
  });

  function flash(text) { setMsg(text); setTimeout(() => setMsg(''), 3000); }

  async function load() {
    setLoading(true);
    try {
      const r = await fetch('/api/auth/users');
      if (r.ok) setUsers(await r.json());
      else flash('載入失敗（' + r.status + '）');
    } catch(e) { flash('網路錯誤：' + e.message); }
    finally { setLoading(false); }
  }
  useEffect(() => { load(); }, []);

  async function createUser() {
    if (!form.name.trim() || !form.username.trim() || !form.password.trim()) {
      flash('姓名、帳號、密碼都必填'); return;
    }
    setSaving(true);
    try {
      const r = await fetch('/api/auth/users', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(form),
      });
      if (r.ok) {
        setForm({ name:'', username:'', password:'', role:'editor' });
        flash('✓ 帳號已新增');
        load();
      } else {
        const d = await r.json().catch(()=>({}));
        flash(d.detail || '新增失敗（' + r.status + '）');
      }
    } catch(e) {
      flash('網路錯誤：' + e.message);
    } finally {
      setSaving(false);
    }
  }

  async function toggleActive(u) {
    await fetch(`/api/auth/users/${u.id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ is_active: u.is_active ? 0 : 1 }),
    });
    load();
  }

  async function deleteUser(u) {
    if (!confirm(`確定刪除「${u.name}」的帳號？此操作無法還原。`)) return;
    await fetch(`/api/auth/users/${u.id}`, { method:'DELETE' });
    flash('帳號已刪除'); load();
  }

  async function savePassword(u) {
    if (!newPw.trim() || newPw.length < 4) { flash('密碼至少 4 個字元'); return; }
    setSaving(true);
    await fetch(`/api/auth/users/${u.id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: newPw }),
    });
    setSaving(false);
    setEditPw(null); setNewPw('');
    flash('密碼已更新');
  }

  return (
    <div>
      {/* 新增帳號表單（永遠顯示在最上方） */}
      <div style={{background:'#fdf8ef',borderRadius:12,padding:'16px',border:'2px solid #c8b89a',marginBottom:20}}>
        <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:'var(--text)'}}>+ 新增帳號</div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:12}}>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>姓名</div>
            <input style={iS} value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="例：小明" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>帳號（登入用）</div>
            <input style={iS} value={form.username} onChange={e=>setForm(p=>({...p,username:e.target.value}))} placeholder="例：ming123" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>密碼</div>
            <input style={iS} type="password" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} placeholder="至少 4 個字元" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>角色</div>
            <select style={iS} value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}>
              <option value="editor">員工（可估價、建連結、上傳）</option>
              <option value="admin">管理員（全權限）</option>
            </select>
          </div>
        </div>
        {msg && <div style={{fontSize:13,fontWeight:600,marginBottom:8,padding:'8px 10px',borderRadius:8,
          background: msg.startsWith('✓') ? '#e8f5e9' : '#ffebee',
          color: msg.startsWith('✓') ? '#2e7d32' : '#c62828'}}>{msg}</div>}
        <button onClick={createUser} disabled={saving}
          style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,
            padding:'12px 0',fontSize:15,fontWeight:800,cursor:'pointer',width:'100%',
            opacity:saving?0.6:1}}>
          {saving ? '新增中…' : '確認新增'}
        </button>
      </div>

      {/* 現有帳號列表 */}
      <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:'var(--text2)'}}>現有帳號</div>
      {loading ? <div style={{fontSize:13,color:'var(--text3)'}}>載入中…</div> : (
        users.length === 0
          ? <div style={{fontSize:13,color:'var(--text3)',padding:'16px 0'}}>尚無帳號</div>
          : users.map(u => (
            <div key={u.id} style={{background:'var(--surface)',borderRadius:10,padding:'12px 14px',
              marginBottom:10,border:'1px solid var(--border)',opacity:u.is_active?1:0.5}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                <div>
                  <span style={{fontWeight:700,fontSize:14}}>{u.name}</span>
                  <span style={{fontFamily:'monospace',fontSize:12,color:'var(--text3)',marginLeft:8}}>@{u.username}</span>
                </div>
                <span style={{background:ROLE_COLOR[u.role]+'22',color:ROLE_COLOR[u.role],
                  borderRadius:6,padding:'2px 8px',fontWeight:700,fontSize:12}}>
                  {ROLE_LABEL[u.role]||u.role}
                </span>
              </div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {editPw === u.id ? (
                  <>
                    <input type="password" placeholder="新密碼" value={newPw}
                      onChange={e=>setNewPw(e.target.value)}
                      style={{...iS,width:140,padding:'4px 8px',fontSize:13}}/>
                    <button style={btnSm('#4caf77','#fff')} onClick={()=>savePassword(u)} disabled={saving}>儲存</button>
                    <button style={btnSm('var(--s3)','var(--text)')} onClick={()=>{setEditPw(null);setNewPw('');}}>取消</button>
                  </>
                ) : (
                  <>
                    <button style={btnSm('var(--s3)','var(--text)')} onClick={()=>{setEditPw(u.id);setNewPw('');}}>改密碼</button>
                    <button style={btnSm(u.is_active?'#fff3e0':'#e8f5e9',u.is_active?'#e65100':'#2e7d32')} onClick={()=>toggleActive(u)}>
                      {u.is_active?'停用':'啟用'}

                    <button style={btnSm('#ffebee','#c62828')} onClick={()=>deleteUser(u)}>刪除</button>

          ))
      )}
    </div>
  );
}



/* ── Quote History Page ──────────────────────────────── */
function QuoteHistoryPage({ role, onBack }) {
  const isAdmin = role === 'admin';
  const [quotes,   setQuotes]   = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [page,     setPage]     = useState(1);
  const [hasMore,  setHasMore]  = useState(false);
  const [selected, setSelected] = useState(null); // quote object
  const [subView,  setSubView]  = useState('list'); // 'list' | 'newquote' | 'photoquote'

  /* 待確認成交 */
  const [pending,     setPending]     = useState([]);
  const [pendingFill, setPendingFill] = useState({});
  const [pendingBusy, setPendingBusy] = useState(null);

  /* 上傳圖片估價 */
  const fileRef = useRef(null);
  const [analyzing,  setAnalyzing]  = useState(false);
  const [quotePhoto, setQuotePhoto] = useState(null);

  /* 金工試算 */
  const [showCalc, setShowCalc] = useState(false);

  const loadPending = () => {
    fetch('/api/quotes/pending').then(r => r.json()).then(setPending).catch(() => {});
  };
  useEffect(loadPending, []);

  async function confirmPending(id) {
    const price = parseInt((pendingFill[id]||'').replace(/[^0-9]/g,''));
    if (!price) return;
    setPendingBusy(id);
    try {
      await fetch(`/api/quotes/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: price }),
      });
      setPending(prev => prev.filter(q => q.id !== id));
      load(1);
    } catch { alert('回填失敗'); }
    setPendingBusy(null);
  }

  const onPickFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setAnalyzing(true);
    try {
      const fd = new FormData();
      fd.append('files', f);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const d = await r.json();
      const u = (d.uploaded || [])[0];
      if (!u) throw new Error((d.errors && d.errors[0] && d.errors[0].error) || '上傳失敗');
      const fl = u.fields || {};
      const g = k => (fl[k] && fl[k].label) || null;
      setQuotePhoto({
        id: null, thumb_url: u.thumb_url, full_url: u.thumb_url,
        category: g('category'), gemstone: g('gemstone'), stone_size: g('stone_size'),
        stone_shape: g('stone_shape'), color: g('color'), metal_color: g('metal_color'),
        material: g('material'), style: g('style'), setting_amount: g('setting_amount'),
        craft_complexity: g('craft_complexity'),
      });
      setSubView('photoquote');
    } catch (err) { alert('圖片分析失敗：' + err.message); }
    setAnalyzing(false);
  };

  const load = async (pg = 1) => {
    setLoading(true);
    try {
      const r = await fetch(`/api/quotes?page=${pg}`);
      const d = await r.json();
      setQuotes(pg === 1 ? (d.quotes||[]) : prev => [...prev, ...(d.quotes||[])]);
      setHasMore(d.has_more);
      setPage(pg);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { load(1); }, []);

  if (subView === 'newquote') return (
    <PhotoQuoteFlow
      photo={{}}
      onBack={() => setSubView('list')}
      onClose={() => setSubView('list')}
    />
  );

  /* 上傳圖片 → Gemini 分析 → 正常估價流程（同看圖估價） */
  if (subView === 'photoquote' && quotePhoto) return (
    <PhotoQuoteFlow
      photo={quotePhoto}
      onBack={() => setSubView('list')}
      onClose={() => { setSubView('list'); load(1); loadPending(); }}
    />
  );

  return (
    <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',background:'var(--bg)',paddingTop:'var(--nav-h)'}}>
      <input type="file" accept="image/*" ref={fileRef} style={{display:'none'}} onChange={onPickFile} />
      {/* Header */}
      <div style={{padding:'14px 16px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--surface)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {onBack && (
            <button onClick={onBack} style={{background:'none',border:'none',color:'var(--text2)',fontSize:20,cursor:'pointer',padding:'0 4px',lineHeight:1}}>‹</button>
          )}
          <div>
            <div style={{fontSize:16,fontWeight:700,color:'var(--text)'}}>估價紀錄</div>
            <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>{quotes.length} 筆</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
          {isAdmin && quotes.length > 0 && (
            <button onClick={async () => {
              if (!confirm(`確定清空全部 ${quotes.length} 筆估價紀錄？`)) return;
              await fetch('/api/quotes/all', { method: 'DELETE' });
              setQuotes([]);
            }} style={{background:'#ffebee',color:'#c62828',border:'none',borderRadius:10,padding:'8px 12px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
              清空
            </button>
          )}
          <button onClick={() => setShowCalc(true)}
            style={{background:'var(--surface)',color:'var(--gold)',border:'1px solid var(--gold)',borderRadius:10,padding:'8px 12px',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
            ⚖ 金工試算
          </button>
          <button onClick={() => !analyzing && fileRef.current && fileRef.current.click()}
            disabled={analyzing}
            style={{background:'var(--gold)',color:'#fff',border:'none',borderRadius:10,padding:'8px 14px',fontSize:13,fontWeight:700,cursor:analyzing?'default':'pointer',opacity:analyzing?0.7:1,whiteSpace:'nowrap'}}>
            {analyzing ? 'AI 分析中…' : '📷 上傳估價'}
          </button>
          {isAdmin && (
            <button onClick={() => setSubView('newquote')} style={{background:'var(--s3)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:10,padding:'8px 12px',fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
              + 新估價
            </button>
          )}
        </div>
      </div>

      {/* 金工試算 overlay */}
      {showCalc && <CostCalcPanel onClose={() => setShowCalc(false)} />}

      {/* List */}
      <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
        {/* 待確認成交 */}
        {pending.length > 0 && (
          <div style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
            <div style={{padding:'12px 16px 4px',fontSize:10,fontWeight:700,letterSpacing:1.5,
              color: pending.some(q=>q.hours_elapsed>=24) ? '#c62828' : 'var(--text3)'}}>
              待確認成交 ({pending.length}){pending.some(q=>q.hours_elapsed>=24) ? '　⚠ 有超過 24 小時未回填' : ''}
            </div>
            {pending.map(q => {
              const overdue = q.hours_elapsed >= 24;
              const fillVal = pendingFill[q.id] || '';
              return (
                <div key={q.id} style={{borderTop:'1px solid var(--border)',padding:'10px 16px 12px'}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:2}}>{q.description || '(無描述)'}</div>
                  {q.customer_name && <div style={{fontSize:11,color:'var(--text2)'}}>客戶：{q.customer_name}</div>}
                  <div style={{fontSize:11,color:overdue?'#c62828':'var(--text3)',margin:'2px 0 8px'}}>
                    {(overdue ? '⚠ ' : '') + q.hours_elapsed + '小時前'}
                    {q.estimated_min ? `　·　${fmtNT(q.estimated_min)} – ${fmtNT(q.estimated_max)}` : ''}
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <div style={{position:'relative',flex:1}}>
                      <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',fontSize:12,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
                      <input type="text" inputMode="numeric" placeholder="成交價" value={fillVal}
                        onChange={e => setPendingFill(prev => ({...prev, [q.id]: e.target.value.replace(/[^0-9]/g,'')}))}
                        style={{width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 8px 8px 36px',fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)'}} />
                    </div>
                    <button onClick={() => confirmPending(q.id)} disabled={!fillVal || pendingBusy === q.id}
                      style={{background:fillVal?'var(--gold)':'var(--s3)',color:fillVal?'#fff':'var(--text3)',border:'none',borderRadius:7,padding:'8px 14px',fontSize:12,fontWeight:700,cursor:fillVal?'pointer':'default',whiteSpace:'nowrap'}}>
                      {pendingBusy === q.id ? '…' : '確認✓'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
        {loading && quotes.length === 0 && <div className="loading-msg">載入中…</div>}
        {!loading && quotes.length === 0 && pending.length === 0 && <div className="empty-msg">尚無估價紀錄</div>}
        {quotes.map(q => {
          const pending = !q.final_price || q.final_price === 0;
          const adj = (() => { try { return JSON.parse(q.adjusted_data||'{}'); } catch { return {}; } })();
          const thumbUrl = q.photo_id ? `/api/thumb/${q.photo_id}` : (q.ref_photo_url || null);
          return (
            <div key={q.id} onClick={() => setSelected(q)}
              style={{display:'flex',gap:12,alignItems:'center',padding:'12px 16px',background:'var(--surface)',borderBottom:'1px solid var(--border)',cursor:'pointer',transition:'background .12s'}}
              onTouchStart={e => e.currentTarget.style.background = 'var(--s3)'}
              onTouchEnd={e => e.currentTarget.style.background = 'var(--surface)'}
            >
              {/* Thumbnail */}
              <div style={{width:54,height:54,borderRadius:8,background:'var(--s3)',flexShrink:0,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {thumbUrl
                  ? <ImgZoom src={thumbUrl} fullSrc={`${thumbUrl}?size=1200`} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} />
                  : <span style={{fontSize:20}}>💎</span>}
              </div>
              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                  <span style={{fontSize:10,color:'var(--text3)',fontWeight:600}}>#{String(q.id).padStart(4,'0')}</span>
                  {q.customer_name && <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>{q.customer_name}</span>}
                  <span style={{marginLeft:'auto',fontSize:10,padding:'2px 8px',borderRadius:10,
                    background: pending ? '#fff3cd' : '#e8f5e9',
                    color:      pending ? '#856404' : '#2e7d32',
                    fontWeight: 600, flexShrink:0,
                  }}>{pending ? '未定價' : fmtNT(q.final_price)}</span>
                </div>
                <div style={{fontSize:12,color:'var(--text)',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {q.description || (adj.category && `${adj.category}・${adj.gemstone||''}`) || '—'}
                </div>
                <div style={{fontSize:10,color:'var(--text3)'}}>
                  {q.inquiry_time || (q.created_at ? q.created_at.slice(0,10) : '')}
                  {q.source_channel && ` · ${q.source_channel}`}
                </div>
              </div>
              <span style={{color:'var(--text3)',fontSize:16,flexShrink:0}}>›</span>
            </div>
          );
        })}
        {hasMore && !loading && (
          <div style={{padding:16,textAlign:'center'}}>
            <button onClick={() => load(page+1)} style={{background:'var(--s3)',border:'none',borderRadius:8,padding:'8px 24px',fontSize:13,cursor:'pointer',color:'var(--text)'}}>載入更多</button>
          </div>
        )}
      </div>

      {/* Detail overlay */}
      {selected && (
        <QuoteHistoryDetail
          quote={selected}
          onClose={() => { setSelected(null); load(1); }}
        />
      )}
    </div>
  );
}

/* ── Quote History Detail ────────────────────────────── */
function QuoteHistoryDetail({ quote: q, onClose }) {
  const [finalInput,   setFinalInput]   = useState('');
  const [saving,       setSaving]       = useState(false);
  const [saved,        setSaved]        = useState(false);
  const [cardMode,     setCardMode]     = useState(null); // null | 'ai' | 'final'
  const [confirmLock,  setConfirmLock]  = useState(false);
  const [locked,       setLocked]       = useState(!!q.locked_at);

  const adj = (() => { try { return JSON.parse(q.adjusted_data||'{}'); } catch { return {}; } })();
  const CHAIN_TO_WEIGHT_MAP = {'少':'輕 (1.5–3g)','正常':'中 (3–5g)','多':'偏重 (5–8g)'};
  // Fallback: parse description "戒指・藍寶石 1ct・輕奢"
  const descParts = (q.description || '').split('・');
  const catFB      = descParts[0]?.trim() || '';
  const stonePartFB = descParts[1] || '';
  const stoneNameFB = stonePartFB.replace(/\s+[\d.]+ct$/,'').trim();
  const caratFB    = parseFloat(stonePartFB.match(/([\d.]+)ct/)?.[1]) || 0;
  const styleFB    = descParts[2]?.trim() || '';
  // Resolved fields (adj preferred, fallback to top-level or parsed)
  const rCat      = adj.category       || catFB        || '';
  const rStone    = adj.gemstone       || q.gemstone   || stoneNameFB || '';
  const rCarat    = adj.carat          || caratFB      || 0;
  const rMaterial = adj.material       || q.material   || '';
  const rStyle    = adj.style          || styleFB      || '';
  const rCraft    = adj.craft_complexity || '';
  const rOrigin   = adj.origin         || '';
  const rTreat    = adj.treatment      || '';
  const rColorQ   = adj.colorQ         || '';
  const rStoneMode= adj.stoneMode      || 'invest';
  const rSidestone= adj.sidestone      || '';
  const rPlating  = adj.plating        || '';
  const rSize     = adj.size           || '';
  const rWeightKey      = adj.setting_amount ? (CHAIN_TO_WEIGHT_MAP[adj.setting_amount] || adj.setting_amount) : '';
  const rCommissionNote = adj.commission_note || '';
  const rOrderType      = adj.order_type      || '';
  const rStaffName      = adj.staff_name      || q.staff_name || '';
  const thumbUrl  = q.photo_id ? `/api/thumb/${q.photo_id}` : (q.ref_photo_url || null);
  const fullUrl   = q.photo_id ? `/api/thumb/${q.photo_id}?size=1200` : (q.ref_photo_url || null);
  const finalNum  = parseInt(String(finalInput).replace(/[^0-9]/g,'')) || 0;

  async function doSave() {
    if (!finalNum || locked) return;
    setSaving(true);
    try {
      const res = await fetch(`/api/quotes/${q.id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json', ...authHeaders()},
        body: JSON.stringify({ final_price: finalNum }),
      });
      if (res.ok) { setSaved(true); }
      else {
        const raw = await res.text().catch(() => '');
        let detail = raw;
        try { const j = JSON.parse(raw); detail = JSON.stringify(j.detail || j); } catch {}
        alert('儲存失敗 ' + res.status + (detail ? '\n' + detail : ''));
      }
    } catch(e) { alert('網路錯誤：' + e.message); }
    setSaving(false);
  }

  async function doLockAndShow() {
    setSaving(true);
    try {
      const res = await fetch(`/api/quotes/${q.id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json', ...authHeaders()},
        body: JSON.stringify({ final_price: finalNum, lock: true }),
      });
      if (res.ok) {
        setLocked(true);
        setConfirmLock(false);
        setCardMode('final');
      } else {
        alert('鎖定失敗，請重試');
      }
    } catch(e) { alert('網路錯誤：' + e.message); }
    setSaving(false);
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:300,display:'flex',alignItems:'flex-end'}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{width:'100%',maxHeight:'88vh',background:'var(--surface)',borderRadius:'18px 18px 0 0',display:'flex',flexDirection:'column',animation:'up .25s cubic-bezier(.32,.72,0,1)',overflow:'hidden'}}>
        {/* Header */}
        <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:'50%',background:'var(--s3)',border:'none',fontSize:16,cursor:'pointer'}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700}}>
              #{String(q.id).padStart(4,'0')} {q.customer_name ? `· ${q.customer_name}` : ''}
            </div>
            <div style={{fontSize:11,color:'var(--text3)'}}>{q.inquiry_time || q.created_at?.slice(0,10)}</div>
          </div>
          <div style={{fontSize:11,color:'var(--text3)'}}>{q.inquiry_time || q.created_at?.slice(0,10)}</div>
        </div>

        <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'16px'}}>
          {/* Photo + basic info */}
          <div style={{display:'flex',gap:12,marginBottom:16}}>
            {thumbUrl && (
              <div style={{width:80,height:80,borderRadius:10,background:'var(--s3)',flexShrink:0,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <ImgZoom src={thumbUrl} fullSrc={fullUrl} alt="" style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain'}} />
              </div>
            )}
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:4}}>{q.description||'—'}</div>
              {q.source_channel && <div style={{fontSize:11,color:'var(--text3)'}}>來源：{q.source_channel}</div>}
              {q.estimated_min > 0 && (
                <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>
                  AI估算：{fmtNT(q.estimated_min)} – {fmtNT(q.estimated_max)}
                </div>
              )}
              {q.budget > 0 && (
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>
                  客戶預算：{fmtNT(q.budget)}
                </div>
              )}
