<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JewelryDB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f5f5f5;
      --surface: #ffffff;
      --text:    #1a1a1a;
      --text2:   #888888;
      --border:  #ebebeb;
      --accent:  #1a1a1a;
      --chip-bg: #f0f0f0;
      --radius:  10px;
      --tab-h:   56px;
      --nav-h:   50px;
    }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent; }
    #root { height: 100%; display: flex; flex-direction: column; }

    /* Nav */
    .nav { height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; flex-shrink: 0; }
    .nav-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }

    /* Tab bar */
    .tab-bar { height: var(--tab-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 10px; font-weight: 500; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* Screen */
    .screen { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

    /* Filter chips */
    .filter-row { padding: 10px 12px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 3px; padding: 6px 12px; border-radius: 20px; background: var(--chip-bg); font-size: 13px; color: var(--text); border: none; cursor: pointer; margin-right: 6px; white-space: nowrap; }
    .chip.active { background: var(--accent); color: #fff; }
    .chip-clear { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 20px; background: none; border: 1px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; margin-right: 6px; white-space: nowrap; }

    /* Photo grid */
    .photo-grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
    .photo-card { background: var(--surface); cursor: pointer; overflow: hidden; }
    .photo-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f0f0f0; }
    .photo-card-label { padding: 5px 8px 7px; font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sentinel { height: 1px; }
    .loading-row { text-align: center; padding: 24px; color: var(--text2); font-size: 13px; }
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text2); font-size: 14px; line-height: 1.6; }

    /* Sheet */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-end; }
    .sheet { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; animation: slideUp .22s cubic-bezier(.32,.72,0,1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
    .sheet-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .sheet-title { font-size: 16px; font-weight: 600; }
    .sheet-close { width: 28px; height: 28px; border-radius: 50%; background: var(--chip-bg); border: none; cursor: pointer; font-size: 18px; line-height: 28px; text-align: center; }
    .sheet-body { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .sheet-item { padding: 14px 16px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-item:active { background: var(--chip-bg); }
    .sheet-item.selected { font-weight: 600; }
    .sheet-item.clear-item { color: var(--text2); font-size: 14px; }

    /* Photo detail */
    .detail-img { width: 100%; max-height: 55vw; object-fit: cover; display: block; background: #f0f0f0; }
    .detail-tags { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 10px; background: var(--chip-bg); border-radius: 20px; font-size: 12px; color: var(--text); }
    .detail-actions { padding: 10px 16px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 13px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; }

    /* Similar grid */
    .similar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
    .similar-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f0f0f0; cursor: pointer; }

    /* Quote */
    .quote-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .quote-hero { padding: 48px 24px 24px; text-align: center; }
    .quote-hero h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .quote-hero p { color: var(--text2); font-size: 14px; }
    .quote-big-btn { display: block; margin: 0 24px; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; width: calc(100% - 48px); text-align: center; }

    .step-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .step-back { width: 36px; height: 36px; border-radius: 50%; background: var(--chip-bg); border: none; cursor: pointer; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .step-info { flex: 1; }
    .step-num { font-size: 11px; color: var(--text2); margin-bottom: 1px; }
    .step-title { font-size: 17px; font-weight: 600; }
    .step-body { padding: 16px; }
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .option-btn { padding: 16px 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: center; font-size: 13px; font-weight: 500; line-height: 1.4; }
    .option-btn.selected { border-color: var(--accent); background: #f5f5f5; font-weight: 700; }
    .option-btn:active { background: var(--chip-bg); }
    .step-skip { width: 100%; padding: 14px; background: none; border: none; color: var(--text2); font-size: 13px; cursor: pointer; margin-top: 6px; text-align: center; }

    /* From-photo attrs */
    .attr-row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .attr-row:active { background: var(--chip-bg); }
    .attr-label { width: 72px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
    .attr-value { flex: 1; font-size: 14px; }
    .attr-arrow { color: #ccc; font-size: 16px; }

    /* Result */
    .result-top { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
    .result-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .price-range { font-size: 26px; font-weight: 700; margin: 4px 0; }
    .price-note { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .result-photos { padding: 14px 16px; }
    .result-photos h3 { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .result-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 4px; background: #f0f0f0; }
    .no-estimate { padding: 20px 0; color: var(--text2); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="/js/vendor/react.min.js"></script>
<script src="/js/vendor/react-dom.min.js"></script>
<script src="/js/vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── Config ──────────────────────────────────────────── */
const CFG = {
  category:    { label: '品項',  values: ['手鏈','墜子','耳釘','項鏈','胸針','戒指','手鐲','其他'] },
  gemstone:    { label: '寶石',  values: ['鑽石','紅寶石','藍寶石','祖母綠','坦桑石','海藍寶','碧璽','珍珠','翡翠','其他彩寶','無寶石'] },
  stone_shape: { label: '形狀',  values: ['橢圓形','圓形','水滴形','心形','方形','長方形','馬眼形','枕形','花形','不規則','無主石'] },
  stone_size:  { label: '大小',  values: ['1克拉以內','1克拉','2克拉','3克拉','5克拉','10克拉以上'] },
  style:       { label: '款式',  values: ['無鑽','簡約(5顆鑽內)','輕奢(20顆鑽內)','豪鑲滿鑲鑽'] },
  color:       { label: '顏色',  values: ['紅色','粉紅色','橙色','黃色','綠色','藍色','紫色','白色','無色透明','黑色','多色'] },
};

const QUOTE_STEPS = [
  { field: 'category',    label: '選品項',   canSkip: false },
  { field: 'stone_size',  label: '主石大小', canSkip: false },
  { field: 'stone_shape', label: '主石形狀', canSkip: false },
  { field: 'style',       label: '款式等級', canSkip: false },
  { field: 'gemstone',    label: '寶石種類', canSkip: true  },
];

/* ─── Icons ───────────────────────────────────────────── */
function IconBrowse() {
  return (
    <svg viewBox="0 0 24 24" style={{width:22,height:22,stroke:'currentColor',fill:'none',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'}}>
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  );
}
function IconQuote() {
  return (
    <svg viewBox="0 0 24 24" style={{width:22,height:22,stroke:'currentColor',fill:'none',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'}}>
      <circle cx="12" cy="12" r="9"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="15" x2="12.01" y2="15"/>
    </svg>
  );
}

/* ─── Sheet ───────────────────────────────────────────── */
function Sheet({ title, onClose, children }) {
  return (
    <div className="sheet-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sheet">
        <div className="sheet-handle" />
        <div className="sheet-header">
          <span className="sheet-title">{title}</span>
          <button className="sheet-close" onClick={onClose}>×</button>
        </div>
        <div className="sheet-body">{children}</div>
      </div>
    </div>
  );
}

/* ─── Filter sheet ────────────────────────────────────── */
function FilterSheet({ field, current, onSelect, onClose }) {
  const cfg = CFG[field];
  return (
    <Sheet title={'選擇' + cfg.label} onClose={onClose}>
      {current && (
        <div className="sheet-item clear-item" onClick={() => { onSelect(null); onClose(); }}>
          清除篩選（顯示全部）
        </div>
      )}
      {cfg.values.map(v => (
        <div key={v} className={'sheet-item' + (current === v ? ' selected' : '')}
          onClick={() => { onSelect(v); onClose(); }}>
          <span>{v}</span>
          {current === v && <span style={{color:'var(--accent)'}}>✓</span>}
        </div>
      ))}
    </Sheet>
  );
}

/* ─── Photo detail sheet ──────────────────────────────── */
function PhotoDetail({ photo, onClose, onSimilar, onQuote }) {
  const tags = [photo.category, photo.gemstone, photo.stone_shape, photo.stone_size, photo.style, photo.color, photo.material]
    .filter(v => v && v !== '未定');
  return (
    <Sheet title="款式詳情" onClose={onClose}>
      <img className="detail-img" src={photo.full_url} alt="" loading="lazy" />
      <div className="detail-tags">
        {tags.map((t, i) => <span key={i} className="tag">{t}</span>)}
        {photo.price_band && <span className="tag" style={{color:'var(--text2)'}}>{photo.price_band}</span>}
      </div>
      <div className="detail-actions">
        <button className="btn btn-outline" onClick={() => { onClose(); onSimilar(photo); }}>找相似</button>
        <button className="btn btn-primary" onClick={() => { onClose(); onQuote(photo); }}>用此估價</button>
      </div>
    </Sheet>
  );
}

/* ─── Similar sheet ───────────────────────────────────── */
function SimilarSheet({ anchor, onClose, onSelectPhoto }) {
  const [items, setItems] = useState(null);
  useEffect(() => {
    fetch('/api/photos/' + anchor.id + '/similar?limit=12')
      .then(r => r.json())
      .then(d => setItems(d.similar || []))
      .catch(() => setItems([]));
  }, [anchor.id]);
  return (
    <Sheet title={'相似款 · ' + (anchor.category || '')} onClose={onClose}>
      {items === null
        ? <div className="loading-row">載入中…</div>
        : items.length === 0
          ? <div className="empty-state">找不到相似款</div>
          : <div className="similar-grid">
              {items.map(p => (
                <img key={p.id} src={p.thumb_url} alt="" loading="lazy"
                  onClick={() => { onClose(); onSelectPhoto(p); }} />
              ))}
            </div>
      }
    </Sheet>
  );
}

/* ─── Browse tab ──────────────────────────────────────── */
function BrowseTab({ onQuote }) {
  const [photos, setPhotos]     = useState([]);
  const [loading, setLoading]   = useState(false);
  const [filters, setFilters]   = useState({});
  const [openFilter, setOpenF]  = useState(null);
  const [detail, setDetail]     = useState(null);
  const [similar, setSimilar]   = useState(null);

  // Refs so IntersectionObserver never needs to be recreated
  const loadingRef  = useRef(false);
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const filtersRef  = useRef({});
  const sentinelRef = useRef(null);
  const fetchRef    = useRef(null);

  // Define fetch function, update fetchRef every render
  const doFetch = async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random' });
      Object.entries(filtersRef.current).forEach(([k, v]) => v && qs.set(k, v));
      const res  = await fetch('/api/photos?' + qs);
      const data = await res.json();
      const list = data.photos || [];
      if (pageRef.current === 1) setPhotos(list);
      else setPhotos(prev => [...prev, ...list]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current += 1;
    } catch(e) {
      hasMoreRef.current = false;
    } finally {
      loadingRef.current = false;
      setLoading(false);
    }
  };
  fetchRef.current = doFetch;

  // Observer: set up once, empty deps → never recreated → no infinite loop
  useEffect(() => {
    const sentinel = sentinelRef.current;
    if (!sentinel) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) fetchRef.current?.(); },
      { rootMargin: '300px' }
    );
    obs.observe(sentinel);
    return () => obs.disconnect();
  }, []);

  // Initial load
  useEffect(() => { fetchRef.current?.(); }, []);

  const applyFilter = (field, value) => {
    const next = { ...filtersRef.current };
    if (value) next[field] = value; else delete next[field];
    filtersRef.current = next;
    setFilters({ ...next });
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    setPhotos([]);
    fetchRef.current?.();
  };

  const clearAll = () => {
    filtersRef.current = {};
    setFilters({});
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    setPhotos([]);
    fetchRef.current?.();
  };

  const hasFilters = Object.keys(filters).length > 0;

  return (
    <div className="screen">
      <div className="filter-row">
        {Object.entries(CFG).map(([field, cfg]) => (
          <button key={field}
            className={'chip' + (filters[field] ? ' active' : '')}
            onClick={() => setOpenF(field)}>
            {filters[field] || cfg.label} {filters[field] ? '✕' : '▾'}
          </button>
        ))}
        {hasFilters && (
          <button className="chip-clear" onClick={clearAll}>清除全部</button>
        )}
      </div>

      <div className="photo-grid-wrap">
        <div className="photo-grid">
          {photos.map(p => (
            <div key={p.id} className="photo-card" onClick={() => setDetail(p)}>
              <img src={p.thumb_url} alt="" loading="lazy" />
              <div className="photo-card-label">
                {[p.category, p.gemstone].filter(v => v && v !== '未定').join(' · ')}
              </div>
            </div>
          ))}
        </div>
        {loading && <div className="loading-row">載入中…</div>}
        {!loading && photos.length === 0 && !hasMoreRef.current && (
          <div className="empty-state">
            沒有符合條件的照片<br/>
            <span style={{fontSize:12}}>試著移除部分篩選條件</span>
          </div>
        )}
        <div ref={sentinelRef} className="sentinel" />
      </div>

      {openFilter && (
        <FilterSheet field={openFilter} current={filters[openFilter] || null}
          onSelect={v => applyFilter(openFilter, v)}
          onClose={() => setOpenF(null)} />
      )}

      {detail && !similar && (
        <PhotoDetail photo={detail}
          onClose={() => setDetail(null)}
          onSimilar={p => { setDetail(null); setSimilar(p); }}
          onQuote={p => { setDetail(null); onQuote(p); }} />
      )}

      {similar && (
        <SimilarSheet anchor={similar}
          onClose={() => setSimilar(null)}
          onSelectPhoto={p => { setSimilar(null); setDetail(p); }} />
      )}
    </div>
  );
}

/* ─── Attr edit sheet (from-photo step) ──────────────── */
function AttrEditSheet({ field, current, onSelect, onClose }) {
  const cfg = CFG[field];
  if (!cfg) return null;
  return (
    <Sheet title={'修改' + cfg.label} onClose={onClose}>
      {current && (
        <div className="sheet-item clear-item" onClick={() => { onSelect(null); onClose(); }}>
          清除（不限定）
        </div>
      )}
      {cfg.values.map(v => (
        <div key={v} className={'sheet-item' + (current === v ? ' selected' : '')}
          onClick={() => { onSelect(v); onClose(); }}>
          <span>{v}</span>
          {current === v && <span style={{color:'var(--accent)'}}>✓</span>}
        </div>
      ))}
    </Sheet>
  );
}

/* ─── Quote tab ───────────────────────────────────────── */
function QuoteTab({ initData, onClearInit }) {
  const [step,      setStep]      = useState('home');
  const [data,      setData]      = useState({});
  const [result,    setResult]    = useState(null);
  const [fetching,  setFetching]  = useState(false);
  const [editField, setEditField] = useState(null);

  useEffect(() => {
    if (initData) {
      setData(initData);
      setStep('from-photo');
      setResult(null);
    }
  }, [initData]);

  const startNew = () => {
    setData({}); setResult(null); setStep(0); onClearInit?.();
  };

  const goBack = () => {
    if (step === 'from-photo')                     { setStep('home'); setData({}); onClearInit?.(); }
    else if (step === 'result')                    { setStep(QUOTE_STEPS.length - 1); }
    else if (typeof step === 'number' && step > 0) { setStep(step - 1); }
    else                                           { setStep('home'); }
  };

  const choose = (field, value) => {
    const next = { ...data, [field]: value };
    setData(next);
    const idx = typeof step === 'number' ? step : 0;
    if (idx + 1 < QUOTE_STEPS.length) setStep(idx + 1);
    else runEstimate(next);
  };

  const runEstimate = async (d) => {
    setFetching(true);
    setStep('result');
    try {
      const qs = new URLSearchParams();
      Object.entries(d || data).forEach(([k, v]) => v && qs.set(k, v));
      const res = await fetch('/api/quotes/estimate-by-attrs?' + qs);
      setResult(await res.json());
    } catch(e) {
      setResult({ estimated: false, message: '網路錯誤', matching_photos: [] });
    } finally {
      setFetching(false);
    }
  };

  const fmt = n => n ? 'NT$' + n.toLocaleString() : '—';

  /* Home */
  if (step === 'home') return (
    <div className="screen">
      <div className="quote-wrap">
        <div className="quote-hero">
          <h2>估 價</h2>
          <p>依款式特徵快速估算參考價格</p>
        </div>
        <button className="quote-big-btn" onClick={startNew}>＋ 開始估價</button>
      </div>
    </div>
  );

  /* From-photo */
  if (step === 'from-photo') {
    const attrFields = ['category','gemstone','stone_shape','stone_size','style','color'];
    return (
      <div className="screen">
        <div className="quote-wrap">
          <div className="step-header">
            <button className="step-back" onClick={goBack}>←</button>
            <div className="step-info">
              <div className="step-num">以照片估價</div>
              <div className="step-title">確認款式屬性</div>
            </div>
          </div>
          {data.photo_url && (
            <img src={data.photo_url}
              style={{width:'100%',maxHeight:'50vw',objectFit:'cover',display:'block',background:'#f0f0f0'}}
              alt="" />
          )}
          {attrFields.filter(f => CFG[f]).map(f => (
            <div key={f} className="attr-row" onClick={() => setEditField(f)}>
              <span className="attr-label">{CFG[f].label}</span>
              <span className="attr-value">{data[f] || <span style={{color:'var(--text2)'}}>—</span>}</span>
              <span className="attr-arrow">›</span>
            </div>
          ))}
          <div style={{padding:'14px 16px 28px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <button className="btn btn-outline" onClick={goBack}>返回</button>
            <button className="btn btn-primary" onClick={() => runEstimate(data)}>開始估價</button>
          </div>
        </div>
        {editField && (
          <AttrEditSheet field={editField} current={data[editField] || null}
            onSelect={v => setData(prev => { const n={...prev}; if(v) n[editField]=v; else delete n[editField]; return n; })}
            onClose={() => setEditField(null)} />
        )}
      </div>
    );
  }

  /* Step */
  if (typeof step === 'number') {
    const s = QUOTE_STEPS[step];
    const values = CFG[s.field]?.values || [];
    return (
      <div className="screen">
        <div className="quote-wrap">
          <div className="step-header">
            <button className="step-back" onClick={goBack}>←</button>
            <div className="step-info">
              <div className="step-num">{'步驟 ' + (step + 1) + ' / ' + QUOTE_STEPS.length}</div>
              <div className="step-title">{s.label}</div>
            </div>
          </div>
          <div className="step-body">
            <div className="option-grid">
              {values.map(v => (
                <button key={v}
                  className={'option-btn' + (data[s.field] === v ? ' selected' : '')}
                  onClick={() => choose(s.field, v)}>
                  {v}
                </button>
              ))}
            </div>
            {s.canSkip && (
              <button className="step-skip" onClick={() => {
                if (step + 1 < QUOTE_STEPS.length) setStep(step + 1);
                else runEstimate(data);
              }}>略過 →</button>
            )}
          </div>
        </div>
      </div>
    );
  }

  /* Result */
  if (step === 'result') {
    const tags = ['category','stone_size','stone_shape','style','gemstone','color']
      .filter(k => data[k]).map(k => data[k]);
    return (
      <div className="screen">
        <div className="quote-wrap">
          <div className="result-top">
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
              <button className="step-back" onClick={goBack}>←</button>
              <span style={{fontWeight:600,fontSize:16}}>估價結果</span>
            </div>
            <div className="result-chips">
              {tags.map((t, i) => <span key={i} className="tag">{t}</span>)}
            </div>
            {fetching
              ? <div className="loading-row">計算中…</div>
              : result?.estimated
                ? <>
                    <div className="price-range">{fmt(result.price_low)} ~ {fmt(result.price_high)}</div>
                    <div className="price-note">參考 {result.sample_count} 筆歷史成交 · {result.source}</div>
                  </>
                : <div className="no-estimate">{result?.message || '成交紀錄不足，無法推估'}</div>
            }
          </div>
          {result?.matching_photos?.length > 0 && (
            <div className="result-photos">
              <h3>相似參考款（{result.matching_photos.length} 張）</h3>
              <div className="result-grid">
                {result.matching_photos.map(p => (
                  <img key={p.id} src={'/static/thumb/' + p.filename} alt="" loading="lazy" />
                ))}
              </div>
            </div>
          )}
          <div style={{padding:'16px 16px 28px'}}>
            <button className="quote-big-btn" style={{margin:0,width:'100%'}} onClick={startNew}>
              重新估價
            </button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

/* ─── App ─────────────────────────────────────────────── */
function App() {
  const [tab,       setTab]      = useState(0);
  const [quoteInit, setQuoteInit] = useState(null);

  const handleQuote = photo => {
    setQuoteInit({
      photo_url:   photo.full_url || photo.thumb_url || null,
      category:    photo.category    || null,
      stone_shape: photo.stone_shape || null,
      stone_size:  photo.stone_size  || null,
      style:       photo.style       || null,
      gemstone:    photo.gemstone    || null,
      color:       photo.color       || null,
    });
    setTab(1);
  };

  return (
    <React.Fragment>
      <div className="nav">
        <span className="nav-title">JewelryDB</span>
      </div>
      {tab === 0 && <BrowseTab onQuote={handleQuote} />}
      {tab === 1 && <QuoteTab initData={quoteInit} onClearInit={() => setQuoteInit(null)} />}
      <div className="tab-bar">
        <button className={'tab-btn' + (tab === 0 ? ' active' : '')} onClick={() => setTab(0)}>
          <IconBrowse /><span>找款</span>
        </button>
        <button className={'tab-btn' + (tab === 1 ? ' active' : '')} onClick={() => setTab(1)}>
          <IconQuote /><span>估價</span>
        </button>
      </div>
    </React.Fragment>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
