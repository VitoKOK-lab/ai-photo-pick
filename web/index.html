/* ── PricingBanner ──────────────────────────────────── */
function PricingBanner({ metalsLastUpdated, onGotoSettings }) {
  const DISMISS_KEY = 'pricingBannerDismissed';
  const DISMISS_TTL = 7 * 24 * 3600 * 1000; // 7 days in ms

  const [visible, setVisible] = React.useState(() => {
    try {
      const raw = localStorage.getItem(DISMISS_KEY);
      if (!raw) return true;
      const { ts } = JSON.parse(raw);
      return Date.now() - ts > DISMISS_TTL;
    } catch { return true; }
  });

  if (!visible || !metalsLastUpdated) return null;

  // Calculate days since last update
  const lastMs = new Date(metalsLastUpdated).getTime();
  const daysSince = Math.floor((Date.now() - lastMs) / (24 * 3600 * 1000));
  if (daysSince <= 7) return null;

  function dismiss() {
    localStorage.setItem(DISMISS_KEY, JSON.stringify({ ts: Date.now() }));
    setVisible(false);
  }

  return (
    <div className="pricing-banner">
      <span className="banner-msg">⚠️ 金銀行情已 {daysSince} 天未更新</span>
      {onGotoSettings && (
        <button className="banner-goto" onClick={onGotoSettings}>前往更新</button>
      )}
      <button className="banner-dismiss" onClick={dismiss} title="關閉">✕</button>
    </div>
  );
}

/* ── StagingSection ─────────────────────────────────── */
function StagingSection() {
  const [files,   setFiles]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [status,  setStatus]  = useState(null);
  const [polling, setPolling] = useState(false);

  function load() {
    setLoading(true);
    fetch('/api/staging').then(r => r.json()).then(d => {
      setFiles(d.files || []);
      setLoading(false);
    }).catch(() => setLoading(false));
  }

  useEffect(() => { load(); }, []);

  // poll ingest status while running
  useEffect(() => {
    if (!polling) return;
    const id = setInterval(() => {
      fetch('/api/staging/ingest-status').then(r => r.json()).then(s => {
        setStatus(s);
        if (!s.running) {
          setPolling(false);
          load();
        }
      });
    }, 1500);
    return () => clearInterval(id);
  }, [polling]);

  function del(rel) {
    fetch(`/api/staging/files/${encodeURIComponent(rel)}`, { method: 'DELETE' })
      .then(() => setFiles(f => f.filter(x => x.rel !== rel)));
  }

  function startIngest() {
    fetch('/api/staging/ingest', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        setStatus(d.status || {});
        setPolling(true);
      });
  }

  const running = status?.running;
  const done    = status?.done;

  return (
    <div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:8}}>
        將照片放入 <code>data/01_unsorted/</code>，預看後按「確認匯入」。
      </div>
      {loading
        ? <div className="staging-empty">載入中…</div>
        : files.length === 0
          ? <div className="staging-empty">目前沒有待匯入照片</div>
          : (
            <div className="staging-grid">
              {files.map(f => (
                <div key={f.rel} className="staging-card">
                  <img src={`/api/staging/thumb/${encodeURIComponent(f.rel)}`} loading="lazy" />
                  <button className="staging-card-del" onClick={() => del(f.rel)} title="刪除">✕</button>
                </div>
              ))}
            </div>
          )
      }
      <div className="staging-actions">
        <button
          className="staging-ingest-btn"
          disabled={files.length === 0 || running}
          onClick={startIngest}
        >
          {running ? `匯入中… ${status?.step || ''}` : `確認匯入 ${files.length} 張`}
        </button>
        <button className="staging-ingest-btn" style={{flex:'none',background:'#888'}} onClick={load}>重新整理</button>
      </div>
      {status && (
        <div className="staging-status">
          {done ? '✅ 匯入完成' : running ? `⏳ ${status.step}` : status.step || ''}
        </div>
      )}
    </div>
  );
}

function GuestApp({ token }) {
  const [info,       setInfo]       = useState(null);
  const [error,      setError]      = useState('');
  const [favIds,     setFavIds]     = useState(new Set());
  const [remain,     setRemain]     = useState(0);
  const [showSheet,  setShowSheet]  = useState(false);
  const [limitToast, setLimitToast] = useState(false);
  const MAX_FAVS = 9;

  useEffect(() => {
    fetch(`/api/guest-links/info/${token}`)
      .then(r => { if (!r.ok) throw r.status; return r.json(); })
      .then(d => { setInfo(d); setRemain(d.remaining_min); })
      .catch(s => setError(s === 410 ? '連結已過期或停用' : '連結不存在'));
  }, [token]);

  useEffect(() => {
    if (!info) return;
    fetch(`/api/guest-links/favorites/${token}`)
      .then(r => r.json())
      .then(d => setFavIds(new Set((d.favorites || []).map(f => f.photo_id))));
  }, [info]);

  useEffect(() => {
    if (!info) return;
    const t = setInterval(() => setRemain(m => Math.max(0, m - 1)), 60000);
    return () => clearInterval(t);
  }, [info]);

  const isFav = id => favIds.has(id);

  const toggleFav = async photo => {
    const id = typeof photo === 'object' ? photo.id : photo;
    if (!favIds.has(id) && favIds.size >= MAX_FAVS) {
      setLimitToast(true);
      setTimeout(() => setLimitToast(false), 2500);
      return;
    }
    try {
      const r = await fetch(`/api/guest-links/favorite/${token}/${id}`, { method: 'POST' });
      if (!r.ok) return;
      const d = await r.json();
      setFavIds(prev => { const n = new Set(prev); d.favorited ? n.add(id) : n.delete(id); return n; });
    } catch {}
  };

  if (error) return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      height:'100vh',gap:12,padding:24,textAlign:'center'}}>
      <div style={{fontSize:48}}>⏰</div>
      <div style={{fontSize:18,fontWeight:700}}>{error}</div>
      <div style={{fontSize:13,color:'#888'}}>請聯繫服務人員取得新連結</div>
    </div>
  );

  if (!info) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:14,color:'#888'}}>
      載入中…
    </div>
  );

  const hrs = Math.floor(remain / 60);
  const timeStr = hrs > 0 ? `${hrs}小時${remain % 60}分` : `${remain % 60}分`;
  const atLimit = favIds.size >= MAX_FAVS;

  return (
    <React.Fragment>
      <header className="nav">
        <span className="nav-logo">Tahir Zainab Selection</span>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:12,color:'var(--text2)'}}>⏱ {timeStr}</span>
          {/* 收藏按鈕 */}
          <button onClick={() => setShowSheet(true)}
            style={{display:'flex',alignItems:'center',gap:5,
              background: atLimit ? 'var(--accent)' : 'var(--gold)',
              color:'#fff',border:'none',borderRadius:20,
              padding:'5px 12px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            ❤️ {favIds.size}
            <span style={{fontWeight:400,fontSize:11,opacity:0.85}}>/{MAX_FAVS}</span>
          </button>
        </div>
      </header>

      <div className="content" style={{paddingBottom: favIds.size > 0 ? 56 : 0}}>
        <BrowseTab isFav={isFav} toggleFav={toggleFav} role="viewer" />
      </div>

      {/* 底部提示條 */}
      {favIds.size > 0 && (
        <div onClick={() => setShowSheet(true)}
          style={{position:'fixed',bottom:0,left:0,right:0,zIndex:300,
            background: atLimit ? 'var(--accent)' : 'var(--gold)', color:'#fff',
            padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',
            cursor:'pointer',fontSize:13,fontWeight:600}}>
          <span>
            {atLimit
              ? `✅ 已選滿 ${MAX_FAVS} 張 — 請通知店員`
              : `❤️ 已收藏 ${favIds.size} / ${MAX_FAVS} 張`}
          </span>
          <span style={{fontSize:12,fontWeight:400,opacity:0.9}}>管理收藏 →</span>
        </div>
      )}

      {/* 上限提示 toast */}
      {limitToast && (
        <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
          zIndex:500,background:'rgba(0,0,0,0.82)',color:'#fff',
          padding:'14px 24px',borderRadius:12,fontSize:14,fontWeight:600,
          textAlign:'center',maxWidth:240,lineHeight:1.5,pointerEvents:'none'}}>
          已達上限 {MAX_FAVS} 張<br/>
          <span style={{fontSize:12,fontWeight:400,opacity:0.8}}>點底部「管理收藏」可取消後再選</span>
        </div>
      )}

      {/* 收藏管理 sheet */}
      {showSheet && (
        <GuestFavSheet
          token={token}
          favIds={favIds}
          onToggle={toggleFav}
          onClose={() => setShowSheet(false)}
        />
      )}
    </React.Fragment>
  );
}

                      <img src={`/api/thumb/${f.photo_id}`}
                        style={{width:'100%',aspectRatio:'1/1',objectFit:'cover',display:'block'}} />
                      {/* hover hint overlay */}
                      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0)',
                        display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <span style={{background:'rgba(0,0,0,0.45)',color:'#fff',borderRadius:20,
                          fontSize:10,fontWeight:700,padding:'3px 9px',opacity:0}}>
                          放大
                        </span>
                      </div>
                      <div style={{padding:'4px 6px',fontSize:10,color:'var(--text3)',
                        background:'var(--surface)',lineHeight:1.4}}>
                        {[f.category, f.gemstone, f.style].filter(Boolean).join(' · ')}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      </div>

      {/* loading spinner */}
      {loadingPhoto && (
        <div style={{position:'fixed',inset:0,zIndex:700,background:'rgba(0,0,0,0.4)',
          display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{color:'#fff',fontSize:14}}>載入中…</div>
        </div>
      )}

      {/* PhotoDetail overlay — transform creates new fixed containing block above modal z-index */}
      {selectedPhoto && (
        <div style={{position:'fixed',inset:0,zIndex:900,transform:'translateZ(0)'}}>
          <PhotoDetail
            photo={selectedPhoto}
            onClose={() => setSelectedPhoto(null)}
            isFav={() => false}
            toggleFav={() => {}}
            role={role}
            onDeleted={null}
            onUpdated={null}
          />
        </div>
      )}
    </>
  );
}

/* ── 員工：客人連結管理 ──────────────────────────────── */
function GuestLinksPanel() {
  const [links,    setLinks]    = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [creating, setCreating] = useState(false);
  const [name,     setName]     = useState('');
  const isAdmin = getJwtUser()?.role === 'admin';
  const staffName = getJwtUser()?.name || getJwtUser()?.username || '';
  const [msg,      setMsg]      = useState('');
  const [newLink,  setNewLink]  = useState(null);
  const [viewLink, setViewLink] = useState(null);

  const baseUrl = window.location.origin;

  function flash(t) { setMsg(t); setTimeout(()=>setMsg(''), 3000); }

  async function load() {
    setLoading(true);
    try { const r = await fetch('/api/guest-links'); setLinks(await r.json()); }
    finally { setLoading(false); }
  }
  useEffect(() => { load(); }, []);

  async function create() {
    if (!name.trim()) { flash('請輸入客人 LINE ID'); return; }
    setCreating(true);
    const r = await fetch('/api/guest-links', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ customer_name: name.trim(), staff_name: staffName.trim() }),
    });
    setCreating(false);
    if (r.ok) {
      const d = await r.json();
      setNewLink({ url: `${baseUrl}/?g=${d.token}`, ...d });
      setName('');
      load();
    } else {
      try { const e = await r.json(); flash('建立失敗：' + (e.detail || r.status)); }
      catch { flash('建立失敗（' + r.status + '）'); }
    }
  }

  async function deactivate(token) {
    // optimistic update — no full reload
    setLinks(prev => prev.map(l => l.token === token
      ? { ...l, is_active: 0, active: false }
      : l
    ));
    await fetch(`/api/guest-links/${token}`, { method:'DELETE' });
    flash('已停用');
  }

  async function restore(token) {
    const r = await fetch(`/api/guest-links/${token}/restore`, { method:'PATCH' });
    if (!r.ok) { flash('恢復失敗'); return; }
    const d = await r.json();
    setLinks(prev => prev.map(l => l.token === token
      ? { ...l, is_active: 1, active: true, expired: false, expires_at: d.expires_at }
      : l
    ));
    flash('已恢復，有效期再延 4 小時');
  }

  async function copyLink(url) {
    try { await navigator.clipboard.writeText(url); flash('連結已複製！'); }
    catch { flash(url); }
  }

  const iS = { padding:'8px 12px', border:'2px solid #c8b89a', borderRadius:8, fontSize:14,
               background:'#fdf8ef', color:'var(--text)', fontWeight:600, width:'100%', boxSizing:'border-box' };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'14px 16px 80px',paddingTop:'calc(var(--nav-h) + 14px)'}}>
      <div style={{fontSize:16,fontWeight:800,marginBottom:14}}>建立客人連結</div>
      {msg && <div style={{fontSize:13,color:'var(--gold)',fontWeight:600,marginBottom:10}}>{msg}</div>}

      {/* 建立表單 */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'14px',marginBottom:20}}>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>客人 LINE ID *</div>
          <input style={iS} placeholder="例：@amy_lin、小美" value={name}
            onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&create()} />
        </div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>
          服務員工：<strong style={{color:'var(--text)'}}>{staffName || '（未知）'}</strong>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:10}}>
          ⏱ 連結有效 4 小時 · 連結過期後收藏記錄仍保留
        </div>
        <button onClick={create} disabled={creating}
          style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,
            padding:'10px 24px',fontSize:14,fontWeight:700,cursor:'pointer',width:'100%'}}>
          {creating ? '建立中…' : '🔗 建立連結'}
        </button>
      </div>

      {/* 剛建立的連結 */}
      {newLink && (
        <div style={{background:'#e8f5e9',border:'2px solid #4caf77',borderRadius:12,padding:'14px',marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,color:'#2e7d32',marginBottom:6}}>
            ✅ 連結已建立 — {newLink.customer_name}
          </div>
          <div style={{fontSize:11,color:'#555',marginBottom:10,wordBreak:'break-all',fontFamily:'monospace',background:'rgba(0,0,0,.05)',borderRadius:6,padding:'6px 8px'}}>
            {newLink.url}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>copyLink(newLink.url)}
              style={{flex:1,background:'#4caf77',color:'#fff',border:'none',borderRadius:8,padding:'9px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
              📋 複製連結
            </button>
          </div>
          <div style={{fontSize:11,color:'#888',marginTop:8,textAlign:'center'}}>
            有效至 {newLink.expires_at?.slice(0,16).replace('T',' ')} UTC
          </div>
        </div>
      )}

      {/* 歷史連結 */}
      <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>連結紀錄</div>
      {viewLink && <GuestFavViewModal link={viewLink} onClose={() => setViewLink(null)} />}

      {loading ? <div style={{color:'var(--text3)',fontSize:13}}>載入中…</div> : (
        links.length === 0 ? <div style={{color:'var(--text3)',fontSize:13}}>尚無連結</div> :
        links.map(l => {
          const url = `${baseUrl}/?g=${l.token}`;
          return (
            <div key={l.id} style={{background:'var(--surface)',border:'1px solid var(--border)',
              borderRadius:10,padding:'10px 14px',marginBottom:8,
              opacity: l.active ? 1 : 0.5}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:14}}>{l.customer_name}</span>
                <span style={{fontSize:11,padding:'2px 8px',borderRadius:6,fontWeight:700,
                  background: l.active?'#e8f5e9':'#f5f5f5',
                  color: l.active?'#2e7d32':'#888'}}>
                  {l.active ? '有效' : l.expired ? '已過期' : '已停用'}
                </span>
              </div>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>
                {l.created_by && `員工：${l.created_by} · `}建立：{l.created_at?.slice(0,16).replace('T',' ')}
              </div>
              <div style={{display:'flex',gap:6}}>
                {l.active && <>
                  <button onClick={()=>copyLink(url)}
                    style={{flex:1,padding:'6px',fontSize:12,fontWeight:600,border:'1px solid var(--border)',borderRadius:6,background:'var(--s2)',cursor:'pointer'}}>
                    📋 複製
                  </button>
                  <button onClick={()=>deactivate(l.token)}
                    style={{padding:'6px 10px',fontSize:12,fontWeight:600,border:'none',borderRadius:6,background:'#ffebee',color:'#c62828',cursor:'pointer'}}>
                    停用
                  </button>
                </>}
                {l.fav_count > 0 && (
                  <button onClick={() => setViewLink(l)}
                    style={{flex:1,padding:'6px',fontSize:12,fontWeight:700,border:'none',borderRadius:6,background:'#ffebee',color:'#c62828',cursor:'pointer'}}>
                    ❤️ {l.fav_count} 查看收藏
                  </button>
                )}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

/* ── Quote Section: 估價紀錄為主，估價一律從圖片出發 ─── */
function QuoteSection({ role }) {
  return React.createElement(QuoteHistoryPage, { role });

/* ──────────────────────────────────────────────────────── */
function App() {
  const [splash,         setSplash]         = useState(() => !localStorage.getItem('userRole'));
  const [tab,            setTab]            = useState('browse');
  const [favs,           setFavs]           = useState(loadFavs);
  const [showDarkBg,     setShowDarkBg]     = useState(false);
  const [role,           setRole]           = useState(() => localStorage.getItem('userRole') || 'guest');
  const [metalsLastUpd,  setMetalsLastUpd]  = useState(null);
  const [idleWarning,    setIdleWarning]    = useState(false);
  const [settingsInitTab,setSettingsInitTab]= useState('upload');

  const isAdmin = role === 'admin';
  const isStaff = role === 'admin' || role === 'editor';

  // 15 分鐘無操作自動登出
  useEffect(() => {
    if (role === 'guest') return;
    const IDLE_MS = 15 * 60 * 1000;
    const WARN_MS = 13 * 60 * 1000;
    let idleTimer, warnTimer;
    function reset() {
      clearTimeout(idleTimer); clearTimeout(warnTimer);
      setIdleWarning(false);
      warnTimer = setTimeout(() => setIdleWarning(true), WARN_MS);
      idleTimer = setTimeout(() => { clearJwtAuth(); localStorage.removeItem('userRole'); setRole('guest'); }, IDLE_MS);
    }
    const evts = ['mousemove','mousedown','keydown','touchstart','scroll','click'];
    evts.forEach(e => window.addEventListener(e, reset, true));
    reset();
    return () => { clearTimeout(idleTimer); clearTimeout(warnTimer); evts.forEach(e => window.removeEventListener(e, reset, true)); };
  }, [role]);

  // Fetch metals_last_updated for banner
  useEffect(() => {
    if (!isStaff) return;
    fetch('/api/pricing/all')
      .then(r => r.json())
      .then(d => { if (d.metals_last_updated) setMetalsLastUpd(d.metals_last_updated); })
      .catch(() => {});
  }, [isStaff]);

  // JWT init — restore session from localStorage on page load
  useEffect(() => {
    const token = getJwtToken();
    const user  = getJwtUser();
    if (token && user) {
      // verify token is still valid
      fetch('/api/auth/me')
        .then(r => r.json())
        .then(data => {
          if (!data.authenticated) { clearJwtAuth(); setRole('guest'); }
          else setRole(data.user?.role || user.role);
        })
        .catch(() => {});
    }
    // Handle 401 from anywhere in the app
    const onExpire = () => { clearJwtAuth(); setRole('guest'); };
    window.addEventListener('authExpired', onExpire);
    return () => window.removeEventListener('authExpired', onExpire);
  }, []);

  function handleLogout() {
    localStorage.removeItem('userRole');
    clearJwtAuth();
    setRole('guest');
  }

  const toggleFav = photo => setFavs(prev => {
    const isCurrent = prev.some(p => p.id === photo.id);
    logEvent(photo.id, isCurrent ? 'unfavorite' : 'favorite');
    const next = isCurrent ? prev.filter(p => p.id !== photo.id) : [...prev, photo];
    saveFavs(next);
    return next;
  });
  const clearFavs = () => { setFavs([]); saveFavs([]); };
  const isFav = id => favs.some(p => p.id === id);

  const favCount  = favs.length;
  const roleLabel = '管理員';
  const logoutLabel = '登出';

  if (role === 'guest') {
    return <LoginPage onAuth={setRole} />;
  }

  return (
    <React.Fragment>
      {splash && <Splash onDone={() => setSplash(false)} />}
      {isStaff && (
        <PricingBanner
          metalsLastUpdated={metalsLastUpd}
          onGotoSettings={isAdmin ? () => { setSettingsInitTab('pricing'); setTab('settings'); } : null}
        />
      )}


      <header className="nav">
        <span className="nav-logo" style={{cursor:'pointer'}} onClick={() => setSplash(true)}>Tahir Zainab Selection</span>
        <div className="nav-tabs">
          <button className={'nav-tab' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>照片庫</button>
          <button className={'nav-tab' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
            收藏 {favCount > 0 && <span className="badge">{favCount}</span>}
          </button>
          {isStaff && (
            <button className={'nav-tab' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
              估價<QuotePendingBadge />
            </button>
          )}
          {isAdmin && (
            <button className={'nav-tab' + (tab === 'settings' ? ' on' : '')} onClick={() => setTab('settings')}>
              設定
            </button>
          )}
        </div>
        <div className="nav-right">
          <span className="nav-role">{roleLabel}</span>
          <button className="nav-logout" onClick={handleLogout}>{logoutLabel}</button>
        </div>
      </header>
      {showDarkBg && (
        <DarkBgModal
          onClose={() => setShowDarkBg(false)}
          onDeleted={() => { setShowDarkBg(false); window.location.reload(); }}
        />
      )}
      <div className="content">
        {tab === 'browse'    && <BrowseTab isFav={isFav} toggleFav={toggleFav} role={role} />}
        {tab === 'favorites' && <FavsTab favs={favs} isFav={isFav} toggleFav={toggleFav} clearFavs={clearFavs} role={role} />}
        {tab === 'quote'     && isStaff  && <QuoteSection role={role} />}
        {tab === 'settings'  && isAdmin  && <PricingSettingsTab key={settingsInitTab} initialTab={settingsInitTab} />}
      </div>
      <nav className="tab-bar">
        <button className={'tab-btn' + (tab === 'browse' ? ' on' : '')} onClick={() => setTab('browse')}>照片庫</button>
        <button className={'tab-btn' + (tab === 'favorites' ? ' on' : '')} onClick={() => setTab('favorites')}>
          收藏{favCount > 0 && <span className="tab-badge">{favCount}</span>}
        </button>
        {isStaff && (
          <button className={'tab-btn' + (tab === 'quote' ? ' on' : '')} onClick={() => setTab('quote')}>
            估價<QuotePendingBadge />
          </button>
        )}
        {isAdmin && (
          <button className={'tab-btn' + (tab === 'settings' ? ' on' : '')} onClick={() => setTab('settings')}>
            設定
          </button>
        )}
      </nav>
      {idleWarning && (
        <div style={{position:'fixed',bottom:80,left:'50%',transform:'translateX(-50%)',
          background:'#323232',color:'#fff',borderRadius:12,padding:'12px 20px',
          zIndex:9999,display:'flex',alignItems:'center',gap:14,boxShadow:'0 4px 20px rgba(0,0,0,.4)',
          fontSize:13,fontWeight:500,whiteSpace:'nowrap'}}>
          ⏰ 2 分鐘後自動登出
          <button onClick={() => setIdleWarning(false)}
            style={{background:'var(--gold)',color:'#fff',border:'none',borderRadius:8,
              padding:'5px 14px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            繼續使用
          </button>
        </div>
      )}
    </React.Fragment>
  );
}

function Root() {
  const guestToken = React.useMemo(() => new URLSearchParams(window.location.search).get('g'), []);
  if (guestToken) return React.createElement(GuestApp, { token: guestToken });
  return React.createElement(App);
}
ReactDOM.render(React.createElement(Root), document.getElementById('root'));
</script>
</body>
