          {['','紅','粉','橙','黃','綠','藍','紫','白','彩'].map(c => {
            const on = colorPref === c;
            return (
              <button key={c} onClick={() => setColorPref(c)}
                style={{padding:'5px 10px',borderRadius:20,border:on?'1.5px solid var(--gold)':'1px solid var(--border)',background:on?'rgba(184,147,90,.14)':'var(--surface)',color:on?'var(--gold)':'var(--text)',fontSize:12,fontWeight:on?700:400,cursor:'pointer',display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                {c === '' ? '全部' : (
                  <><span style={{width:10,height:10,borderRadius:'50%',background:COLOR_DOT[c]||'#ccc',flexShrink:0,display:'inline-block',border:'1px solid rgba(0,0,0,.1)'}} />{c}</>

              </button>

          })}
        </div>

        {/* Stone grid */}
        <div style={{fontSize:11,fontWeight:700,color:stoneMode==='invest'?'var(--gold)':'var(--text3)',marginBottom:6}}>

        </div>
        <div style={{display:'flex',flexWrap:'wrap',marginBottom:12}}>
          {filtered.map(([k,s]) => {

              <button key={k} onClick={() => setStoneKey(k)}

                  background:on?'rgba(184,147,90,.14)':'var(--surface)',

        {stoneKey && (
          <>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:6}}>克拉數 (ct)</div>

              onBlur={e=>e.target.style.borderColor='var(--border)'} />

        )}

        {currentStone && (
          <>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:4}}>產地</div>
            <div style={{display:'flex',flexWrap:'wrap',marginBottom:10}}>
              {Object.keys(currentStone.origins).map(v => <Chip key={v} val={v} cur={origin} setCur={setOrigin} />)}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:4}}>處理方式</div>
            <div style={{display:'flex',flexWrap:'wrap',marginBottom:10}}>
              {Object.keys(currentStone.treatments).map(v => <Chip key={v} val={v} cur={treatment} setCur={setTreatment} />)}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:4}}>品色</div>

  // ── Step 2: 金工材料 ─────────────────────────────────

            {cat==='戒指'?'戒圍':cat==='耳釘'?'耳針款式':'鍊長'}

          <select value={itemSize} onChange={e=>{
              const v=e.target.value; setItemSize(v);
              if (cat==='項鍊'&&NECKLACE_LENGTH_TO_CHAIN[v]) setChain(NECKLACE_LENGTH_TO_CHAIN[v]);
              else if (cat==='手鏈'&&BRACELET_LENGTH_TO_CHAIN[v]) setChain(BRACELET_LENGTH_TO_CHAIN[v]);
            }}
            style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 12px',fontSize:14,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)',cursor:'pointer',appearance:'none',WebkitAppearance:'none',marginBottom:16}}

            onBlur={e=>e.target.style.borderColor='var(--border)'}>
            {SIZE_OPTS[cat].map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </>
      )}

      <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:6}}>台子材質</div>
      <div style={{display:'flex',flexWrap:'wrap',marginBottom:16}}>
        {Object.keys(pricing.METAL_PER_G).filter(v=>!['9K金','14K金'].includes(v)).map(v => (
          <Chip key={v} val={v} cur={materialType} setCur={setMaterialType} />
        ))}
      </div>

      <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:6}}>用料多寡</div>
      <div style={{display:'flex',flexWrap:'wrap',marginBottom:16}}>
        {['少','正常','多'].map(v => <Chip key={v} val={v} cur={chain} setCur={setChain} />)}
      </div>

      {metalCostMax > 0 && (
        <div style={{background:'var(--s3)',borderRadius:10,border:'1px solid var(--border)',padding:'10px 14px'}}>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:2}}>台子材料預估</div>
          <div style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>{fmtNT(metalCostMin)} – {fmtNT(metalCostMax)}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{materialType} · {weightKey}</div>
        </div>
      )}
    </div>
  );

  // ── Step 3: 複雜度 ───────────────────────────────────
  const COMPLEXITY_DESC = {'極簡':'基本款 · 無鑽','簡單':'5顆鑽以內','中等':'20顆鑽以內','複雜':'多鑽/特殊設計','精工':'全鑽/訂製工法'};
  const renderStep3 = () => (
    <div style={{padding:'12px 16px'}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:8}}>金工複雜度</div>

        {Object.entries(COMPLEXITY_DESC).map(([v, desc]) => {
          const on = craft === v;
          const range = pricing.LABOR[cat]?.[v] || [0,0];
          return (
            <button key={v} onClick={() => setCraft(v)}
              style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                padding:'12px 14px',borderRadius:10,
                border:on?'1.5px solid var(--gold)':'1px solid var(--border)',
                background:on?'rgba(184,147,90,.10)':'var(--surface)',
                color:on?'var(--gold)':'var(--text)',cursor:'pointer',textAlign:'left'}}>
              <div>
                <div style={{fontSize:14,fontWeight:on?700:500}}>{v}</div>
                <div style={{fontSize:11,color:on?'rgba(184,147,90,.7)':'var(--text3)',marginTop:2}}>{desc}</div>
              </div>
              {range[1]>0 && <div style={{fontSize:12,fontWeight:600,color:on?'var(--gold)':'var(--text2)',flexShrink:0,marginLeft:8}}>{fmtNT(range[0])}–{fmtNT(range[1])}</div>}
            </button>

      {laborRange[1] > 0 && (
        <div style={{background:'rgba(184,147,90,.07)',borderRadius:10,border:'1px solid rgba(184,147,90,.25)',padding:'10px 14px',marginTop:8}}>

          <div style={{fontSize:15,fontWeight:700,color:'var(--gold)'}}>{fmtNT(laborRange[0])} – {fmtNT(laborRange[1])}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{cat} · {laborKey}</div>
        </div>
      )}
    </div>
  );

  // ── Step 4: 配石 ────────────────────────────────────

    return (
      <div style={{padding:'12px 16px',paddingBottom:120}}>

  // ── Step 5: 客戶資料 ─────────────────────────────────
  const renderStep5 = () => {
    const inp = {width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 10px',fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)',color:'var(--text)'};
    const foc = e=>e.target.style.borderColor='var(--gold)';

      <div style={{padding:'12px 16px',paddingBottom:200}}>

          <input type="text" placeholder="林小姐" value={customer} onChange={e=>setCustomer(e.target.value)}

          <div style={{display:'flex',gap:8,marginBottom:10}}>

              <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>詢價時間</div>
              <div style={{...inp,color:'var(--text2)',background:'var(--bg)',cursor:'default',lineHeight:'1.4',paddingTop:9,paddingBottom:9}}>{inquiryDate}</div>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>帳號來源</div>

            </div>

          <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>服務專員</div>

          </div>
          <div style={{display:'flex',gap:8,marginBottom:10}}>

                onChange={e=>setStoneOrderNo(e.target.value)}
                style={inp} onFocus={foc} onBlur={blr} />
            </div>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>備註</div>
          <textarea placeholder="詢問製作圖片款的戒指，預算彈性可談…" value={qNotes}
            onChange={e=>setQNotes(e.target.value)} rows={2}
            style={{...inp,resize:'vertical',lineHeight:1.5}} onFocus={foc} onBlur={blr} />
        </div>

        {hasPrice && (
          <div style={{background:'var(--surface)',borderRadius:10,border:'1px solid var(--border)',padding:'12px 16px'}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:0.5,color:'var(--text3)',marginBottom:8}}>估價明細</div>
            {stoneMin>0 && <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text)',marginBottom:4}}>
              <span>💎 主石 ({stoneName}{ct>0?' '+ct+'ct':''})</span>
              <span style={{fontWeight:600}}>{fmtNT(stoneMin)} – {fmtNT(stoneMax)}</span>
            </div>}
            {laborRange[1]>0 && <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text)',marginBottom:4}}>
              <span>🔨 工費 ({cat} · {laborKey})</span>
              <span style={{fontWeight:600}}>{fmtNT(laborRange[0])} – {fmtNT(laborRange[1])}</span>
            </div>}
            {metalCostMax>0 && <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text)',marginBottom:4}}>
              <span>⚙️ 金屬 ({materialType} · {weightKey})</span>
              <span style={{fontWeight:600}}>{fmtNT(metalCostMin)} – {fmtNT(metalCostMax)}</span>
            </div>}
            {sideRange[1]>0 && <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text)',marginBottom:4}}>

            <div style={{borderTop:'2px solid var(--gold)',marginTop:8,padding:'10px 12px',background:'rgba(184,147,90,.08)',borderRadius:8}}>
              <div style={{fontSize:10,color:'var(--text3)',marginBottom:3,letterSpacing:0.5}}>建議報價區間，請自行輸入預估金額</div>
              <div style={{fontSize:16,fontWeight:800,color:'var(--gold)'}}>{fmtNT(totalMin)} – {fmtNT(totalMax)}</div>
            </div>

            本估價為<strong>快速參考區間</strong>，僅供預算規劃使用。<br/>
            最終精準報價需由我們<strong>精工部門</strong>依實際材料、工時及市場行情進行正式估算，結果可能與此參考值有所差異。

        </div>

        {/* 上傳客人參考照片（選填）*/}
        <div style={{width:'100%',maxWidth:320,marginBottom:20}}>
          {uploadedUrl ? (
            <div style={{position:'relative',borderRadius:10,overflow:'hidden',border:'1.5px solid var(--gold)',background:'#eee'}}>
              <ImgZoom src={uploadedUrl} fullSrc={uploadedUrl} alt=""
                style={{width:'100%',maxHeight:160,objectFit:'contain',display:'block',background:'#f8f8f8'}} />
              <button onClick={() => setUploadedUrl(null)}
                style={{position:'absolute',top:6,right:6,background:'rgba(0,0,0,0.55)',color:'#fff',

                移除
              </button>
              <div style={{padding:'6px 10px',fontSize:11,color:'var(--text3)',background:'var(--surface)'}}>
                ✅ 客人參考照片已上傳 · 點擊可放大
              </div>
            </div>
          ) : (
            <label style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,
              border:'1.5px dashed var(--border)',borderRadius:10,padding:'14px',cursor:'pointer',
              background:'var(--surface)',color:'var(--text2)',fontSize:13,fontWeight:600}}>
              <span style={{fontSize:18}}>📷</span>
              上傳客人參考照片（選填）
              <input type="file" accept="image/*" onChange={handlePhotoUpload} style={{display:'none'}} />
            </label>
          )}
        </div>

        {/* 確認按鈕 */}
        <button onClick={() => setShowIntro(false)}
          style={{width:'100%',maxWidth:320,padding:'14px 0',borderRadius:12,border:'none',
            background:'var(--accent)',color:'#fff',fontSize:16,fontWeight:800,
            cursor:'pointer',letterSpacing:0.5,boxShadow:'0 4px 16px rgba(0,0,0,0.15)'}}>
          我了解，開始估價 →
        </button>

        <div style={{fontSize:11,color:'var(--text3)',marginTop:14,textAlign:'center'}}>
          點擊開始即表示您已知悉以上說明
        </div>

  );

  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={step===1?onBack:()=>setStep(s=>s-1)}>←</button>
          <span className="det-hd-title">估價 · {STEPS[step-1]}</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>

        <div style={{display:'flex',gap:3,padding:'8px 16px 0',background:'var(--bg)'}}>
          {STEPS.map((_,i) => (
            <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<step?'var(--gold)':'var(--border)',transition:'background .2s'}} />
          ))}
        </div>
        {showEstimateCard && hasPrice && (
          <QuoteCard mode="estimate" photo={dispPhoto} description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
            totalMin={manualNum>0?Math.min(manualNum,Math.round(totalMax)):Math.round(totalMin)}
            totalMax={manualNum>0?Math.max(manualNum,Math.round(totalMax)):Math.round(totalMax)} customer={customer} staffName={staffName} stoneOrderNo={stoneOrderNo}
            commissionNote={commissionNote} orderType={orderType}
            itemSize={itemSize} cat={cat} stoneName={stoneName}
            carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}

            budget={budgetNum} onClose={() => setShowEstimateCard(false)} />
        )}

        <div className="det-scroll">
          {(() => {
            if (step === 1) return renderStep0();
            if (orderType === '全訂制') {
              if (step === 2) return renderStep1();
              if (step === 3) return renderStep2();
              if (step === 4) return renderStep3();
              if (step === 5) return renderStep4();
              if (step === 6) return renderStep5();
            } else if (orderType === '半訂制') {
              if (step === 2) return renderStoneOrderStep();
              if (step === 3) return renderStep2();
              if (step === 4) return renderStep3();
              if (step === 5) return renderStep4();
              if (step === 6) return renderStep5();
            } else {
              if (step === 2) return renderCommissionStoneStep();
              if (step === 3) return renderCommissionOrderNoStep();
              if (step === 4) return renderStep2();
              if (step === 5) return renderStep3();
              if (step === 6) return renderStep4();
              if (step === 7) return renderStep5();
            }
          })()}
        </div>

        {step < STEPS.length ? (
          <div style={{padding:'12px 16px 20px',borderTop:'1px solid var(--border)',background:'var(--surface)'}}>
            <button onClick={() => setStep(s=>s+1)}
              style={{width:'100%',background:'var(--gold)',color:'#fff',border:'none',borderRadius:10,padding:'13px',fontSize:15,fontWeight:700,cursor:'pointer'}}>
              下一步 →
            </button>
          </div>
        ) : (
          <div style={{position:'absolute',bottom:0,left:0,right:0,background:'var(--accent)',padding:'12px 16px 20px',boxShadow:'0 -4px 20px rgba(0,0,0,.2)'}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,.65)',marginBottom:6}}>預估報價</div>
            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:6}}>
              <div style={{display:'flex',alignItems:'center',flex:1,background:'rgba(255,255,255,.12)',border:'1.5px solid rgba(255,255,255,.3)',borderRadius:8,overflow:'hidden'}}>
                <span style={{padding:'0 4px 0 10px',color:'rgba(255,255,255,.6)',fontSize:13,fontWeight:600,flexShrink:0,lineHeight:1}}>NT$</span>
                <input type="text" inputMode="numeric" placeholder="輸入預估金額" value={manualQuote}
                  onChange={e=>setManualQuote(e.target.value.replace(/[^0-9]/g,''))}
                  style={{flex:1,background:'none',border:'none',padding:'11px 10px 11px 2px',fontSize:18,fontWeight:700,color:'#fff',outline:'none',fontFamily:'inherit',minWidth:0}} />
              </div>
              <button onClick={doSave} disabled={saving||manualNum===0}
                style={{background:(saving||manualNum===0)?'rgba(255,255,255,.25)':'var(--gold)',color:'#fff',border:'none',borderRadius:8,padding:'10px 16px',fontSize:14,fontWeight:700,cursor:(saving||manualNum===0)?'default':'pointer',flexShrink:0}}>
                {saving?'儲存中…':'儲存預估'}
              </button>
            </div>
            {hasPrice && <div style={{fontSize:11,color:'rgba(255,255,255,.5)'}}>AI預估：{fmtNT(totalMin)} – {fmtNT(totalMax)}</div>}
            {budgetNum>0&&manualNum>0 && (
              <div style={{fontSize:11,marginTop:2,color:manualNum<=budgetNum*1.05?'#4caf77':'#ff8a80'}}>
                {manualNum<=budgetNum*1.05?'✓ 預算範圍內':`超出預算 ${fmtNT(manualNum-budgetNum)}`}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Quote / Estimator tab ──────────────────────────── */
function QuoteTab() {
  const pricing = usePricing();
  /* ── State ── */
  const [stoneKey,    setStoneKey]    = useState('');       // invest key or '' or COMMERCIAL_*
  const [stoneMode,   setStoneMode]   = useState('invest'); // 'invest' | 'commercial'
  const [carat,       setCarat]       = useState('1');
  const [origin,      setOrigin]      = useState('');
  const [treatment,   setTreatment]   = useState('');
  const [color,       setColor]       = useState('');
  const [hasMounting, setHasMounting] = useState(true);
  const [item,        setItem]        = useState('戒指');
  const [metal,       setMetal]       = useState('18K金');
  const [weight,      setWeight]      = useState('中 (3–5g)');
  const [complexity,  setComplexity]  = useState('中等');
  const [sidestone,   setSidestone]   = useState('無配石');
  const [size,        setSize]        = useState('');
  const [cert,        setCert]        = useState('無');
  const [customer,    setCustomer]    = useState('');
  const [sliderPct,   setSliderPct]   = useState(0.5);
  const [copied,      setCopied]      = useState(false);

  /* ── Pending quotes ── */
  const [pending,          setPending]          = useState([]);
  const [pendingFill,      setPendingFill]      = useState({});
  const [pendingBusy,      setPendingBusy]      = useState(null);
  const [overdueAlert,     setOverdueAlert]     = useState(false);

  useEffect(() => {
    fetch('/api/quotes/pending')
      .then(r => r.json())
      .then(data => {
        setPending(data);
        if (data.some(q => q.hours_elapsed >= 24)) setOverdueAlert(true);
      })
      .catch(() => {});
  }, []);

  async function confirmPending(id) {
    const price = parseInt((pendingFill[id]||'').replace(/[^0-9]/g,''));
    if (!price) return;
    setPendingBusy(id);
    try {
      await fetch(`/api/quotes/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: price }),
      });
      setPending(prev => prev.filter(q => q.id !== id));
    } catch { alert('回填失敗'); }
    setPendingBusy(null);
  }

  /* ── Reset invest-detail fields when stone changes ── */
  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColor(Object.keys(s.colors)[0]);
    }
    setSliderPct(0.5);
  }, [stoneKey, stoneMode]);

  /* Reset size when item changes */
  useEffect(() => {
    if (SIZE_OPTS[item]) setSize(SIZE_OPTS[item][0]);
  }, [item]);

  /* ── Computation ── */
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0, stoneTarget = 0;
  let stoneLabel = '';

  if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey] && ct > 0) {
    const s = STONES_INVEST[stoneKey];
    stoneLabel = s.name;
    const band = getBand(ct);
    const k = (s.origins[origin] || 1) * (s.treatments[treatment] || 1) * (s.colors[color] || 1);
    const fpc = s.floor[band] * k;
    const cpc = s.ceil[band] * k;
    const ref = Math.sqrt(fpc * cpc);
    stoneMin    = fpc * 0.8 * ct;
    stoneMax    = cpc * 0.8 * ct;
    stoneTarget = ref * 0.8 * ct;
  } else if (stoneMode === 'commercial' && stoneKey && pricing.STONES_COMMERCIAL[stoneKey] && ct > 0) {
    const s = pricing.STONES_COMMERCIAL[stoneKey];
    stoneLabel = s.name;
    stoneMin    = s.range[0] * ct;
    stoneMax    = s.range[1] * ct;
    stoneTarget = (stoneMin + stoneMax) / 2;
  }

  let mountMin = 0, mountMax = 0;
  if (hasMounting) {
    const LC2 = pricing.LABOR_CONFIG || {};
    const laborExact2 = Math.round((Number(LC2.daily_rate)||2000) * (Number(LC2[complexity])||0));
    const laborRange  = LC2[complexity] ? [Math.round(laborExact2*0.9), Math.round(laborExact2*1.1)] : [0,0];
    const weightRange = pricing.WEIGHTS[weight] || WEIGHTS[weight] || [0,0];
    const metalPg     = pricing.METAL_PER_G[metal] || METAL_PER_G[metal] || 0;
    const sideRange   = (() => {
      if (sidestone === '無配石') return [0,0];
      const spaceIdx = sidestone.indexOf(' ');
      if (spaceIdx < 0) return [0,0];
      const tp = sidestone.slice(0, spaceIdx);
      const bd = sidestone.slice(spaceIdx + 1);
      return (pricing.SIDESTONES_V2[tp] || {})[bd] || [0,0];
    })();
    mountMin = laborRange[0] + metalPg * weightRange[0] + sideRange[0];
    mountMax = laborRange[1] + metalPg * weightRange[1] + sideRange[1];
  }

  const certFee = CERTS[cert] || 0;
  const totalMin    = stoneMin    + mountMin + certFee;
  const totalMax    = stoneMax    + mountMax + certFee;
  const totalTarget = stoneTarget + (mountMin + mountMax) / 2 + certFee;
  const finalPrice  = totalMin + (totalMax - totalMin) * sliderPct;

  const hasPrice = totalMin > 0 || totalMax > 0;

  /* ── Copy ── */
  function handleCopy() {
    if (!hasPrice) return;
    const lines = [];
    if (customer) lines.push('客戶：' + customer);
    if (stoneLabel) lines.push('寶石：' + stoneLabel + (ct ? '  ' + ct + ' ct' : ''));
    if (hasMounting) lines.push('鑲嵌：' + item + ' / ' + metal + ' / ' + complexity);
    if (cert !== '無') lines.push('證書：' + cert);
    lines.push('報價：' + fmtNT(finalPrice));
    lines.push('範圍：' + fmtNT(totalMin) + ' – ' + fmtNT(totalMax));
    const txt = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    } else {
      const el = document.createElement('textarea');
      el.value = txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }
  }

  /* ── Style helpers ── */
  const sectionStyle = {
    background: 'var(--surface)',
    borderRadius: '12px',
    border: '1px solid var(--border)',
    marginBottom: '10px',
    overflow: 'hidden',
  };
  const sectionHeaderStyle = {
    fontSize: '10px',
    fontWeight: 700,
    letterSpacing: '1.5px',
    textTransform: 'uppercase',
    color: 'var(--text3)',
    padding: '12px 16px 6px',
  };
  const rowStyle = { padding: '6px 16px 10px' };
  const labelStyle = { fontSize: '11px', color: 'var(--text3)', fontWeight: 600, marginBottom: '5px' };
  const inputStyle = {
    width: '100%', border: '1.5px solid var(--border)', borderRadius: '8px',
    padding: '10px 12px', fontSize: '14px', color: 'var(--text)',
    background: 'var(--surface)', outline: 'none', appearance: 'none',
    WebkitAppearance: 'none', fontFamily: 'inherit',
  };
  const divStyle = { borderTop: '1px solid var(--border)', margin: '2px 16px' };
  const toggleRowStyle = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    padding: '12px 16px',
  };

  /* ── Invest stone select options ── */
  const investKeys = Object.keys(STONES_INVEST);
  const commercialKeys = Object.keys(pricing.STONES_COMMERCIAL);

  const currentInvestStone = stoneMode === 'invest' && stoneKey ? STONES_INVEST[stoneKey] : null;

  /* ── Price float height ── */
  const PRICE_H = 110;

  return (
    React.createElement('div', {
      style: {
        position: 'fixed', inset: 0,
        paddingTop: 'var(--nav-h)',
        paddingBottom: 'var(--tab-h)',
        background: '#F4F4F4',
        zIndex: 10, display: 'flex', flexDirection: 'column',
      }
    },
      /* ── Scrollable form area ── */
      React.createElement('div', {
        style: { flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', padding: '12px 14px', paddingBottom: (PRICE_H + 16) + 'px' }
      },

        /* ── Overdue alert banner ── */
        overdueAlert && React.createElement('div', {
          style: { background:'#fff3f0', border:'1px solid #ffcccc', borderRadius:10, padding:'10px 14px', marginBottom:10, display:'flex', justifyContent:'space-between', alignItems:'center' }
        },
          React.createElement('div', null,
            React.createElement('div', { style:{color:'#c62828',fontWeight:700,fontSize:13} }, `⚠ 有 ${pending.filter(q=>q.hours_elapsed>=24).length} 筆報價超過 24 小時未確認成交`),
            React.createElement('div', { style:{fontSize:11,color:'#888',marginTop:2} }, '請業務盡快回填實際成交價')
          ),
          React.createElement('button', { onClick: () => setOverdueAlert(false), style:{background:'none',border:'none',fontSize:20,color:'#ccc',cursor:'pointer',lineHeight:1,padding:'0 4px'} }, '×')
        ),

        /* ── Pending quotes section ── */
        pending.length > 0 && React.createElement('div', {
          style: { ...sectionStyle, marginBottom: 10 }
        },
          React.createElement('div', {
            style: { ...sectionHeaderStyle, color: pending.some(q=>q.hours_elapsed>=24) ? '#c62828' : 'var(--text3)' }
          }, `待確認成交 (${pending.length})`),
          pending.map(q => {
            const overdue = q.hours_elapsed >= 24;
            const fillVal = pendingFill[q.id] || '';
            return React.createElement('div', {
              key: q.id,
              style: { borderTop:'1px solid var(--border)', padding:'10px 16px 12px' }
            },
              React.createElement('div', { style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8} },
                React.createElement('div', null,
                  React.createElement('div', { style:{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:2} }, q.description || '(無描述)'),
                  q.customer_name && React.createElement('div', { style:{fontSize:11,color:'var(--text2)'} }, '客戶：' + q.customer_name),
                  React.createElement('div', { style:{fontSize:11,color:overdue?'#c62828':'var(--text3)',marginTop:2} },
                    (overdue ? '⚠ ' : '') + q.hours_elapsed + '小時前' +
                    (q.estimated_min ? `  ·  ${fmtNT(q.estimated_min)} – ${fmtNT(q.estimated_max)}` : '')
                  )
                )
              ),
              React.createElement('div', { style:{display:'flex',gap:6} },
                React.createElement('div', { style:{position:'relative',flex:1} },
                  React.createElement('span', { style:{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',fontSize:12,color:'var(--text2)',fontWeight:600,pointerEvents:'none'} }, 'NT$'),
                  React.createElement('input', {
                    type:'text', inputMode:'numeric', placeholder:'成交價',
                    value: fillVal,
                    onChange: e => setPendingFill(prev => ({...prev, [q.id]: e.target.value.replace(/[^0-9]/g,'')})),
                    style:{width:'100%',border:'1px solid var(--border)',borderRadius:7,padding:'8px 8px 8px 36px',fontSize:13,fontFamily:'inherit',outline:'none',background:'var(--surface)'},
                    onFocus: e => e.target.style.borderColor='var(--gold)',
                    onBlur:  e => e.target.style.borderColor='var(--border)',
                  })
                ),
                React.createElement('button', {
                  onClick: () => confirmPending(q.id),
                  disabled: !fillVal || pendingBusy === q.id,
                  style:{background:fillVal?'var(--gold)':'var(--s3)',color:fillVal?'#fff':'var(--text3)',border:'none',borderRadius:7,padding:'8px 14px',fontSize:12,fontWeight:700,cursor:fillVal?'pointer':'default',whiteSpace:'nowrap'}
                }, pendingBusy === q.id ? '…' : '確認✓')
              )
            );
          })
        ),

        /* Customer name */
        React.createElement('div', { style: sectionStyle },
          React.createElement('div', { style: sectionHeaderStyle }, '客戶'),
          React.createElement('div', { style: rowStyle },
            React.createElement('input', {
              type: 'text', placeholder: '客戶姓名（選填）', value: customer,
              onChange: e => setCustomer(e.target.value),
              style: inputStyle,
              onFocus: e => e.target.style.borderColor = 'var(--gold)',
              onBlur:  e => e.target.style.borderColor = 'var(--border)',
            })
          )
        ),

        /* ── Section: 寶石 ── */
        React.createElement('div', { style: sectionStyle },
          React.createElement('div', { style: sectionHeaderStyle }, '寶石'),

          /* Invest tier */
          React.createElement('div', { style: { padding: '4px 16px 2px', fontSize: '11px', color: 'var(--gold)', fontWeight: 600, letterSpacing: '0.5px' } }, '投資級寶石'),
          React.createElement('div', { style: rowStyle },
            React.createElement('select', {
              value: stoneMode === 'invest' ? stoneKey : '',
              onChange: e => { setStoneMode('invest'); setStoneKey(e.target.value); },
              style: { ...inputStyle, cursor: 'pointer' },
              onFocus: e => e.target.style.borderColor = 'var(--gold)',
              onBlur:  e => e.target.style.borderColor = 'var(--border)',
            },
              React.createElement('option', { value: '' }, '— 選擇投資級寶石 —'),
              investKeys.map(k => React.createElement('option', { key: k, value: k }, STONES_INVEST[k].name))
            )
          ),

          React.createElement('div', { style: divStyle }),

          /* Commercial tier */
          React.createElement('div', { style: { padding: '8px 16px 2px', fontSize: '11px', color: 'var(--text2)', fontWeight: 600, letterSpacing: '0.5px' } }, '商業級寶石'),
          React.createElement('div', { style: rowStyle },
            React.createElement('select', {
              value: stoneMode === 'commercial' ? stoneKey : '',

/* ── LoginPage (full-screen) ── */
function LoginPage({ onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err,      setErr]      = useState('');
  const [shake,    setShake]    = useState(false);
  const [loading,  setLoading]  = useState(false);
  const [userList, setUserList] = useState([]);
  const pwRef = useRef(null);

  useEffect(() => {
    fetch('/api/auth/user-list').then(r => r.json()).then(setUserList).catch(() => {});
  }, []);

  function triggerError(msg) {
    setErr(msg || '帳號或密碼錯誤'); setPassword('');
    setShake(true);
    setTimeout(() => setShake(false), 500);
  }

  function storeAndAuth(data) {
    // PIN login: {token, role}  |  Account login: {token, user:{id,name,username,role}}
    const role = data.role || data.user?.role;
    const u    = data.user  || {};
    localStorage.setItem('jwt_token', data.token);
    localStorage.setItem('jwt_user', JSON.stringify({ role, name: u.name || '', username: u.username || '' }));
    localStorage.setItem('userRole', role);
    onAuth(role);
  }

  async function submit() {
    if (!username.trim() || !password.trim()) { setErr('請選擇帳號並輸入密碼'); return; }
    setLoading(true); setErr('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) { storeAndAuth(await res.json()); }
      else { triggerError('帳號或密碼錯誤'); }
    } catch { triggerError('網路錯誤，請重試'); }
    finally { setLoading(false); }
  }

  const inputSt = {
    width:'100%', padding:'11px 14px', border:'1.5px solid var(--border)', borderRadius:'var(--r)',
    fontSize:15, outline:'none', boxSizing:'border-box', fontFamily:'inherit',
    background:'var(--surface)', color:'var(--text)',
  };

  return (
    <div className="login-page">
      <div className="login-brand">Tahir Zainab Selection</div>
      <div className="login-card">
        <div className={'login-card-inner' + (shake ? ' shake' : '')}>
          <div className="login-label">登入</div>
          <select style={{...inputSt, cursor:'pointer'}} value={username} autoFocus
            onChange={e => { setUsername(e.target.value); setErr(''); pwRef.current?.focus(); }}>
            <option value="">— 請選擇帳號 —</option>
            {userList.map(u => <option key={u.username} value={u.username}>{u.name}</option>)}
          </select>
          <input ref={pwRef} type="password" style={inputSt} placeholder="密碼"
            value={password}
            onChange={e => { setPassword(e.target.value); setErr(''); }}
            onKeyDown={e => e.key === 'Enter' && submit()} />
          <div className="login-err">{err}</div>
          <button className="login-btn" onClick={submit} disabled={loading}>
            {loading ? '驗證中…' : '確認'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Login modal (JWT, inactive when USE_JWT_AUTH=false) */
function LoginModal({ onClose, onAuth }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  async function submit() {
    if (!username || !password) return;
    setLoading(true); setErr('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      if (!res.ok) { setErr('帳號或密碼錯誤'); setLoading(false); return; }
      const data = await res.json();
      localStorage.setItem('jwt_token', data.token);
      localStorage.setItem('jwt_user', JSON.stringify(data.user));
      onAuth(data.user.role, data.user);
      onClose();
    } catch { setErr('連線失敗'); }
    setLoading(false);
  }

  return (
    <div className="pin-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="pin-box">
        <div className="pin-title">登入</div>
        <input className="pin-input" type="text" placeholder="帳號" value={username}
          onChange={e => { setUsername(e.target.value); setErr(''); }}
          style={{marginBottom:8}} />
        <input className="pin-input" type="password" placeholder="密碼" value={password}
          onChange={e => { setPassword(e.target.value); setErr(''); }}
          onKeyDown={e => e.key === 'Enter' && submit()} />
        <div className="pin-err">{err}</div>
        <button className="pin-btn" onClick={submit} disabled={loading}>
          {loading ? '登入中…' : '登入'}
        </button>
        <button className="pin-cancel" onClick={onClose}>取消</button>
      </div>
    </div>
  );
}

/* ── Upload button ─────────────────────────────────── */
function UploadBtn({ onUploaded }) {
  const inputRef  = useRef(null);
  const [busy,    setBusy]    = useState(false);
  const [toast,   setToast]   = useState(null);

  async function handleFiles(e) {
    const files = [...e.target.files];
    if (!files.length) return;
    setBusy(true); setToast(null);
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const ok   = data.uploaded?.length || 0;
      const fail = data.errors?.length   || 0;
      const dups = data.errors?.filter(e => e.error === '重複照片').length || 0;
      let msg = ok > 0 ? `✓ 已新增 ${ok} 張` : '';
      if (dups)  msg += (msg ? '\n' : '') + `⚠ ${dups} 張重複`;
      if (fail - dups > 0) msg += (msg ? '\n' : '') + `✗ ${fail - dups} 張失敗`;
      setToast(msg || '無新照片');
      if (ok > 0 && onUploaded) onUploaded(data.uploaded);
    } catch {
      setToast('✗ 上傳失敗，請重試');
    } finally {
      setBusy(false);
      e.target.value = '';
      setTimeout(() => setToast(null), 4000);
    }
  }

  return (
    <>
      <input ref={inputRef} type="file" accept="image/*,.heic,.heif" multiple style={{display:'none'}} onChange={handleFiles} />
      <button className="upload-fab" onClick={() => inputRef.current.click()} disabled={busy} title="上傳照片">
        {busy ? '…' : '+'}
      </button>
      {toast && <div className="upload-toast">{toast}</div>}
    </>
  );
}

}

/* ── Dark-bg cleaner modal ─────────────────────────── */
function DarkBgModal({ onClose, onDeleted }) {
  const [phase, setPhase] = useState('idle'); // idle | scanning | confirm | deleting | done
  const [photos, setPhotos] = useState([]);
  const [excluded, setExcluded] = useState(new Set()); // IDs to keep (untick)
  const [count, setCount] = useState(0);

  const scan = () => {
    setPhase('scanning');
    fetch('/api/photos/dark-bg')
      .then(r => r.json())
      .then(d => { setPhotos(d.photos); setPhase('confirm'); })
      .catch(() => { alert('掃描失敗'); setPhase('idle'); });
  };

  const toggle = id => setExcluded(prev => {
    const s = new Set(prev);
    s.has(id) ? s.delete(id) : s.add(id);
    return s;
  });

  const doDelete = async () => {
    const ids = photos.filter(p => !excluded.has(p.id)).map(p => p.id);
    if (!ids.length) { onClose(); return; }
    setPhase('deleting');
    const res = await fetch('/api/photos/bulk', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const d = await res.json();
    setCount(d.deleted.length);
    setPhase('done');
    onDeleted && onDeleted(d.deleted);
  };

  const toDelete = photos.filter(p => !excluded.has(p.id));

  return (
    <div className="darkbg-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="darkbg-panel">
        <div className="darkbg-hd">
          <button className="det-back" onClick={onClose}>×</button>
          <span style={{flex:1,fontSize:15,fontWeight:600}}>清除黑底照片</span>
        </div>

        {phase === 'idle' && (
          <div style={{padding:'40px 24px',textAlign:'center',color:'var(--text2)',fontSize:14,lineHeight:1.9}}>
            偵測縮圖四個角落亮度<br/>自動找出黑色背景的照片<br/>
            <button className="db db-save" style={{marginTop:20,padding:'10px 32px'}} onClick={scan}>開始掃描</button>
          </div>
        )}

        {phase === 'scanning' && (
          <div className="loading-msg" style={{padding:60}}>掃描中，請稍候…</div>
        )}

        {phase === 'confirm' && (
          <>
            <div style={{padding:'8px 16px',fontSize:12,color:'var(--text2)',flexShrink:0}}>
              找到 <b>{photos.length}</b> 張黑底圖・點擊可取消勾選保留・將刪除 <b>{toDelete.length}</b> 張
            </div>
            {photos.length === 0
              ? <div className="empty-msg">沒有找到黑底照片</div>
              : <div className="darkbg-grid">
                  {photos.map(p => (
                    <div key={p.id} className={'darkbg-card' + (excluded.has(p.id) ? ' exclude' : '')}
                      onClick={() => toggle(p.id)}>
                      <img src={p.thumb_url} alt="" loading="lazy" />
                    </div>
                  ))}
                </div>
            }
            <div className="darkbg-footer">
              <button className="db" style={{flex:1,border:'1px solid var(--border)',background:'none'}} onClick={onClose}>取消</button>
              <button className="db db-save" style={{flex:2}} onClick={doDelete} disabled={toDelete.length===0}>
                永久刪除 {toDelete.length} 張
              </button>
            </div>
          </>
        )}

        {phase === 'deleting' && <div className="loading-msg" style={{padding:60}}>刪除中…</div>}

        {phase === 'done' && (
          <div style={{padding:'40px 24px',textAlign:'center',fontSize:14,color:'var(--text2)',lineHeight:2}}>
            ✅ 已刪除 {count} 張黑底照片<br/>
            <button className="db db-save" style={{marginTop:16,padding:'10px 32px'}} onClick={onClose}>完成</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── 估價參數面板（原 PricingSettingsTab 內容） ──────── */
function PricingParamsPanel() {
  const [metals,         setMetals]         = useState({});
  const [labor,          setLabor]          = useState({});
  const [laborConfig,    setLaborConfig]    = useState({daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8});
  const [sidestones,     setSidestones]     = useState({});
  const [sidestonesV2,   setSidestonesV2]   = useState({});
  const [weights,        setWeights]        = useState({});
  const [invest,         setInvest]         = useState({});
  const [commercialCarat,setCommercialCarat]= useState({});
  const [showWtEdit,     setShowWtEdit]     = useState(false);
  const [loaded,         setLoaded]         = useState(false);
  const [saving,         setSaving]         = useState(false);
  const [saved,          setSaved]          = useState(false);

  useEffect(() => {
    fetch('/api/pricing/all').then(r => r.json()).then(d => {
      setMetals(d.metals ? { ...d.metals } : {});
      setLabor(d.labor ? JSON.parse(JSON.stringify(d.labor)) : {});
      if (d.labor_config) setLaborConfig({ ...d.labor_config });
      setSidestones(d.sidestones ? { ...d.sidestones } : {});
      if (d.sidestones_v2) setSidestonesV2(JSON.parse(JSON.stringify(d.sidestones_v2)));
      setWeights(d.weights ? { ...d.weights } : {});
      if (d.stones_invest) {
        const inv = {};
        Object.entries(d.stones_invest).forEach(([k, v]) => {
          inv[k] = { name: v.name, floor: { ...v.floor }, ceil: { ...v.ceil } };
        });
        setInvest(inv);
      }
      if (d.commercial_carat) {
        setCommercialCarat(JSON.parse(JSON.stringify(d.commercial_carat)));
      }
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const saveAll = async () => {
    setSaving(true);
    const reqs = [];
    for (const [mat, price] of Object.entries(metals)) {
      reqs.push(fetch('/api/pricing/metals/' + encodeURIComponent(mat), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ price_per_g: Math.round(Number(price)) }),
      }));
    }
    for (const [skey, s] of Object.entries(invest)) {
      for (const band of ['B1','B2','B3','B4','B5']) {
        if ((s.floor||{})[band] !== undefined) {
          reqs.push(fetch('/api/pricing/stones-invest/' + encodeURIComponent(skey) + '/' + band, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price_floor: Math.round(Number(s.floor[band])), price_ceil: Math.round(Number(s.ceil[band])) }),
          }));
        }
      }
    }
    for (const [skey, s] of Object.entries(commercialCarat)) {
      for (const ct of ['1ct','2ct','3ct','4ct','5ct']) {
        if (s[ct]) {
          reqs.push(fetch('/api/pricing/stones-commercial-carat/' + encodeURIComponent(skey) + '/' + ct, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price_min: Math.round(Number(s[ct][0])), price_max: Math.round(Number(s[ct][1])) }),
          }));
        }
      }
    }
    for (const [key, val] of Object.entries(laborConfig)) {
      reqs.push(fetch('/api/pricing/labor-config/' + encodeURIComponent(key), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: Number(val) }),
      }));
    }
    for (const [stype, bands] of Object.entries(sidestonesV2)) {
      for (const [band, vals] of Object.entries(bands)) {
        if (!Array.isArray(vals)) continue;
        reqs.push(fetch('/api/pricing/sidestones-v2/' + encodeURIComponent(stype) + '/' + encodeURIComponent(band), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ price_min: Math.round(Number(vals[0])), price_max: Math.round(Number(vals[1])) }),
        }));
      }
    }
    for (const [label, vals] of Object.entries(weights)) {
      if (!Array.isArray(vals)) continue;
      reqs.push(fetch('/api/pricing/weights/' + encodeURIComponent(label), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weight_min: Number(vals[0]), weight_max: Number(vals[1]) }),
      }));
    }
    await Promise.all(reqs).catch(() => {});
    window.dispatchEvent(new Event('pricingUpdated'));
    setSaving(false); setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  if (!loaded) return <div style={{padding:32,textAlign:'center',color:'var(--text2)',fontSize:14}}>載入中…</div>;

  const COMPLEXITY_ORDER = ['極簡', '簡單', '中等', '複雜', '精工'];
  const laborCats = Object.keys(labor);
  const laborComps = COMPLEXITY_ORDER.filter(c => laborCats.some(cat => (labor[cat] || {})[c] !== undefined));
  const CT_LABELS = ['1ct','2ct','3ct','4ct','5ct'];
  const BANDS = ['B1','B2','B3','B4','B5'];
  const BAND_LBL = {B1:'B1 (~1ct)',B2:'B2 (~2ct)',B3:'B3 (~3ct)',B4:'B4 (~4ct)',B5:'B5 (~5ct)'};
  const investKeys = Object.keys(invest);
  const commCaratKeys = Object.keys(commercialCarat);

  const iS = { padding:'7px 10px', border:'2px solid #c8b89a', borderRadius:8, fontSize:15, background:'#fdf8ef', color:'var(--text)', fontWeight:600, boxSizing:'border-box', textAlign:'right', width:'100%' };
  const hdSt = { fontSize:16, fontWeight:800, color:'var(--text)', padding:'16px 0 10px', borderBottom:'2px solid var(--border)', marginBottom:14 };
  const thSt = { padding:'6px 8px', textAlign:'right', fontWeight:700, fontSize:13, color:'var(--text2)' };
  const matrixCell = (minVal, maxVal, onMin, onMax) => (
    <td style={{padding:'3px 4px',textAlign:'center'}}>
      <div style={{display:'flex',gap:2,alignItems:'center',justifyContent:'center'}}>
        <input type="number" style={{...iS,width:62,fontSize:13,padding:'5px 4px'}} value={minVal||''} onChange={onMin} />
        <span style={{color:'var(--text3)',fontSize:12}}>/</span>
        <input type="number" style={{...iS,width:62,fontSize:13,padding:'5px 4px'}} value={maxVal||''} onChange={onMax} />
      </div>
    </td>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', background:'var(--surface)', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
        <span style={{ fontSize:13, color: saved ? 'var(--gold)' : 'var(--text2)', flex:1, fontWeight: saved ? 600 : 400 }}>
          {saved ? '✓ 已儲存' : saving ? '儲存中…' : '修改後點「儲存」生效'}
        </span>
        <button onClick={saveAll} disabled={saving} style={{ background:'var(--accent)', color:'#fff', border:'none', borderRadius:8, padding:'7px 20px', fontSize:13, fontWeight:700, cursor:'pointer', opacity:saving ? 0.6 : 1 }}>儲存</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'4px 20px 40px' }}>

        {/* 貴金屬行情：金屬 × 重量 自動計算矩陣 */}
        {(() => {
          return (
            <div style={{...hdSt}}>
              貴金屬行情
              <span style={{fontWeight:400,fontSize:12,color:'var(--text3)',marginLeft:8}}>輸入NT$/克，其餘自動帶入</span>
            </div>
          );
        })()}
        {(() => {
          const metalKeys = Object.keys(metals);
          const weightEntries = Object.entries(weights);
          return (
            <div style={{overflowX:'auto',marginBottom:8}}>
              <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
                <thead>
                  <tr>
                    <th style={{...thSt,textAlign:'left',minWidth:88,position:'sticky',left:0,background:'var(--surface)',fontSize:11}}>用料級別</th>
                    {metalKeys.map(mat => (
                      <th key={mat} style={{...thSt,textAlign:'center',minWidth:96,paddingBottom:4}}>
                        <div style={{fontWeight:600,marginBottom:4}}>{mat}</div>
                        <input type="number" style={{...iS,width:86,fontSize:14,textAlign:'center',padding:'5px 6px'}}
                          value={metals[mat]||''} placeholder="NT$/克"
                          onChange={e => setMetals(prev => ({...prev,[mat]:e.target.value}))} />
                        <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>NT$/克</div>
                      </th>

                </thead>
                <tbody>
                  {weightEntries.map(([label, vals]) => {
                    const [wMin, wMax] = Array.isArray(vals) ? [Number(vals[0]),Number(vals[1])] : [0,0];
                    return (
                      <tr key={label} style={{borderTop:'1px solid var(--border)'}}>
                        <td style={{padding:'7px 8px',position:'sticky',left:0,background:'var(--bg)',whiteSpace:'nowrap'}}>

                          const price = Math.round(pg * wMax).toLocaleString();
                          return (
                            <td key={mat} style={{padding:'7px 8px',textAlign:'center',fontSize:12,color:'var(--text)',fontWeight:600,fontVariantNumeric:'tabular-nums'}}>
                              {price}

                          );

                    );
                  })}

              </table>
            </div>

        })()}
        <div style={{marginBottom:24}}>
          <button onClick={() => setShowWtEdit(v => !v)}

            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginTop:8}}>

                {Object.entries(weights).map(([label, vals]) => (

                    <td style={{padding:'4px 6px',width:90}}>
                      <input type="number" step="0.1" style={iS} value={Array.isArray(vals)?vals[0]||'':''} onChange={e => setWeights(prev=>({...prev,[label]:[e.target.value,(prev[label]||[0,0])[1]]}))} />

            <table style={{borderCollapse:'collapse',fontSize:12}}>
              <thead><tr>
                <th style={{...thSt,textAlign:'left',minWidth:64,position:'sticky',left:0,background:'var(--surface)'}}>寶石</th>

              </tr></thead>
              <tbody>

                  <tr key={skey} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'6px 8px',fontWeight:600,color:'var(--text)',fontSize:12,whiteSpace:'nowrap',position:'sticky',left:0,background:'var(--surface)'}}>{commercialCarat[skey]?.name}</td>
                    {CT_LABELS.map(ct => {

                      return matrixCell(

                        e => setCommercialCarat(prev => ({...prev,[skey]:{...prev[skey],[ct]:[e.target.value,(prev[skey]?.[ct]||[0,0])[1]]}})),
                        e => setCommercialCarat(prev => ({...prev,[skey]:{...prev[skey],[ct]:[(prev[skey]?.[ct]||[0,0])[0],e.target.value]}}))
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>}

        {/* 師傅工錢：日薪 × 天數 */}
        <div style={hdSt}>師傅工錢 <span style={{fontWeight:400,fontSize:12,color:'var(--text3)'}}>深圳珠寶廠行情 · 日薪 × 天數</span></div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,background:'var(--s3)',borderRadius:10,padding:'12px 14px'}}>
          <div style={{fontSize:12,color:'var(--text3)',flexShrink:0}}>日薪（NT$/天）</div>
          <input type="number" style={{...iS,width:100,fontWeight:700}}
            value={laborConfig.daily_rate||''}
            onChange={e=>setLaborConfig(prev=>({...prev,daily_rate:e.target.value}))} />
          <div style={{fontSize:11,color:'var(--text3)'}}>× 天數 = 工費</div>
        </div>
        <div style={{overflowX:'auto',marginBottom:28}}>
          <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
            <thead><tr>
              <th style={{...thSt,textAlign:'left',minWidth:60}}>複雜度</th>
              <th style={{...thSt,textAlign:'center',minWidth:80}}>天數</th>
              <th style={{...thSt,textAlign:'center',minWidth:130}}>工費預估</th>
            </tr></thead>
            <tbody>
              {['極簡','簡單','中等','複雜','精工'].map(comp => {
                const days = Number(laborConfig[comp] || 0);
                const dr   = Number(laborConfig.daily_rate || 2000);
                const cost = Math.round(dr * days);
                const lo   = Math.round(cost * 0.9);
                const hi   = Math.round(cost * 1.1);
                return (
                  <tr key={comp} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'8px 8px',fontWeight:600,color:'var(--text)',fontSize:12}}>{comp}</td>
                    <td style={{padding:'6px 8px',width:90}}>
                      <input type="number" step="0.5" style={iS}
                        value={laborConfig[comp]||''}
                        onChange={e=>setLaborConfig(prev=>({...prev,[comp]:e.target.value}))} />
                    </td>
                    <td style={{padding:'6px 8px',textAlign:'center',fontSize:11,color:'var(--text2)'}}>
                      {cost>0 ? `${lo.toLocaleString()}–${hi.toLocaleString()}` : '—'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* 配石費：種類 × 數量帶 */}
        <div style={hdSt}>配石費 <span style={{fontWeight:400,fontSize:12,color:'var(--text3)'}}>NT$，下限／上限</span></div>
        <div style={{overflowX:'auto',marginBottom:28}}>
          <table style={{borderCollapse:'collapse',fontSize:11}}>
            <thead><tr>
              <th style={{...thSt,textAlign:'left',minWidth:70,position:'sticky',left:0,background:'var(--surface)'}}>數量</th>
              {['天然碎鑽','莫桑鑽','彩色配石','合成培育鑽'].map(t=>(
                <th key={t} style={{...thSt,textAlign:'center',minWidth:130}}>{t}<br/><span style={{fontWeight:400,fontSize:10,color:'var(--text3)'}}>下／上</span></th>
              ))}
            </tr></thead>
            <tbody>
              {['1–5顆','6–15顆','16–30顆','31–50顆','50顆以上'].map(band=>(
                <tr key={band} style={{borderTop:'1px solid var(--border)'}}>
                  <td style={{padding:'6px 8px',fontWeight:600,color:'var(--text)',fontSize:11,whiteSpace:'nowrap',position:'sticky',left:0,background:'var(--surface)'}}>{band}</td>
                  {['天然碎鑽','莫桑鑽','彩色配石','合成培育鑽'].map(t=>{
                    const vals = (sidestonesV2[t]||{})[band] || [0,0];
                    return matrixCell(
                      vals[0], vals[1],
                      e=>setSidestonesV2(prev=>({...prev,[t]:{...(prev[t]||{}),[band]:[e.target.value,((prev[t]||{})[band]||[0,0])[1]]}})),
                      e=>setSidestonesV2(prev=>({...prev,[t]:{...(prev[t]||{}),[band]:[((prev[t]||{})[band]||[0,0])[0],e.target.value]}}))
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>


      </div>
    </div>
  );
}

/* ── 封鎖 IP 管理 ────────────────────────────────────── */
function BlockedIPsSection() {
  const [ips, setIps] = useState([]);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');
  function flash(t) { setMsg(t); setTimeout(()=>setMsg(''),2500); }

  async function load() {
    setLoading(true);
    try { setIps(await fetch('/api/auth/blocked-ips').then(r=>r.json())); }
    finally { setLoading(false); }
  }
  useEffect(()=>{ load(); }, []);

  async function unblock(ip) {
    await fetch(`/api/auth/blocked-ips/${encodeURIComponent(ip)}`, { method:'DELETE' });
    flash(`已解鎖 ${ip}`); load();
  }

  return (
    <div>
      <div style={{fontSize:16,fontWeight:800,marginBottom:6}}>封鎖 IP 列表</div>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:14}}>
        登入失敗 5 次後自動永久封鎖。只有管理員可以解鎖。
      </div>
      {msg && <div style={{fontSize:13,color:'var(--gold)',fontWeight:600,marginBottom:10}}>{msg}</div>}
      {loading ? <div style={{color:'var(--text3)',fontSize:13}}>載入中…</div> :
       ips.length === 0 ? <div style={{color:'var(--text3)',fontSize:13}}>目前無封鎖 IP</div> :
       ips.map(r => (
        <div key={r.ip} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',
          background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,marginBottom:8}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:'monospace',fontWeight:700,fontSize:14,color:'#e53935'}}>{r.ip}</div>
            <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>
              {r.reason}　·　{(r.blocked_at||'').slice(0,16).replace('T',' ')}
            </div>
          </div>
          <button onClick={()=>unblock(r.ip)}
            style={{padding:'6px 14px',fontSize:12,fontWeight:700,border:'none',
              borderRadius:8,background:'#e8f5e9',color:'#2e7d32',cursor:'pointer'}}>
            解鎖
          </button>
        </div>
      ))}
    </div>
  );
}

/* ── UserMgmtSection ────────────────────────────────── */
function UserMgmtSection() {
  const ROLE_LABEL = { admin:'管理員', editor:'員工', viewer:'唯讀' };
  const ROLE_COLOR = { admin:'#b8935a', editor:'#4caf77', viewer:'#8a8a8a' };

  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [editPw,  setEditPw]  = useState(null);
  const [newPw,   setNewPw]   = useState('');
  const [form,    setForm]    = useState({ name:'', username:'', password:'', role:'editor' });
  const [saving,  setSaving]  = useState(false);
  const [msg,     setMsg]     = useState('');

  const iS = { padding:'10px 12px', border:'2px solid #c8b89a', borderRadius:8, fontSize:15,
               background:'#fdf8ef', color:'var(--text)', fontWeight:600, width:'100%', boxSizing:'border-box' };
  const btnSm = (bg, color) => ({
    padding:'5px 12px', fontSize:12, fontWeight:600, border:'none', borderRadius:6,
    background: bg, color: color, cursor:'pointer',
  });

  function flash(text) { setMsg(text); setTimeout(() => setMsg(''), 3000); }

  async function load() {
    setLoading(true);
    try {
      const r = await fetch('/api/auth/users');
      if (r.ok) setUsers(await r.json());
      else flash('載入失敗（' + r.status + '）');
    } catch(e) { flash('網路錯誤：' + e.message); }
    finally { setLoading(false); }
  }
  useEffect(() => { load(); }, []);

  async function createUser() {
    if (!form.name.trim() || !form.username.trim() || !form.password.trim()) {
      flash('姓名、帳號、密碼都必填'); return;
    }
    setSaving(true);
    try {
      const r = await fetch('/api/auth/users', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(form),
      });
      if (r.ok) {
        setForm({ name:'', username:'', password:'', role:'editor' });
        flash('✓ 帳號已新增');
        load();
      } else {
        const d = await r.json().catch(()=>({}));
        flash(d.detail || '新增失敗（' + r.status + '）');
      }
    } catch(e) {
      flash('網路錯誤：' + e.message);
    } finally {
      setSaving(false);
    }
  }

  async function toggleActive(u) {
    await fetch(`/api/auth/users/${u.id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ is_active: u.is_active ? 0 : 1 }),
    });
    load();
  }

  async function deleteUser(u) {
    if (!confirm(`確定刪除「${u.name}」的帳號？此操作無法還原。`)) return;
    await fetch(`/api/auth/users/${u.id}`, { method:'DELETE' });
    flash('帳號已刪除'); load();
  }

  async function savePassword(u) {
    if (!newPw.trim() || newPw.length < 4) { flash('密碼至少 4 個字元'); return; }
    setSaving(true);
    await fetch(`/api/auth/users/${u.id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: newPw }),
    });
    setSaving(false);
    setEditPw(null); setNewPw('');
    flash('密碼已更新');
  }

  return (
    <div>
      {/* 新增帳號表單（永遠顯示在最上方） */}
      <div style={{background:'#fdf8ef',borderRadius:12,padding:'16px',border:'2px solid #c8b89a',marginBottom:20}}>
        <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:'var(--text)'}}>+ 新增帳號</div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:12}}>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>姓名</div>
            <input style={iS} value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="例：小明" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>帳號（登入用）</div>
            <input style={iS} value={form.username} onChange={e=>setForm(p=>({...p,username:e.target.value}))} placeholder="例：ming123" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>密碼</div>
            <input style={iS} type="password" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} placeholder="至少 4 個字元" />
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>角色</div>
            <select style={iS} value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}>
              <option value="editor">員工（可估價、建連結、上傳）</option>
              <option value="admin">管理員（全權限）</option>
            </select>
          </div>
        </div>
        {msg && <div style={{fontSize:13,fontWeight:600,marginBottom:8,padding:'8px 10px',borderRadius:8,
          background: msg.startsWith('✓') ? '#e8f5e9' : '#ffebee',
          color: msg.startsWith('✓') ? '#2e7d32' : '#c62828'}}>{msg}</div>}
        <button onClick={createUser} disabled={saving}
          style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,
            padding:'12px 0',fontSize:15,fontWeight:800,cursor:'pointer',width:'100%',
            opacity:saving?0.6:1}}>
          {saving ? '新增中…' : '確認新增'}
        </button>
      </div>

      {/* 現有帳號列表 */}

/* ── Quote History Detail ────────────────────────────── */
function QuoteHistoryDetail({ quote: q, onClose }) {
  const [finalInput, setFinalInput] = useState('');

  const [saved,      setSaved]      = useState(false);
  const [cardMode,   setCardMode]   = useState(null); // null | 'ai' | 'final'

  const adj = (() => { try { return JSON.parse(q.adjusted_data||'{}'); } catch { return {}; } })();
  const CHAIN_TO_WEIGHT_MAP = {'少':'輕 (1.5–3g)','正常':'中 (3–5g)','多':'偏重 (5–8g)'};
  // Fallback: parse description "戒指・藍寶石 1ct・輕奢"
  const descParts = (q.description || '').split('・');
  const catFB      = descParts[0]?.trim() || '';
  const stonePartFB = descParts[1] || '';
  const stoneNameFB = stonePartFB.replace(/\s+[\d.]+ct$/,'').trim();
  const caratFB    = parseFloat(stonePartFB.match(/([\d.]+)ct/)?.[1]) || 0;
  const styleFB    = descParts[2]?.trim() || '';
  // Resolved fields (adj preferred, fallback to top-level or parsed)
  const rCat      = adj.category       || catFB        || '';
  const rStone    = adj.gemstone       || q.gemstone   || stoneNameFB || '';
  const rCarat    = adj.carat          || caratFB      || 0;
  const rMaterial = adj.material       || q.material   || '';
  const rStyle    = adj.style          || styleFB      || '';
  const rCraft    = adj.craft_complexity || '';
  const rOrigin   = adj.origin         || '';
  const rTreat    = adj.treatment      || '';
  const rColorQ   = adj.colorQ         || '';
  const rStoneMode= adj.stoneMode      || 'invest';
  const rSidestone= adj.sidestone      || '';
  const rPlating  = adj.plating        || '';
  const rSize     = adj.size           || '';
  const rWeightKey      = adj.setting_amount ? (CHAIN_TO_WEIGHT_MAP[adj.setting_amount] || adj.setting_amount) : '';
  const rCommissionNote = adj.commission_note || '';
  const rOrderType      = adj.order_type      || '';
  const rStaffName      = adj.staff_name      || q.staff_name || '';
  const thumbUrl  = q.photo_id ? `/api/thumb/${q.photo_id}` : null;
  const finalNum  = parseInt(String(finalInput).replace(/[^0-9]/g,'')) || 0;

  async function doSave() {
    if (!finalNum) return;
    setSaving(true);
    try {
      const res = await fetch(`/api/quotes/${q.id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ final_price: finalNum }),

      else {
        const raw = await res.text().catch(() => '');
        let detail = raw;
        try { const j = JSON.parse(raw); detail = JSON.stringify(j.detail || j); } catch {}
        alert('儲存失敗 ' + res.status + (detail ? '\n' + detail : ''));

            {saved && <div style={{fontSize:11,color:'#4caf77',marginBottom:8}}>✓ 已儲存</div>}

          orderType={rOrderType}
          cat={rCat}

          carat={rCarat}

          stoneMode={rStoneMode}

/* ── PricingBanner ──────────────────────────────────── */
function PricingBanner({ metalsLastUpdated, onGotoSettings }) {
  const DISMISS_KEY = 'pricingBannerDismissed';
  const DISMISS_TTL = 7 * 24 * 3600 * 1000; // 7 days in ms

  const [visible, setVisible] = React.useState(() => {
    try {
      const raw = localStorage.getItem(DISMISS_KEY);
      if (!raw) return true;
      const { ts } = JSON.parse(raw);
      return Date.now() - ts > DISMISS_TTL;
    } catch { return true; }
  });

  if (!visible || !metalsLastUpdated) return null;

  // Calculate days since last update
  const lastMs = new Date(metalsLastUpdated).getTime();
  const daysSince = Math.floor((Date.now() - lastMs) / (24 * 3600 * 1000));
  if (daysSince <= 7) return null;

  function dismiss() {
    localStorage.setItem(DISMISS_KEY, JSON.stringify({ ts: Date.now() }));
    setVisible(false);
  }

  return (
    <div className="pricing-banner">
      <span className="banner-msg">⚠️ 金銀行情已 {daysSince} 天未更新</span>
      {onGotoSettings && (
        <button className="banner-goto" onClick={onGotoSettings}>前往更新</button>
      )}
      <button className="banner-dismiss" onClick={dismiss} title="關閉">✕</button>
    </div>
  );
}

/* ── StagingSection ─────────────────────────────────── */
function StagingSection() {
  const [files,   setFiles]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [status,  setStatus]  = useState(null);
  const [polling, setPolling] = useState(false);

  function load() {
    setLoading(true);
    fetch('/api/staging').then(r => r.json()).then(d => {
      setFiles(d.files || []);
      setLoading(false);
    }).catch(() => setLoading(false));
  }

  useEffect(() => { load(); }, []);

  // poll ingest status while running
  useEffect(() => {
    if (!polling) return;
    const id = setInterval(() => {
      fetch('/api/staging/ingest-status').then(r => r.json()).then(s => {
        setStatus(s);
        if (!s.running) {
          setPolling(false);
          load();
        }
      });
    }, 1500);
    return () => clearInterval(id);
  }, [polling]);

  function del(rel) {
    fetch(`/api/staging/${encodeURIComponent(rel)}`, { method: 'DELETE' })
      .then(() => setFiles(f => f.filter(x => x.rel !== rel)));
  }

  function startIngest() {
    fetch('/api/staging/ingest', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        setStatus(d.status || {});
        setPolling(true);
      });
  }

  const running = status?.running;
  const done    = status?.done;

  return (
    <div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:8}}>
        將照片放入 <code>data/01_unsorted/</code>，預看後按「確認匯入」。
      </div>
      {loading
        ? <div className="staging-empty">載入中…</div>
        : files.length === 0
          ? <div className="staging-empty">目前沒有待匯入照片</div>
          : (
            <div className="staging-grid">
              {files.map(f => (
                <div key={f.rel} className="staging-card">
                  <img src={`/api/staging/thumb/${encodeURIComponent(f.rel)}`} loading="lazy" />
                  <button className="staging-card-del" onClick={() => del(f.rel)} title="刪除">✕</button>
                </div>
              ))}
            </div>
          )
      }
      <div className="staging-actions">
        <button
          className="staging-ingest-btn"
          disabled={files.length === 0 || running}
          onClick={startIngest}
        >
          {running ? `匯入中… ${status?.step || ''}` : `確認匯入 ${files.length} 張`}
        </button>
        <button className="staging-ingest-btn" style={{flex:'none',background:'#888'}} onClick={load}>重新整理</button>
      </div>
      {status && (
        <div className="staging-status">
          {done ? '✅ 匯入完成' : running ? `⏳ ${status.step}` : status.step || ''}
        </div>
      )}
    </div>
  );
}

function GuestApp({ token }) {
  const [info,       setInfo]       = useState(null);
  const [error,      setError]      = useState('');
  const [favIds,     setFavIds]     = useState(new Set());
  const [remain,     setRemain]     = useState(0);
  const [showSheet,  setShowSheet]  = useState(false);
  const [limitToast, setLimitToast] = useState(false);
  const MAX_FAVS = 9;

  useEffect(() => {
    fetch(`/api/guest-links/info/${token}`)
      .then(r => { if (!r.ok) throw r.status; return r.json(); })
      .then(d => { setInfo(d); setRemain(d.remaining_min); })
      .catch(s => setError(s === 410 ? '連結已過期或停用' : '連結不存在'));
  }, [token]);

  useEffect(() => {
    if (!info) return;
    fetch(`/api/guest-links/favorites/${token}`)
      .then(r => r.json())
      .then(d => setFavIds(new Set((d.favorites || []).map(f => f.photo_id))));
  }, [info]);

  useEffect(() => {
    if (!info) return;
    const t = setInterval(() => setRemain(m => Math.max(0, m - 1)), 60000);
    return () => clearInterval(t);
  }, [info]);

  const isFav = id => favIds.has(id);

  const toggleFav = async photo => {
    const id = typeof photo === 'object' ? photo.id : photo;
    if (!favIds.has(id) && favIds.size >= MAX_FAVS) {
      setLimitToast(true);
      setTimeout(() => setLimitToast(false), 2500);
      return;
    }
    try {
      const r = await fetch(`/api/guest-links/favorite/${token}/${id}`, { method: 'POST' });
      if (!r.ok) return;
      const d = await r.json();
      setFavIds(prev => { const n = new Set(prev); d.favorited ? n.add(id) : n.delete(id); return n; });
    } catch {}
  };

  if (error) return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      height:'100vh',gap:12,padding:24,textAlign:'center'}}>
      <div style={{fontSize:48}}>⏰</div>
      <div style={{fontSize:18,fontWeight:700}}>{error}</div>
      <div style={{fontSize:13,color:'#888'}}>請聯繫服務人員取得新連結</div>
    </div>
  );

  if (!info) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:14,color:'#888'}}>
      載入中…
    </div>
  );

  const hrs = Math.floor(remain / 60);
  const timeStr = hrs > 0 ? `${hrs}小時${remain % 60}分` : `${remain % 60}分`;
  const atLimit = favIds.size >= MAX_FAVS;

  return (
    <React.Fragment>
      <header className="nav">
        <span className="nav-logo">Tahir Zainab Selection</span>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:12,color:'var(--text2)'}}>⏱ {timeStr}</span>
          {/* 收藏按鈕 */}
          <button onClick={() => setShowSheet(true)}
            style={{display:'flex',alignItems:'center',gap:5,
              background: atLimit ? 'var(--accent)' : 'var(--gold)',
              color:'#fff',border:'none',borderRadius:20,
              padding:'5px 12px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            ❤️ {favIds.size}
            <span style={{fontWeight:400,fontSize:11,opacity:0.85}}>/{MAX_FAVS}</span>
          </button>
        </div>
      </header>

      <div className="content" style={{paddingBottom: favIds.size > 0 ? 56 : 0}}>
        <BrowseTab isFav={isFav} toggleFav={toggleFav} role="viewer" />
      </div>

      {/* 底部提示條 */}
      {favIds.size > 0 && (
        <div onClick={() => setShowSheet(true)}
          style={{position:'fixed',bottom:0,left:0,right:0,zIndex:300,
            background: atLimit ? 'var(--accent)' : 'var(--gold)', color:'#fff',
            padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',
            cursor:'pointer',fontSize:13,fontWeight:600}}>
          <span>
            {atLimit
              ? `✅ 已選滿 ${MAX_FAVS} 張 — 請通知店員`
              : `❤️ 已收藏 ${favIds.size} / ${MAX_FAVS} 張`}
          </span>
          <span style={{fontSize:12,fontWeight:400,opacity:0.9}}>管理收藏 →</span>
        </div>
      )}

      {/* 上限提示 toast */}
      {limitToast && (
        <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
          zIndex:500,background:'rgba(0,0,0,0.82)',color:'#fff',
          padding:'14px 24px',borderRadius:12,fontSize:14,fontWeight:600,
          textAlign:'center',maxWidth:240,lineHeight:1.5,pointerEvents:'none'}}>
          已達上限 {MAX_FAVS} 張<br/>
          <span style={{fontSize:12,fontWeight:400,opacity:0.8}}>點底部「管理收藏」可取消後再選</span>
        </div>
      )}

      {/* 收藏管理 sheet */}
      {showSheet && (
        <GuestFavSheet
          token={token}
          favIds={favIds}
          onToggle={toggleFav}
          onClose={() => setShowSheet(false)}
        />
      )}
    </React.Fragment>
  );
}
