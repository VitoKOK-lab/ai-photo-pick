<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Tahir Zainab Selection</title>
  <style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #f4f4f4;
  --surface: #ffffff;
  --s2:      #f9f9f9;
  --s3:      #efefef;
  --text:    #1a1a1a;
  --text2:   #777;
  --text3:   #bbb;
  --border:  #e8e8e8;
  --accent:  #1a1a1a;
  --gold:    #b8935a;
  --r:       10px;
  --nav-h:   52px;
  --tab-h:   58px;
  --side-w:  220px;
  --shadow:  0 1px 4px rgba(0,0,0,.08);
  --shadow2: 0 4px 16px rgba(0,0,0,.12);
}

/* ── Base ───────────────────────────────────────────────── */
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }

/* ── Nav ────────────────────────────────────────────────── */
.nav {
  height: var(--nav-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  box-shadow: var(--shadow);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  transition: transform .4s cubic-bezier(.4,0,.2,1);
}
.browse-hdr { position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 150; background: var(--surface); transition: transform .4s cubic-bezier(.4,0,.2,1); }
.nav-logo { font-size: 13px; font-weight: 200; letter-spacing: 5px; color: var(--gold); flex: 1; text-transform: uppercase; }
.nav-tabs { display: none; gap: 0; }
.nav-tab {
  position: relative;
  padding: 0 20px;
  height: 100%;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  white-space: nowrap;
}
.nav-tab:first-child { border-left: 1px solid var(--border); }
.nav-tab.on { color: var(--accent); font-weight: 700; }
.badge { background: var(--gold); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

/* ── Tab bar (mobile) ───────────────────────────────────── */
.tab-bar { background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
.tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; background: none; border: none; border-right: 1px solid var(--border); color: var(--text2); font-size: 13px; font-weight: 500; padding: 14px 4px; cursor: pointer; position: relative; }
.tab-btn:last-child { border-right: none; }
.tab-btn.on { color: var(--accent); font-weight: 700; }
.tab-badge { background: var(--gold); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center; line-height: 1.4; }

/* ── Content ────────────────────────────────────────────── */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

/* ── Category tabs ───────────────────────────────────────── */
.cat-tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:10px 10px 6px; gap:6px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.cat-tabs::-webkit-scrollbar { display:none; }
.cat-tab { display:flex; flex-direction:column; align-items:center; gap:4px; border:none; background:none; padding:4px 6px; border-radius:10px; cursor:pointer; min-width:56px; flex-shrink:0; touch-action:manipulation; transition:background .2s; }
.cat-tab.on { background:none; }
.cat-tab-img { width:72px; height:72px; border-radius:8px; object-fit:cover; border:none; transition:transform .15s; }
.cat-tab:active .cat-tab-img { transform:scale(.93); }
.cat-tab-thumb { position:relative; width:72px; height:72px; flex-shrink:0; }
.cat-tab-thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; display:block; }
.cat-tab-thumb::after { content:''; position:absolute; inset:0; border-radius:8px; background:rgba(184,147,90,0); transition:background .2s; pointer-events:none; }
.cat-tab.on .cat-tab-thumb::after { background:rgba(184,147,90,.38); }
.cat-tab-all { width:72px; height:72px; border-radius:8px; background:var(--s3); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text2); border:none; }
.cat-tab span { font-size:11px; color:var(--text2); white-space:nowrap; }
.cat-tab.on span { color:var(--gold); font-weight:600; }

/* ── Chips ───────────────────────────────────────────────── */
.chips-bar { display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chips-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 8px 18px; background: none; border: none; border-right: 1px solid var(--border); font-size: 13px; color: var(--text2); white-space: nowrap; transition: color .15s; flex-shrink: 0; }
.chip.on { color: var(--accent); font-weight: 600; }
.chip-clr { display: inline-flex; align-items: center; padding: 8px 18px; background: none; border: none; font-size: 13px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }

/* ── Body row ───────────────────────────────────────────── */
.body-row { flex: 1; overflow: hidden; display: flex; min-height: 0; }

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar { display: none; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 12px 0 32px; }
.sb-clear { margin: 6px 14px 12px; padding: 8px 12px; background: none; border: 1px solid var(--border); border-radius: var(--r); color: var(--text3); font-size: 12px; width: calc(100% - 28px); text-align: left; }
.sb-clear:hover { background: var(--s3); color: var(--text2); }
.sb-sec { border-bottom: 1px solid var(--border); }
.sb-hd { width: 100%; padding: 11px 16px; background: none; border: none; display: flex; align-items: center; justify-content: space-between; text-align: left; }
.sb-hd-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
.sb-hd.has-val .sb-hd-label { color: var(--accent); }
.sb-hd-arrow { font-size: 10px; color: var(--text3); }
.sb-opts { padding: 0 10px 10px; }
.sb-opt { display: block; width: 100%; padding: 8px 8px; background: none; border: none; color: var(--text2); font-size: 13px; text-align: left; border-radius: 6px; }
.sb-opt:hover { background: var(--s3); color: var(--text); }
.sb-opt.on { color: var(--accent); font-weight: 600; }
.sb-opt-clr { display: block; width: 100%; padding: 5px 8px; background: none; border: none; color: var(--text3); font-size: 11px; text-align: left; }

/* ── Main + grid ────────────────────────────────────────── */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 2px; }
.card { background: var(--surface); cursor: pointer; overflow: hidden; position: relative; border-radius: 0; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; transition: transform .15s ease; }
.card:active { transform: scale(.97); }
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fff; transition: opacity .2s; }
.card-fav { position: absolute; top: 7px; right: 7px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); border: none; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--text3); box-shadow: var(--shadow); transition: transform .2s, color .2s; }
.card-fav:active { transform: scale(1.3); }
.card-fav.on { color: var(--gold); }
.card-lbl { padding: 6px 9px 8px; font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sentinel { height: 1px; }

/* ── Grid banner (full-width editorial) ─────────────── */
.grid-banner { grid-column: 1 / -1; position: relative; cursor: pointer; overflow: hidden; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; }
.grid-banner img { width: 100%; aspect-ratio: 16/7; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.25,.46,.45,.94); }
.grid-banner:active img { transform: scale(1.04); }
.grid-banner-lbl { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 16px; background: linear-gradient(transparent, rgba(0,0,0,.42)); color: #fff; font-size: 13px; letter-spacing: 3px; font-weight: 300; text-transform: uppercase; }
.loading-msg { text-align: center; padding: 28px; color: var(--text3); font-size: 13px; }
/* ── Section divider between 去背 / 情境 ─────────────── */
.grid-section-div { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 18px 14px 10px; }
.grid-section-div-line { flex: 1; height: 1px; background: var(--border); }
.grid-section-div-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--text3); white-space: nowrap; }
.empty-msg { text-align: center; padding: 64px 24px; color: var(--text2); font-size: 14px; line-height: 1.9; }

/* ── Filter dropdown ────────────────────────────────────── */
.dd-panel { position: fixed; min-width: 160px; max-width: min(92vw, 260px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow2); z-index: 9999; overflow-y: auto; max-height: min(60vh, 380px); animation: ddIn .15s ease; }
@keyframes ddIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.dd-item { padding: 11px 15px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border); gap: 10px; transition: background .12s; }
.dd-item:last-child { border-bottom: none; }
.dd-item:active, .dd-item:hover { background: var(--s3); }
.dd-item.on { color: var(--accent); font-weight: 600; }
.dd-item.dd-zero { color: var(--text3); cursor: default; pointer-events: none; }
.dd-clr { color: var(--text3); font-size: 12px; }
.dd-cnt { font-size: 12px; color: var(--text3); font-weight: 400; flex-shrink: 0; }

/* ── Detail overlay ─────────────────────────────────────── */
.det-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; display: flex; align-items: flex-end; }
.det-panel { width: 100%; max-height: 80vh; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative; animation: up .25s cubic-bezier(.32,.72,0,1); box-shadow: var(--shadow2); }
.det-handle { width: 36px; height: 4px; background: var(--s3); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
.det-x { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--s3); border: none; font-size: 18px; color: var(--text2); display: flex; align-items: center; justify-content: center; z-index: 1; }
.det-hd-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.det-back { width: 32px; height: 32px; border-radius: 50%; background: var(--s3); border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text); }
.det-hd-title { font-size: 15px; font-weight: 600; flex: 1; }
.det-left { flex-shrink: 0; }
.det-img { width: 100%; aspect-ratio: 1; max-height: none; object-fit: cover; display: block; background: var(--s3); }
.det-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.det-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.det-tags { padding: 12px 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 11px; background: var(--s3); border-radius: 20px; font-size: 12px; color: var(--text2); }
/* Action bar */
.det-actions { display: flex; align-items: center; padding: 10px 16px 18px; border-top: 1px solid var(--border); gap: 8px; flex-shrink: 0; background: var(--surface); }
.det-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 10px; min-width: 48px; transition: background .15s; touch-action: manipulation; }
.det-icon-btn:active { background: var(--s3); }
.det-icon-btn span:first-child { font-size: 20px; line-height: 1; }
.det-icon-btn span:last-child { font-size: 10px; color: var(--text3); font-weight: 500; white-space: nowrap; }
.det-icon-btn.fav-on span:last-child { color: var(--gold); }
.det-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
.det-cta { background: var(--gold); color: #fff; border: none; border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.det-edit-btn { background: var(--s3); color: var(--text2); border: none; border-radius: 10px; padding: 11px 14px; font-size: 16px; cursor: pointer; touch-action: manipulation; }
.db { padding: 13px; border-radius: var(--r); border: none; font-size: 13px; font-weight: 600; touch-action: manipulation; position: relative; z-index: 2; }
.db-fav { background: var(--s3); color: var(--text); }
.db-fav.on { background: #fff0e0; color: var(--gold); border: 1.5px solid var(--gold); }
.db-sim { background: var(--accent); color: #fff; }

/* ── Edit panel ─────────────────────────────────────────── */
.db-edit { background: var(--s3); color: var(--text2); }
.edit-panel { padding: 14px 16px 20px; }
.edit-row { margin-bottom: 12px; }
.edit-label { font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--text3); margin-bottom: 6px; }
.edit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.edit-chip { padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; color: var(--text2); cursor: pointer; }
.edit-chip.on { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.edit-actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
.db-save { background: var(--accent); color: #fff; }
.db-del { background: none; border: 1px solid #e8c4c4; color: #c0392b; font-size: 11px; font-weight: 400; padding: 0; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* similar view */
.sim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; padding: 3px; }
.sim-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--s3); cursor: pointer; animation: fadeUp 1.5s cubic-bezier(.22,.68,0,1.2) both; }

/* ── Dark-bg cleaner ────────────────────────────────────── */
.darkbg-btn { font-size: 11px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text2); cursor: pointer; white-space: nowrap; }
.darkbg-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 400; display: flex; align-items: flex-end; }
.darkbg-panel { width: 100%; max-height: 85vh; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .25s cubic-bezier(.32,.72,0,1); }
.darkbg-hd { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.darkbg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; overflow-y: auto; flex: 1; }
.darkbg-card { position: relative; cursor: pointer; }
.darkbg-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.darkbg-card.exclude::after { content: '✓'; position: absolute; inset: 0; background: rgba(0,200,100,.35); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
.darkbg-footer { padding: 12px 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }

/* ── Login page ─────────────────────────────────────────── */
.login-page { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-brand { font-size: 13px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; font-weight: 200; text-align: center; margin-bottom: 36px; }
.login-card { background: var(--surface); border-radius: var(--r); padding: 24px 20px 20px; width: 100%; max-width: 280px; box-shadow: var(--shadow2); display: flex; flex-direction: column; gap: 14px; }
.login-label { font-size: 13px; color: var(--text2); text-align: center; }
.login-pin-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--r); font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; box-sizing: border-box; }
.login-pin-input:focus { border-color: var(--gold); }
.login-pin-input.shake { animation: pin-shake .4s ease; }
@keyframes pin-shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)} }
.login-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.login-err { font-size: 12px; color: #e74c3c; text-align: center; min-height: 16px; }
.login-agent-link { display: block; text-align: center; font-size: 12px; color: var(--text3); cursor: pointer; }
.login-agent-link:hover { color: var(--text2); }

/* ── Nav right-side logout ──────────────────────────────── */
.nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-role { font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 0.5px; }
.nav-logout { padding: 6px 14px; border: none; border-radius: var(--r); background: var(--s3); font-size: 13px; color: var(--text2); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.nav-logout:hover { background: var(--border); color: var(--text); }

/* ── Admin PIN modal (kept for agent login) ─────────────── */
.pin-ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; display: flex; align-items: center; justify-content: center; }
.pin-box { background: var(--surface); border-radius: 16px; padding: 24px 20px; width: 280px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
.pin-title { font-size: 15px; font-weight: 600; text-align: center; color: var(--text); }
.pin-input { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; width: 100%; box-sizing: border-box; }
.pin-input:focus { border-color: var(--gold); }
.pin-err { font-size: 12px; color: #e74c3c; text-align: center; min-height: 16px; }
.pin-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.pin-cancel { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--text2); cursor: pointer; }
.undo-toast { position: fixed; bottom: calc(var(--tab-h) + 16px); left: 50%; transform: translateX(-50%); z-index: 400; background: #1a1a1a; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.3); animation: fadeUp .3s ease both; }
.undo-btn { background: var(--gold); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

/* ── Upload FAB ─────────────────────────────────────────── */
.upload-fab { position: fixed; bottom: calc(var(--tab-h) + 16px); right: 16px; z-index: 300; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 28px; font-weight: 300; line-height: 1; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.24); display: flex; align-items: center; justify-content: center; transition: transform .15s, box-shadow .15s; }
.upload-fab:active { transform: scale(.92); }
.upload-fab:disabled { opacity: .6; cursor: default; }
.upload-toast { position: fixed; bottom: calc(var(--tab-h) + 78px); right: 14px; z-index: 301; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; animation: fadeUp .3s ease both; pointer-events: none; white-space: pre-line; max-width: 220px; }
.upload-prog { position: fixed; bottom: calc(var(--tab-h) + 78px); right: 14px; z-index: 301; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; animation: fadeUp .3s ease both; pointer-events: none; }

/* ── Staging panel ───────────────────────────────────────── */
.staging-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 0; }
.staging-card { position: relative; border-radius: 10px; overflow: hidden; background: #f0f0f0; aspect-ratio: 1; }
.staging-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.staging-card-del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.staging-empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 14px; }

@keyframes sparkPop { 0% { opacity:0; transform:scale(0) translateY(0); } 30% { opacity:1; transform:scale(1.4) translateY(-5px); } 100% { opacity:0; transform:scale(.5) translateY(-26px); } }

<div id="root"></div>
<script src="/js/vendor/react.min.js"></script>
<script src="/js/vendor/react-dom.min.js"></script>
<script src="/js/vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Config ─────────────────────────────────────────── */
const BANNERS = ['/banners/ｂ1.png','/banners/ｂ2.png','/banners/ｂ3.png','/banners/ｂ4.png','/banners/ｂ5.png','/banners/ｂ6.png','/banners/ｂ7.png','/banners/ｂ8.png','/banners/ｂ9.png','/banners/ｂ10.png'].sort(() => Math.random() - 0.5);

/* ── JWT auth utilities ─────────────────────────────── */
function getJwtToken() { return localStorage.getItem('jwt_token'); }
function getJwtUser()  { try { return JSON.parse(localStorage.getItem('jwt_user') || 'null'); } catch { return null; } }
function clearJwtAuth() { localStorage.removeItem('jwt_token'); localStorage.removeItem('jwt_user'); }

/* Intercept all fetch() calls — automatically attach Bearer token for /api/ routes,
   and fire 'authExpired' event on 401 so App can show the login screen again. */
(function() {
  const _origFetch = window.fetch.bind(window);
  window.fetch = function(url, opts = {}) {
    const token = getJwtToken();
    if (token && typeof url === 'string' && url.startsWith('/api/')) {
      opts = { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) } };
    }
    return _origFetch(url, opts).then(resp => {
      if (resp.status === 401 && typeof url === 'string' && url.startsWith('/api/') && !url.includes('/api/auth/')) {
        clearJwtAuth();
        window.dispatchEvent(new CustomEvent('authExpired'));
      }
      return resp;
    });
  };
})();

async function apiFetch(url, options = {}) { return fetch(url, options); }
const SESSION_ID = (sessionStorage.getItem('sid') || (() => { const s = Math.random().toString(36).slice(2); sessionStorage.setItem('sid', s); return s; })());
async function logEvent(photo_id, event_type, extra = {}) {
  try {
    await fetch('/api/events', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ photo_id, event_type, session_id: SESSION_ID, ...extra }) });
  } catch {}
}
const CATS = ['戒指','手鏈','項鍊','耳釘','胸針','其他'];
const CFG = {
  style:       { label: '鑽石數量', values: ['無鑽','簡約','輕奢','奢華'] },
  color:       { label: '寶石色', values: ['紅','粉','黃','綠','藍','紫','白','彩'] },
  metal_color: { label: '金工色', values: ['金','銀'] },
};

/* ── Fav storage ────────────────────────────────────── */
const loadFavs = () => { try { return JSON.parse(localStorage.getItem('jdb_favs') || '[]'); } catch { return []; } };
const saveFavs = f => localStorage.setItem('jdb_favs', JSON.stringify(f));

/* ── Icons ──────────────────────────────────────────── */
function IcoGrid() {
  return <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
}
function IcoHeart({ fill }) {
  return <svg viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
}

const CAT_IMGS = {
  '戒指': '/banners/戒指.png', '手鏈': '/banners/手鏈.png',
  '項鍊': '/banners/項鍊.png', '耳釘': '/banners/耳釘.png', '胸針': '/banners/胸針.png', '其他': '/banners/其他.png',
};

/* ── Category tabs ──────────────────────────────────── */
function CategoryTabs({ active, onSelect }) {
  return (
    <div className="cat-tabs">
      {CATS.map(cat => (
        <button key={cat} className={'cat-tab' + (active === cat ? ' on' : '')}
          onClick={() => onSelect(cat)}>
          <div className="cat-tab-thumb">
            {CAT_IMGS[cat]
              ? <img src={CAT_IMGS[cat]} alt="" loading="lazy" />
              : <div className="cat-tab-all" style={{fontSize:13,width:'100%',height:'100%',borderRadius:8}}>{cat}</div>
            }
          </div>
          <span>{cat}</span>
        </button>
      ))}
    </div>
  );
}

/* ── Filter dropdown ────────────────────────────────── */
function FilterDropdown({ field, cur, counts, onPick }) {
  const cfg = CFG[field];
  const [open, setOpen] = React.useState(false);
  const [panelStyle, setPanelStyle] = React.useState({});
  const btnRef = React.useRef(null);
  const panelRef = React.useRef(null);

  const toggle = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - 168);
      setPanelStyle({ top: r.bottom + 4, left: Math.max(4, left) });
    }
    setOpen(p => !p);
  };

  React.useEffect(() => {
    if (!open) return;
    const h = e => {
      if (btnRef.current?.contains(e.target)) return;
      if (panelRef.current?.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener('mousedown', h);
    document.addEventListener('touchstart', h);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('touchstart', h); };
  }, [open]);

  const panel = open && ReactDOM.createPortal(
    <div ref={panelRef} className="dd-panel" style={panelStyle}>
      {cur && <div className="dd-item dd-clr" onClick={() => { onPick(null); setOpen(false); }}>清除（全部）</div>}
      {cfg.values.map(v => {
        const cnt = counts?.[v] ?? null;
        const zero = cnt !== null && cnt === 0;
        return (
          <div key={v} className={'dd-item' + (cur === v ? ' on' : '') + (zero ? ' dd-zero' : '')}
            onClick={() => { if (!zero) { onPick(v === cur ? null : v); setOpen(false); } }}>
            <span>{v}{cur === v ? ' ✓' : ''}</span>
            {cnt != null && <span className="dd-cnt">{cnt}</span>}
          </div>
        );
      })}
    </div>,
    document.body
  );

  return (
    <div style={{position:'relative', display:'inline-block', flexShrink:0}}>
      <button ref={btnRef} className={'chip' + (cur ? ' on' : '')} onClick={toggle}>
        {cur || cfg.label} {cur ? '✕' : '▾'}
      </button>
      {panel}
    </div>
  );
}

/* ── Sidebar ────────────────────────────────────────── */
function Sidebar({ filters, onFilter, onClear, counts }) {
  const [open, setOpen] = useState({ category: true, style: true, color: false, metal_color: false });
  return (
    <aside className="sidebar">
      {Object.keys(filters).length > 0 && (
        <button className="sb-clear" onClick={onClear}>✕ 清除全部篩選</button>
      )}
      {Object.entries(CFG).map(([field, cfg]) => (
        <div key={field} className="sb-sec">
          <button className={'sb-hd' + (filters[field] ? ' has-val' : '')}
            onClick={() => setOpen(p => ({ ...p, [field]: !p[field] }))}>
            <span className="sb-hd-label">{cfg.label}{filters[field] ? ' · ' + filters[field] : ''}</span>
            <span className="sb-hd-arrow">{open[field] ? '▾' : '▸'}</span>
          </button>
          {open[field] && (
            <div className="sb-opts">
              {filters[field] && <button className="sb-opt-clr" onClick={() => onFilter(field, null)}>✕ 清除</button>}
              {cfg.values.map(v => {
                const cnt = counts?.[field]?.[v];
                return (
                  <button key={v} className={'sb-opt' + (filters[field] === v ? ' on' : '')}
                    onClick={() => onFilter(field, filters[field] === v ? null : v)}>
                    <span>{v}</span>
                    {cnt != null && <span style={{marginLeft:6,fontSize:11,color:'var(--text3)',fontWeight:400}}>{cnt}</span>}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      ))}
    </aside>
  );
}

/* ── Similar infinite grid ──────────────────────────── */
function SimilarInfiniteGrid({ items, onSelectPhoto, setView }) {
  const [displayed, setDisplayed] = React.useState(() => items.map((p, i) => ({...p, _key: i})));
  const [counter, setCounter]     = React.useState(items.length);
  const sentinelRef = React.useRef(null);

  React.useEffect(() => {
    const sentinel = sentinelRef.current;
    if (!sentinel || items.length === 0) return;
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        const shuffled = [...items].sort(() => Math.random() - 0.5);
        setDisplayed(prev => {
          const base = prev.length;
          return [...prev, ...shuffled.map((p, i) => ({...p, _key: base + i + Math.random()}))];
        });
      }
    }, { threshold: 0.1 });
    observer.observe(sentinel);
    return () => observer.disconnect();
  }, [items]);

  return (
    <div className="sim-grid">
      {displayed.map((p, i) => (
        <img key={p._key} src={p.thumb_url} alt="" loading="lazy"
          style={{animationDelay:`${(i % 9) * 0.19}s`}}
          onClick={() => { onSelectPhoto(p); setView('detail'); }} />
      ))}
      <div ref={sentinelRef} style={{gridColumn:'1/-1', height:60}} />
    </div>
  );
}

/* ── Zoom image (button +/−) ────────────────────────── */
function PinchImage({ src, className }) {
  const containerRef = useRef(null);
  const imgRef       = useRef(null);
  const [scale, setScale] = useState(1);
  const scaleRef = useRef(1);
  const offset   = useRef({ tx:0, ty:0 });
  const drag     = useRef({ on:false, x0:0, y0:0, tx0:0, ty0:0 });

  function applyTransform(s, animate) {
    const img = imgRef.current; if (!img) return;
    const o = offset.current;
    img.style.transition = animate ? 'transform .2s ease' : 'none';
    img.style.transform  = `scale(${s}) translate(${o.tx}px,${o.ty}px)`;
  }

  function zoom(delta) {
    const s = Math.min(4, Math.max(1, scaleRef.current + delta));
    if (s <= 1) offset.current = { tx:0, ty:0 };
    scaleRef.current = s;
    setScale(s);
    applyTransform(s, true);
  }

  useEffect(() => {
    const el = containerRef.current; if (!el) return;
    function client(e) { return e.touches ? { x:e.touches[0].clientX, y:e.touches[0].clientY } : { x:e.clientX, y:e.clientY }; }
    function startDrag(e) {
      if (scaleRef.current <= 1) return;
      if (e.touches && e.touches.length !== 1) return;
      const c = client(e);
      drag.current = { on:true, x0:c.x, y0:c.y, tx0:offset.current.tx, ty0:offset.current.ty };
    }
    function moveDrag(e) {
      if (!drag.current.on) return;
      if (e.touches && e.touches.length !== 1) return;
      e.preventDefault();
      const c = client(e); const s = scaleRef.current;
      offset.current.tx = drag.current.tx0 + (c.x - drag.current.x0) / s;
      offset.current.ty = drag.current.ty0 + (c.y - drag.current.y0) / s;
      applyTransform(s, false);
    }
    function endDrag() { drag.current.on = false; }

    el.addEventListener('touchstart', startDrag, { passive: true });
    el.addEventListener('touchmove',  moveDrag,  { passive: false });
    el.addEventListener('touchend',   endDrag,   { passive: true });
    el.addEventListener('mousedown',  startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup',   endDrag);
    return () => {
      el.removeEventListener('touchstart', startDrag);
      el.removeEventListener('touchmove',  moveDrag);
      el.removeEventListener('touchend',   endDrag);
      el.removeEventListener('mousedown',  startDrag);
      window.removeEventListener('mousemove', moveDrag);
      window.removeEventListener('mouseup',   endDrag);
    };
  }, [src]);

  const btnStyle = (disabled) => ({
    width:32, height:32, borderRadius:8, border:'none',
    background:'rgba(0,0,0,.5)', color:'#fff', fontSize:20, lineHeight:1,
    cursor: disabled ? 'default' : 'pointer', display:'flex', alignItems:'center',
    justifyContent:'center', opacity: disabled ? 0.35 : 1, flexShrink:0,
  });

  return (
    <div ref={containerRef} className={className}
      style={{overflow:'hidden', position:'relative', touchAction: scale > 1 ? 'none' : 'auto'}}>
      <img ref={imgRef} src={src} alt="" loading="lazy"
        style={{width:'100%',height:'100%',objectFit:'cover',display:'block',
                transformOrigin:'center',userSelect:'none',WebkitUserSelect:'none',
                cursor: scale > 1 ? 'grab' : 'default'}}
        draggable={false} />
      <div style={{position:'absolute',bottom:8,right:8,display:'flex',gap:4,zIndex:5}}>
        <button style={btnStyle(scale<=1)} onClick={() => zoom(-0.5)} disabled={scale<=1}>－</button>
        <button style={btnStyle(scale>=4)} onClick={() => zoom( 0.5)} disabled={scale>=4}>＋</button>
      </div>
    </div>
  );
}

/* ── Photo detail ───────────────────────────────────── */
function PhotoDetail({ photo, onClose, isFav, toggleFav, onSelectPhoto, onDeleted, onUpdated, role }) {
  const isAdmin = role === 'admin';
  const isStaff = role === 'admin' || role === 'editor';
  const openedAt = useRef(Date.now());
  useEffect(() => {
    logEvent(photo.id, 'view');
    return () => logEvent(photo.id, 'dwell', { dwell_ms: Date.now() - openedAt.current });
  }, [photo.id]);

  const [view,    setView]    = useState('detail'); // 'detail' | 'similar' | 'edit'
  const [similar, setSimilar] = useState(null);
  const [simErr,  setSimErr]  = useState(false);
  const [editCat,   setEditCat]   = useState(photo.category        || '');
  const [editSty,   setEditSty]   = useState(photo.style           || '');
  const [editChain, setEditChain] = useState(photo.setting_amount  || '');
  const [editCraft, setEditCraft] = useState(photo.craft_complexity|| '');
  const [editMetal, setEditMetal] = useState(photo.metal_color     || '');
  const [saving,    setSaving]    = useState(false);
  const simScrollRef = useRef(null);

  useEffect(() => {
    setView('detail'); setSimilar(null); setSimErr(false);
    setEditCat(photo.category || ''); setEditSty(photo.style || '');
    setEditChain(photo.setting_amount || ''); setEditCraft(photo.craft_complexity || '');
    setEditMetal(photo.metal_color || '');
  }, [photo.id]);

  const doSave = async () => {
    setSaving(true);
    try {
      const res = await fetch('/api/photos/' + photo.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: editCat, style: editSty, setting_amount: editChain, craft_complexity: editCraft, metal_color: editMetal }),
      });
      const updated = await res.json();
      onUpdated && onUpdated(updated);
      setView('detail');
    } catch { alert('儲存失敗'); }
    setSaving(false);
  };

  const doDelete = async () => {
    if (!confirm('確定永久刪除這張照片？（檔案會一併刪除，無法復原）')) return;
    await fetch('/api/photos/' + photo.id, { method: 'DELETE' });
    onDeleted && onDeleted(photo.id);
    onClose();
  };

  const openSimilar = () => {
    setView('similar');
    setTimeout(() => { if (simScrollRef.current) simScrollRef.current.scrollTop = 0; }, 0);
    if (similar !== null) return;
    setSimErr(false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    fetch('/api/photos/' + photo.id + '/similar?limit=12', { signal: ctrl.signal })
      .then(r => r.json())
      .then(d => { clearTimeout(timer); setSimilar(d.similar || []); })
      .catch(() => { clearTimeout(timer); setSimilar([]); setSimErr(true); });
  };

  const fav  = isFav(photo.id);
  const STYLE_VALS = new Set(['無鑽','簡約(5顆鑽內)','輕奢(20顆鑽內)','奢華滿鑲鑽']);
  const tags = [photo.category, photo.style,
    STYLE_VALS.has(photo.gemstone) ? null : photo.gemstone,
    photo.stone_shape, photo.stone_size, photo.color, photo.metal_color,
    photo.setting_amount, photo.craft_complexity]
    .filter(v => v && v !== '未定');

  /* Edit view */
  if (view === 'edit') return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setView('detail')}>←</button>
          <span className="det-hd-title">修改分類</span>
          <button className="db db-del" onClick={doDelete} title="刪除照片">🗑</button>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>
        </div>
        <div className="det-scroll">
          <img src={photo.thumb_url} alt="" style={{width:'100%',maxHeight:220,objectFit:'contain',background:'#f9f9f9'}} />
          <div className="edit-panel">
            <div className="edit-row">
              <div className="edit-label">品項</div>
              <div className="edit-chips">
                {CATS.map(v => (
                  <button key={v} className={'edit-chip' + (editCat === v ? ' on' : '')} onClick={() => setEditCat(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">鑽石數量</div>
              <div className="edit-chips">
                {CFG.style.values.map(v => (
                  <button key={v} className={'edit-chip' + (editSty === v ? ' on' : '')} onClick={() => setEditSty(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">用料多寡</div>
              <div className="edit-chips">
                {['少','正常','多'].map(v => (
                  <button key={v} className={'edit-chip' + (editChain === v ? ' on' : '')} onClick={() => setEditChain(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">做工複雜</div>
              <div className="edit-chips">
                {['極簡','普通','複雜','極複雜'].map(v => (
                  <button key={v} className={'edit-chip' + (editCraft === v ? ' on' : '')} onClick={() => setEditCraft(v)}>{v}</button>
                ))}
              </div>
            </div>
            <div className="edit-row">
              <div className="edit-label">金工顏色</div>
              <div className="edit-chips">
                {['金','銀'].map(v => (
                  <button key={v} className={'edit-chip' + (editMetal === v ? ' on' : '')} onClick={() => setEditMetal(v)}>{v}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
        <div style={{padding:'10px 16px 20px',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <button className="db db-save" style={{width:'100%'}} onClick={doSave} disabled={saving}>
            {saving ? '儲存中…' : '✓ 儲存'}
          </button>
        </div>
      </div>
    </div>
  );

  /* Similar view */
  if (view === 'similar') return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setView('detail')}>←</button>
          <span className="det-hd-title">{'相似款 · ' + (photo.category || '')}</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onClose}>×</button>
        </div>
        <div className="det-scroll" ref={simScrollRef}>
          {similar === null
            ? <div className="loading-msg">載入中…</div>
            : simErr
              ? <div className="empty-msg">載入失敗，請稍後再試<br/><button style={{marginTop:12,padding:'8px 20px',borderRadius:8,border:'1px solid var(--border)',background:'var(--s3)',fontSize:13,cursor:'pointer'}} onClick={() => { setSimilar(null); setSimErr(false); openSimilar(); }}>重試</button></div>
              : similar.length === 0
                ? <div className="empty-msg">找不到相似款</div>
                : <SimilarInfiniteGrid items={similar} onSelectPhoto={onSelectPhoto} setView={setView} />
          }
        </div>
      </div>
    </div>
  );

  /* Quote flow view */
  if (view === 'quote') return (
    <PhotoQuoteFlow photo={photo} onBack={() => setView('detail')} onClose={onClose} />
  );

  /* Detail view */
  return (
    <div className="det-ovl" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="det-panel">
        <button className="det-x" onClick={onClose}>×</button>
        <div className="det-left">
          <div className="det-handle" />
          <PinchImage className="det-img" src={photo.full_url} />
        </div>
        <div className="det-right">
          <div className="det-scroll">
            <div className="det-tags">
              {tags.map((t, i) => <span key={i} className="tag">{t}</span>)}
              {photo.price_band && <span className="tag" style={{color:'var(--text3)'}}>{photo.price_band}</span>}
            </div>
          </div>
          {/* Fixed action bar */}
          <div className="det-actions">
            <button className={'det-icon-btn' + (fav?' fav-on':'')} onClick={() => toggleFav(photo)}>
              <span style={{color:fav?'var(--gold)':'var(--text2)'}}>{fav?'♥':'♡'}</span>
              <span>{fav?'已收藏':'收藏'}</span>
            </button>
            <button className="det-icon-btn" onClick={openSimilar}>
              <span>⊞</span>
              <span>相似款</span>
            </button>
            <div className="det-divider" />
            <div style={{flex:1}} />
            {isStaff && (
              <button className="det-cta" onClick={() => setView('quote')}>💎 估價</button>
            )}
            {isAdmin && (
              <button className="det-edit-btn" onClick={() => setView('edit')} title="修改 / 刪除">✏️</button>
            )}
            {!isAdmin && isStaff && (
              <button className="det-edit-btn" style={{color:'#c0392b',background:'#fdf0f0'}}
                onClick={() => confirm('確定移除此照片？') && (onDeleted?.(photo.id), onClose())}
                title="移除照片">🗑</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Photo grid ─────────────────────────────────────── */
function PhotoGrid({ isFav, toggleFav, filters, role }) {
  const [photos,     setPhotos]     = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [detail,     setDetail]     = useState(null);
  const [pendingDel, setPendingDel] = useState(null); // {id, photo, timer}
  const isAdmin = role === 'admin';
  const isStaff = role === 'admin' || role === 'editor';

  const loadingRef  = useRef(false);
  const pageRef     = useRef(1);
  const hasMoreRef  = useRef(true);
  const filtersRef  = useRef({});
  const seedRef     = useRef(Math.random());
  const sentinelRef = useRef(null);
  const fetchRef    = useRef(null);
  const gridWrapRef = useRef(null);

  const doFetch = async () => {
    if (loadingRef.current || !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const qs = new URLSearchParams({ page: pageRef.current, sort: 'random', _r: seedRef.current });
      Object.entries(filtersRef.current).forEach(([k, v]) => v && qs.set(k, v));
      const res  = await fetch('/api/photos?' + qs);
      const data = await res.json();
      const list = data.photos || [];
      if (pageRef.current === 1) setPhotos(list);
      else setPhotos(prev => [...prev, ...list]);
      hasMoreRef.current = !!data.has_more;
      pageRef.current += 1;
    } catch { hasMoreRef.current = false; }
    finally { loadingRef.current = false; setLoading(false); }
  };
  fetchRef.current = doFetch;

  useEffect(() => {
    const s = sentinelRef.current;
    if (!s) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) fetchRef.current?.(); },
      { rootMargin: '400px' }
    );
    obs.observe(s);
    return () => obs.disconnect();
  }, []);

  useEffect(() => { fetchRef.current?.(); }, []);

  useEffect(() => {
    const el = gridWrapRef.current;
    if (!el) return;
    const nav = document.querySelector('.nav');
    const browseHdr = document.querySelector('.browse-hdr');
    const navH = nav ? nav.offsetHeight : 52;
    const hdrH = browseHdr ? browseHdr.offsetHeight : 0;
    const total = navH + hdrH;
    el.style.paddingTop = total + 'px';
    let lastY = 0;
    const show = () => { if (nav) nav.style.transform=''; if (browseHdr) browseHdr.style.transform=''; };
    const hide = () => { if (nav) nav.style.transform=`translateY(-${total}px)`; if (browseHdr) browseHdr.style.transform=`translateY(-${total}px)`; };
    const onScroll = () => {
      const y = el.scrollTop;
      if (y < total) show();
      else if (y > lastY) hide();
      else show();
      lastY = y;
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => { el.removeEventListener('scroll', onScroll); show(); };
  }, []);

  useEffect(() => {
    filtersRef.current = filters || {};
    pageRef.current    = 1;
    hasMoreRef.current = true;
    loadingRef.current = false;
    seedRef.current    = Math.random();
    setPhotos([]);
    if (gridWrapRef.current) gridWrapRef.current.scrollTop = 0;
    fetchRef.current?.();
  }, [JSON.stringify(filters)]);

  return (
    <>
      <div className="grid-wrap" ref={gridWrapRef}>
        <div className="grid">
          {photos.reduce((acc, p, i) => {
            if (i > 0 && i % 36 === 0) {
              const bIdx = Math.floor(i / 36) - 1;
              acc.push(
                <div key={`banner-${i}`} className="grid-banner">
                  <img src={BANNERS[bIdx % BANNERS.length]} alt="" loading="lazy" />
                  <div className="grid-banner-lbl">Tahir Zainab Selection</div>
                </div>
              );
            }
            acc.push(
              <div key={p.id} className="card" style={{animationDelay:`${(i % 9) * 0.19}s`}}>
                <img src={p.thumb_url} alt="" loading="lazy" onClick={() => setDetail(p)} />
                <button className={'card-fav' + (isFav(p.id) ? ' on' : '')}
                  onClick={e => { e.stopPropagation(); toggleFav(p); }}>
                  {isFav(p.id) ? '♥' : '♡'}
                </button>
                <div className="card-lbl" onClick={() => setDetail(p)}>
                  {[p.category, p.style].filter(v => v && v !== '未定').join(' · ')}
                </div>
              </div>
            );
            return acc;
          }, [])}
        </div>
        {loading && <div className="loading-msg">載入中…</div>}
        {!loading && photos.length === 0 && !hasMoreRef.current && (
          <div className="empty-msg">沒有符合條件的照片<br/><span style={{fontSize:12,color:'var(--text3)'}}>試著調整篩選條件</span></div>
        )}
        <div ref={sentinelRef} className="sentinel" />
      </div>

      {detail && (
        <PhotoDetail
          photo={detail}
          onClose={() => setDetail(null)}
          isFav={isFav}
          toggleFav={toggleFav}
          onSelectPhoto={p => setDetail(p)}
          role={role}
          onDeleted={id => {
            if (isAdmin) {
              // Admin: immediate delete
              setPhotos(prev => prev.filter(p => p.id !== id));
              setDetail(null);
            } else {
              // Staff: delayed delete with undo
              const photo = photos.find(p => p.id === id);
              setPhotos(prev => prev.filter(p => p.id !== id));
              setDetail(null);
              const timer = setTimeout(() => {
                fetch('/api/photos/' + id, { method: 'DELETE' });
                setPendingDel(null);
              }, 5000);
              setPendingDel({ id, photo, timer });
            }
          }}
          onUpdated={updated => { setPhotos(prev => prev.map(p => p.id === updated.id ? {...p, ...updated} : p)); setDetail(updated); }}
        />
      )}
      {pendingDel && (
        <div className="undo-toast">
          <span>已移除照片</span>
          <button className="undo-btn" onClick={() => {
            clearTimeout(pendingDel.timer);
            setPhotos(prev => [pendingDel.photo, ...prev]);
            setPendingDel(null);
          }}>復原</button>
        </div>
      )}
    </>
  );
}

/* ── Browse tab ─────────────────────────────────────── */
function BrowseTab({ isFav, toggleFav, role, onStartSwipe }) {
  const [photoMode, setPhotoMode] = useState('去背'); // '去背' | '情境'
  const [catFilter, setCatFilter]  = useState(null);
  const [filters,   setFilters]    = useState({});
  const [counts,    setCounts]     = useState({});

  const allFilters = {
    ...(catFilter ? { category: catFilter } : {}),
    ...filters,
    photo_type: photoMode,
  };

  useEffect(() => {
    const qs = new URLSearchParams();
    if (catFilter) qs.set('category', catFilter);
    Object.entries(filters).forEach(([k, v]) => v && qs.set(k, v));
    fetch('/api/photos/filter-counts?' + qs)
      .then(r => r.json())
      .then(d => setCounts(d))
      .catch(() => {});
  }, [catFilter, JSON.stringify(filters)]);

  const setF = (field, value) => setFilters(prev => {
    const n = { ...prev };
    if (value) n[field] = value; else delete n[field];
    return n;
  });

  return (
    <>
      <div className="browse-hdr">
        {/* 去背 / 情境 切換 */}
        <div style={{display:'flex',gap:0,margin:'8px 14px 0',background:'var(--s3)',borderRadius:10,padding:3,width:'fit-content'}}>
          {['去背','情境'].map(mode => (
            <button key={mode} onClick={() => setPhotoMode(mode)} style={{
              padding:'6px 22px', border:'none', borderRadius:8, fontSize:13, fontWeight:600,
              cursor:'pointer', transition:'all .18s',
              background: photoMode===mode ? 'var(--surface)' : 'transparent',
              color: photoMode===mode ? 'var(--text)' : 'var(--text3)',
              boxShadow: photoMode===mode ? '0 1px 4px rgba(0,0,0,.1)' : 'none',
            }}>{mode}</button>
          ))}
        </div>
        <CategoryTabs active={catFilter} onSelect={setCatFilter} />
        <div className="chips-bar">
          {Object.entries(CFG).map(([field]) => (
            <FilterDropdown key={field} field={field} cur={filters[field] || null}
              counts={counts[field] || {}} onPick={v => setF(field, v)} />
          ))}
          {(catFilter || Object.keys(filters).length > 0) && (
            <button className="chip-clr" onClick={() => { setFilters({}); setCatFilter(null); }}>清除</button>
          )}
        </div>
        {role === 'agent' && onStartSwipe && (
          <div style={{display:'flex',justifyContent:'center',padding:'6px 0 4px'}}>
            <button className="swipe-mode-btn" onClick={() => onStartSwipe(allFilters)}>
              <span style={{fontSize:18}}>✦</span> 探索模式
            </button>
          </div>
        )}
      </div>
      <div className="body-row">
        <div className="main">
          <PhotoGrid isFav={isFav} toggleFav={toggleFav} filters={allFilters} role={role} />
        </div>
      </div>
    </>
  );
}

/* ── Pricing DB hook – fetches from /api/pricing/all, falls back to hardcoded ── */
const _pricingState = { data: null, promise: null };
function _fetchPricing(setP) {
  _pricingState.data = null; _pricingState.promise = null;
  _pricingState.promise = fetch('/api/pricing/all')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d) return;
      const data = {
        METAL_PER_G:       d.metals       || {},
        LABOR:             d.labor        || {},
        LABOR_CONFIG:      d.labor_config || {daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8},
        WEIGHTS:           d.weights      || {},
        SIDESTONES:        d.sidestones   || {},
        SIDESTONES_V2:     d.sidestones_v2 || {},
        PLATING:           d.plating      || {},
        STONES_COMMERCIAL: Object.fromEntries(
          Object.entries(d.stones_commercial || {}).map(([k, v]) => [k, { name: v.name, range: v.range || [v.price_min||0, v.price_max||0] }])
        ),
      };
      _pricingState.data = data;
      if (setP) setP(data);
    })
    .catch(() => {});
  return _pricingState.promise;
}
function usePricing() {
  const [p, setP] = React.useState(_pricingState.data);
  React.useEffect(() => {
    if (_pricingState.data) { setP(_pricingState.data); return; }
    if (!_pricingState.promise) { _fetchPricing(setP); }
    else { _pricingState.promise.then(() => { if (_pricingState.data) setP(_pricingState.data); }); }
  }, []);
  React.useEffect(() => {
    const handler = () => _fetchPricing(setP);
    window.addEventListener('pricingUpdated', handler);
    return () => window.removeEventListener('pricingUpdated', handler);
  }, []);
  return {
    METAL_PER_G:       p?.METAL_PER_G       || METAL_PER_G,
    LABOR:             p?.LABOR             || LABOR,
    LABOR_CONFIG:      p?.LABOR_CONFIG      || {daily_rate:2000,'極簡':0.5,'簡單':1,'中等':2,'複雜':4,'精工':8},
    WEIGHTS:           p?.WEIGHTS           || WEIGHTS,
    SIDESTONES:        p?.SIDESTONES        || SIDESTONES,
    SIDESTONES_V2:     p?.SIDESTONES_V2     || {},
    STONES_COMMERCIAL: p?.STONES_COMMERCIAL || STONES_COMMERCIAL,
    PLATING:           p?.PLATING           || {'無':[0,0],'金色':[500,1500],'玫瑰金':[500,1500],'黑金':[800,2000]},
  };
}

            ) : (
              <>
                <div style={{fontSize:8,color:'#b8935a',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>最終報價</div>
                <div style={{fontSize:22,fontWeight:800,color:'#1a1a1a',lineHeight:1.2,marginBottom:6}}>{fmtNT(manualPrice)}</div>
              </>
            )}
          </div>
        </div>

        <div style={{paddingBottom:6,borderBottom:'1px solid #f0f0f0',marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:700,color:'#1a1a1a',lineHeight:1.5,marginBottom:1}}>{description||'—'}</div>
          <div style={{fontSize:9,color:'#bbb'}}>{today}{sourceChannel&&' · '+sourceChannel}</div>
        </div>

        <div style={{margin:'8px 0'}}>
          <R label="品項" value={cat} />
          <R label="主石" value={stoneName?`${stoneName}${carat>0?' '+carat+'ct':''}`:null} />
          {stoneMode==='invest' && <R label="產地" value={origin} />}
          {stoneMode==='invest' && <R label="優化處理" value={treatment} />}
          {stoneMode==='invest' && <R label="顏色等級" value={colorQ} />}
          <R label="材質" value={materialType} />
          <R label="用料重量" value={weightKey} />
          <R label="做工複雜度" value={craft||style} />
          <R label="配石" value={sidestone&&sidestone!=='無配石'?sidestone:null} />
          <R label="尺寸" value={itemSize} />
          {budget>0 && <R label="客戶預算" value={fmtNT(budget)} />}
        </div>

        <div style={{fontSize:8,color:'#bbb',lineHeight:1.8,marginTop:8,paddingTop:8,borderTop:'1px solid #f0f0f0'}}>
          本公司為彩色裸礦石供應商，珠寶訂製為滿足客戶提供樣式、需求之金工服務，最終樣式以溝通內容詳載於訂單付款頁面為主，付款後視同確認無誤。<br/>
          ※ 圖片為參考圖，並非為本公司商品。
        </div>
        <div style={{textAlign:'center',fontSize:8,color:'#ddd',marginTop:6,letterSpacing:3}}>TAHIR ZAINAB SELECTION</div>
      </div>
    </div>
  );
}

/* 點擊放大圖 lightbox */
function ImgZoom({ src, fullSrc, style, className, ...props }) {
  const [open, setOpen] = React.useState(false);
  return (
    <>
      <img src={src} style={{...style, cursor:'zoom-in'}} className={className}
        onClick={e => { e.stopPropagation(); setOpen(true); }} {...props} />
      {open && ReactDOM.createPortal(
        <div onClick={() => setOpen(false)}
          style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:99999,
            display:'flex',alignItems:'center',justifyContent:'center'}}>
          <img src={fullSrc || src} alt=""
            style={{maxWidth:'95vw',maxHeight:'92vh',objectFit:'contain',borderRadius:8,
              boxShadow:'0 8px 48px rgba(0,0,0,.6)'}} />
          <button onClick={() => setOpen(false)}
            style={{position:'fixed',top:16,right:20,background:'none',border:'none',
              color:'#fff',fontSize:32,lineHeight:1,cursor:'pointer',padding:4}}>×</button>
        </div>,
        document.body
      )}
    </>
  );
}

function PhotoQuoteFlow({ photo, onBack, onClose }) {
  const pricing = usePricing();
  const GEM_MAP = {};
  Object.entries(STONES_INVEST).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'invest'}; });
  Object.entries(pricing.STONES_COMMERCIAL).forEach(([k,s]) => { GEM_MAP[s.name] = {key:k,mode:'commercial'}; });
  const initGem = GEM_MAP[photo.gemstone] || null;

  const [uploadedUrl, setUploadedUrl] = useState(null);
  // dispPhoto merges server photo with any client-uploaded image
  const dispPhoto = React.useMemo(() => ({
    ...photo,
    thumb_url: photo.thumb_url || uploadedUrl || null,
    full_url:  photo.full_url  || uploadedUrl || null,
  }), [photo, uploadedUrl]);

  function handlePhotoUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setUploadedUrl(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  const [step,         setStep]         = useState(1);
  const [budget,       setBudget]       = useState('');
  const [cat,          setCat]          = useState(photo.category        || CATS[0] || '戒指');
  const [style,        setStyle]        = useState(photo.style           || '');
  const [chain,        setChain]        = useState(photo.setting_amount  || '正常');
  const [craft,        setCraft]        = useState(photo.craft_complexity || '中等');
  const [metalColor,   setMetalColor]   = useState(photo.metal_color     || '');
  const [materialType, setMaterialType] = useState(photo.metal_color==='銀'?'925銀':'18K金');
  const [stoneKey,     setStoneKey]     = useState(initGem?.key  || '');
  const [stoneMode,    setStoneMode]    = useState('commercial');
  const [carat,        setCarat]        = useState('1');
  const [origin,       setOrigin]       = useState('');
  const [treatment,    setTreatment]    = useState('');
  const [colorQ,       setColorQ]       = useState('');
  const [sideType,     setSideType]     = useState('無配石');
  const [sideBand,     setSideBand]     = useState('1–5顆');
  const [manualQuote,  setManualQuote]  = useState('');
  const [customer,     setCustomer]     = useState('');
  const [inquiryDate,  setInquiryDate]  = useState(`${new Date().getMonth()+1}/${new Date().getDate()}`);
  const [sourceChannel,setSourceChannel]= useState('');
  const [itemSize,     setItemSize]     = useState('');
  const [plating,      setPlating]      = useState('');
  const [stoneOrderNo, setStoneOrderNo] = useState('');
  const [qNotes,       setQNotes]       = useState('');
  const [colorPref,    setColorPref]    = useState('');
  const [saving,            setSaving]            = useState(false);
  const [savedId,           setSavedId]           = useState(null);
  const [finalInput,        setFinalInput]        = useState('');
  const [confirming,        setConfirming]        = useState(false);
  const [confirmed,         setConfirmed]         = useState(false);
  const [showCard,          setShowCard]          = useState(false);
  const [showEstimateCard,  setShowEstimateCard]  = useState(false);
  const [orderType,         setOrderType]         = useState('全訂制');
  const [commissionNote,    setCommissionNote]    = useState('');
  const [showIntro,         setShowIntro]         = useState(true);
  const staffName = getJwtUser()?.name || '';

  useEffect(() => {
    if (stoneMode === 'invest' && stoneKey && STONES_INVEST[stoneKey]) {
      const s = STONES_INVEST[stoneKey];
      setOrigin(Object.keys(s.origins)[0]);
      setTreatment(Object.keys(s.treatments)[0]);
      setColorQ(Object.keys(s.colors)[0]);
    }
    setManualQuote('');
  }, [stoneKey, stoneMode]);

  useEffect(() => {
    const opts = SIZE_OPTS[cat];
    const def = opts ? opts[0] : '';
    setItemSize(def);
    if (cat === '項鍊' && NECKLACE_LENGTH_TO_CHAIN[def]) setChain(NECKLACE_LENGTH_TO_CHAIN[def]);
    else if (cat === '手鏈' && BRACELET_LENGTH_TO_CHAIN[def]) setChain(BRACELET_LENGTH_TO_CHAIN[def]);
  }, [cat]);

  // Price calculation
  const ct = parseFloat(carat) || 0;
  let stoneMin = 0, stoneMax = 0;
  const currentStone  = stoneMode === 'invest'     ? STONES_INVEST[stoneKey]             : null;
  const currentStoneC = stoneMode === 'commercial' ? pricing.STONES_COMMERCIAL[stoneKey] : null;
  const stoneName = currentStone?.name || currentStoneC?.name || '';

  if (currentStone && ct > 0) {
    const band = getBand(ct);
    const k = (currentStone.origins[origin]||1) * (currentStone.treatments[treatment]||1) * (currentStone.colors[colorQ]||1);
    stoneMin = currentStone.floor[band] * k * 0.8 * ct;
    stoneMax = currentStone.ceil[band]  * k * 0.8 * ct;
  } else if (currentStoneC && ct > 0) {
    stoneMin = currentStoneC.range[0] * ct;
    stoneMax = currentStoneC.range[1] * ct;
  }

  const CHAIN_TO_WEIGHT = {'少':'輕 (1.5–3g)','正常':'中 (3–5g)','多':'偏重 (5–8g)'};
  const laborKey    = craft || '中等';
  const LC          = pricing.LABOR_CONFIG || {};
  const dailyRate   = Number(LC.daily_rate) || 2000;
  const craftDays   = Number(LC[laborKey]) || 0;
  const laborExact  = Math.round(dailyRate * craftDays);
  const laborRange  = craftDays > 0 ? [Math.round(laborExact * 0.9), Math.round(laborExact * 1.1)] : [0, 0];
  const weightKey   = CHAIN_TO_WEIGHT[chain] || '中 (3–5g)';
  const weightRange = (pricing.WEIGHTS[weightKey] || WEIGHTS[weightKey]) || [3,5];
  const metalPg     = pricing.METAL_PER_G[materialType] || METAL_PER_G[materialType] || 3800;
  const sidestone    = sideType === '無配石' ? '無配石' : `${sideType} ${sideBand}`;
  const sideRange    = sideType !== '無配石' && pricing.SIDESTONES_V2[sideType]
    ? (pricing.SIDESTONES_V2[sideType][sideBand] || [0,0])
    : [0,0];
  const metalCostMin = metalPg * weightRange[0];
  const metalCostMax = metalPg * weightRange[1];
  const plateRange  = pricing.PLATING[plating] || [0,0];
  const mountMin    = laborRange[0] + metalCostMin + sideRange[0] + plateRange[0];
  const mountMax    = laborRange[1] + metalCostMax + sideRange[1] + plateRange[1];
  const totalMin    = stoneMin + mountMin;
  const totalMax    = stoneMax + mountMax;
  const hasPrice    = totalMin > 0 || totalMax > 0;
  const manualNum   = parseInt(String(manualQuote).replace(/[^0-9]/g,'')) || 0;
  const budgetNum   = parseInt(String(budget).replace(/[^0-9]/g,'')) || 0;

  const orig = {
    category: photo.category || '', style: photo.style || '',
    setting_amount: photo.setting_amount || '', craft_complexity: photo.craft_complexity || '',
    metal_color: photo.metal_color || '', gemstone: photo.gemstone || '',
  };

  async function doSave() {
    setSaving(true);
    try {
      const adj = {category:cat, style, setting_amount:chain, craft_complexity:craft, metal_color:metalColor, material:materialType, gemstone:stoneName, stoneKey, stoneMode, carat:ct, origin, treatment, colorQ, sidestone, size:itemSize, plating, stone_order_no:stoneOrderNo, commission_note:commissionNote, order_type:orderType, staff_name:staffName, notes:qNotes, inquiry_time:inquiryDate, source_channel:sourceChannel};
      const notesText = [
        inquiryDate && `詢價時間：${inquiryDate}${sourceChannel?' ('+sourceChannel+')':''}`,
        manualNum > 0 && `預估報價：NT$${manualNum.toLocaleString('zh-TW')}`,
        itemSize && `尺寸：${itemSize}`,
        plating && plating !== '無' && `鍍金：${plating}`,
        stoneOrderNo && `裸石單號：${stoneOrderNo}`,
        commissionNote && `委託石頭：${commissionNote}`,
        qNotes && `備註：${qNotes}`,
      ].filter(Boolean).join('\n');
      const payload = {
        description:    `${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`,
        final_price:    null,
        material:       materialType,
        gemstone:       stoneName || null,
        photo_id:       photo.id || null,
        customer_name:  customer || null,
        original_data:  JSON.stringify(orig),
        adjusted_data:  JSON.stringify(adj),
        estimated_min:  manualNum > 0 ? Math.min(manualNum, Math.round(totalMax)) : (totalMin > 0 ? Math.round(totalMin) : null),
        estimated_max:  manualNum > 0 ? Math.max(manualNum, Math.round(totalMax)) : (totalMax > 0 ? Math.round(totalMax) : null),
        budget:         budgetNum > 0 ? budgetNum : null,
        stone_order_no: stoneOrderNo || null,
        inquiry_time:   inquiryDate || null,
        source_channel: sourceChannel || null,
        staff_name:     staffName || null,
        notes:          notesText || null,
      };
      const res = await fetch('/api/quotes', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      if (res.ok) { const d = await res.json(); setSavedId(d.id); }
      else {
        const rawText = await res.text().catch(()=>'');
        let detail = rawText;
        try { const j = JSON.parse(rawText); detail = JSON.stringify(j.detail||j,null,2); } catch {}
        alert('儲存失敗 ' + res.status + '\n' + detail);
      }
    } catch(e) { alert('網路錯誤：' + e.message); }
    setSaving(false);
  }

  async function doConfirmPrice() {
    const price = parseInt(String(finalInput).replace(/[^0-9]/g,''));
    if (!price || !savedId) return;
    setConfirming(true);
    try {
      await fetch(`/api/quotes/${savedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({final_price:price}) });
      setConfirmed(true);
      setTimeout(onBack, 1600);
    } catch { alert('回填失敗'); }
    setConfirming(false);
  }

  const Chip = ({val, cur, setCur}) => {
    const on = cur === val;
    return (
      <button onClick={() => setCur(val)} style={{
        padding:'8px 14px', borderRadius:8, margin:'4px 4px 4px 0',
        border: on ? '1.5px solid var(--gold)' : '1px solid var(--border)',
        background: on ? 'rgba(184,147,90,.14)' : 'var(--surface)',
        color: on ? 'var(--gold)' : 'var(--text)',
        fontSize:13, fontWeight: on ? 700 : 400, cursor:'pointer', flexShrink:0,
      }}>{val}</button>
    );
  };

  // ── Saved view ──────────────────────────────────────
  if (savedId !== null) return (
    <div className="det-ovl">
      {showEstimateCard && hasPrice && (
        <QuoteCard mode="estimate" photo={dispPhoto} description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
          totalMin={manualNum>0?Math.min(manualNum,Math.round(totalMax)):Math.round(totalMin)}
          totalMax={manualNum>0?Math.max(manualNum,Math.round(totalMax)):Math.round(totalMax)} customer={customer} staffName={staffName} stoneOrderNo={stoneOrderNo}
          commissionNote={commissionNote} orderType={orderType}
          itemSize={itemSize} cat={cat} stoneName={stoneName}
          carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}
          materialType={materialType} weightKey={weightKey} craft={craft} style={style}
          sidestone={sidestone} sourceChannel={sourceChannel} inquiryDate={inquiryDate}
          budget={budgetNum} onClose={() => setShowEstimateCard(false)} />
      )}
      {showCard && parseInt(finalInput) > 0 && (
        <QuoteCard mode="final" photo={dispPhoto} description={`${cat}・${stoneName||'無主石'}${ct>0?' '+ct+'ct':''}・${style||craft}`}
          manualPrice={parseInt(String(finalInput).replace(/[^0-9]/g,''))||0} totalMin={Math.round(totalMin)} totalMax={Math.round(totalMax)} customer={customer} staffName={staffName} stoneOrderNo={stoneOrderNo}
          commissionNote={commissionNote} orderType={orderType}
          itemSize={itemSize} cat={cat} stoneName={stoneName}
          carat={ct} origin={origin} treatment={treatment} colorQ={colorQ} stoneMode={stoneMode}
          materialType={materialType} weightKey={weightKey} craft={craft} style={style}
          sidestone={sidestone} sourceChannel={sourceChannel} inquiryDate={inquiryDate}
          budget={budgetNum} onClose={() => setShowCard(false)} />
      )}
      <div className="det-panel" style={{flexDirection:'column'}}>
        <div className="det-hd-bar">
          <button className="det-back" onClick={() => setSavedId(null)}>←</button>
          <span className="det-hd-title">報價已儲存</span>
          <button className="det-x" style={{position:'static',width:30,height:30}} onClick={onBack}>×</button>
        </div>
        <div className="det-scroll" style={{padding:'14px'}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            {/* 左：預估報價 */}
            <div style={{flex:1,background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)',padding:'14px',textAlign:'center'}}>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:1.2,textTransform:'uppercase',marginBottom:6}}>預估報價</div>
              {hasPrice ? (
                <>
                  <div style={{fontSize:20,fontWeight:700,color:'var(--text)',marginBottom:2}}>{fmtNT(manualNum || Math.round(totalMin))}</div>
                  <div style={{fontSize:10,color:'var(--text2)'}}>{fmtNT(totalMin)} – {fmtNT(totalMax)}</div>
                </>
              ) : <div style={{fontSize:12,color:'var(--text3)'}}>未計算</div>}
              {customer && <div style={{fontSize:10,color:'var(--text2)',marginTop:4}}>客戶：{customer}</div>}
              {hasPrice && (
                <>
                  <div style={{fontSize:10,color:'var(--text3)',marginTop:8,marginBottom:6,lineHeight:1.5}}>先把資訊跟參考照片傳給估價專員</div>
                  <button onClick={() => setShowEstimateCard(true)}
                    style={{width:'100%',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:11,fontWeight:600,color:'var(--text)',cursor:'pointer'}}>
                    📊 預覽截圖
                  </button>
                </>
              )}
            </div>
            {/* 右：最終報價 */}
            <div style={{flex:1,background:'#fffbf0',borderRadius:14,border:'1px solid rgba(184,147,90,.35)',padding:'14px'}}>
              <div style={{fontSize:10,letterSpacing:1.2,textTransform:'uppercase',color:'var(--gold)',fontWeight:700,marginBottom:6}}>最終報價</div>
              {!confirmed ? (
                <>
                  <div style={{fontSize:10,color:'var(--text2)',marginBottom:8,lineHeight:1.5}}>輸入給客人的最終報價</div>
                  <div style={{position:'relative',marginBottom:6}}>
                    <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'var(--text2)',fontWeight:600,pointerEvents:'none'}}>NT$</span>
                    <input type="text" inputMode="numeric" placeholder="0" autoFocus
                      value={finalInput} onChange={e=>setFinalInput(e.target.value.replace(/[^0-9]/g,''))}
                      style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'8px 6px 8px 30px',fontSize:15,fontWeight:700,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit'}}
                      onFocus={e=>e.target.style.borderColor='var(--gold)'}
                      onBlur={e=>e.target.style.borderColor='var(--border)'}
                      onKeyDown={e=>e.key==='Enter'&&doConfirmPrice()} />
                  </div>
                  {parseInt(finalInput) > 0 && (
                    <button onClick={() => setShowCard(true)}
                      style={{width:'100%',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:11,fontWeight:600,color:'var(--text)',cursor:'pointer',marginBottom:6}}>
                      📋 預覽截圖
                    </button>
                  )}
                  <button onClick={doConfirmPrice} disabled={!finalInput||confirming}
                    style={{width:'100%',background:(!finalInput||confirming)?'var(--s3)':'var(--accent)',color:(!finalInput||confirming)?'var(--text3)':'#fff',border:'none',borderRadius:8,padding:'9px',fontSize:12,fontWeight:700,cursor:(!finalInput||confirming)?'default':'pointer',marginBottom:4}}>
                    {confirming ? '確認中…' : '✓ 確認成交'}
                  </button>
                  <button onClick={onBack} style={{width:'100%',background:'var(--surface)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px',fontSize:11,cursor:'pointer'}}>事後再填</button>
                </>
              ) : (
                <div style={{textAlign:'center',padding:'20px 0'}}>
                  <div style={{fontSize:36}}>✓</div>
                  <div style={{fontSize:14,fontWeight:700,marginTop:8}}>成交已記錄</div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );

  const STEPS = orderType === '全訂制'
    ? ['訂制類型','選寶石','金工材料','複雜度','配石','客戶資料']
    : orderType === '半訂制'
    ? ['訂制類型','裸石訂單','金工材料','複雜度','配石','客戶資料']
    : ['訂制類型','委託石頭','裸石單號','金工材料','複雜度','配石','客戶資料'];

  // ── Step 0: 訂制類型 ─────────────────────────────────
  const renderStep0 = () => (
    <div style={{padding:'16px'}}>
      {[
        ['全訂制','含裸石和台子','由我們提供裸石並設計製作台子，從頭到尾全包'],
        ['半訂制','已有裸石訂單號','已向我們購買過裸石，需輸入裸石訂單編號，補做台子'],
        ['委託訂制','純台子加工設計','石頭是客戶自己的或委託我們設計加工，不含裸石費用'],
      ].map(([type, sub, desc]) => {
        const on = orderType === type;
        return (
          <button key={type} onClick={() => setOrderType(type)}
            style={{width:'100%',textAlign:'left',padding:'16px',borderRadius:12,marginBottom:10,
              border:on?'2px solid var(--gold)':'1.5px solid var(--border)',
              background:on?'rgba(184,147,90,.10)':'var(--surface)',cursor:'pointer'}}>
            <div style={{fontSize:15,fontWeight:700,color:on?'var(--gold)':'var(--text)',marginBottom:2}}>{type}</div>
            <div style={{fontSize:12,fontWeight:600,color:on?'rgba(184,147,90,.8)':'var(--text2)',marginBottom:4}}>{sub}</div>
            <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.6}}>{desc}</div>
          </button>
        );
      })}
    </div>
  );

  // ── 半訂制 Step 2: 裸石訂單號 ────────────────────────
  const renderStoneOrderStep = () => (
    <div style={{padding:'16px'}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--text3)',marginBottom:6}}>裸石訂單編號</div>
      <input type="text" placeholder="例：1001" value={stoneOrderNo}
        onChange={e=>setStoneOrderNo(e.target.value)}
        style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'11px 14px',fontSize:15,fontWeight:600,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit',marginBottom:12}}
        onFocus={e=>e.target.style.borderColor='var(--gold)'}
        onBlur={e=>e.target.style.borderColor='var(--border)'} />
      <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.7,background:'var(--s3)',borderRadius:8,padding:'10px 14px'}}>
        請輸入您之前向我們購買裸石的訂單編號，我們將依此查詢石頭規格。加工費不含裸石費用。
      </div>
    </div>
  );

  // ── 委託訂制 裸石單號 ─────────────────────────────────
  const renderCommissionOrderNoStep = () => (
    <div style={{padding:'16px'}}>
      <div style={{fontSize:14,fontWeight:600,color:'var(--text)',marginBottom:4}}>裸石單號（選填）</div>

  const renderCommissionStoneStep = () => {
    const inp = {width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'11px 14px',fontSize:14,color:'var(--text)',background:'var(--surface)',outline:'none',fontFamily:'inherit',marginBottom:14,boxSizing:'border-box'};

  // ── Step 1: 選寶石 ──────────────────────────────────
  const COLOR_DOT = {'紅':'#e53935','粉':'#f48fb1','橙':'#fb8c00','黃':'#fdd835','綠':'#43a047','藍':'#1e88e5','紫':'#8e24aa','白':'#bdbdbd','彩':'linear-gradient(135deg,#e53935,#fdd835,#43a047,#1e88e5)'};
  const renderStep1 = () => {
    const stoneList = stoneMode === 'invest'
      ? Object.entries(STONES_INVEST)
      : Object.entries(pricing.STONES_COMMERCIAL);
    const filtered = colorPref
      ? stoneList.filter(([k]) => GEM_COLORS[colorPref]?.has(k))
      : stoneList;
    return (
      <div style={{padding:'12px 16px',paddingBottom:16}}>
        <div style={{display:'flex',gap:10,alignItems:'center',background:'var(--surface)',borderRadius:10,padding:'10px',border:'1px solid var(--border)',marginBottom:14}}>
          {dispPhoto.thumb_url && <ImgZoom src={dispPhoto.thumb_url} fullSrc={dispPhoto.full_url || dispPhoto.thumb_url} alt="" style={{width:52,height:52,objectFit:'cover',borderRadius:7,flexShrink:0}} />}
          <div style={{minWidth:0}}>
            <div style={{fontSize:10,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase',marginBottom:3}}>參考款</div>

              {[photo.category,photo.gemstone,photo.style,photo.stone_size].filter(v=>v&&v!=='未定').map((t,i)=>(

              ))}
            </div>
          </div>
        </div>

        {/* 商業 / 投資 toggle */}
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          {[['commercial','輕奢'],['invest','投資級']].map(([m,l]) => {
            const on = stoneMode===m;
            return (
              <button key={m} onClick={() => { setStoneMode(m); setStoneKey(''); }}
                style={{flex:1,padding:'10px 0',borderRadius:9,border:on?'1.5px solid var(--gold)':'1px solid var(--border)',background:on?'rgba(184,147,90,.14)':'var(--surface)',color:on?'var(--gold)':'var(--text)',fontSize:13,fontWeight:on?700:400,cursor:'pointer'}}>

              </button>
            );

        </div>

        {/* Color filter */}
