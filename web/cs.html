<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客服訂單追蹤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cs.css">
</head>
<body>
  <div class="topbar">
    <a href="/" class="btn btn-sm">← 返回</a>
    <h1>客服訂單追蹤</h1>
    <div class="spacer"></div>
    <span class="last-import" id="last-import"></span>
    <button class="btn btn-sm" id="refresh-btn">↻ 重新整理</button>
    <button class="btn btn-gold btn-sm" id="open-import-btn">⬆ 上傳 SHOPLINE 報表</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="board">訂單看板</button>
    <button class="tab" data-tab="handover">交接班</button>
  </div>

  <!-- ── 看板 ── -->
  <div class="wrap" id="tab-board">
    <div class="dash" id="dash"></div>

    <div class="toolbar">
      <button class="chip active" data-view="active">全部進行中</button>
      <button class="chip" data-view="risk">🔴 異常</button>
      <button class="chip" data-view="overdue">🟠 逾期未出</button>
      <button class="chip" data-view="payment">🟡 付款超時</button>
      <button class="chip" data-view="archived">📦 已封存</button>
      <span class="grow"></span>
      <input class="search" id="search" placeholder="搜尋訂單號 / 客戶 / 商品…">
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>訂單號</th>
            <th>客戶</th>
            <th class="hide-sm">商品</th>
            <th>狀態</th>
            <th>負責人</th>
            <th class="hide-sm">下一步</th>
            <th>預計日</th>
            <th>旗標</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
      <div class="empty hidden" id="board-empty">這個分類目前沒有訂單 🎉</div>
    </div>
  </div>

  <!-- ── 交接班 ── -->
  <div class="wrap hidden" id="tab-handover">
    <div class="ho-form">
      <h2 style="font-size:16px;margin-bottom:12px;">寫一筆交班記錄</h2>
      <div class="grid2">
        <div class="field"><label>交班人</label><input id="ho-from" placeholder="你的名字"></div>
        <div class="field"><label>接班人</label><input id="ho-to" placeholder="接手的人"></div>
      </div>
      <div class="field"><label>要特別盯的單號</label><input id="ho-watch" placeholder="例：20260531160234640, 20260530..."></div>
      <div class="field"><label>叮嚀（卡在哪、聯絡客人了沒、下一步）</label><textarea id="ho-note" placeholder="例：山東心緣那張欠石，已 LINE 通知客人會延一週，等工廠 6/15 換貨。"></textarea></div>
      <button class="btn btn-gold" id="ho-save">送出交班</button>
    </div>
    <h2 style="font-size:16px;margin:0 0 10px 2px;">最近交班記錄</h2>
    <div id="ho-list"></div>
  </div>

  <!-- ── 匯入 Modal ── -->
  <div class="overlay hidden" id="import-modal">
    <div class="modal">
      <h2>上傳 SHOPLINE 報表</h2>
      <p class="sub">選擇從 SHOPLINE 匯出的訂單報表（.xls 或 .csv）。系統會依訂單號自動合併同單多列、比對去重，只把<b>沒見過的新單</b>寫進看板；已出貨／已完成／已取消的單直接進封存資料庫，看板只留<b>未完成</b>的單。</p>
      <div class="field">
        <label>報表檔案（.xls / .csv）</label>
        <input type="file" id="import-file" accept=".xls,.csv,application/vnd.ms-excel,text/csv">
      </div>
      <div id="import-result"></div>
      <div class="modal-actions">
        <button class="btn btn-gold" id="import-do">開始匯入</button>
        <button class="btn" id="import-close">關閉</button>
      </div>
    </div>
  </div>

  <!-- ── 訂單編輯 Modal ── -->
  <div class="overlay hidden" id="order-modal">
    <div class="modal">
      <h2 id="om-title">訂單</h2>
      <p class="sub" id="om-sub"></p>
      <div class="grid2">
        <div class="field">
          <label>目前狀態</label>
          <select id="om-status"></select>
        </div>
        <div class="field">
          <label>負責人</label>
          <input id="om-owner" placeholder="誰的球">
        </div>
      </div>
      <div class="field">
        <label>下一步動作</label>
        <input id="om-next" placeholder="接班的人照這個做">
      </div>
      <div class="grid2">
        <div class="field">
          <label>預計出貨/完成日</label>
          <input type="date" id="om-due">
        </div>
        <div class="field">
          <label>異常類型</label>
          <select id="om-risktype"></select>
        </div>
      </div>
      <div class="field check-row">
        <input type="checkbox" id="om-risk">
        <label for="om-risk" style="margin:0;">標為異常（整列變紅，交班優先看）</label>
      </div>
      <div class="field">
        <label>備註</label>
        <textarea id="om-notes"></textarea>
      </div>
      <div class="field" id="om-rawwrap">
        <label>SHOPLINE 原始資料</label>
        <div id="om-raw" style="font-size:12px;color:var(--ink-2);background:#FAF8F5;border-radius:8px;padding:10px;max-height:140px;overflow:auto;"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-gold" id="om-save">儲存</button>
        <button class="btn" id="om-close">取消</button>
        <span class="grow" style="flex:1"></span>
        <button class="btn btn-danger" id="om-archive">移入封存</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/cs.js"></script>
</body>
</html>
