<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>珠寶款式資料庫 · 後台統計</title>
<style>
  :root {
    --bg:#f1f1f4; --surface:#ffffff; --s3:#e8e8ee; --border:#e0e0e8;
    --text:#232330; --text2:#5a5a68; --text3:#8d8d99;
    --gold:#b8935a; --heart:#d64566;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Segoe UI",sans-serif; }
  #root { min-height:100vh; }
  button { font-family:inherit; cursor:pointer; }

  .nav { display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
    background:var(--surface); border-bottom:1px solid var(--border); }
  .nav-title { font-weight:800; font-size:16px; letter-spacing:1px; }
  .nav button { border:1px solid var(--border); background:var(--surface); color:var(--text2);
    border-radius:10px; padding:7px 14px; font-size:12px; font-weight:600; }

  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:24px; }
  .card { background:var(--surface); border-radius:14px; padding:16px; text-align:center;
    box-shadow:0 2px 8px rgba(30,30,45,.06); }
  .card .num { font-size:26px; font-weight:800; color:var(--gold); }
  .card .label { font-size:12px; color:var(--text3); margin-top:4px; }

  .section { background:var(--surface); border-radius:14px; padding:18px; margin-bottom:18px;
    box-shadow:0 2px 8px rgba(30,30,45,.06); }
  .section h3 { margin:0 0 14px; font-size:14px; letter-spacing:.5px; }

  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
  .bar-row .key { width:88px; flex-shrink:0; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; height:16px; background:var(--s3); border-radius:8px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--gold); }
  .bar-row .cnt { width:34px; text-align:right; flex-shrink:0; font-weight:700; color:var(--text); }

  .top-grid { display:grid; gap:10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .top-tile { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden;
    box-shadow:0 2px 8px rgba(30,30,45,.08); background:var(--bg); }
  .top-tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .top-tile .badge { position:absolute; top:6px; right:6px; background:var(--heart); color:#fff;
    font-size:11px; font-weight:800; padding:3px 8px; border-radius:10px; }
  .top-tile .label { position:absolute; left:0; right:0; bottom:0; padding:5px 7px;
    background:linear-gradient(transparent, rgba(0,0,0,.6)); color:#fff; font-size:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .empty { color:var(--text3); font-size:13px; text-align:center; padding:20px 0; }

  .login-zone { position:fixed; inset:0; background:rgba(20,20,30,.6); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { background:var(--surface); border-radius:20px; padding:32px 26px; text-align:center;
    width:100%; max-width:320px; }
  .login-box .icon { font-size:34px; margin-bottom:10px; }
  .login-box input { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px;
    font-size:15px; text-align:center; margin-bottom:10px; }
  .login-box button { width:100%; background:var(--gold); color:#fff; border:none; border-radius:12px;
    padding:12px 0; font-size:14px; font-weight:800; letter-spacing:1px; }
  .login-box .err { color:#c0392b; font-size:12px; margin-bottom:10px; }
  .login-box .ok { color:#2e7d32; font-size:12px; margin-bottom:10px; }
  .login-box .hint { font-size:11px; color:var(--text3); margin-top:12px; line-height:1.5; }

  .pw-change { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pw-change input { border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12px; }
  .pw-change button { border:1px solid var(--border); background:var(--bg); color:var(--text2);
    border-radius:8px; padding:7px 12px; font-size:12px; font-weight:600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function BarList({ title, rows }) {
  const max = Math.max(1, ...rows.map((r) => r.cnt));
  return (
    <div className="section">
      <h3>{title}</h3>
      {rows.length === 0 && <div className="empty">目前還沒有資料</div>}
      {rows.map((r) => (
        <div className="bar-row" key={r.key || "（未標註）"}>
          <div className="key" title={r.key}>{r.key || "（未標註）"}</div>
          <div className="bar-track"><div className="bar-fill" style={{ width: `${(r.cnt / max) * 100}%` }} /></div>
          <div className="cnt">{r.cnt}</div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [password, setPassword] = useState(() => {
    try { return sessionStorage.getItem("pp_admin_pw") || ""; } catch { return ""; }
  });
  const [pwInput, setPwInput] = useState("");
  const [pwInput2, setPwInput2] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [needsSetup, setNeedsSetup] = useState(null); // null=還沒檢查過, true/false=檢查結果
  const [showChangePw, setShowChangePw] = useState(false);
  const [oldPwInput, setOldPwInput] = useState("");
  const [newPwInput, setNewPwInput] = useState("");

  useEffect(() => {
    fetch("/api/admin/has-password").then((r) => r.json()).then((d) => setNeedsSetup(!d.hasPassword)).catch(() => setNeedsSetup(false));
  }, []);

  const load = async (pw) => {
    setLoading(true);
    setErr("");
    try {
      const res = await fetch(`/api/admin/stats?password=${encodeURIComponent(pw)}`);
      if (res.status === 401) {
        setErr("密碼錯誤");
        setPassword("");
        try { sessionStorage.removeItem("pp_admin_pw"); } catch {}
        setLoading(false);
        return;
      }
      const d = await res.json();
      setData(d);
      setPassword(pw);
      try { sessionStorage.setItem("pp_admin_pw", pw); } catch {}
    } catch {
      setErr("連線失敗，請重試");
    }
    setLoading(false);
  };

  useEffect(() => { if (password) load(password); }, []); // eslint-disable-line

  const logout = () => {
    setPassword("");
    setData(null);
    try { sessionStorage.removeItem("pp_admin_pw"); } catch {}
  };

  const doSetup = async () => {
    setErr("");
    if (pwInput.length < 4) { setErr("密碼至少需要 4 碼"); return; }
    if (pwInput !== pwInput2) { setErr("兩次輸入的密碼不一樣"); return; }
    setLoading(true);
    try {
      const res = await fetch("/api/admin/set-password", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pwInput }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.error || "設定失敗"); setLoading(false); return; }
      setNeedsSetup(false);
      await load(pwInput);
    } catch {
      setErr("連線失敗，請重試");
      setLoading(false);
    }
  };

  const doChangePassword = async () => {
    setErr(""); setOk("");
    if (newPwInput.length < 4) { setErr("新密碼至少需要 4 碼"); return; }
    try {
      const res = await fetch("/api/admin/change-password", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old_password: oldPwInput, new_password: newPwInput }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.error || "修改失敗"); return; }
      setOk("密碼修改成功");
      setPassword(newPwInput);
      try { sessionStorage.setItem("pp_admin_pw", newPwInput); } catch {}
      setOldPwInput(""); setNewPwInput(""); setShowChangePw(false);
    } catch {
      setErr("連線失敗，請重試");
    }
  };

  if (needsSetup === null) return null; // 還在檢查有沒有設定過密碼

  if (needsSetup) {
    return (
      <div className="login-zone">
        <div className="login-box">
          <div className="icon">🔑</div>
          <h2>第一次使用，請設定後台密碼</h2>
          {err && <div className="err">{err}</div>}
          <input type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)}
            placeholder="設定密碼（至少 4 碼）" />
          <input type="password" value={pwInput2} onChange={(e) => setPwInput2(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && doSetup()}
            placeholder="再輸入一次確認" />
          <button disabled={loading} onClick={doSetup}>{loading ? "設定中…" : "設定密碼"}</button>
          <div className="hint">密碼只有你自己知道，之後登入後台都要用這組密碼。</div>
        </div>
      </div>
    );
  }

  if (!password || !data) {
    return (
      <div className="login-zone">
        <div className="login-box">
          <div className="icon">🔒</div>
          <h2>後台登入</h2>
          {err && <div className="err">{err}</div>}
          <input
            type="password"
            value={pwInput}
            onChange={(e) => setPwInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && load(pwInput)}
            placeholder="請輸入密碼"
          />
          <button disabled={loading} onClick={() => load(pwInput)}>{loading ? "驗證中…" : "登入"}</button>
        </div>
      </div>
    );
  }

  const { totals, top, byCategory, byColor, byGemstone, byShape, byVisitor, recentUploads } = data;

  return (
    <div className="wrap">
      <div className="nav">
        <div className="nav-title">珠寶款式資料庫 · 後台統計</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setShowChangePw((v) => !v)}>修改密碼</button>
          <button onClick={logout}>登出</button>
        </div>
      </div>

      {showChangePw && (
        <div className="wrap" style={{ paddingBottom: 0 }}>
          <div className="section">
            <h3>修改密碼</h3>
            {err && <div className="err" style={{ marginBottom: 8 }}>{err}</div>}
            {ok && <div className="ok" style={{ marginBottom: 8 }}>{ok}</div>}
            <div className="pw-change">
              <input type="password" placeholder="目前密碼" value={oldPwInput} onChange={(e) => setOldPwInput(e.target.value)} />
              <input type="password" placeholder="新密碼（至少 4 碼）" value={newPwInput} onChange={(e) => setNewPwInput(e.target.value)} />
              <button onClick={doChangePassword}>確定修改</button>
            </div>
          </div>
        </div>
      )}

      <div className="wrap">
        <div className="cards">
          <div className="card"><div className="num">{totals.totalFavorites || 0}</div><div className="label">總收藏次數</div></div>
          <div className="card"><div className="num">{totals.totalVisitors || 0}</div><div className="label">收藏過的客人數</div></div>
          <div className="card"><div className="num">{totals.totalPhotos || 0}</div><div className="label">被收藏的款式數</div></div>
          <div className="card"><div className="num">{totals.totalUploads || 0}</div><div className="label">客人上傳張數</div></div>
          <div className="card"><div className="num">{totals.totalUploaders || 0}</div><div className="label">上傳過的客人數</div></div>
        </div>

        <div className="section">
          <h3>客人個人上傳</h3>
          {(!recentUploads || recentUploads.length === 0) && <div className="empty">目前還沒有客人自己上傳照片</div>}
          <div className="top-grid">
            {(recentUploads || []).map((p) => (
              <div className="top-tile" key={p.id}>
                <img src={p.image_url} alt="" loading="lazy" />
                <div className="label">{p.uploaded_by}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="section">
          <h3>最受歡迎款式（依收藏次數）</h3>
          {top.length === 0 && <div className="empty">目前還沒有客人收藏任何款式</div>}
          <div className="top-grid">
            {top.map((p) => {
              const specs = [p.category, p.color, p.gemstone, p.stone_shape].filter((v) => v && v !== "未定").join(" · ");
              return (
                <div className="top-tile" key={p.id}>
                  <img src={p.image_url} alt="" loading="lazy" />
                  <div className="badge">♥ {p.cnt}</div>
                  {specs && <div className="label">{specs}</div>}
                </div>
              );
            })}
          </div>
        </div>

        <BarList title="依品項分布" rows={byCategory} />
        <BarList title="依顏色分布" rows={byColor} />
        <BarList title="依寶石分布" rows={byGemstone} />
        <BarList title="依形狀分布" rows={byShape} />
        <BarList title="收藏最多的客人" rows={(byVisitor || []).map((v) => ({ key: v.visitor_name, cnt: v.cnt }))} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
