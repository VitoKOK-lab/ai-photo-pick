<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>審美資料庫 · 款式瀏覽</title>
<style>
  :root {
    --bg:#f1f1f4; --surface:#ffffff; --s3:#e8e8ee; --border:#e0e0e8;
    --text:#232330; --text2:#5a5a68; --text3:#8d8d99;
    --gold:#b8935a; --danger:#c0392b; --heart:#d64566; --ok:#2e7d32;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Segoe UI",sans-serif;
    height:100%; overflow:hidden; overscroll-behavior:none; }
  #root { height:100vh; height:100svh; display:flex; flex-direction:column; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; touch-action:manipulation; }

  .nav { flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--border); }
  .nav-title { font-weight:800; font-size:16px; letter-spacing:1px; }
  .nav-visitor { font-size:12px; color:var(--text3); display:flex; align-items:center; gap:8px; }
  .nav-visitor b { color:var(--text); }
  .nav-visitor button { border:none; background:none; color:var(--gold); font-size:12px;
    text-decoration:underline; padding:0; }

  .tabs { flex-shrink:0; display:flex; gap:6px; padding:10px 16px 0; background:var(--surface); }
  .tabs button { border:none; background:none; padding:8px 4px; font-size:14px; font-weight:700;
    color:var(--text3); border-bottom:2px solid transparent; }
  .tabs button.active { color:var(--text); border-bottom-color:var(--gold); }

  .filters { flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    padding:10px 16px 12px; display:flex; flex-direction:column; gap:8px; }
  .pills { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .pills button { flex-shrink:0; border:1px solid var(--border); background:var(--bg); color:var(--text2);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pills button.active { background:var(--gold); color:#fff; border-color:var(--gold); }
  .selects { display:flex; gap:8px; }
  .selects select { flex:1; min-width:0; border:1px solid var(--border); background:var(--bg);
    color:var(--text2); border-radius:10px; padding:7px 8px; font-size:12px; }

  /* ── 單張卡片滑動（全部款式）── */
  .swipe-wrap { flex:1; min-height:0; position:relative; display:flex; align-items:center;
    justify-content:center; padding:16px; overflow:hidden; }
  .card-stack { position:relative; width:100%; max-width:420px; height:100%; max-height:640px; }
  .swipe-card { position:absolute; inset:0; background:var(--surface); border-radius:20px;
    box-shadow:0 10px 30px rgba(30,30,45,.15); overflow:hidden; display:flex;
    align-items:center; justify-content:center; }
  .swipe-card img { width:100%; height:100%; object-fit:contain; pointer-events:none; user-select:none; background:#fafafb; }
  .swipe-card.top { z-index:2; touch-action:none; }
  .swipe-card.behind { z-index:1; transform:scale(.95) translateY(10px); opacity:.7; }
  .stamp { position:absolute; top:24px; padding:8px 16px; border:4px solid; border-radius:10px;
    font-size:22px; font-weight:900; letter-spacing:2px; pointer-events:none; }
  .stamp.like { left:20px; border-color:var(--ok); color:var(--ok); transform:rotate(-15deg); }
  .stamp.skip { right:20px; border-color:var(--danger); color:var(--danger); transform:rotate(15deg); }

  .swipe-actions { flex-shrink:0; display:flex; justify-content:center; align-items:center;
    gap:28px; padding:6px 0 22px; }
  .act-circle { width:58px; height:58px; border-radius:50%; border:none; display:flex;
    align-items:center; justify-content:center; font-size:24px; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .act-skip { background:var(--surface); color:var(--text3); }
  .act-like { background:var(--heart); color:#fff; }

  .empty-state { text-align:center; color:var(--text3); }
  .empty-state .big { font-size:40px; margin-bottom:8px; }

  /* ── 我的收藏：維持格狀 ── */
  .content { flex:1; min-height:0; overflow-y:auto; padding:14px 14px 30px; }
  .grid { display:grid; gap:10px; grid-template-columns: repeat(2, 1fr); }
  .tile { position:relative; aspect-ratio:1; background:var(--surface); border-radius:12px;
    overflow:hidden; box-shadow:0 2px 8px rgba(30,30,45,.08); }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; background:#fafafb; }
  .heart { position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .heart.active { color:var(--heart); }
  .heart:not(.active) { color:var(--text3); }
  .empty { grid-column:1/-1; text-align:center; color:var(--text3); padding:60px 0; }
  .empty .big { font-size:40px; margin-bottom:8px; }

  .login-zone { position:fixed; inset:0; background:rgba(20,20,30,.6); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { background:var(--surface); border-radius:20px; padding:32px 26px; text-align:center;
    width:100%; max-width:340px; }
  .login-box .icon { font-size:38px; margin-bottom:10px; }
  .login-box h2 { font-size:18px; margin:0 0 6px; }
  .login-box p { font-size:12px; color:var(--text3); margin:0 0 18px; }
  .login-box input { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px;
    font-size:15px; text-align:center; margin-bottom:14px; }
  .login-box button { width:100%; background:var(--gold); color:#fff; border:none; border-radius:12px;
    padding:13px 0; font-size:15px; font-weight:800; letter-spacing:1px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const BATCH_SIZE = 20;
const REFILL_AT = 5;
const SWIPE_THRESHOLD = 90;

function SwipeCard({ photo, onDecide, top }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [flying, setFlying] = useState(null); // 'like' | 'skip' | null
  const startRef = useRef(0);

  const onPointerDown = (e) => {
    if (!top || flying) return;
    setDragging(true);
    startRef.current = e.clientX;
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragging || flying) return;
    setDragX(e.clientX - startRef.current);
  };
  const commit = (dir) => {
    setFlying(dir);
    setDragging(false);
    setTimeout(() => onDecide(dir), 220);
  };
  const onPointerUp = () => {
    if (!dragging || flying) return;
    setDragging(false);
    if (dragX > SWIPE_THRESHOLD) commit("like");
    else if (dragX < -SWIPE_THRESHOLD) commit("skip");
    else setDragX(0);
  };

  let x = dragX;
  if (flying === "like") x = 500;
  if (flying === "skip") x = -500;
  const rotate = x / 18;
  const style = top
    ? {
        transform: `translateX(${x}px) rotate(${rotate}deg)`,
        transition: dragging ? "none" : "transform .25s ease",
      }
    : {};
  const likeOpacity = Math.min(1, Math.max(0, dragX / SWIPE_THRESHOLD));
  const skipOpacity = Math.min(1, Math.max(0, -dragX / SWIPE_THRESHOLD));

  return (
    <div
      className={"swipe-card " + (top ? "top" : "behind")}
      style={style}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
    >
      <img src={photo.image_url} alt="" draggable="false" />
      {top && <div className="stamp like" style={{ opacity: flying === "like" ? 1 : likeOpacity }}>收藏</div>}
      {top && <div className="stamp skip" style={{ opacity: flying === "skip" ? 1 : skipOpacity }}>跳過</div>}
    </div>
  );
}

function App() {
  const [visitor, setVisitor] = useState(() => {
    try { return localStorage.getItem("pp_visitor_name") || ""; } catch { return ""; }
  });
  const [nameInput, setNameInput] = useState("");
  const [tab, setTab] = useState("all"); // all | mine
  const [filterOptions, setFilterOptions] = useState({ category: [], gemstone: [] });
  const [filters, setFilters] = useState({ category: "", gemstone: "" });
  const filtersRef = useRef(filters);
  const [queue, setQueue] = useState([]);
  const [myFavorites, setMyFavorites] = useState([]); // 完整照片物件（我的收藏分頁用）
  const [favIds, setFavIds] = useState(() => new Set());
  const [loading, setLoading] = useState(false);
  const [hasMore, setHasMore] = useState(true);
  const lastIdRef = useRef(0);
  const loadingRef = useRef(false);
  const hasMoreRef = useRef(true);

  useEffect(() => {
    fetch("/api/filters?status=kept").then((r) => r.json()).then(setFilterOptions).catch(() => {});
  }, []);

  const loadMyFavorites = useCallback(async (name) => {
    if (!name) { setMyFavorites([]); setFavIds(new Set()); return; }
    try {
      const d = await (await fetch(`/api/favorites?name=${encodeURIComponent(name)}`)).json();
      const favs = d.favorites || [];
      setMyFavorites(favs);
      setFavIds(new Set(favs.map((p) => p.id)));
    } catch {}
  }, []);

  useEffect(() => { if (visitor) loadMyFavorites(visitor); }, [visitor, loadMyFavorites]);

  const fetchBatch = useCallback(async (reset) => {
    if (loadingRef.current) return;
    if (!reset && !hasMoreRef.current) return;
    loadingRef.current = true;
    setLoading(true);
    try {
      const afterId = reset ? 0 : lastIdRef.current;
      const params = new URLSearchParams({ status: "kept", limit: String(BATCH_SIZE) });
      if (afterId) params.set("after_id", String(afterId));
      for (const k of ["category", "gemstone"]) {
        if (filtersRef.current[k]) params.set(k, filtersRef.current[k]);
      }
      const d = await (await fetch(`/api/photos?${params.toString()}`)).json();
      const got = d.photos || [];
      setQueue((prev) => (reset ? got : [...prev, ...got]));
      if (got.length) lastIdRef.current = got[got.length - 1].id;
      hasMoreRef.current = got.length === BATCH_SIZE;
      setHasMore(hasMoreRef.current);
    } catch {}
    loadingRef.current = false;
    setLoading(false);
  }, []);

  useEffect(() => {
    filtersRef.current = filters;
    if (tab === "all") {
      lastIdRef.current = 0;
      hasMoreRef.current = true;
      setQueue([]);
      fetchBatch(true);
    }
  }, [filters, tab, fetchBatch]);

  useEffect(() => {
    if (tab === "all" && queue.length < REFILL_AT && hasMore && !loading) fetchBatch(false);
  }, [queue, tab, hasMore, loading, fetchBatch]);

  const changeFilter = (key, value) => setFilters((f) => ({ ...f, [key]: value }));

  const addFavorite = async (photoId) => {
    if (!visitor) return;
    try {
      await fetch("/api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ photo_id: photoId, name: visitor }),
      });
      loadMyFavorites(visitor);
    } catch {}
  };

  const toggleFavorite = async (photoId) => {
    if (!visitor) return;
    const wasFav = favIds.has(photoId);
    setFavIds((prev) => {
      const next = new Set(prev);
      if (wasFav) next.delete(photoId); else next.add(photoId);
      return next;
    });
    try {
      await fetch("/api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ photo_id: photoId, name: visitor }),
      });
      loadMyFavorites(visitor);
    } catch {}
  };

  const decide = (dir) => {
    const photo = queue[0];
    if (!photo) return;
    if (dir === "like") addFavorite(photo.id);
    setQueue((prev) => prev.slice(1));
  };

  const doLogin = () => {
    const name = nameInput.trim();
    if (!name) return;
    setVisitor(name);
    try { localStorage.setItem("pp_visitor_name", name); } catch {}
  };

  const switchVisitor = () => {
    setVisitor("");
    setNameInput("");
    try { localStorage.removeItem("pp_visitor_name"); } catch {}
  };

  return (
    <>
      <div className="nav">
        <div className="nav-title">審美資料庫</div>
        {visitor && (
          <div className="nav-visitor">
            <span>Hi, <b>{visitor}</b></span>
            <button onClick={switchVisitor}>換人</button>
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={tab === "all" ? "active" : ""} onClick={() => setTab("all")}>全部款式</button>
        <button className={tab === "mine" ? "active" : ""} onClick={() => setTab("mine")}>
          我的收藏{myFavorites.length ? `（${myFavorites.length}）` : ""}
        </button>
      </div>

      {tab === "all" && (
        <div className="filters">
          <div className="pills">
            <button className={filters.category === "" ? "active" : ""} onClick={() => changeFilter("category", "")}>全部品項</button>
            {filterOptions.category.map((v) => (
              <button key={v} className={filters.category === v ? "active" : ""} onClick={() => changeFilter("category", v)}>{v}</button>
            ))}
          </div>
          <div className="selects">
            <select value={filters.gemstone} onChange={(e) => changeFilter("gemstone", e.target.value)}>
              <option value="">全部寶石</option>
              {filterOptions.gemstone.map((v) => <option key={v} value={v}>{v}</option>)}
            </select>
          </div>
        </div>
      )}

      {tab === "all" && (
        <>
          <div className="swipe-wrap">
            <div className="card-stack">
              {queue.length === 0 && !loading && (
                <div className="swipe-wrap" style={{ position: "absolute", inset: 0, padding: 0 }}>
                  <div className="empty-state">
                    <div className="big">✓</div>
                    <div>沒有更多款式了</div>
                  </div>
                </div>
              )}
              {queue.slice(0, 2).reverse().map((p, i, arr) => (
                <SwipeCard key={p.id} photo={p} top={i === arr.length - 1} onDecide={decide} />
              ))}
            </div>
          </div>
          {queue.length > 0 && (
            <div className="swipe-actions">
              <button className="act-circle act-skip" onClick={() => decide("skip")}>✕</button>
              <button className="act-circle act-like" onClick={() => decide("like")}>♥</button>
            </div>
          )}
        </>
      )}

      {tab === "mine" && (
        <div className="content">
          <div className="grid">
            {myFavorites.length === 0 && (
              <div className="empty">
                <div className="big">♡</div>
                <div>還沒有收藏任何款式</div>
              </div>
            )}
            {myFavorites.map((p) => (
              <div key={p.id} className="tile">
                <img src={p.image_url} alt="" loading="lazy" />
                <button className="heart active" onClick={() => toggleFavorite(p.id)}>♥</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {!visitor && (
        <div className="login-zone">
          <div className="login-box">
            <div className="icon">💍</div>
            <h2>歡迎瀏覽款式</h2>
            <p>請先留下你的名字或暱稱，就可以開始收藏喜歡的款式</p>
            <input
              value={nameInput}
              onChange={(e) => setNameInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && doLogin()}
              placeholder="你的名字或暱稱"
              maxLength={40}
            />
            <button onClick={doLogin}>開始瀏覽</button>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
