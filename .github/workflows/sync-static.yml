name: Sync static site to Jewelry-Selection

on:
  push:
    branches: [claude/great-darwin-auI2D, main]
    paths:
      - 'docs/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/ to Jewelry-Selection
        run: |
          git clone https://x-access-token:${{ secrets.JEWELRY_PAT }}@github.com/VitoKOK-lab/Jewelry-Selection.git /tmp/js
          cd /tmp/js
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          # sync docs/ contents (except thumbs which user manages locally)
          cp $GITHUB_WORKSPACE/docs/index.html .
          cp $GITHUB_WORKSPACE/docs/.nojekyll . 2>/dev/null || true
          # sync banner and category images
          cp $GITHUB_WORKSPACE/docs/ｂ*.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/戒指.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/手鏈.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/墜子.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/項鍊.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/耳釘.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/胸針.png . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/docs/其他.png . 2>/dev/null || true
          git add index.html .nojekyll ｂ*.png 戒指.png 手鏈.png 墜子.png 項鍊.png 耳釘.png 胸針.png 其他.png
          git diff --cached --quiet || git commit -m "Sync from ai-photo-pick: ${{ github.sha }}"
          git push
